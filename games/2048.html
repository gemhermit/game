<style>

            width: 500px;

            user-select: none;

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 106.25px);

        .tile-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 0;
        }

        .tile {
            position: absolute;
            width: 106.25px; /* (500 - 30 - 45) / 4 */
            height: 106.25px;
            background: #eee4da;
            border-radius: 6px;
            font-weight: bold;
            font-size: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: left 0.15s ease-in-out, top 0.15s ease-in-out, transform 0.15s ease-in-out, background 0.15s;
            z-index: 10;
            user-select: none;
            -webkit-user-select: none;
        }

        .tile-new {
            animation: appear 0.2s;
        }

        .tile-merged {
            animation: pop 0.2s;
            z-index: 20;
        }

        @keyframes appear {
            0% { opacity: 0; transform: scale(0); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

<body>
    <div class="sidebar">
        <h1>2048</h1>
        <div class="subtitle">合并数字，向 2048 进发！<br>使用方向键或滑动屏幕控制。</div>
        
        <div class="score-container">
            <div class="score-box">
                <div class="score-label">得分</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">最高分</div>
                <div class="score-value" id="bestScore">0</div>
            </div>
        </div>

        <button class="btn" id="newGameBtn">新游戏</button>
    </div>

    <div class="main-area">
        <div class="game-container" id="gameContainer">
            <div class="grid-container">
                <!-- 16 grid cells -->
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            <div class="tile-container" id="tileContainer">
                <!-- Tiles injected here -->
            </div>
            <div class="game-over-overlay" id="gameOverOverlay">
                <div class="game-msg">游戏结束!</div>
                <button class="btn" onclick="game.init()">再试一次</button>
            </div>
        </div>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.gridSize = 4;
                this.score = 0;
                this.bestScore = localStorage.getItem('2048_best') || 0;
                this.grid = [];
                this.tileContainer = document.getElementById('tileContainer');
                this.scoreEl = document.getElementById('score');
                this.bestScoreEl = document.getElementById('bestScore');
                this.gameOverOverlay = document.getElementById('gameOverOverlay');
                
                this.bestScoreEl.textContent = this.bestScore;
                
                this.init();
                this.setupInput();
            }

            init() {
                this.grid = Array(this.gridSize).fill().map(() => Array(this.gridSize).fill(null));
                this.score = 0;
                this.updateScore();
                this.gameOverOverlay.classList.remove('show');
                this.clearTiles();
                
                this.addRandomTile();
                this.addRandomTile();
                this.render();
            }

            clearTiles() {
                this.tileContainer.innerHTML = '';
            }

            addRandomTile() {
                const emptyCells = [];
                for (let r = 0; r < this.gridSize; r++) {
                    for (let c = 0; c < this.gridSize; c++) {
                        if (!this.grid[r][c]) emptyCells.push({r, c});
                    }
                }

                if (emptyCells.length > 0) {
                    const cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.grid[cell.r][cell.c] = {
                        value: Math.random() < 0.9 ? 2 : 4,
                        id: Math.random().toString(36).substr(2, 9),
                        merged: false,
                        isNew: true
                    };
                }
            }

            setupInput() {
                document.addEventListener('keydown', (e) => {
                    if (e.key.startsWith('Arrow')) {
                        e.preventDefault();
                        let moved = false;
                        switch(e.key) {
                            case 'ArrowUp': moved = this.move(0, -1); break;
                            case 'ArrowDown': moved = this.move(0, 1); break;
                            case 'ArrowLeft': moved = this.move(-1, 0); break;
                            case 'ArrowRight': moved = this.move(1, 0); break;
                        }
                        if (moved) this.afterMove();
                    }
                });

                let startX, startY, activePointerId;
                const gameContainer = document.getElementById('gameContainer');
                gameContainer.addEventListener('pointerdown', (e) => {
                    if (e.pointerType === 'mouse' && e.button !== 0) return;
                    e.preventDefault();
                    startX = e.clientX;
                    startY = e.clientY;
                    activePointerId = e.pointerId;
                    if (gameContainer.setPointerCapture) {
                        gameContainer.setPointerCapture(e.pointerId);
                    }
                });
                
                gameContainer.addEventListener('pointermove', (e) => {
                    if (activePointerId === e.pointerId) {
                        e.preventDefault();
                    }
                });

                const handlePointerEnd = (e) => {
                    if (activePointerId !== e.pointerId || startX == null || startY == null) return;
                    const endX = e.clientX;
                    const endY = e.clientY;
                    
                    const dx = endX - startX;
                    const dy = endY - startY;
                    
                    let moved = false;
                    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
                        moved = this.move(dx > 0 ? 1 : -1, 0);
                    } else if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 30) {
                        moved = this.move(0, dy > 0 ? 1 : -1);
                    }
                    
                    if (moved) this.afterMove();
                    startX = null;
                    startY = null;
                    activePointerId = null;
                    if (gameContainer.releasePointerCapture) {
                        gameContainer.releasePointerCapture(e.pointerId);
                    }
                };

                gameContainer.addEventListener('pointerup', handlePointerEnd);
                gameContainer.addEventListener('pointercancel', handlePointerEnd);

                document.getElementById('newGameBtn').addEventListener('click', () => this.init());
            }

            move(dx, dy) {
                let moved = false;
                
                const traverse = (callback) => {
                    const rStart = dy > 0 ? 3 : 0;
                    const rStep = dy > 0 ? -1 : 1;
                    const cStart = dx > 0 ? 3 : 0;
                    const cStep = dx > 0 ? -1 : 1;
                    
                    for (let r = rStart; r >= 0 && r < 4; r += rStep) {
                        for (let c = cStart; c >= 0 && c < 4; c += cStep) {
                            callback(r, c);
                        }
                    }
                };

                // Prepare state: reset merge flags
                traverse((r, c) => {
                    if (this.grid[r][c]) {
                        this.grid[r][c].merged = false;
                        this.grid[r][c].isNew = false;
                    }
                });

                // Move and merge
                traverse((r, c) => {
                    if (!this.grid[r][c]) return;
                    
                    let tile = this.grid[r][c];
                    let tr = r, tc = c;
                    
                    // Find furthest valid position
                    while (true) {
                        let nextR = tr + dy;
                        let nextC = tc + dx;
                        
                        // Check boundaries
                        if (nextR < 0 || nextR >= 4 || nextC < 0 || nextC >= 4) break;
                        
                        let obstacle = this.grid[nextR][nextC];
                        
                        if (!obstacle) {
                            // Empty cell, can move here
                            tr = nextR;
                            tc = nextC;
                        } else if (obstacle.value === tile.value && !obstacle.merged) {
                            // Merge!
                            tr = nextR;
                            tc = nextC;
                            
                            // Create merged tile (conceptually the moving tile absorbs the stationary one)
                            // To animate nicely, we would ideally keep both tiles until animation ends,
                            // but for this fix we stick to single-layer logic with improved DOM reuse.
                            tile.value *= 2;
                            tile.merged = true;
                            this.score += tile.value;
                            break; // Stop after merge
                        } else {
                            break; // Blocked by different value or already merged tile
                        }
                    }
                    
                    if (tr !== r || tc !== c) {
                        moved = true;
                        this.grid[r][c] = null;
                        this.grid[tr][tc] = tile;
                    }
                });

                return moved;
            }

            // moveRobust removed as it is now integrated into move

            afterMove() {
                this.updateScore();
                this.addRandomTile();
                this.render();
                
                if (this.isGameOver()) {
                    this.gameOverOverlay.classList.add('show');
                }
            }

            updateScore() {
                this.scoreEl.textContent = this.score;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    this.bestScoreEl.textContent = this.bestScore;
                    localStorage.setItem('2048_best', this.bestScore);
                }
            }

            render() {
                // Map existing tiles by ID
                const existingTiles = {};
                Array.from(this.tileContainer.children).forEach(el => {
                    if (el.dataset.id) existingTiles[el.dataset.id] = el;
                });
                
                // Track which IDs are still present
                const currentIds = new Set();
                
                for(let r=0; r<4; r++) {
                    for(let c=0; c<4; c++) {
                        const tile = this.grid[r][c];
                        if (tile) {
                            currentIds.add(tile.id);
                            
                            // Position
                            // Cell size 106.25, Gap 15
                            const left = 15 + c * (106.25 + 15);
                            const top = 15 + r * (106.25 + 15);
                            const cls = `tile tile-${tile.value} ${tile.isNew ? 'tile-new' : ''} ${tile.merged ? 'tile-merged' : ''}`;
                            
                            let el = existingTiles[tile.id];
                            if (el) {
                                // Update existing
                                // Only update class if changed to avoid restarting some animations?
                                // Actually, 'tile-merged' is transient.
                                el.className = cls;
                                el.textContent = tile.value;
                                el.style.left = `${left}px`;
                                el.style.top = `${top}px`;
                            } else {
                                // Create new
                                el = document.createElement('div');
                                el.dataset.id = tile.id;
                                el.className = cls;
                                el.textContent = tile.value;
                                el.style.left = `${left}px`;
                                el.style.top = `${top}px`;
                                this.tileContainer.appendChild(el);
                            }
                        }
                    }
                }
                
                // Remove stale tiles
                for (const id in existingTiles) {
                    if (!currentIds.has(id)) {
                        existingTiles[id].remove();
                    }
                }
            }

            isGameOver() {
                for(let r=0; r<4; r++) {
                    for(let c=0; c<4; c++) {
                        if (!this.grid[r][c]) return false; // Empty cell
                        // Check neighbors
                        if (c < 3 && this.grid[r][c].value === this.grid[r][c+1].value) return false;
                        if (r < 3 && this.grid[r][c].value === this.grid[r+1][c].value) return false;
                    }
                }
                return true;
            }
        }

        const game = new Game2048();
    </script>
