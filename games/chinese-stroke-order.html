<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <div class="sidebar">

                <button id="loadCustomBtn" class="btn-primary">开始练习</button>

                <!-- Character Items -->

        <div class="main-content">
            <div class="canvas-container">
                <div style="text-align: center; margin-bottom: 8px;">

                </div>

                <div class="character-box" id="characterDisplayArea">
                    <div class="tian-grid"></div>

                </div>

                    准备开始...
                </div>

                <div class="progress-container">

                        <div class="progress-bar-fill" id="progressFill"></div>
                    </div>

                </div>

                <div class="controls-bar">
                    <button class="btn-control primary" id="nextCharBtn">
                        <span>下一个</span>

                    </button>

                        <span>🎥</span>
                        <span>演示</span>
                    </button>
                    <!-- Hint Button Removed -->
                    <button class="btn-control" id="restartBtn">
                        <span>🔄</span>
                        <span>重写</span>
                    </button>
                    <button class="btn-control" id="toggleOutlineBtn">
                        <span>👁️</span>
                        <span>轮廓</span>
                    </button>

    <script>
        // 默认汉字库 (可以保留部分作为基础数据，但不再限制输入)
        const defaultCharacters = '人大小山水火土木日月心手口目田白石立见车春风花鸟春眠不觉晓处处闻啼鸟夜来风雨声花落知多少';
        
        // 笔画名称映射 (仅用于已知字符的提示优化)
        const characterStrokeMap = {
            '人': ['丿', '丶'],
            '大': ['一', '丿', '丶'],
            // ... 可以保留之前的完整映射作为参考，或者简化
        };

        const strokeNamesMap = {
            '一': '横', '丨': '竖', '丿': '撇', '丶': '点',
            '乛': '提', '亅': '竖钩', '乚': '竖弯钩', '丅': '竖提',
            '乙': '横折', '竖钩': '竖钩', '横撇': '横撇',
            '卧钩': '卧钩', '横折钩': '横折钩', '撇折': '撇折',
            '竖折': '竖折', '横折': '横折', '提': '提'
        };

        class StrokeGame {
            constructor() {
                this.characters = Array.from(defaultCharacters);
                this.currentIndex = 0;
                this.writer = null;
                this.isOutlineVisible = true;
                
                // Stats
                this.mistakes = 0;
                this.totalStrokes = 0;
                this.completedChars = new Set();
                
                this.initUI();
                this.loadCharacter(this.characters[this.currentIndex]);
                this.bindEvents();
            }

            initUI() {
                this.updateList();
                this.updateTotalCount();
                // Initialize progress text to empty or 0/0 to avoid 'undefined' flash
                document.getElementById('progressText').textContent = '0 / -';
            }
            
            updateTotalCount() {
                const el = document.getElementById('totalCount');
                if (el) el.textContent = this.characters.length;
            }
            
            loadCustomText() {
                const text = document.getElementById('customInput').value;
                if (!text.trim()) return;
                
                // Filter Chinese characters
                const chars = text.match(/[\u4e00-\u9fa5]/g);
                if (!chars || chars.length === 0) {
                    alert('请输入有效的中文字符');
                    return;
                }
                
                // Update list (unique chars or sequence? sequence is better for text practice)
                this.characters = chars; // Keep sequence including duplicates if user wants to practice same char multiple times? Maybe better to unique?
                // Let's keep unique for now to avoid confusion in list, or maybe allow sequence. 
                // "Input a whole paragraph" implies practicing the paragraph. 
                // Let's use Array.from(new Set(chars)) if we want unique, but maybe user wants to write the sentence.
                // Let's stick to Unique for the list view to be clean, or Sequence? 
                // The current UI highlights the char in list. If duplicate chars exist, which one highlights? 
                // Let's use Unique for now.
                this.characters = Array.from(new Set(chars));
                
                this.currentIndex = 0;
                this.completedChars.clear();
                this.updateList();
                this.updateTotalCount();
                this.loadCharacter(this.characters[0]);
                
                // Feedback
                document.getElementById('hintArea').innerHTML = `<span style="color: #6c5ce7;">已加载 ${this.characters.length} 个字符</span>`;
            }

            async loadCharacter(char) {
                const target = document.getElementById('character-target');
                target.innerHTML = ''; // Clear previous
                
                document.getElementById('currentCharacter').textContent = char;
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressText').textContent = '加载中...';
                document.getElementById('hintArea').textContent = '正在加载字形数据...';
                
                // Robust data fetching with fallbacks
                const fetchCharData = async (c) => {
                    const encodedChar = encodeURIComponent(c);
                    const urls = [
                        `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encodedChar}.json`,
                        `https://unpkg.com/hanzi-writer-data@2.0/${encodedChar}.json`
                    ];
                    
                    let lastError;
                    for (const url of urls) {
                        try {
                            const res = await fetch(url);
                            if (res.ok) {
                                const data = await res.json();
                                // HanziWriter create() needs the strokes data
                                // If data is valid, return it.
                                if (data && (data.strokes || Array.isArray(data))) return data; 
                                // Some versions might return array directly or object with strokes
                            }
                            throw new Error(`Status ${res.status}`);
                        } catch (e) {
                            console.warn(`Failed to load from ${url}`, e);
                            lastError = e;
                        }
                    }
                    throw lastError || new Error('无法连接到数据服务器');
                };

                try {
                    const charData = await fetchCharData(char);
                    
                    // Cleanup previous instance properly
                    if (this.writer) {
                        this.writer = null;
                    }
                    
                    // Determine total strokes from data for UI update
                    const totalStrokes = (charData.strokes && charData.strokes.length) || 0;
                    this.currentTotalStrokes = totalStrokes;
                    document.getElementById('progressText').textContent = `0 / ${totalStrokes}`;

                    this.writer = HanziWriter.create('character-target', char, {
                        width: 320,
                        height: 320,
                        padding: 5,
                        showOutline: this.isOutlineVisible,
                        strokeAnimationSpeed: 1,
                        delayBetweenStrokes: 100,
                        radicalColor: '#e74c3c', // Red for Radical
                        outlineColor: '#999',
                        strokeColor: '#2c3e50', // Black/Dark Blue for normal strokes
                        highlightColor: '#f39c12',
                        drawingWidth: 20,
                        showCharacter: false,
                        checkStrokeIndependently: false,
                        charDataLoader: (c, onComplete) => onComplete(charData)
                    });

                    // Start Quiz
                    this.startQuiz();
                    this.updateHint();
                    
                } catch (err) {
                    console.error('Error loading character:', err);
                    document.getElementById('hintArea').innerHTML = `
                        <div style="color: #e74c3c; display: flex; flex-direction: column; align-items: center; gap: 4px;">
                            <span>⚠️ 加载失败: ${err.message || '网络连接不稳定'}</span>
                            <button onclick="game.loadCharacter('${char}')" class="btn-control" style="padding: 4px 12px; font-size: 0.9em; border-color: #e74c3c; color: #e74c3c;">🔄 重试</button>
                        </div>
                    `;
                    document.getElementById('progressText').textContent = '加载出错';
                }
            }

            startQuiz() {
                if (!this.writer) return;

                this.writer.quiz({
                    onMistake: (strokeData) => {
                        this.mistakes++;
                        this.updateStats();
                        this.showFeedback('Oops! 笔画顺序或方向不对哦', 'error');
                        // Shake effect
                        const el = document.getElementById('characterDisplayArea');
                        el.style.transform = 'translateX(5px)';
                        setTimeout(() => el.style.transform = 'translateX(-5px)', 50);
                        setTimeout(() => el.style.transform = 'none', 100);
                    },
                    onCorrectStroke: (strokeData) => {
                        this.updateProgress(strokeData.strokeNum + 1, this.currentTotalStrokes);
                        this.updateStats();
                        this.showFeedback('正确！继续加油', 'success');
                        this.updateHint(strokeData.strokeNum + 1);
                    },
                    onComplete: (summary) => {
                        this.completedChars.add(this.characters[this.currentIndex]);
                        this.updateList();
                        this.showFeedback(`🎉 太棒了！"${this.characters[this.currentIndex]}"字练习完成！`, 'success');
                        
                        setTimeout(() => {
                            // Celebrate animation or auto next?
                            // Let user click next or auto next after delay
                        }, 1000);
                    }
                });
            }

            updateProgress(current, total) {
                const pct = Math.round((current / total) * 100);
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('progressText').textContent = `${current} / ${total}`;
            }

            updateStats() {
                // Simplified accuracy logic
                const totalOps = this.totalStrokes + this.mistakes; // This logic is approximate as we don't track total correct strokes globally well without complexity
                // Let's just use current session mistakes for now or leave it static 100% until mistake
                // A better metric: Correct Strokes / (Correct Strokes + Mistakes)
                // But we need to track cumulative correct strokes across characters?
                // For now, let's track mistakes per character in memory?
                // Let's keep it simple: just show mistakes if > 0
                if (this.mistakes > 0) {
                   // document.getElementById('accuracy').textContent = '加油练习';
                }
                document.getElementById('completedCount').textContent = this.completedChars.size;
            }

            updateHint(nextStrokeIndex = 0) {
                const char = this.characters[this.currentIndex];
                const definedStrokes = characterStrokeMap[char];
                
                if (definedStrokes && definedStrokes[nextStrokeIndex]) {
                    const strokeSymbol = definedStrokes[nextStrokeIndex];
                    const strokeName = strokeNamesMap[strokeSymbol] || strokeSymbol;
                    document.getElementById('hintArea').innerHTML = `请书写第 ${nextStrokeIndex + 1} 笔：<strong style="font-size: 1.2em; color: #d35400;">${strokeName}</strong>`;
                } else {
                    document.getElementById('hintArea').textContent = `请书写第 ${nextStrokeIndex + 1} 笔`;
                }
            }

            showFeedback(msg, type) {
                const area = document.getElementById('hintArea');
                let color = '#334155'; // Default dark gray
                if (type === 'error') color = '#c0392b';
                else if (type === 'success') color = '#27ae60';
                else if (type === 'info') color = '#4f46e5'; // Indigo for hints
                
                area.innerHTML = `<span style="color: ${color}; font-weight: bold;">${msg}</span>`;
            }

            updateList() {
                const container = document.getElementById('characterListContainer');
                container.innerHTML = '';
                this.characters.forEach((char, idx) => {
                    const div = document.createElement('div');
                    div.className = `char-item ${idx === this.currentIndex ? 'active' : ''} ${this.completedChars.has(char) ? 'completed' : ''}`;
                    div.textContent = char;
                    div.onclick = () => {
                        if (this.currentIndex === idx) return;
                        this.currentIndex = idx;
                        this.loadCharacter(char);
                        this.updateList();
                    };
                    container.appendChild(div);
                });
            }

            // Controls
            animate() {
                if (this.writer) {
                    this.writer.animateCharacter();
                }
            }
            
            toggleOutline() {
                this.isOutlineVisible = !this.isOutlineVisible;
                if (this.writer) {
                    if (this.isOutlineVisible) this.writer.showOutline();
                    else this.writer.hideOutline();
                }
            }
            
            restart() {
                if (this.writer) {
                    this.writer.quiz(); // Reset quiz
                    this.updateProgress(0, 1); // Reset progress visual (approx)
                    this.updateHint(0);
                }
            }
            
            hint() {
                // Feature removed
            }
            
            next() {
                this.currentIndex = (this.currentIndex + 1) % this.characters.length;
                this.loadCharacter(this.characters[this.currentIndex]);
                this.updateList();
            }

            bindEvents() {
                document.getElementById('animateBtn').onclick = () => this.animate();
                document.getElementById('toggleOutlineBtn').onclick = () => this.toggleOutline();
                document.getElementById('restartBtn').onclick = () => this.restart();
                // document.getElementById('hintBtn').onclick = () => this.hint();
                document.getElementById('nextCharBtn').onclick = () => this.next();
                document.getElementById('loadCustomBtn').onclick = () => this.loadCustomText();
            }
        }

        // Initialize
        let game; // Expose to global scope for retry button
        window.onload = () => {
            // Need to append an element for total count if it was removed in HTML update
            // I removed #totalCount element in HTML but referenced in JS initUI.
            // Let's fix that or remove the reference.
            // Actually I removed the specific element ID in the HTML above.
            // I'll just remove the JS line in the class or add the element back.
            // Adding the element back is better for completeness.
            const scorePanel = document.querySelector('.score-panel');
            if (scorePanel && !document.getElementById('totalCount')) {
                 const div = document.createElement('div');
                 div.className = 'score-item';
                 div.innerHTML = '<span class="score-label">总字数：</span><span class="score-value" id="totalCount">0</span>';
                 scorePanel.appendChild(div);
            }
            
            game = new StrokeGame();
        };
    </script>
</body>
