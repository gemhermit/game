<style>

        body {

        button {
            border: 0;

            width: min(100%, 1020px);

        .hud {

        .hud__group {
            display: flex;

        .hud__chip {
            padding: 8px 11px;
            border-radius: 999px;
            color: white;
            background: rgba(12, 28, 18, 0.46);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(8px);
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .chase {
            position: absolute;
            left: 18px;
            right: 18px;
            top: 68px;
            height: 10px;

            border: 1px solid rgba(255, 255, 255, 0.24);

        .chase__fill {
            height: 100%;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            transition: width 0.18s ease;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 20px;
            pointer-events: none;
        }

        .overlay[hidden] { display: none; }

        .overlay__panel {
            width: min(560px, 100%);
            padding: 24px;
            border-radius: 26px;
            color: #fefce8;
            background: rgba(15, 34, 21, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 22px 52px rgba(0, 0, 0, 0.32);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .overlay__panel h2 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .overlay__panel p {
            color: rgba(254, 252, 232, 0.78);
            line-height: 1.7;
        }

        .touch-controls {
            position: absolute;
            inset: auto 18px 18px 18px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            pointer-events: auto;
        }

        .touch-controls button {
            min-height: 48px;
            color: white;
            background: rgba(12, 28, 18, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.24);

        }

        .touch-controls button:nth-child(2) {
            display: grid;
            grid-template-rows: 1fr 1fr;
            padding: 0;
            overflow: hidden;
        }

        .touch-controls button:nth-child(2) span {
            display: grid;
            place-items: center;
            min-height: 24px;
        }

        @media (max-width: 980px) {
            body {
                overflow: auto;
            }

            .game-shell {
                height: auto;
                min-height: 100vh;
                grid-template-columns: 1fr;
            }

            .sidebar {
                border-right: 0;
                border-bottom: 1px solid var(--line);
            }

            .track-area {
                min-height: 76vh;
                padding: 18px;
            }

            .canvas-shell {
                min-height: 620px;
            }
        }

        @media (max-width: 620px) {
            .sidebar {
                padding: 18px;
            }

            .track-area {
                padding: 12px;
            }

            .canvas-shell {
                height: 78vh;
                min-height: 520px;
                border-radius: 24px;
            }

            .stats,
            .actions {
                grid-template-columns: 1fr;
            }

            .hud {
                inset: 12px 12px auto 12px;
            }

            .hud__chip {
                padding: 7px 9px;
                font-size: 0.88rem;
            }

            .chase {
                top: 64px;
                left: 12px;
                right: 12px;
            }
        }

<body>
    <main class="game-shell">
        <aside class="sidebar">

                <div>
                    <h1>遗迹狂奔</h1>
                    <p class="subtitle">三路无尽跑酷。左右闪避，跳过断桥，滑过石门，把古遗迹的宝物带出来。</p>

            </div>

            <section class="card">
                <div class="stats" id="stats"></div>
            </section>

            <section class="card">

            </section>

            <section class="card">
                <div class="section-title">
                    <h2>遗迹任务</h2>
                    <span class="pill">完成加金币</span>

            <section class="card tips">
                键盘：A/D 或方向键左右换道，W/空格跳跃，S/下方向滑铲，P 暂停。手机：在跑道上滑动，也可以点底部按钮。
            </section>
        </aside>

        <section class="track-area">
            <div class="canvas-shell" id="canvasShell">
                <canvas id="gameCanvas" aria-label="遗迹狂奔游戏画面"></canvas>
                <div class="hud">
                    <div class="hud__group">
                        <span class="hud__chip" id="hudDistance">0m</span>
                        <span class="hud__chip" id="hudCoins">金币 0</span>
                        <span class="hud__chip" id="hudCombo">连击 0</span>
                    </div>
                    <div class="hud__group">
                        <span class="hud__chip" id="hudPower">护符待机</span>
                    </div>
                </div>
                <div class="chase" aria-label="追击压力">
                    <div class="chase__fill" id="chaseFill"></div>
                </div>
                <div class="overlay" id="overlay">
                    <div class="overlay__panel">
                        <h2 id="overlayTitle">准备闯入遗迹</h2>
                        <p id="overlayText">收集金币和遗迹碎片，躲开石门、断桥、滚木和机关。撞击会让追兵逼近，追击压力满格就会被抓住。</p>
                    </div>
                </div>
                <div class="touch-controls">
                    <button id="leftBtn" aria-label="向左">←</button>
                    <button aria-label="跳跃或滑铲">
                        <span id="jumpBtn">↑ 跳</span>
                        <span id="slideBtn">↓ 滑</span>
                    </button>
                    <button id="rightBtn" aria-label="向右">→</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const shell = document.getElementById("canvasShell");

        const els = {
            stats: document.getElementById("stats"),
            startBtn: document.getElementById("startBtn"),
            pauseBtn: document.getElementById("pauseBtn"),
            restartBtn: document.getElementById("restartBtn"),
            missions: document.getElementById("missions"),
            shop: document.getElementById("shop"),
            bankPill: document.getElementById("bankPill"),
            hudDistance: document.getElementById("hudDistance"),
            hudCoins: document.getElementById("hudCoins"),
            hudCombo: document.getElementById("hudCombo"),
            hudPower: document.getElementById("hudPower"),
            chaseFill: document.getElementById("chaseFill"),
            overlay: document.getElementById("overlay"),
            overlayTitle: document.getElementById("overlayTitle"),
            overlayText: document.getElementById("overlayText"),
            leftBtn: document.getElementById("leftBtn"),
            rightBtn: document.getElementById("rightBtn"),
            jumpBtn: document.getElementById("jumpBtn"),
            slideBtn: document.getElementById("slideBtn")
        };

        const maxZ = 95;
        const lanes = [-1, 0, 1];
        const storageKey = "relic-runner-save";

        const upgradeDefs = [
            { id: "magnet", icon: "🧲", name: "磁力护符", max: 5, base: 120, desc: "磁铁持续时间更久，远处金币也会自动吸过来。" },
            { id: "shield", icon: "🛡️", name: "护身石纹", max: 5, base: 140, desc: "每局开场护盾更久，撞击时更容易保住节奏。" },
            { id: "sprint", icon: "⚡", name: "疾风凉鞋", max: 5, base: 160, desc: "冲刺道具持续更久，并在冲刺时获得更多距离分。" },
            { id: "value", icon: "💰", name: "金币鉴定", max: 5, base: 150, desc: "每枚金币价值更高，任务奖励也更肥。" }
        ];

        const missionDefs = [
            { id: "distance", name: "跑出 1200 米", reward: 90, get: (game) => game.distance, target: 1200, unit: "m" },
            { id: "coins", name: "单局收集 120 金币", reward: 110, get: (game) => game.coins, target: 120, unit: "" },
            { id: "combo", name: "保持 35 连击", reward: 100, get: (game) => game.maxCombo, target: 35, unit: "" },
            { id: "relic", name: "带出 3 块遗迹碎片", reward: 130, get: (game) => game.relics, target: 3, unit: "" }
        ];

        const obstacleTypes = [
            { type: "idol", name: "石像", action: "换道" },
            { type: "barrier", name: "矮墙", action: "跳跃" },
            { type: "gate", name: "石门", action: "滑铲" },
            { type: "gap", name: "断桥", action: "跳跃" },
            { type: "log", name: "滚木", action: "换道" }
        ];

        const powerTypes = ["magnet", "shield", "sprint", "relic"];

        let save = loadSave();
        let game = createGame();
        let lastTime = performance.now();
        let rafId = 0;

        function loadSave() {
            const base = {
                bank: 0,
                bestDistance: 0,
                bestScore: 0,
                upgrades: { magnet: 0, shield: 0, sprint: 0, value: 0 },
                completedMissions: {}
            };
            try {
                const raw = localStorage.getItem(storageKey);
                if (!raw) return base;
                const parsed = JSON.parse(raw);
                return {
                    ...base,
                    ...parsed,
                    upgrades: { ...base.upgrades, ...(parsed.upgrades || {}) },
                    completedMissions: { ...base.completedMissions, ...(parsed.completedMissions || {}) }
                };
            } catch (error) {
                return base;
            }
        }

        function persistSave() {
            try {
                localStorage.setItem(storageKey, JSON.stringify(save));
            } catch (error) {
                // localStorage can be blocked in private browsing.
            }
        }

        function createGame() {
            return {
                started: false,
                running: false,
                paused: false,
                over: false,
                distance: 0,
                coins: 0,
                gems: 0,
                relics: 0,
                score: 0,
                combo: 0,
                maxCombo: 0,
                lane: 0,
                laneX: 0,
                jumpY: 0,
                jumpVelocity: 0,
                slideTimer: 0,
                invulnerableTimer: 0,
                magnetTimer: 0,
                shieldTimer: 3 + save.upgrades.shield * 1.4,
                sprintTimer: 0,
                speed: 22,
                chase: 18,
                nextObstacle: 30,
                nextCoins: 16,
                nextPower: 130,
                nextScenery: 18,
                objects: [],
                particles: [],
                scenery: []
            };
        }

        function resizeCanvas() {
            const rect = shell.getBoundingClientRect();
            const ratio = Math.min(window.devicePixelRatio || 1, 2);
            canvas.width = Math.max(1, Math.floor(rect.width * ratio));
            canvas.height = Math.max(1, Math.floor(rect.height * ratio));
            ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function format(value) {
            return Math.floor(value).toLocaleString("zh-CN");
        }

        function rand(min, max) {
            return min + Math.random() * (max - min);
        }

        function pick(list) {
            return list[Math.floor(Math.random() * list.length)];
        }

        function upgradeCost(def) {
            const level = save.upgrades[def.id];
            return Math.round(def.base * Math.pow(level + 1, 1.62));
        }

        function startGame() {
            if (game.over) {
                game = createGame();
            }
            game.started = true;
            game.running = true;
            game.paused = false;
            els.overlay.hidden = true;
            lastTime = performance.now();
            renderSidebar();
        }

        function restartGame() {
            game = createGame();
            startGame();
        }

        function togglePause() {
            if (!game.started || game.over) return;
            game.paused = !game.paused;
            game.running = !game.paused;
            if (game.paused) {
                showOverlay("脚步先停一下", "遗迹里的机关不会等太久。按 P 或点击继续奔跑回到赛道。");
            } else {
                els.overlay.hidden = true;
                lastTime = performance.now();
            }
            renderSidebar();
        }

        function endGame(reason) {
            if (game.over) return;
            game.over = true;
            game.running = false;
            game.paused = false;
            const earned = Math.floor(game.coins * (1 + save.upgrades.value * 0.08) + game.gems * 35);
            const missionReward = settleMissions();
            save.bank += earned + missionReward;
            save.bestDistance = Math.max(save.bestDistance, Math.floor(game.distance));
            save.bestScore = Math.max(save.bestScore, Math.floor(game.score));
            persistSave();
            showOverlay(
                reason,
                `本局 ${format(game.distance)} 米，金币 ${format(game.coins)}，最高连击 ${format(game.maxCombo)}。结算获得 ${format(earned + missionReward)} 金币。`
            );
            renderSidebar();
        }

        function settleMissions() {
            let reward = 0;
            for (const mission of missionDefs) {
                if (save.completedMissions[mission.id]) continue;
                if (mission.get(game) >= mission.target) {
                    save.completedMissions[mission.id] = true;
                    reward += Math.round(mission.reward * (1 + save.upgrades.value * 0.08));
                }
            }
            return reward;
        }

        function showOverlay(title, text) {
            els.overlayTitle.textContent = title;
            els.overlayText.textContent = text;
            els.overlay.hidden = false;
        }

        function moveLane(direction) {
            if (!game.started || game.over) return;
            if (!game.running && !game.paused) startGame();
            game.lane = clamp(game.lane + direction, -1, 1);
        }

        function jump() {
            if (!game.started || game.over) return;
            if (!game.running && !game.paused) startGame();
            if (game.jumpY <= 0.02) {
                game.jumpVelocity = 12.8;
                game.slideTimer = 0;
                addParticles(game.laneX, 0.9, "#fef3c7", 8);
            }
        }

        function slide() {
            if (!game.started || game.over) return;
            if (!game.running && !game.paused) startGame();
            if (game.jumpY <= 0.05) {
                game.slideTimer = 0.74;
                addParticles(game.laneX, 0.3, "#d9f99d", 6);
            }
        }

        function buyUpgrade(id) {
            const def = upgradeDefs.find((item) => item.id === id);
            const level = save.upgrades[id];
            if (!def || level >= def.max) return;
            const cost = upgradeCost(def);
            if (save.bank < cost) return;
            save.bank -= cost;
            save.upgrades[id] += 1;
            persistSave();
            renderSidebar();
        }

        function resetMissions() {
            save.completedMissions = {};
            persistSave();
            renderSidebar();
        }

        function update(dt) {
            if (!game.running || game.paused || game.over) return;

            const sprintBoost = game.sprintTimer > 0 ? 1.34 : 1;
            const difficulty = Math.min(1.75, 1 + game.distance / 2600);
            game.speed = (22 + game.distance / 210) * sprintBoost;
            const move = game.speed * dt;
            game.distance += move * difficulty;
            game.score = game.distance * 1.8 + game.coins * 8 + game.gems * 80 + game.combo * 10;
            game.chase = clamp(game.chase - dt * (game.combo > 0 ? 2.2 : 1.1), 0, 100);

            const laneTarget = game.lane * 1;
            game.laneX += (laneTarget - game.laneX) * Math.min(1, dt * 12);

            if (game.jumpY > 0 || game.jumpVelocity > 0) {
                game.jumpY += game.jumpVelocity * dt;
                game.jumpVelocity -= 31 * dt;
                if (game.jumpY < 0) {
                    game.jumpY = 0;
                    game.jumpVelocity = 0;
                }
            }

            game.slideTimer = Math.max(0, game.slideTimer - dt);
            game.invulnerableTimer = Math.max(0, game.invulnerableTimer - dt);
            game.magnetTimer = Math.max(0, game.magnetTimer - dt);
            game.shieldTimer = Math.max(0, game.shieldTimer - dt);
            game.sprintTimer = Math.max(0, game.sprintTimer - dt);

            spawnObjects();

            for (const obj of game.objects) {
                obj.z -= move;
                if (obj.kind === "coin" && game.magnetTimer > 0 && obj.z < 32 && !obj.collected) {
                    obj.lane += (game.laneX - obj.lane) * Math.min(1, dt * 5);
                }
                if (obj.kind === "coin") {
                    obj.spin += dt * 7;
                }
            }

            for (const scene of game.scenery) {
                scene.z -= move;
            }

            checkCollisions();
            updateParticles(dt);

            game.objects = game.objects.filter((obj) => obj.z > -8 && !obj.remove);
            game.scenery = game.scenery.filter((scene) => scene.z > -8);

            if (game.chase >= 100) {
                endGame("守卫追上来了");
            }
        }

        function spawnObjects() {
            while (game.distance > game.nextCoins) {
                spawnCoinLine(maxZ + rand(0, 8));
                game.nextCoins += rand(22, 36);
            }

            while (game.distance > game.nextObstacle) {
                spawnObstaclePattern(maxZ + rand(0, 8));
                game.nextObstacle += Math.max(13, rand(20, 31) - game.distance / 420);
            }

            while (game.distance > game.nextPower) {
                spawnPower(maxZ + rand(0, 8));
                game.nextPower += rand(150, 230);
            }

            while (game.distance > game.nextScenery) {
                spawnScenery(maxZ + rand(0, 8));
                game.nextScenery += rand(10, 18);
            }
        }

        function spawnCoinLine(z) {
            const lane = pick(lanes);
            const length = 5 + Math.floor(Math.random() * 5);
            for (let i = 0; i < length; i += 1) {
                game.objects.push({
                    id: cryptoRandom(),
                    kind: "coin",
                    lane,
                    z: z + i * 4,
                    spin: Math.random() * 6,
                    collected: false
                });
            }
        }

        function spawnObstaclePattern(z) {
            const roll = Math.random();
            if (roll < 0.28) {
                const lane = pick(lanes);
                game.objects.push(makeObstacle(pick(["idol", "log"]), lane, z));
            } else if (roll < 0.54) {
                const lane = pick(lanes);
                game.objects.push(makeObstacle(pick(["barrier", "gate", "gap"]), lane, z));
            } else if (roll < 0.78) {
                const openLane = pick(lanes);
                for (const lane of lanes) {
                    if (lane !== openLane) game.objects.push(makeObstacle("idol", lane, z + Math.random() * 2));
                }
            } else {
                const lane = pick(lanes);
                game.objects.push(makeObstacle("barrier", lane, z));
                const otherLane = pick(lanes.filter((item) => item !== lane));
                game.objects.push(makeObstacle("gate", otherLane, z + 7));
            }
        }

        function makeObstacle(type, lane, z) {
            return {
                id: cryptoRandom(),
                kind: "obstacle",
                type,
                lane,
                z,
                hit: false
            };
        }

        function spawnPower(z) {
            const type = pick(powerTypes);
            game.objects.push({
                id: cryptoRandom(),
                kind: "power",
                type,
                lane: pick(lanes),
                z,
                spin: 0,
                collected: false
            });
        }

        function spawnScenery(z) {
            const side = Math.random() < 0.5 ? -1 : 1;
            game.scenery.push({
                kind: pick(["tree", "pillar", "torch", "ruin"]),
                side,
                z,
                offset: rand(2.3, 3.7),
                height: rand(0.8, 1.4)
            });
        }

        function cryptoRandom() {
            return `${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function checkCollisions() {
            for (const obj of game.objects) {
                if (obj.remove || obj.collected) continue;
                const laneDistance = Math.abs(obj.lane - game.laneX);

                if ((obj.kind === "coin" || obj.kind === "power") && obj.z < 3.5 && obj.z > -2.2 && laneDistance < 0.58) {
                    collectObject(obj);
                    continue;
                }

                if (obj.kind !== "obstacle" || obj.hit || obj.z > 2.4 || obj.z < -1.6 || laneDistance > 0.5) continue;
                const avoided =
                    (obj.type === "barrier" && game.jumpY > 0.85) ||
                    (obj.type === "gap" && game.jumpY > 0.5) ||
                    (obj.type === "gate" && game.slideTimer > 0.1);
                if (!avoided) {
                    hitObstacle(obj);
                } else {
                    obj.hit = true;
                    game.combo += 2;
                    game.maxCombo = Math.max(game.maxCombo, game.combo);
                    addParticles(game.laneX, 0.7, "#bbf7d0", 6);
                }
            }
        }

        function collectObject(obj) {
            obj.collected = true;
            obj.remove = true;
            if (obj.kind === "coin") {
                const value = 1 + save.upgrades.value * 0.12;
                game.coins += value;
                game.combo += 1;
                game.maxCombo = Math.max(game.maxCombo, game.combo);
                addParticles(obj.lane, 0.9, "#facc15", 8);
            } else if (obj.kind === "power") {
                if (obj.type === "magnet") game.magnetTimer = 6 + save.upgrades.magnet * 1.6;
                if (obj.type === "shield") game.shieldTimer = 5 + save.upgrades.shield * 1.5;
                if (obj.type === "sprint") game.sprintTimer = 4 + save.upgrades.sprint * 1.3;
                if (obj.type === "relic") game.relics += 1;
                if (obj.type !== "relic") game.gems += 1;
                game.combo += 4;
                game.maxCombo = Math.max(game.maxCombo, game.combo);
                addParticles(obj.lane, 1.2, powerColor(obj.type), 16);
            }
        }

        function hitObstacle(obj) {
            if (game.invulnerableTimer > 0) return;
            obj.hit = true;
            game.combo = 0;
            game.chase += game.shieldTimer > 0 ? 12 : 34;
            game.invulnerableTimer = 1.1;
            game.speed *= 0.82;

            if (game.shieldTimer > 0) {
                game.shieldTimer = 0;
                addParticles(game.laneX, 0.8, "#93c5fd", 22);
            } else {
                game.coins = Math.max(0, game.coins - 8);
                addParticles(game.laneX, 0.8, "#fca5a5", 22);
            }

            if (game.chase >= 96) {
                endGame(`撞上${obstacleTypes.find((item) => item.type === obj.type)?.name || "机关"}`);
            }
        }

        function addParticles(lane, height, color, count) {
            for (let i = 0; i < count; i += 1) {
                game.particles.push({
                    lane: lane + rand(-0.15, 0.15),
                    height: height + rand(-0.16, 0.16),
                    z: rand(0.6, 2.2),
                    vx: rand(-0.8, 0.8),
                    vy: rand(0.5, 1.9),
                    life: rand(0.35, 0.75),
                    maxLife: 0.75,
                    color
                });
            }
        }

        function updateParticles(dt) {
            for (const particle of game.particles) {
                particle.lane += particle.vx * dt;
                particle.height += particle.vy * dt;
                particle.vy -= 3.6 * dt;
                particle.life -= dt;
            }
            game.particles = game.particles.filter((item) => item.life > 0);
        }

        function powerColor(type) {
            if (type === "magnet") return "#38bdf8";
            if (type === "shield") return "#93c5fd";
            if (type === "sprint") return "#fde047";
            return "#f0abfc";
        }

        function draw() {
            const width = shell.clientWidth;
            const height = shell.clientHeight;
            ctx.clearRect(0, 0, width, height);
            drawBackground(width, height);
            drawTrack(width, height);
            drawScenery(width, height);

            const sorted = [...game.objects].sort((a, b) => b.z - a.z);
            for (const obj of sorted) {
                if (obj.kind === "coin") drawCoin(obj, width, height);
                if (obj.kind === "power") drawPower(obj, width, height);
                if (obj.kind === "obstacle") drawObstacle(obj, width, height);
            }

            drawPlayer(width, height);
            drawParticles(width, height);
            drawVignette(width, height);
        }

        function project(lane, z, heightOffset = 0) {
            const width = shell.clientWidth;
            const height = shell.clientHeight;
            const horizon = height * 0.31;
            const t = clamp(1 - z / maxZ, 0, 1);
            const curve = Math.pow(t, 1.55);
            const y = horizon + curve * (height * 0.66) - heightOffset * (48 + t * 130);
            const laneSpread = width * (0.07 + t * 0.22);
            const x = width * 0.5 + lane * laneSpread;
            const scale = 0.22 + t * 1.45;
            return { x, y, scale, t };
        }

        function drawBackground(width, height) {
            const sky = ctx.createLinearGradient(0, 0, 0, height);
            sky.addColorStop(0, "#b8e6d3");
            sky.addColorStop(0.45, "#e5f5c8");
            sky.addColorStop(1, "#255c31");
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, width, height);

            ctx.fillStyle = "rgba(23, 74, 38, 0.55)";
            for (let i = 0; i < 8; i += 1) {
                const x = (i / 7) * width;
                const peak = height * (0.24 + (i % 3) * 0.03);
                ctx.beginPath();
                ctx.moveTo(x - width * 0.25, height * 0.52);
                ctx.lineTo(x, peak);
                ctx.lineTo(x + width * 0.28, height * 0.52);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = "rgba(252, 211, 77, 0.8)";
            ctx.beginPath();
            ctx.arc(width * 0.78, height * 0.12, Math.min(width, height) * 0.055, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawTrack(width, height) {
            const nearLeft = project(-1.8, 0);
            const nearRight = project(1.8, 0);
            const farLeft = project(-0.42, maxZ);
            const farRight = project(0.42, maxZ);
            const road = ctx.createLinearGradient(0, farLeft.y, 0, nearLeft.y);
            road.addColorStop(0, "#71623d");
            road.addColorStop(0.55, "#8b7445");
            road.addColorStop(1, "#3d2e20");
            ctx.fillStyle = road;
            ctx.beginPath();
            ctx.moveTo(farLeft.x, farLeft.y);
            ctx.lineTo(farRight.x, farRight.y);
            ctx.lineTo(nearRight.x, nearRight.y);
            ctx.lineTo(nearLeft.x, nearLeft.y);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = "rgba(255, 244, 193, 0.34)";
            ctx.lineWidth = 2;
            for (const lane of [-0.5, 0.5]) {
                ctx.beginPath();
                for (let z = maxZ; z >= 0; z -= 7) {
                    const point = project(lane, z);
                    if (z === maxZ) ctx.moveTo(point.x, point.y);
                    else ctx.lineTo(point.x, point.y);
                }
                ctx.stroke();
            }

            ctx.strokeStyle = "rgba(255, 255, 255, 0.18)";
            for (let z = 0; z < maxZ; z += 12) {
                const left = project(-1.7, z);
                const right = project(1.7, z);
                ctx.lineWidth = Math.max(1, 2.6 * left.scale);
                ctx.beginPath();
                ctx.moveTo(left.x, left.y);
                ctx.lineTo(right.x, right.y);
                ctx.stroke();
            }
        }

        function drawScenery(width, height) {
            const sorted = [...game.scenery].sort((a, b) => b.z - a.z);
            for (const scene of sorted) {
                const point = project(scene.side * scene.offset, scene.z);
                const s = point.scale * scene.height;
                ctx.save();
                ctx.translate(point.x, point.y);
                ctx.globalAlpha = 0.45 + point.t * 0.45;
                if (scene.kind === "tree") {
                    ctx.fillStyle = "#14532d";
                    ctx.fillRect(-5 * s, -54 * s, 10 * s, 54 * s);
                    ctx.fillStyle = "#166534";
                    ctx.beginPath();
                    ctx.ellipse(0, -74 * s, 28 * s, 42 * s, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else if (scene.kind === "torch") {
                    ctx.fillStyle = "#5b3a1d";
                    ctx.fillRect(-4 * s, -48 * s, 8 * s, 48 * s);
                    ctx.fillStyle = "#f97316";
                    ctx.beginPath();
                    ctx.arc(0, -56 * s, 10 * s, 0, Math.PI * 2);
                    ctx.fill();
                } else if (scene.kind === "pillar") {
                    ctx.fillStyle = "#6b7280";
                    ctx.fillRect(-12 * s, -74 * s, 24 * s, 74 * s);
                    ctx.fillStyle = "#9ca3af";
                    ctx.fillRect(-18 * s, -82 * s, 36 * s, 10 * s);
                } else {
                    ctx.fillStyle = "#78716c";
                    ctx.fillRect(-24 * s, -42 * s, 48 * s, 42 * s);
                    ctx.clearRect(-8 * s, -24 * s, 16 * s, 24 * s);
                }
                ctx.restore();
            }
        }

        function drawCoin(obj) {
            const point = project(obj.lane, obj.z, 0.72 + Math.sin(obj.spin) * 0.05);
            const size = 11 * point.scale;
            ctx.save();
            ctx.translate(point.x, point.y);
            ctx.rotate(obj.spin * 0.16);
            ctx.fillStyle = "#facc15";
            ctx.beginPath();
            ctx.ellipse(0, 0, size * (0.45 + Math.abs(Math.cos(obj.spin)) * 0.55), size, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "#854d0e";
            ctx.lineWidth = Math.max(1, point.scale * 1.6);
            ctx.stroke();
            ctx.restore();
        }

        function drawPower(obj) {
            const point = project(obj.lane, obj.z, 0.88 + Math.sin(performance.now() / 220) * 0.06);
            const size = 19 * point.scale;
            ctx.save();
            ctx.translate(point.x, point.y);
            ctx.fillStyle = powerColor(obj.type);
            ctx.shadowColor = powerColor(obj.type);
            ctx.shadowBlur = 18 * point.scale;
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.fillStyle = "#102a1a";
            ctx.font = `${Math.max(12, 15 * point.scale)}px ${getComputedStyle(document.body).fontFamily}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const icons = { magnet: "🧲", shield: "🛡️", sprint: "⚡", relic: "💎" };
            ctx.fillText(icons[obj.type], 0, 1);
            ctx.restore();
        }

        function drawObstacle(obj) {
            const point = project(obj.lane, obj.z);
            const s = point.scale;
            ctx.save();
            ctx.translate(point.x, point.y);
            if (obj.type === "idol") {
                ctx.fillStyle = "#57534e";
                roundRect(-18 * s, -58 * s, 36 * s, 58 * s, 8 * s);
                ctx.fill();
                ctx.fillStyle = "#a3a3a3";
                ctx.beginPath();
                ctx.arc(0, -70 * s, 18 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#111827";
                ctx.fillRect(-8 * s, -72 * s, 5 * s, 5 * s);
                ctx.fillRect(3 * s, -72 * s, 5 * s, 5 * s);
            } else if (obj.type === "barrier") {
                ctx.fillStyle = "#92400e";
                roundRect(-32 * s, -24 * s, 64 * s, 24 * s, 5 * s);
                ctx.fill();
                ctx.fillStyle = "#fef3c7";
                ctx.fillRect(-26 * s, -19 * s, 52 * s, 4 * s);
            } else if (obj.type === "gate") {
                ctx.strokeStyle = "#78716c";
                ctx.lineWidth = 14 * s;
                ctx.beginPath();
                ctx.moveTo(-34 * s, 0);
                ctx.lineTo(-34 * s, -68 * s);
                ctx.quadraticCurveTo(0, -96 * s, 34 * s, -68 * s);
                ctx.lineTo(34 * s, 0);
                ctx.stroke();
                ctx.fillStyle = "rgba(20, 20, 20, 0.28)";
                ctx.fillRect(-22 * s, -56 * s, 44 * s, 56 * s);
            } else if (obj.type === "gap") {
                ctx.fillStyle = "#17261c";
                ctx.beginPath();
                ctx.ellipse(0, -4 * s, 54 * s, 18 * s, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#fef3c7";
                ctx.lineWidth = 3 * s;
                ctx.stroke();
            } else {
                ctx.fillStyle = "#78350f";
                roundRect(-40 * s, -23 * s, 80 * s, 28 * s, 14 * s);
                ctx.fill();
                ctx.strokeStyle = "#451a03";
                ctx.lineWidth = 3 * s;
                ctx.stroke();
            }
            ctx.restore();
        }

        function drawPlayer() {
            const point = project(game.laneX, 1.4, 0.48 + game.jumpY);
            const s = point.scale * (game.slideTimer > 0 ? 0.72 : 1);
            const stride = Math.sin(game.distance * 0.18 + performance.now() * 0.004 * (game.running ? 1 : 0.35));
            const bounce = Math.cos(game.distance * 0.18) * 2.4 * s;
            const slidePose = game.slideTimer > 0;
            const lean = (game.lane - game.laneX) * 0.18 + (slidePose ? 0.24 : 0) - clamp(game.jumpVelocity * 0.01, -0.12, 0.16);
            const armSwing = slidePose ? 4 * s : stride * 11 * s;
            const legSwing = slidePose ? 6 * s : stride * 13 * s;

            ctx.save();
            ctx.translate(point.x, point.y + bounce);
            if (game.invulnerableTimer > 0 && Math.floor(performance.now() / 90) % 2 === 0) {
                ctx.globalAlpha = 0.54;
            }

            ctx.fillStyle = "rgba(12, 28, 18, 0.22)";
            ctx.beginPath();
            ctx.ellipse(0, 5 * s, 23 * s, Math.max(6 * s, 11 * s - game.jumpY * 4.2 * s), 0, 0, Math.PI * 2);
            ctx.fill();

            if (game.shieldTimer > 0) {
                ctx.strokeStyle = "rgba(147, 197, 253, 0.84)";
                ctx.lineWidth = 3.2 * s;
                ctx.beginPath();
                ctx.arc(0, -36 * s, 42 * s, 0, Math.PI * 2);
                ctx.stroke();
                ctx.strokeStyle = "rgba(191, 219, 254, 0.38)";
                ctx.beginPath();
                ctx.arc(0, -36 * s, 49 * s, Math.PI * 0.16, Math.PI * 1.22);
                ctx.stroke();
            }

            ctx.save();
            ctx.rotate(lean);

            ctx.fillStyle = "#6b4f2c";
            roundRect(-11 * s, -12 * s, 9 * s, 18 * s, 3.5 * s);
            roundRect(2 * s, -12 * s, 9 * s, 18 * s, 3.5 * s);
            ctx.fill();

            ctx.strokeStyle = "#2f2419";
            ctx.lineCap = "round";
            ctx.lineWidth = 6 * s;
            ctx.beginPath();
            if (slidePose) {
                ctx.moveTo(-4 * s, -6 * s);
                ctx.lineTo(-17 * s, 3 * s);
                ctx.moveTo(5 * s, -6 * s);
                ctx.lineTo(16 * s, 3 * s);
            } else {
                ctx.moveTo(-4 * s, -6 * s);
                ctx.lineTo(-6 * s - legSwing, 15 * s);
                ctx.moveTo(5 * s, -6 * s);
                ctx.lineTo(8 * s + legSwing, 14 * s);
            }
            ctx.stroke();

            ctx.fillStyle = "#6d28d9";
            roundRect(-16 * s, -52 * s, 9 * s, 26 * s, 5 * s);
            ctx.fillStyle = "#8b5cf6";
            roundRect(7 * s, -52 * s, 9 * s, 26 * s, 5 * s);
            ctx.fill();

            ctx.fillStyle = "#8b5e34";
            roundRect(-12 * s, -50 * s, 26 * s, 28 * s, 8 * s);
            ctx.fill();
            ctx.fillStyle = "#b45309";
            roundRect(-14 * s, -49 * s, 28 * s, 8 * s, 4 * s);
            ctx.fill();

            ctx.fillStyle = "#14532d";
            roundRect(-14 * s, -46 * s, 28 * s, 34 * s, 9 * s);
            ctx.fill();
            ctx.fillStyle = "#f3f4f6";
            roundRect(-6 * s, -42 * s, 12 * s, 18 * s, 4 * s);
            ctx.fill();
            ctx.fillStyle = "#dc2626";
            ctx.beginPath();
            ctx.moveTo(-8 * s, -38 * s);
            ctx.lineTo(10 * s, -33 * s);
            ctx.lineTo(5 * s, -27 * s);
            ctx.lineTo(-9 * s, -30 * s);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#f59e0b";
            roundRect(-3 * s, -25 * s, 8 * s, 4 * s, 2 * s);
            ctx.fill();

            ctx.strokeStyle = "#f8fafc";
            ctx.lineWidth = 5 * s;
            ctx.beginPath();
            if (slidePose) {
                ctx.moveTo(-8 * s, -41 * s);
                ctx.lineTo(-20 * s, -28 * s);
                ctx.moveTo(8 * s, -39 * s);
                ctx.lineTo(19 * s, -27 * s);
            } else {
                ctx.moveTo(-8 * s, -41 * s);
                ctx.lineTo(-18 * s - armSwing, -22 * s);
                ctx.moveTo(8 * s, -39 * s);
                ctx.lineTo(17 * s + armSwing, -20 * s);
            }
            ctx.stroke();

            ctx.fillStyle = "#f8d4a1";
            ctx.beginPath();
            ctx.arc(0, -58 * s, 14 * s, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#7c2d12";
            ctx.beginPath();
            ctx.arc(0, -63 * s, 13 * s, Math.PI, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = "#166534";
            roundRect(-17 * s, -74 * s, 34 * s, 7 * s, 3 * s);
            roundRect(-11 * s, -86 * s, 22 * s, 16 * s, 5 * s);
            ctx.fill();
            ctx.fillStyle = "#ca8a04";
            roundRect(-17 * s, -74 * s, 34 * s, 3.5 * s, 2 * s);
            ctx.fill();

            ctx.fillStyle = "#111827";
            ctx.beginPath();
            ctx.arc(-5 * s, -59 * s, 1.3 * s, 0, Math.PI * 2);
            ctx.arc(5 * s, -59 * s, 1.3 * s, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = "rgba(120, 53, 15, 0.7)";
            ctx.lineWidth = 1.6 * s;
            ctx.beginPath();
            ctx.arc(0, -53 * s, 4 * s, 0.2, Math.PI - 0.2);
            ctx.stroke();

            ctx.restore();
            ctx.restore();
        }

        function drawParticles() {
            for (const particle of game.particles) {
                const point = project(particle.lane, particle.z, particle.height);
                ctx.save();
                ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
                ctx.fillStyle = particle.color;
                ctx.beginPath();
                ctx.arc(point.x, point.y, 4 * point.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawVignette(width, height) {
            const vignette = ctx.createRadialGradient(width / 2, height / 2, height * 0.2, width / 2, height / 2, height * 0.8);
            vignette.addColorStop(0, "rgba(0,0,0,0)");
            vignette.addColorStop(1, "rgba(12,28,18,0.38)");
            ctx.fillStyle = vignette;
            ctx.fillRect(0, 0, width, height);
        }

        function roundRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        function renderSidebar() {
            const stats = [
                ["本局距离", `${format(game.distance)}m`],
                ["本局金币", format(game.coins)],
                ["最佳距离", `${format(save.bestDistance)}m`],
                ["最高分", format(save.bestScore)],
                ["遗迹碎片", format(game.relics)],
                ["追击压力", `${Math.round(game.chase)}%`]
            ];
            els.stats.innerHTML = stats.map(([label, value]) => `
                <div class="stat">
                    <span>${label}</span>
                    <strong>${value}</strong>
                </div>
            `).join("");

            els.bankPill.textContent = `金币 ${format(save.bank)}`;
            els.shop.innerHTML = upgradeDefs.map((def) => {
                const level = save.upgrades[def.id];
                const maxed = level >= def.max;
                const cost = upgradeCost(def);
                return `
                    <article class="shop-card">
                        <div class="shop-card__head">
                            <strong>${def.icon} ${def.name}</strong>
                            <span class="pill">${level}/${def.max}</span>
                        </div>
                        <p>${def.desc}</p>
                        <button data-upgrade="${def.id}" ${maxed || save.bank < cost || (game.started && !game.over) ? "disabled" : ""}>${maxed ? "已满级" : `升级 ${format(cost)}`}</button>
                    </article>
                `;
            }).join("");
            els.shop.querySelectorAll("[data-upgrade]").forEach((button) => {
                button.addEventListener("click", () => buyUpgrade(button.dataset.upgrade));
            });

            els.missions.innerHTML = missionDefs.map((mission) => {
                const progress = Math.min(mission.target, Math.floor(mission.get(game)));
                const done = save.completedMissions[mission.id] || progress >= mission.target;
                return `
                    <article class="mission ${done ? "is-done" : ""}">
                        <div class="mission__head">
                            <span>${mission.name}</span>
                            <span>${done ? "完成" : `${progress}/${mission.target}${mission.unit}`}</span>
                        </div>
                        <p>奖励 ${mission.reward} 金币。${save.completedMissions[mission.id] ? "已经领取。" : "本局达成后自动结算。"}</p>
                    </article>
                `;
            }).join("");

            els.startBtn.textContent = game.running ? "奔跑中" : game.over ? "再来一局" : game.started ? "继续奔跑" : "开始奔跑";
            els.pauseBtn.textContent = game.paused ? "继续" : "暂停";
            els.pauseBtn.disabled = !game.started || game.over;
        }

        function renderHud() {
            els.hudDistance.textContent = `${format(game.distance)}m`;
            els.hudCoins.textContent = `金币 ${format(game.coins)}`;
            els.hudCombo.textContent = `连击 ${format(game.combo)}`;
            els.chaseFill.style.width = `${clamp(game.chase, 0, 100)}%`;
            const powers = [];
            if (game.magnetTimer > 0) powers.push(`磁铁 ${game.magnetTimer.toFixed(0)}s`);
            if (game.shieldTimer > 0) powers.push(`护盾 ${game.shieldTimer.toFixed(0)}s`);
            if (game.sprintTimer > 0) powers.push(`冲刺 ${game.sprintTimer.toFixed(0)}s`);
            els.hudPower.textContent = powers.length ? powers.join(" / ") : "护符待机";
        }

        function tick(now) {
            const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
            lastTime = now;
            update(dt);
            draw();
            renderHud();
            if (Math.floor(now / 250) !== Math.floor((now - dt * 1000) / 250)) {
                renderSidebar();
            }
            rafId = requestAnimationFrame(tick);
        }

        function handleKey(event) {
            const key = event.key.toLowerCase();
            if (["arrowleft", "a"].includes(key)) {
                event.preventDefault();
                moveLane(-1);
            } else if (["arrowright", "d"].includes(key)) {
                event.preventDefault();
                moveLane(1);
            } else if (["arrowup", "w", " "].includes(key)) {
                event.preventDefault();
                jump();
            } else if (["arrowdown", "s"].includes(key)) {
                event.preventDefault();
                slide();
            } else if (key === "p") {
                togglePause();
            }
        }

        let touchStart = null;
        function handleTouchStart(event) {
            const touch = event.changedTouches[0];
            touchStart = { x: touch.clientX, y: touch.clientY, time: performance.now() };
        }

        function handleTouchEnd(event) {
            if (!touchStart) return;
            const touch = event.changedTouches[0];
            const dx = touch.clientX - touchStart.x;
            const dy = touch.clientY - touchStart.y;
            const absX = Math.abs(dx);
            const absY = Math.abs(dy);
            if (Math.max(absX, absY) < 22) {
                jump();
            } else if (absX > absY) {
                moveLane(dx > 0 ? 1 : -1);
            } else if (dy < 0) {
                jump();
            } else {
                slide();
            }
            touchStart = null;
        }

        els.startBtn.addEventListener("click", startGame);
        els.pauseBtn.addEventListener("click", togglePause);
        els.restartBtn.addEventListener("click", restartGame);
        els.leftBtn.addEventListener("click", () => moveLane(-1));
        els.rightBtn.addEventListener("click", () => moveLane(1));
        els.jumpBtn.addEventListener("click", jump);
        els.slideBtn.addEventListener("click", slide);
        canvas.addEventListener("touchstart", handleTouchStart, { passive: true });
        canvas.addEventListener("touchend", handleTouchEnd, { passive: true });
        window.addEventListener("keydown", handleKey);
        window.addEventListener("resize", () => {
            resizeCanvas();
            draw();
        });

        resizeCanvas();
        renderSidebar();
        renderHud();
        draw();
        showOverlay("准备闯入遗迹", "点击开始奔跑。左右换道，向上跳跃，向下滑铲；连续收金币会提高连击，撞到机关会让追兵逼近。");
        rafId = requestAnimationFrame(tick);
    </script>
</body>
</html>
