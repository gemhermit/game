<body>

            <div class="subtitle">通过已知头和脚的数量，推算鸡和兔各有多少只的经典数学问题。</div>
        </div>

        <div class="stats-card">
            <div class="stat-row">
                <span class="stat-label">正确解答</span>
                <span class="stat-value success" id="correctCount">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">错误尝试</span>
                <span class="stat-value danger" id="wrongCount">0</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">准确率</span>
                <span class="stat-value" id="accuracy">0%</span>
            </div>

        <div class="control-panel">
            <div class="control-group">
                <label class="control-label">难度选择</label>
                <div class="mode-selector">
                    <div class="mode-btn active" data-level="easy">简单</div>
                    <div class="mode-btn" data-level="medium">中等</div>
                    <div class="mode-btn" data-level="hard">困难</div>
                </div>

            <div class="control-group">
                <label class="control-label">你的答案</label>
                <div class="input-row">
                    <div class="input-wrapper">
                        <input type="number" id="chickenInput" placeholder="鸡?" min="0">
                        <span class="input-icon">🐔</span>
                    </div>
                    <div class="input-wrapper">
                        <input type="number" id="rabbitInput" placeholder="兔?" min="0">
                        <span class="input-icon">🐰</span>
                    </div>
                </div>
            </div>

            <div class="btn-grid">
                <button class="btn btn-primary" id="checkBtn">
                    <span>🔍</span> 检查答案
                </button>
                <button class="btn btn-secondary" id="solveBtn">
                    <span>💡</span> 查看解析
                </button>
                <button class="btn btn-accent" id="newBtn">
                    <span>🎲</span> 新题目
                </button>
                <button class="btn btn-danger" id="clearBtn">
                    <span>🧹</span> 清空
                </button>
            </div>
        </div>
        

    </div>

    <div class="main-content">
        <div class="problem-card">
            <div class="problem-text" id="problemText">
                笼子里有若干只鸡和兔，从上面数有 <span class="problem-highlight">8</span> 个头，从下面数有 <span class="problem-highlight">22</span> 只脚。
            </div>
        </div>

        <div class="visualization-area">
            <div class="cage-bg"></div>

                <!-- Animals will be rendered here -->
            </div>
        </div>

        <div class="solution-overlay" id="solutionOverlay">
            <div class="solution-title">
                <span>解题步骤</span>
                <button class="close-btn" id="closeSolution">×</button>

            <div id="solutionContent"></div>
        </div>
    </div>

    <div class="toast" id="toast">
        <span id="toastIcon">✅</span>
        <span id="toastMessage">答案正确！</span>
    </div>

    <script>
        class ChickenRabbitGame {
            constructor() {
                this.state = {
                    heads: 0,
                    feet: 0,
                    chickens: 0,
                    rabbits: 0,
                    stats: {
                        correct: 0,
                        wrong: 0
                    },
                    difficulty: 'easy',
                    showAnimals: false
                };

                this.configs = {
                    easy: { headRange: [5, 10] },
                    medium: { headRange: [8, 15] },
                    hard: { headRange: [12, 25] }
                };

                this.dom = {
                    problemText: document.getElementById('problemText'),
                    animalsContainer: document.getElementById('animalsContainer'),
                    chickenInput: document.getElementById('chickenInput'),
                    rabbitInput: document.getElementById('rabbitInput'),
                    stats: {
                        correct: document.getElementById('correctCount'),
                        wrong: document.getElementById('wrongCount'),
                        accuracy: document.getElementById('accuracy')
                    },
                    toast: document.getElementById('toast'),
                    solutionOverlay: document.getElementById('solutionOverlay'),
                    solutionContent: document.getElementById('solutionContent')
                };

                this.init();
            }

            init() {
                this.bindEvents();
                this.generateProblem();
            }

            bindEvents() {
                // Difficulty selectors
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.state.difficulty = btn.dataset.level;
                        this.generateProblem();
                    });
                });

                // Buttons
                document.getElementById('checkBtn').addEventListener('click', () => this.checkAnswer());
                document.getElementById('solveBtn').addEventListener('click', () => this.showSolution());
                document.getElementById('newBtn').addEventListener('click', () => this.generateProblem());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearInputs());
                document.getElementById('closeSolution').addEventListener('click', () => this.hideSolution());

                // Enter key support
                const handleEnter = (e) => {
                    if (e.key === 'Enter') {
                        if (e.target.id === 'chickenInput') this.dom.rabbitInput.focus();
                        else if (e.target.id === 'rabbitInput') this.checkAnswer();
                    }
                };
                this.dom.chickenInput.addEventListener('keypress', handleEnter);
                this.dom.rabbitInput.addEventListener('keypress', handleEnter);
            }

            randomBetween(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            generateProblem() {
                const config = this.configs[this.state.difficulty];
                const heads = this.randomBetween(config.headRange[0], config.headRange[1]);
                
                // Ensure valid solution
                let chickens, rabbits, feet;
                do {
                    chickens = this.randomBetween(0, heads);
                    rabbits = heads - chickens;
                    feet = chickens * 2 + rabbits * 4;
                } while (feet < heads * 2 || feet > heads * 4);

                this.state.heads = heads;
                this.state.feet = feet;
                this.state.chickens = chickens;
                this.state.rabbits = rabbits;
                this.state.showAnimals = false;

                this.updateDisplay();
                this.clearInputs();
                this.hideSolution();
                this.renderAnimals();
            }

            updateDisplay() {
                this.dom.problemText.innerHTML = 
                    `笼子里有若干只鸡和兔，从上面数有 <span class="problem-highlight">${this.state.heads}</span> 个头，` +
                    `从下面数有 <span class="problem-highlight">${this.state.feet}</span> 只脚。`;
            }

            renderAnimals() {
                this.dom.animalsContainer.innerHTML = '';
                const { heads, chickens, rabbits, showAnimals } = this.state;
                
                // Calculate grid
                const containerWidth = this.dom.animalsContainer.clientWidth;
                const containerHeight = this.dom.animalsContainer.clientHeight;
                const area = containerWidth * containerHeight;
                // Estimate cell size
                const cols = Math.ceil(Math.sqrt(heads * (containerWidth / containerHeight)));
                const rows = Math.ceil(heads / cols);
                
                const cellW = containerWidth / cols;
                const cellH = containerHeight / rows;

                // Create animal list
                let animals = [];
                if (showAnimals) {
                    for(let i=0; i<chickens; i++) animals.push({type: 'chicken', icon: '🐔'});
                    for(let i=0; i<rabbits; i++) animals.push({type: 'rabbit', icon: '🐰'});
                    // Shuffle
                    for (let i = animals.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [animals[i], animals[j]] = [animals[j], animals[i]];
                    }
                } else {
                    for(let i=0; i<heads; i++) animals.push({type: 'unknown', icon: '❓'});
                }

                animals.forEach((animal, index) => {
                    const el = document.createElement('div');
                    el.className = `animal ${animal.type === 'unknown' ? 'placeholder' : ''}`;
                    el.textContent = animal.icon;
                    
                    const row = Math.floor(index / cols);
                    const col = index % cols;
                    
                    // Center in cell with random offset
                    const offsetX = (Math.random() - 0.5) * 20;
                    const offsetY = (Math.random() - 0.5) * 10;
                    
                    const left = col * cellW + cellW/2 - 24 + offsetX; 
                    const top = row * cellH + cellH/2 - 24 + offsetY;

                    // Adjust vertical position for depth effect (lower rows are "closer")
                    // We map row index to z-index so lower animals cover higher ones
                    el.style.zIndex = row;
                    
                    el.style.left = `${left}px`;
                    el.style.top = `${top}px`;
                    
                    // Add staggered animation
                    el.style.animationDelay = `${index * 0.05}s`;
                    
                    this.dom.animalsContainer.appendChild(el);
                });
            }

            checkAnswer() {
                const inputC = parseInt(this.dom.chickenInput.value);
                const inputR = parseInt(this.dom.rabbitInput.value);

                if (isNaN(inputC) || isNaN(inputR)) {
                    this.showToast('请输入有效的数字', 'error');
                    return;
                }

                if (inputC === this.state.chickens && inputR === this.state.rabbits) {
                    this.state.stats.correct++;
                    this.state.showAnimals = true;
                    this.renderAnimals();
                    this.showToast('回答正确！真棒！', 'success');
                } else {
                    this.state.stats.wrong++;
                    
                    // Provide specific feedback
                    const totalHeads = inputC + inputR;
                    const totalFeet = inputC * 2 + inputR * 4;
                    let msg = '答案不对哦。';
                    if (totalHeads !== this.state.heads) msg += ` 头数是${totalHeads}，但题目是${this.state.heads}。`;
                    else if (totalFeet !== this.state.feet) msg += ` 脚数是${totalFeet}，但题目是${this.state.feet}。`;
                    
                    this.showToast(msg, 'error');
                }
                this.updateStats();
            }

            showSolution() {
                const { heads, feet, chickens, rabbits } = this.state;
                const steps = [
                    { title: "假设全是鸡", content: `如果是${heads}只鸡，那应该有 ${heads} × 2 = ${heads * 2} 只脚。` },
                    { title: "计算脚数差", content: `实际有${feet}只脚，比假设多了 ${feet} - ${heads * 2} = ${feet - heads * 2} 只脚。` },
                    { title: "算出兔子数", content: `每只兔子比鸡多2只脚，所以兔子有 ${feet - heads * 2} ÷ 2 = ${rabbits} 只。` },
                    { title: "算出鸡的数量", content: `剩下的就是鸡：${heads} - ${rabbits} = ${chickens} 只。` }
                ];

                this.dom.solutionContent.innerHTML = steps.map((step, i) => `
                    <div class="solution-step">
                        <strong>步骤 ${i+1}：${step.title}</strong><br>
                        ${step.content}
                    </div>
                `).join('');
                
                this.dom.solutionOverlay.classList.add('show');
                
                // Also show visual answer
                this.state.showAnimals = true;
                this.renderAnimals();
                this.dom.chickenInput.value = chickens;
                this.dom.rabbitInput.value = rabbits;
            }

            hideSolution() {
                this.dom.solutionOverlay.classList.remove('show');
            }

            clearInputs() {
                this.dom.chickenInput.value = '';
                this.dom.rabbitInput.value = '';
                this.dom.chickenInput.focus();
            }

            updateStats() {
                const { correct, wrong } = this.state.stats;
                const total = correct + wrong;
                const acc = total === 0 ? 0 : Math.round((correct / total) * 100);
                
                this.dom.stats.correct.textContent = correct;
                this.dom.stats.wrong.textContent = wrong;
                this.dom.stats.accuracy.textContent = `${acc}%`;
            }

            showToast(msg, type) {
                const toast = this.dom.toast;
                const icon = document.getElementById('toastIcon');
                const message = document.getElementById('toastMessage');
                
                toast.className = `toast show ${type}`;
                icon.textContent = type === 'success' ? '✅' : '❌';
                message.textContent = msg;
                
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }
        }

        // Handle resize for grid recalculation
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (game) game.renderAnimals();
            }, 200);
        });

        const game = new ChickenRabbitGame();
    </script>
</body>
</html>
