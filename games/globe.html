    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script>
        // Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Earth Group
        const earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // Create Earth Texture with detailed continents
        function createEarthTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Ocean gradient - deeper blue with variation
            const oceanGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            oceanGradient.addColorStop(0, '#0a3055');
            oceanGradient.addColorStop(0.2, '#0d3d6b');
            oceanGradient.addColorStop(0.4, '#155a8a');
            oceanGradient.addColorStop(0.5, '#1a6fa8');
            oceanGradient.addColorStop(0.6, '#155a8a');
            oceanGradient.addColorStop(0.8, '#0d3d6b');
            oceanGradient.addColorStop(1, '#0a3055');
            ctx.fillStyle = oceanGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add subtle wave texture to ocean
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const alpha = Math.random() * 0.02;
                ctx.fillStyle = `rgba(100, 180, 255, ${alpha})`;
                ctx.fillRect(x, y, Math.random() * 3 + 1, 1);
            }

            // Draw detailed continents with terrain variation
            // Asia - with forests and deserts
            drawContinentWithTerrain(ctx, 'asia', [
                [toCanvas(25, 75), toCanvas(40, 73), toCanvas(55, 72), toCanvas(70, 70), toCanvas(85, 68), toCanvas(100, 65), toCanvas(115, 60), toCanvas(130, 55), toCanvas(145, 50), toCanvas(160, 45)],
                [toCanvas(170, 40), toCanvas(175, 35), toCanvas(180, 30), toCanvas(175, 25), toCanvas(165, 22), toCanvas(150, 18), toCanvas(135, 15), toCanvas(120, 12), toCanvas(105, 10), toCanvas(95, 8)],
                [toCanvas(85, 12), toCanvas(75, 18), toCanvas(65, 25), toCanvas(55, 32), toCanvas(45, 40), toCanvas(38, 48), toCanvas(32, 55), toCanvas(28, 62), toCanvas(25, 68), toCanvas(25, 75)]
            ], '#1e6b3e', '#c4a35a');

            // Europe
            drawContinentWithTerrain(ctx, 'europe', [
                [toCanvas(-10, 72), toCanvas(0, 73), toCanvas(10, 72), toCanvas(20, 70), toCanvas(28, 67), toCanvas(35, 62), toCanvas(40, 57), toCanvas(42, 52), toCanvas(40, 47), toCanvas(35, 42)],
                [toCanvas(28, 38), toCanvas(20, 36), toCanvas(12, 35), toCanvas(5, 37), toCanvas(-3, 40), toCanvas(-8, 44), toCanvas(-10, 50), toCanvas(-10, 56), toCanvas(-10, 62), toCanvas(-10, 68), toCanvas(-10, 72)]
            ], '#2a7d54', '#8b9a6b');

            // Africa
            drawContinentWithTerrain(ctx, 'africa', [
                [toCanvas(-18, 37), toCanvas(-12, 38), toCanvas(-5, 36), toCanvas(5, 34), toCanvas(12, 32), toCanvas(18, 30), toCanvas(24, 28), toCanvas(30, 25), toCanvas(36, 20), toCanvas(40, 15)],
                [toCanvas(43, 10), toCanvas(45, 5), toCanvas(47, 0), toCanvas(47, -8), toCanvas(45, -15), toCanvas(42, -22), toCanvas(38, -28), toCanvas(33, -33), toCanvas(28, -35), toCanvas(22, -35)],
                [toCanvas(17, -33), toCanvas(12, -28), toCanvas(8, -22), toCanvas(5, -15), toCanvas(2, -8), toCanvas(0, 0), toCanvas(-2, 10), toCanvas(-5, 20), toCanvas(-10, 28), toCanvas(-15, 34), toCanvas(-18, 37)]
            ], '#237a4a', '#d4a84b');

            // North America
            drawContinentWithTerrain(ctx, 'north-america', [
                [toCanvas(-168, 72), toCanvas(-150, 73), toCanvas(-130, 72), toCanvas(-110, 70),
                toCanvas(-95, 68), toCanvas(-82, 65), toCanvas(-72, 60), toCanvas(-65, 55),
                toCanvas(-60, 48), toCanvas(-55, 42), toCanvas(-50, 35), toCanvas(-45, 28),
                toCanvas(-40, 22), toCanvas(-35, 18), toCanvas(-28, 15), toCanvas(-22, 12),
                toCanvas(-15, 10), toCanvas(-8, 8), toCanvas(0, 7), toCanvas(8, 8),
                toCanvas(15, 10), toCanvas(22, 14), toCanvas(28, 20), toCanvas(33, 28),
                toCanvas(38, 38), toCanvas(42, 48), toCanvas(48, 55), toCanvas(55, 60),
                toCanvas(65, 63), toCanvas(75, 65), toCanvas(85, 66), toCanvas(95, 67),
                toCanvas(105, 66), toCanvas(115, 64), toCanvas(125, 60), toCanvas(135, 55),
                toCanvas(145, 50), toCanvas(155, 48), toCanvas(162, 50), toCanvas(168, 55),
                toCanvas(170, 60), toCanvas(168, 65), toCanvas(160, 68), toCanvas(-168, 72)
            ], '#1f7a45', '#c9a959');

            // South America
            drawContinentWithTerrain(ctx, 'south-america', [
                [toCanvas(-82, 12), toCanvas(-75, 10), toCanvas(-65, 8), toCanvas(-55, 5),
                toCanvas(-48, 2), toCanvas(-42, -3), toCanvas(-38, -10), toCanvas(-35, -18),
                toCanvas(-34, -25), toCanvas(-35, -32), toCanvas(-38, -38), toCanvas(-42, -42),
                toCanvas(-48, -45), toCanvas(-55, -48), toCanvas(-62, -50), toCanvas(-70, -50),
                toCanvas(-75, -48), toCanvas(-78, -44), toCanvas(-80, -38), toCanvas(-80, -32),
                toCanvas(-80, -25), toCanvas(-80, -18), toCanvas(-80, -10), toCanvas(-80, -3),
                toCanvas(-80, 5), toCanvas(-82, 12)
            ], '#267a4f', '#8b7355');

            // Oceania - Australia
            drawContinentWithTerrain(ctx, 'oceania', [
                [toCanvas(113, -12), toCanvas(123, -15), toCanvas(135, -17), toCanvas(145, -18),
                toCanvas(153, -17), toCanvas(160, -15), toCanvas(165, -12), toCanvas(168, -8),
                toCanvas(170, -5), toCanvas(172, 0), toCanvas(173, 5), toCanvas(172, 10),
                toCanvas(170, 15), toCanvas(165, 20), toCanvas(158, 24), toCanvas(148, 26),
                toCanvas(138, 26), toCanvas(128, 24), toCanvas(120, 20), toCanvas(115, 15),
                toCanvas(112, 10), toCanvas(110, 5), toCanvas(110, 0), toCanvas(111, -5), toCanvas(113, -12)
            ], '#3a9d6e', '#a08060'];

            // Add islands
            drawIslands(ctx);

            // Antarctica
            ctx.fillStyle = '#e8f4f8';
            drawAntarctica(ctx, canvas.width, canvas.height);

            // Arctic
            ctx.fillStyle = '#e8f4f8';
            drawArctic(ctx, canvas.width, canvas.height);

            return new THREE.CanvasTexture(canvas);
        }

        function drawContinentWithTerrain(ctx, continent, points, forestColor, desertColor) {
            // Draw base continent
            ctx.fillStyle = forestColor;
            ctx.beginPath();
            ctx.moveTo(points[0][0], points[0][1]);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i][0], points[i][1]);
            }
            ctx.closePath();
            ctx.fill();

            // Add desert patches
            ctx.fillStyle = desertColor;
            if (continent === 'asia') {
                // Arabian Peninsula
                ctx.beginPath();
                ctx.ellipse(900, 280, 40, 25, 0.3, 0, Math.PI * 2);
                ctx.fill();
                // Gobi desert
                ctx.beginPath();
                ctx.ellipse(1100, 320, 50, 20, 0.2, 0, Math.PI * 2);
                ctx.fill();
            }
            if (continent === 'africa') {
                // Sahara
                ctx.beginPath();
                ctx.ellipse(900, 380, 80, 35, -0.1, 0, Math.PI * 2);
                ctx.fill();
            }
            if (continent === 'north-america') {
                // Mojave/Sonoran
                ctx.beginPath();
                ctx.ellipse(280, 280, 30, 15, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            if (continent === 'south-america') {
                // Atacama
                ctx.beginPath();
                ctx.ellipse(400, 450, 25, 12, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            if (continent === 'oceania') {
                // Australian interior
                ctx.beginPath();
                ctx.ellipse(1280, 640, 40, 25, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawIslands(ctx) {
            // Greenland
            ctx.fillStyle = '#d4e8d6';
            ctx.beginPath();
            ctx.ellipse(380, 200, 35, 50, -0.2, 0, Math.PI * 2);
            ctx.fill();

            // UK
            ctx.fillStyle = '#2a7d54';
            ctx.beginPath();
            ctx.ellipse(750, 230, 15, 25, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Japan
            ctx.fillStyle = '#1f7a45';
            ctx.beginPath();
            ctx.ellipse(1350, 280, 12, 40, 0.15, 0, Math.PI * 2);
            ctx.fill();

            // New Zealand
            ctx.fillStyle = '#3a9d6e';
            ctx.beginPath();
            ctx.ellipse(1680, 700, 8, 20, 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(1700, 680, 6, 15, -0.1, 0, Math.PI * 2);
            ctx.fill();

            // Indonesia islands
            ctx.fillStyle = '#2a7d54';
            for (let i = 0; i < 8; i++) {
                ctx.beginPath();
                ctx.ellipse(1250 + i * 20, 580 + (i % 2) * 10, 15, 8, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Philippines
            ctx.fillStyle = '#267a4f';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                ctx.ellipse(1320 + i * 12, 500 + (i % 2) * 8, 10, 6, 0, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawDetailedContinent(ctx, continent) {
            const data = getContinentData(continent);
            ctx.beginPath();
            ctx.moveTo(data[0][0], data[0][1]);
            for (let i = 1; i < data.length; i++) {
                const [x, y] = data[i];
                const [px, py] = data[i - 1];
                // Use quadratic curves for smoother edges
                const cx = (x + px) / 2 + (Math.random() - 0.5) * 10;
                const cy = (y + py) / 2 + (Math.random() - 0.5) * 10;
                ctx.quadraticCurveTo(cx, cy, x, y);
            }
            ctx.closePath();
            ctx.fill();
        }

        function getContinentData(continent) {
            const scale = 2048 / 360;
            const heightScale = 1024 / 180;

            // Convert lat/lon to canvas coordinates
            const toCanvas = (lon, lat) => [
                (lon + 180) * scale,
                (90 - lat) * heightScale
            ];

            const data = {
                'asia': [
                    toCanvas(25, 75), toCanvas(40, 72), toCanvas(60, 70), toCanvas(80, 65),
                    toCanvas(100, 60), toCanvas(120, 55), toCanvas(140, 50), toCanvas(160, 45),
                    toCanvas(170, 40), toCanvas(180, 35), toCanvas(170, 30), toCanvas(150, 25),
                    toCanvas(130, 20), toCanvas(110, 15), toCanvas(100, 10), toCanvas(90, 15),
                    toCanvas(80, 20), toCanvas(70, 25), toCanvas(60, 30), toCanvas(50, 35),
                    toCanvas(40, 40), toCanvas(35, 45), toCanvas(30, 50), toCanvas(25, 55),
                    toCanvas(25, 60), toCanvas(20, 65), toCanvas(25, 70), toCanvas(25, 75)
                ],
                'europe': [
                    toCanvas(-10, 70), toCanvas(0, 72), toCanvas(10, 71), toCanvas(20, 70),
                    toCanvas(28, 65), toCanvas(35, 60), toCanvas(40, 55), toCanvas(35, 50),
                    toCanvas(30, 45), toCanvas(25, 40), toCanvas(15, 38), toCanvas(5, 40),
                    toCanvas(-5, 43), toCanvas(-10, 45), toCanvas(-10, 50), toCanvas(-10, 55),
                    toCanvas(-10, 60), toCanvas(-10, 65), toCanvas(-10, 70)
                ],
                'africa': [
                    toCanvas(-17, 35), toCanvas(-10, 37), toCanvas(0, 35), toCanvas(10, 32),
                    toCanvas(15, 30), toCanvas(20, 25), toCanvas(25, 20), toCanvas(30, 15),
                    toCanvas(35, 10), toCanvas(40, 5), toCanvas(42, 0), toCanvas(40, -10),
                    toCanvas(35, -20), toCanvas(30, -25), toCanvas(25, -30), toCanvas(20, -34),
                    toCanvas(15, -35), toCanvas(10, -30), toCanvas(5, -25), toCanvas(0, -20),
                    toCanvas(-5, -15), toCanvas(-10, -10), toCanvas(-15, -5), toCanvas(-17, 0),
                    toCanvas(-18, 10), toCanvas(-17, 20), toCanvas(-17, 30), toCanvas(-17, 35)
                ],
                'north-america': [
                    toCanvas(-168, 70), toCanvas(-140, 72), toCanvas(-120, 70), toCanvas(-100, 70),
                    toCanvas(-95, 65), toCanvas(-80, 60), toCanvas(-70, 55), toCanvas(-60, 50),
                    toCanvas(-50, 45), toCanvas(-40, 40), toCanvas(-30, 35), toCanvas(-25, 30),
                    toCanvas(-20, 25), toCanvas(-15, 20), toCanvas(-10, 15), toCanvas(-5, 10),
                    toCanvas(0, 8), toCanvas(5, 10), toCanvas(10, 15), toCanvas(15, 20),
                    toCanvas(20, 25), toCanvas(25, 30), toCanvas(30, 35), toCanvas(35, 40),
                    toCanvas(40, 45), toCanvas(50, 50), toCanvas(60, 55), toCanvas(65, 60),
                    toCanvas(70, 65), toCanvas(80, 68), toCanvas(90, 70), toCanvas(100, 70),
                    toCanvas(110, 68), toCanvas(120, 65), toCanvas(130, 60), toCanvas(140, 55),
                    toCanvas(150, 50), toCanvas(160, 55), toCanvas(165, 60), toCanvas(165, 65),
                    toCanvas(170, 68), toCanvas(-168, 70)
                ],
                'south-america': [
                    toCanvas(-80, 10), toCanvas(-70, 10), toCanvas(-60, 5), toCanvas(-50, 0),
                    toCanvas(-40, -5), toCanvas(-35, -10), toCanvas(-30, -15), toCanvas(-30, -20),
                    toCanvas(-35, -25), toCanvas(-40, -30), toCanvas(-45, -35),
                    toCanvas(-50, -40), toCanvas(-55, -45), toCanvas(-60, -50), toCanvas(-65, -52),
                    toCanvas(-70, -50), toCanvas(-75, -45), toCanvas(-75, -40), toCanvas(-80, -35),
                    toCanvas(-80, -30), toCanvas(-80, -25), toCanvas(-80, -20), toCanvas(-80, -15),
                    toCanvas(-80, -10), toCanvas(-80, -5), toCanvas(-80, 0), toCanvas(-80, 5),
                    toCanvas(-80, 10)
                ],
                'oceania': [
                    toCanvas(110, -10), toCanvas(115, -12), toCanvas(130, -12), toCanvas(145, -10),
                    toCanvas(155, -8), toCanvas(160, -10), toCanvas(165, -15), toCanvas(170, -20),
                    toCanvas(175, -25), toCanvas(180, -30), toCanvas(170, -35), toCanvas(160, -40),
                    toCanvas(150, -42), toCanvas(140, -40), toCanvas(130, -38), toCanvas(120, -35),
                    toCanvas(115, -30), toCanvas(110, -25), toCanvas(105, -20), toCanvas(100, -15),
                    toCanvas(105, -12), toCanvas(110, -10)
                ]
            };

            return data[continent] || [];
        }

        function drawAntarctica(ctx, width, height) {
            // Antarctica - detailed irregular shape
            ctx.beginPath();
            ctx.moveTo(200, height - 30);
            ctx.bezierCurveTo(400, height - 20, 600, height - 10, 800, height - 25);
            ctx.bezierCurveTo(1000, height - 15, 1200, height - 20, 1400, height - 30);
            ctx.bezierCurveTo(1600, height - 25, 1800, height - 35, width - 200, height - 30);
            ctx.bezierCurveTo(width - 400, height - 40, width - 600, height - 25, width - 800, height - 35);
            ctx.bezierCurveTo(width - 1000, height - 20, width - 1200, height - 30, width - 1400, height - 25);
            ctx.bezierCurveTo(width - 1600, height - 35, width - 1800, height - 20, 200, height - 30);
            ctx.fill();
        }

        function drawArctic(ctx, width, height) {
            // Arctic - detailed irregular shape
            ctx.beginPath();
            ctx.moveTo(300, 30);
            ctx.bezierCurveTo(500, 20, 700, 25, 900, 20);
            ctx.bezierCurveTo(1100, 28, 1300, 22, 1500, 30);
            ctx.bezierCurveTo(1700, 25, 1748, 35, 1748, 35);
            ctx.bezierCurveTo(1748, 35, 1700, 45, 1500, 40);
            ctx.bezierCurveTo(1300, 48, 1100, 42, 900, 45);
            ctx.bezierCurveTo(700, 38, 500, 43, 300, 40);
            ctx.bezierCurveTo(200, 45, 300, 30, 300, 30);
            ctx.fill();
        }

        // Earth Mesh
        const earthTexture = createEarthTexture();
        const earthGeometry = new THREE.SphereGeometry(1.5, 64, 64);
        const earthMaterial = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 25,
            specular: new THREE.Color(0x333333)
        });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earthGroup.add(earth);

        // Atmosphere
        const atmosphereGeometry = new THREE.SphereGeometry(1.58, 64, 64);
        const atmosphereMaterial = new THREE.MeshPhongMaterial({
            color: 0x4488ff,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
        earthGroup.add(atmosphere);

        // Lat/Long Lines
        function createLatLongLines() {
            const group = new THREE.Group();

            // Latitude lines
            for (let i = -80; i <= 80; i += 20) {
                const geometry = new THREE.TorusGeometry(
                    Math.cos(i * Math.PI / 180) * 1.501,
                    0.002,
                    8, 64
                );
                const material = new THREE.MeshBasicMaterial({
                    color: 0x4488ff,
                    transparent: true,
                    opacity: 0.2
                });
                const ring = new THREE.Mesh(geometry, material);
                ring.rotation.x = Math.PI / 2;
                ring.position.y = Math.sin(i * Math.PI / 180) * 1.501;
                group.add(ring);
            }

            // Longitude lines
            for (let i = 0; i < 360; i += 15) {
                const geometry = new THREE.TorusGeometry(1.501, 0.002, 8, 64);
                const material = new THREE.MeshBasicMaterial({
                    color: 0x4488ff,
                    transparent: true,
                    opacity: 0.2
                });
                const ring = new THREE.Mesh(geometry, material);
                ring.rotation.y = i * Math.PI / 180;
                group.add(ring);
            }

            return group;
        }

        const latLongLines = createLatLongLines();
        earthGroup.add(latLongLines);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(5, 3, 5);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
        fillLight.position.set(-5, -3, -5);
        scene.add(fillLight);

        // Interaction
        let isRotating = true;
        let rotationSpeed = 0.3;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0;
        let targetRotationY = 0;
        let autoRotateY = 0;
        let targetZoom = 1;
        let currentZoom = 1;

        // Mouse Events
        renderer.domElement.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaMove = {
                x: e.clientX - previousMousePosition.x,
                y: e.clientY - previousMousePosition.y
            };
            targetRotationY += deltaMove.x * 0.005;
            targetRotationX += deltaMove.y * 0.005;
            targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        document.addEventListener('mouseup', () => { isDragging = false; });

        // Wheel zoom - smooth
        renderer.domElement.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetZoom -= e.deltaY * 0.001;
            targetZoom = Math.max(0.5, Math.min(2, targetZoom));
            document.getElementById('zoomSlider').value = targetZoom * 100;
            document.getElementById('zoomValue').textContent = targetZoom.toFixed(1) + 'x';
        });

        // Touch Events
        renderer.domElement.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        renderer.domElement.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaMove = {
                x: e.touches[0].clientX - previousMousePosition.x,
                y: e.touches[0].clientY - previousMousePosition.y
            };
            targetRotationY += deltaMove.x * 0.005;
            targetRotationX += deltaMove.y * 0.005;
            targetRotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, targetRotationX));
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        renderer.domElement.addEventListener('touchend', () => { isDragging = false; });

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Control Functions
        function toggleRotation() {
            isRotating = !isRotating;
        }

        function resetView() {
            targetRotationX = 0;
            targetRotationY = 0;
            autoRotateY = 0;
            targetZoom = 1;
            currentZoom = 1;
            camera.position.z = 5;
            document.getElementById('speedSlider').value = 30;
            document.getElementById('speedValue').textContent = '30%';
            document.getElementById('zoomSlider').value = 100;
            document.getElementById('zoomValue').textContent = '1.0x';
            rotationSpeed = 0.3;
            isRotating = true;
        }

        function speedUp() {
            rotationSpeed = Math.min(1, rotationSpeed + 0.1);
            const value = Math.round(rotationSpeed * 100);
            document.getElementById('speedSlider').value = value;
            document.getElementById('speedValue').textContent = value + '%';
        }

        function slowDown() {
            rotationSpeed = Math.max(0.05, rotationSpeed - 0.1);
            const value = Math.round(rotationSpeed * 100);
            document.getElementById('speedSlider').value = value;
            document.getElementById('speedValue').textContent = value + '%';
        }

        // Speed slider
        document.getElementById('speedSlider').addEventListener('input', (e) => {
            rotationSpeed = e.target.value / 100;
            document.getElementById('speedValue').textContent = e.target.value + '%';
            isRotating = rotationSpeed > 0;
        });

        // Zoom slider
        document.getElementById('zoomSlider').addEventListener('input', (e) => {
            targetZoom = e.target.value / 100;
            document.getElementById('zoomValue').textContent = targetZoom.toFixed(1) + 'x';
        });

        // Continent Info
        const info = {
            'asia': '亚洲是世界上面积最大、人口最多的大洲，占地球陆地面积的30%。亚洲有着悠久的历史文明，包括古代中国、印度、巴比伦等文明。亚洲最高峰是珠穆朗玛峰（8848.86米）。',
            'europe': '欧洲是世界上面积第二小的大洲，但却是工业革命的发源地，对世界历史和文化产生了深远影响。欧洲共有50多个国家，是世界上发达国家最多的大洲。',
            'africa': '非洲是世界第二大洲，拥有世界上最长的河流尼罗河和最大的沙漠撒哈拉沙漠。非洲是人类文明的发源地之一，目前有54个国家。',
            'north-america': '北美洲是世界第三大洲，包括美国、加拿大、墨西哥等23个国家。北美洲是世界上经济最发达的大洲之一，拥有丰富的自然资源和先进的科技。',
            'south-america': '南美洲拥有世界上最长的山脉安第斯山脉和最大的热带雨林亚马逊雨林。巴西是南美洲面积最大的国家，足球和桑巴舞是其著名文化。',
            'oceania': '大洋洲由澳大利亚大陆和众多岛屿组成，是世界上面积最小的大洲。澳大利亚是大洋洲最大的国家，大堡礁是世界上最著名的自然奇观之一。',
            'antarctic': '南极洲是世界上最寒冷、风暴最多的大陆，没有永久居民。南极洲蕴藏着丰富的矿产资源，是重要的科研基地。'
        };

        function showInfo(continent) {
            document.getElementById('infoText').textContent = info[continent];
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);

            if (isRotating && !isDragging) {
                autoRotateY += rotationSpeed * 0.01;
            }

            earthGroup.rotation.y += (targetRotationY + autoRotateY - earthGroup.rotation.y) * 0.1;
            earthGroup.rotation.x += (targetRotationX - earthGroup.rotation.x) * 0.1;

            // Smooth zoom
            currentZoom += (targetZoom - currentZoom) * 0.1;
            camera.position.z = 5 / currentZoom;

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
