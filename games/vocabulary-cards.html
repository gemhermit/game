                    { word: 'Beautiful', phonetic: '/ˈbjuːtɪfl/', meaning: '美丽的', example: 'She is beautiful.\n她很美丽。' }
                ]
            },

                name: '动物词汇',
                words: [
                    { word: 'Cat', phonetic: '/kæt/', meaning: '猫', example: 'The cat is sleeping.\n猫在睡觉。' },
                    { word: 'Dog', phonetic: '/dɔːɡ/', meaning: '狗', example: 'My dog is friendly.\n我的狗很友好。' },
                    { word: 'Bird', phonetic: '/bɜːrd/', meaning: '鸟', example: 'The bird can fly.\n鸟会飞。' },
                    { word: 'Fish', phonetic: '/fɪʃ/', meaning: '鱼', example: 'Fish live in water.\n鱼生活在水中。' },
                    { word: 'Elephant', phonetic: '/ˈelɪfənt/', meaning: '大象', example: 'The elephant is big.\n大象很大。' },
                    { word: 'Lion', phonetic: '/ˈlaɪən/', meaning: '狮子', example: 'The lion is strong.\n狮子很强壮。' },
                    { word: 'Tiger', phonetic: '/ˈtaɪɡər/', meaning: '老虎', example: 'Tigers are dangerous.\n老虎很危险。' },
                    { word: 'Rabbit', phonetic: '/ˈræbɪt/', meaning: '兔子', example: 'The rabbit is cute.\n兔子很可爱。' },
                    { word: 'Horse', phonetic: '/hɔːrs/', meaning: '马', example: 'The horse runs fast.\n马跑得很快。' },
                    { word: 'Monkey', phonetic: '/ˈmʌŋki/', meaning: '猴子', example: 'Monkeys like bananas.\n猴子喜欢香蕉。' }
                ]
            },
            colors: {
                name: '颜色词汇',
                words: [
                    { word: 'Red', phonetic: '/red/', meaning: '红色', example: 'The apple is red.\n苹果是红色的。' },
                    { word: 'Blue', phonetic: '/bluː/', meaning: '蓝色', example: 'The sky is blue.\n天空是蓝色的。' },
                    { word: 'Green', phonetic: '/ɡriːn/', meaning: '绿色', example: 'Grass is green.\n草是绿色的。' },
                    { word: 'Yellow', phonetic: '/ˈjeloʊ/', meaning: '黄色', example: 'The sun is yellow.\n太阳是黄色的。' },
                    { word: 'Black', phonetic: '/blæk/', meaning: '黑色', example: 'The cat is black.\n猫是黑色的。' },
                    { word: 'White', phonetic: '/waɪt/', meaning: '白色', example: 'Snow is white.\n雪是白色的。' },
                    { word: 'Purple', phonetic: '/ˈpɜːrpl/', meaning: '紫色', example: 'The flower is purple.\n花是紫色的。' },
                    { word: 'Orange', phonetic: '/ˈɔːrɪndʒ/', meaning: '橙色', example: 'The orange is orange.\n橙子是橙色的。' },
                    { word: 'Pink', phonetic: '/pɪŋk/', meaning: '粉色', example: 'She likes pink.\n她喜欢粉色。' },
                    { word: 'Brown', phonetic: '/braʊn/', meaning: '棕色', example: 'The bear is brown.\n熊是棕色的。' }
                ]
            },
            food: {
                name: '食物词汇',
                words: [
                    { word: 'Apple', phonetic: '/ˈæpl/', meaning: '苹果', example: 'I eat an apple.\n我吃一个苹果。' },
                    { word: 'Banana', phonetic: '/bəˈnænə/', meaning: '香蕉', example: 'Bananas are yellow.\n香蕉是黄色的。' },
                    { word: 'Bread', phonetic: '/bred/', meaning: '面包', example: 'I like bread.\n我喜欢面包。' },
                    { word: 'Milk', phonetic: '/mɪlk/', meaning: '牛奶', example: 'Milk is white.\n牛奶是白色的。' },
                    { word: 'Water', phonetic: '/ˈwɔːtər/', meaning: '水', example: 'I drink water.\n我喝水。' },
                    { word: 'Rice', phonetic: '/raɪs/', meaning: '米饭', example: 'We eat rice.\n我们吃米饭。' },
                    { word: 'Chicken', phonetic: '/ˈtʃɪkɪn/', meaning: '鸡肉', example: 'Chicken is delicious.\n鸡肉很美味。' },
                    { word: 'Egg', phonetic: '/eɡ/', meaning: '鸡蛋', example: 'I cook an egg.\n我煮一个鸡蛋。' },
                    { word: 'Cake', phonetic: '/keɪk/', meaning: '蛋糕', example: 'The cake is sweet.\n蛋糕很甜。' },
                    { word: 'Tea', phonetic: '/tiː/', meaning: '茶', example: 'I drink tea.\n我喝茶。' }
                ]
            },
            family: {
                name: '家庭词汇',
                words: [
                    { word: 'Father', phonetic: '/ˈfɑːðər/', meaning: '父亲', example: 'My father is kind.\n我的父亲很善良。' },
                    { word: 'Mother', phonetic: '/ˈmʌðər/', meaning: '母亲', example: 'My mother cooks well.\n我的母亲做饭很好。' },
                    { word: 'Brother', phonetic: '/ˈbrʌðər/', meaning: '兄弟', example: 'My brother is tall.\n我的兄弟很高。' },
                    { word: 'Sister', phonetic: '/ˈsɪstər/', meaning: '姐妹', example: 'My sister is smart.\n我的姐妹很聪明。' },
                    { word: 'Baby', phonetic: '/ˈbeɪbi/', meaning: '婴儿', example: 'The baby is cute.\n婴儿很可爱。' },
                    { word: 'Child', phonetic: '/tʃaɪld/', meaning: '孩子', example: 'The child is playing.\n孩子在玩耍。' },
                    { word: 'Family', phonetic: '/ˈfæməli/', meaning: '家庭', example: 'I love my family.\n我爱我的家庭。' },
                    { word: 'Home', phonetic: '/hoʊm/', meaning: '家', example: 'Home is warm.\n家很温暖。' },
                    { word: 'Grandpa', phonetic: '/ˈɡrænpɑː/', meaning: '爷爷', example: 'Grandpa tells stories.\n爷爷讲故事。' },
                    { word: 'Grandma', phonetic: '/ˈɡrænmɑː/', meaning: '奶奶', example: 'Grandma is kind.\n奶奶很慈祥。' }
                ]
            }
        };
        
        let currentCategory = 'basic';
        let currentIndex = 0;
        let learnedWords = new Set();
        let correctAnswers = 0;
        let totalAnswers = 0;
        let isFlipped = false;
        
        const card = document.getElementById('flashCard');
        const wordText = document.getElementById('wordText');
        const phoneticText = document.getElementById('phoneticText');
        const meaningText = document.getElementById('meaningText');
        const exampleText = document.getElementById('exampleText');
        
        function updateCard() {
            const words = vocabularies[currentCategory].words;
            const currentWord = words[currentIndex];
            
            wordText.textContent = currentWord.word;
            phoneticText.textContent = currentWord.phonetic;
            meaningText.textContent = currentWord.meaning;
            exampleText.innerHTML = currentWord.example.replace('\n', '<br>');
            
            // 重置卡片状态
            card.classList.remove('flipped');
            isFlipped = false;
            
            updateStats();
        }
        
        function updateStats() {
            const words = vocabularies[currentCategory].words;
            const categoryName = vocabularies[currentCategory].name;
            
            document.getElementById('currentCategory').textContent = categoryName;
            document.getElementById('learnedCount').textContent = learnedWords.size;
            document.getElementById('totalCount').textContent = words.length;
            
            const accuracy = totalAnswers > 0 ? Math.round((correctAnswers / totalAnswers) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
            
            const progress = (learnedWords.size / words.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }
        
        function flipCard() {
            card.classList.toggle('flipped');
            isFlipped = !isFlipped;
        }
        
        function nextWord() {
            const words = vocabularies[currentCategory].words;
            currentIndex = (currentIndex + 1) % words.length;
            updateCard();
        }
        
        function prevWord() {
            const words = vocabularies[currentCategory].words;
            currentIndex = (currentIndex - 1 + words.length) % words.length;
            updateCard();
        }
        
        function markAsKnown() {
            const words = vocabularies[currentCategory].words;
            const wordKey = `${currentCategory}-${currentIndex}`;
            learnedWords.add(wordKey);
            correctAnswers++;
            totalAnswers++;
            nextWord();
        }
        
        function markAsUnknown() {
            totalAnswers++;
            nextWord();
        }
        
        function shuffleWords() {
            const words = vocabularies[currentCategory].words;
            currentIndex = Math.floor(Math.random() * words.length);
            updateCard();
        }
        
        function resetProgress() {
            learnedWords.clear();
            correctAnswers = 0;
            totalAnswers = 0;
            currentIndex = 0;
            updateCard();
        }
        
        function speakWord() {
            const words = vocabularies[currentCategory].words;
            const currentWord = words[currentIndex];
            
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(currentWord.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.8;
                speechSynthesis.speak(utterance);
            } else {
                alert('您的浏览器不支持语音合成功能');
            }
        }
        
        function changeCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            learnedWords.clear();
            correctAnswers = 0;
            totalAnswers = 0;
            
            // 更新按钮状态
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-category="${category}"]`).classList.add('active');
            
            updateCard();
        }
        
        // 事件监听
        card.addEventListener('click', flipCard);
        document.getElementById('nextBtn').addEventListener('click', nextWord);
        document.getElementById('prevBtn').addEventListener('click', prevWord);
        document.getElementById('knowBtn').addEventListener('click', markAsKnown);
        document.getElementById('unknowBtn').addEventListener('click', markAsUnknown);
        document.getElementById('shuffleBtn').addEventListener('click', shuffleWords);
        document.getElementById('resetBtn').addEventListener('click', resetProgress);
        document.getElementById('speakBtn').addEventListener('click', speakWord);
        
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                changeCategory(btn.dataset.category);
            });
        });
        
        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                    e.preventDefault();
                    flipCard();
                    break;
                case 'ArrowLeft':
                    prevWord();
                    break;
                case 'ArrowRight':
                    nextWord();
                    break;
                case '1':
                    markAsKnown();
                    break;
                case '2':
                    markAsUnknown();
                    break;
                case 's':
                    speakWord();
                    break;
            }
        });
        
        // 初始化
