                        {word: 'EXTRAORDINARY', phonetic: '/ɪkˈstrɔːrdəneri/', meaning: 'adj. 非凡的', example: 'She has extraordinary talent. 她有非凡的天赋。'},
                        {word: 'RESPONSIBILITY', phonetic: '/rɪˌspɑːnsəˈbɪləti/', meaning: 'n. 责任', example: 'It is our responsibility to protect the environment. 保护环境是我们的责任。'},
                        {word: 'COMMUNICATION', phonetic: '/kəˌmjuːnɪˈkeɪʃən/', meaning: 'n. 交流', example: 'Good communication is important. 良好的交流很重要。'},
                        {word: 'INTERNATIONAL', phonetic: '/ˌɪntərˈnæʃənəl/', meaning: 'adj. 国际的', example: 'This is an international conference. 这是一个国际会议。'},
                        {word: 'UNDERSTANDING', phonetic: '/ˌʌndərˈstændɪŋ/', meaning: 'n. 理解', example: 'Mutual understanding is key to friendship. 相互理解是友谊的关键。'},
                        {word: 'ENVIRONMENT', phonetic: '/ɪnˈvaɪrənmənt/', meaning: 'n. 环境', example: 'We should protect the environment. 我们应该保护环境。'},
                        {word: 'CONGRATULATION', phonetic: '/kənˌɡrætʃuˈleɪʃən/', meaning: 'n. 祝贺', example: 'Congratulations on your success! 祝贺你成功！'},
                        {word: 'DETERMINATION', phonetic: '/dɪˌtɜːrmɪˈneɪʃən/', meaning: 'n. 决心', example: 'Determination is the key to success. 决心是成功的关键。'},
                        {word: 'IMAGINATION', phonetic: '/ɪˌmædʒɪˈneɪʃən/', meaning: 'n. 想象力', example: 'Children have rich imagination. 孩子有丰富的想象力。'},
                        {word: 'PHILOSOPHY', phonetic: '/fɪˈlɒsəfi/', meaning: 'n. 哲学', example: 'He studies philosophy in college. 他在大学学哲学。'},
                        {word: 'ARCHITECTURE', phonetic: '/ˈɑːrkɪtektʃər/', meaning: 'n. 建筑学', example: 'She studies architecture. 她学习建筑学。'},
                        {word: 'TECHNOLOGY', phonetic: '/tekˈnɒlədʒi/', meaning: 'n. 技术', example: 'Technology changes our life. 技术改变我们的生活。'},
                        {word: 'OPPORTUNITY', phonetic: '/ˌɒpərˈtuːnɪti/', meaning: 'n. 机会', example: 'This is a good opportunity. 这是个好机会。'},
                        {word: 'ADMINISTRATION', phonetic: '/ədˌmɪnɪˈstreɪʃən/', meaning: 'n. 管理', example: 'He works in administration. 他做行政工作。'}
                    ]
                };
                
                this.generateKeyboard();
                this.bindEvents();
                this.newWord();
                this.updateStats();
            }
            
            generateKeyboard() {
                const keyboard = document.getElementById('virtualKeyboard');
                const letters = 'QWERTYUIOPASDFGHJKLZXCVBNM';
                
                keyboard.innerHTML = '';
                for (let letter of letters) {
                    const key = document.createElement('div');
                    key.className = 'key';
                    key.textContent = letter;
                    key.dataset.letter = letter;
                    keyboard.appendChild(key);
                }
            }
            
            newWord() {
                const wordList = this.wordLists[this.difficulty];
                this.currentWord = wordList[Math.floor(Math.random() * wordList.length)];
                this.currentInput = '';
                this.hintLevel = 0;

                this.updateWordDisplay();
                this.generateLetterSlots();
                this.clearInput();
                this.hideResult();
                this.hideHint();
                this.updateProgress();

                // 更新键盘状态以反映新单词的字母需求
                this.updateKeyboardState();
            }
            
            updateWordDisplay() {
                document.getElementById('wordDisplay').textContent = '???';
                document.getElementById('wordPhonetic').textContent = this.currentWord.phonetic;
                document.getElementById('wordMeaning').textContent = this.currentWord.meaning;
                document.getElementById('wordExample').innerHTML = this.currentWord.example;
            }
            
            generateLetterSlots() {
                const container = document.getElementById('letterSlots');
                container.innerHTML = '';
                
                for (let i = 0; i < this.currentWord.word.length; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'letter-slot';
                    slot.dataset.index = i;
                    container.appendChild(slot);
                }
            }
            
            updateLetterSlots() {
                const slots = document.querySelectorAll('.letter-slot');
                const word = this.currentWord.word;
                
                slots.forEach((slot, index) => {
                    const letter = this.currentInput[index] || '';
                    slot.textContent = letter;
                    
                    slot.classList.remove('filled', 'correct', 'wrong');
                    
                    if (letter) {
                        slot.classList.add('filled');
                        if (letter === word[index]) {
                            slot.classList.add('correct');
                        } else {
                            slot.classList.add('wrong');
                        }
                    }
                });
            }
            
            addLetter(letter) {
                if (this.currentInput.length < this.currentWord.word.length) {
                    this.currentInput += letter;
                    this.updateLetterSlots();
                    this.updateInputField();

                    // 更新键盘状态 - 只有当字母使用次数达到目标时才禁用
                    this.updateKeyboardState();
                }
            }
            
            removeLetter() {
                if (this.currentInput.length > 0) {
                    const removedLetter = this.currentInput[this.currentInput.length - 1];
                    this.currentInput = this.currentInput.slice(0, -1);
                    this.updateLetterSlots();
                    this.updateInputField();

                    // 更新键盘状态
                    this.updateKeyboardState();
                }
            }

            updateKeyboardState() {
                // 统计目标单词中每个字母应该出现的次数
                const targetCount = {};
                for (let letter of this.currentWord.word) {
                    targetCount[letter] = (targetCount[letter] || 0) + 1;
                }

                // 统计用户当前输入中每个字母已经使用的次数
                const currentCount = {};
                for (let letter of this.currentInput) {
                    currentCount[letter] = (currentCount[letter] || 0) + 1;
                }

                // 更新每个键盘按键的状态
                document.querySelectorAll('.key').forEach(key => {
                    const letter = key.dataset.letter;
                    const used = currentCount[letter] || 0;
                    const needed = targetCount[letter] || 0;

                    // 如果使用次数已达到或超过需求，禁用按钮
                    if (used >= needed) {
                        key.classList.add('used');
                    } else {
                        key.classList.remove('used');
                    }

                    // 保留correct/wrong状态
                    if (!key.classList.contains('correct') && !key.classList.contains('wrong')) {
                        key.classList.remove('used');
                    }
                });
            }
            
            updateInputField() {
                document.getElementById('letterInput').value = this.currentInput;
            }
            
            checkSpelling() {
                if (this.currentInput.length === 0) {
                    this.showResult('请输入拼写', '请先输入单词的拼写。', '#e17055');
                    return;
                }
                
                if (this.currentInput === this.currentWord.word) {
                    this.correctCount++;
                    this.streak++;
                    
                    document.getElementById('wordDisplay').textContent = this.currentWord.word;
                    
                    let message = '恭喜你！单词拼写完全正确。';
                    if (this.streak >= 5) {
                        message += `\n太棒了！你已经连续拼对${this.streak}个单词了！`;
                    }
                    
                    this.showResult('拼写正确!', message, '#00b894');
                    this.markKeyboardCorrect();
                } else {
                    this.wrongCount++;
                    this.streak = 0;
                    
                    let feedback = `拼写错误。正确拼写是：${this.currentWord.word}\n`;
                    feedback += `你的拼写：${this.currentInput}`;
                    
                    this.showResult('拼写错误', feedback, '#e17055');
                    this.markKeyboardWrong();
                }
                
                this.updateStats();
            }
            
            markKeyboardCorrect() {
                for (let letter of this.currentInput) {
                    const key = document.querySelector(`[data-letter="${letter}"]`);
                    if (key) {
                        key.classList.remove('wrong');
                        key.classList.add('correct');
                    }
                }
            }
            
            markKeyboardWrong() {
                for (let i = 0; i < this.currentInput.length; i++) {
                    const letter = this.currentInput[i];
                    const correctLetter = this.currentWord.word[i];
                    const key = document.querySelector(`[data-letter="${letter}"]`);
                    
                    if (key && letter !== correctLetter) {
                        key.classList.remove('correct');
                        key.classList.add('wrong');
                    }
                }
            }
            
            showHint() {
                const word = this.currentWord.word;
                let hintText = '';
                
                switch (this.hintLevel) {
                    case 0:
                        hintText = `提示：这个单词有${word.length}个字母，以字母 '${word[0]}' 开头`;
                        break;
                    case 1:
                        hintText = `提示：前两个字母是 '${word.substring(0, 2)}'`;
                        break;
                    case 2:
                        const halfLength = Math.ceil(word.length / 2);
                        hintText = `提示：前半部分是 '${word.substring(0, halfLength)}'`;
                        break;
                    default:
                        hintText = `提示：完整拼写是 '${word}'`;
                        break;
                }
                
                document.getElementById('hintContent').textContent = hintText;
                document.getElementById('hintPanel').style.display = 'block';
                
                this.hintLevel++;
                
                setTimeout(() => {
                    this.hideHint();
                }, 4000);
            }
            
            playAudio() {
                // 模拟语音播放
                const btn = document.getElementById('playAudioBtn');
                btn.textContent = '🔊 播放中...';
                btn.disabled = true;
                
                // 使用Web Speech API（如果支持）
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(this.currentWord.word);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.8;
                    speechSynthesis.speak(utterance);
                    
                    utterance.onend = () => {
                        btn.textContent = '🔊 播放发音';
                        btn.disabled = false;
                    };
                } else {
                    setTimeout(() => {
                        btn.textContent = '🔊 播放发音';
                        btn.disabled = false;
                    }, 2000);
                }
            }
            
            clearInput() {
                this.currentInput = '';
                this.updateLetterSlots();
                this.updateInputField();
                this.resetKeyboard();
                this.hideHint();
            }
            
            resetKeyboard() {
                document.querySelectorAll('.key').forEach(key => {
                    key.classList.remove('used', 'correct', 'wrong');
                });
            }
            
            showResult(title, content, color) {
                const resultPanel = document.getElementById('resultPanel');
                const resultTitle = document.getElementById('resultTitle');
                const resultContent = document.getElementById('resultContent');
                
                resultTitle.textContent = title;
                resultContent.textContent = content;
                resultPanel.style.background = `linear-gradient(135deg, ${color} 0%, ${color}dd 100%)`;
                resultPanel.style.display = 'block';
                
                setTimeout(() => {
                    resultPanel.style.display = 'none';
                }, 4000);
            }
            
            hideResult() {
                document.getElementById('resultPanel').style.display = 'none';
            }
            
            hideHint() {
                document.getElementById('hintPanel').style.display = 'none';
            }
            
            updateProgress() {
                const progress = (this.currentInput.length / this.currentWord.word.length) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
            }
            
            updateStats() {
                document.getElementById('correctCount').textContent = this.correctCount;
                document.getElementById('wrongCount').textContent = this.wrongCount;
                document.getElementById('streak').textContent = this.streak;
                
                const total = this.correctCount + this.wrongCount;
                const accuracy = total > 0 ? Math.round((this.correctCount / total) * 100) : 0;
                document.getElementById('accuracy').textContent = `${accuracy}%`;
            }
            
            setDifficulty(level) {
                this.difficulty = level;
                
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-level="${level}"]`).classList.add('active');
                
                this.newWord();
            }
            
            bindEvents() {
                // 难度选择
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (btn.dataset.level) {
                            this.setDifficulty(btn.dataset.level);
                        }
                    });
                });

                // 虚拟键盘
                document.getElementById('virtualKeyboard').addEventListener('click', (e) => {
                    if (e.target.classList.contains('key') && !e.target.classList.contains('used')) {
                        this.addLetter(e.target.dataset.letter);
                    }
                });

                // 输入框
                document.getElementById('letterInput').addEventListener('input', (e) => {
                    const value = e.target.value.toUpperCase();
                    this.currentInput = value.slice(0, this.currentWord.word.length);
                    this.updateLetterSlots();
                    this.updateProgress();
                });

                // 键盘事件
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        this.removeLetter();
                        this.updateProgress();
                    } else if (e.key === 'Enter') {
                        this.checkSpelling();
                    } else if (/^[A-Za-z]$/.test(e.key)) {
                        this.addLetter(e.key.toUpperCase());
                        this.updateProgress();
                    }
                });

                // 控制按钮
                document.getElementById('checkBtn').addEventListener('click', () => {
                    this.checkSpelling();
                });

                document.getElementById('hintBtn').addEventListener('click', () => {
                    this.showHint();
                });

                document.getElementById('clearBtn').addEventListener('click', () => {
                    this.clearInput();
                });

                document.getElementById('nextBtn').addEventListener('click', () => {
                    this.newWord();
                });

                document.getElementById('playAudioBtn').addEventListener('click', () => {
                    this.playAudio();
                });

                // 下载词库模板
                document.getElementById('downloadBtn').addEventListener('click', () => {
                    this.downloadTemplate();
                });

                // 导入词库 - label自动触发file input
                document.getElementById('importInput').addEventListener('change', (e) => {
                    this.importWordList(e.target.files[0]);
                });
            }

            downloadTemplate() {
                const template = [
                    { word: "EXAMPLE", phonetic: "/ɪɡˈzæmpəl/", meaning: "n. 例子", example: "This is an example sentence. 这是个例句。" },
                    { word: "CUSTOM", phonetic: "/ˈkʌstəm/", meaning: "n. 习惯", example: "It is a custom in this country. 这是这个国家的习俗。" },
                    { word: "TEMPLATE", phonetic: "/ˈtemplət/", meaning: "n. 模板", example: "Use this template to add more words. 使用此模板添加更多单词。" }
                ];

                const blob = new Blob([JSON.stringify(template, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'word-list-template.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            importWordList(file) {
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const content = e.target.result;
                        let newWords = [];

                        // 尝试解析JSON格式
                        if (file.name.endsWith('.json')) {
                            const data = JSON.parse(content);
                            if (Array.isArray(data)) {
                                newWords = data;
                            } else if (data.words && Array.isArray(data.words)) {
                                newWords = data.words;
                            }
                        } else {
                            // 尝试解析TXT格式：每行一个单词，单词|音标|释义|例句
                            const lines = content.split('\n');
                            for (let line of lines) {
                                line = line.trim();
                                if (!line) continue;
                                const parts = line.split('|');
                                if (parts.length >= 2) {
                                    newWords.push({
                                        word: parts[0].trim().toUpperCase(),
                                        phonetic: parts[1] || '',
                                        meaning: parts[2] || '',
                                        example: parts[3] || ''
                                    });
                                }
                            }
                        }

                        if (newWords.length > 0) {
                            // 根据单词长度分类
                            newWords.forEach(word => {
                                const len = word.word.length;
                                if (len <= 5) {
                                    this.wordLists.easy.push(word);
                                } else if (len <= 8) {
                                    this.wordLists.medium.push(word);
                                } else {
                                    this.wordLists.hard.push(word);
                                }
                            });

                            // 显示导入成功
                            const resultPanel = document.getElementById('resultPanel');
                            document.getElementById('resultTitle').textContent = '导入成功!';
                            document.getElementById('resultContent').textContent = `成功导入 ${newWords.length} 个单词！当前词库共有 ${this.wordLists.easy.length + this.wordLists.medium.length + this.wordLists.hard.length} 个单词。`;
                            resultPanel.style.background = 'linear-gradient(135deg, #00b894 0%, #00a085 100%)';
                            resultPanel.style.display = 'block';
                            setTimeout(() => {
                                resultPanel.style.display = 'none';
                            }, 4000);

                            this.newWord();
                        } else {
                            alert('未能解析到有效的单词，请检查文件格式。\nJSON格式：[{word: "APPLE", phonetic: "/æpəl/", meaning: "n. 苹果", example: "..."}]\nTXT格式：APPLE|/æpəl/|n. 苹果|例句...');
                        }
                    } catch (err) {
                        alert('导入失败：' + err.message);
                    }
                    // 清空input以便可以重复导入同一文件
                    document.getElementById('importInput').value = '';
                };
                reader.readAsText(file);
            }
        }
        
        // 启动游戏
        new WordSpellingGame();
    </script>
