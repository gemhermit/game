    <script>
        class PulleySim {
            constructor() {
                this.canvas = document.getElementById('pulleyCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.container = document.getElementById('canvasContainer');
                
                // State
                this.config = {
                    type: 'fixed', // fixed, movable, compound, complex
                    weight: 100,
                    pulleyWeight: 10,
                    friction: 0.05,
                    showVectors: false,
                    isPlaying: true
                };

                this.physics = {
                    liftHeight: 0, // 0 to 1 (0 = bottom, 1 = top)
                    velocity: 0,
                    targetHeight: 0,
                    isDragging: false,
                    ropeOffset: 0 // For animation
                };

                // UI Elements
                this.ui = {
                    weightSlider: document.getElementById('weightSlider'),
                    pulleyWeightSlider: document.getElementById('pulleyWeightSlider'),
                    frictionSlider: document.getElementById('frictionSlider'),
                    weightVal: document.getElementById('weightVal'),
                    pulleyWeightVal: document.getElementById('pulleyWeightVal'),
                    frictionVal: document.getElementById('frictionVal'),
                    forceVal: document.getElementById('forceVal'),
                    maVal: document.getElementById('maVal'),
                    effVal: document.getElementById('effVal'),
                    effBar: document.getElementById('effBar'),
                    theoryText: document.getElementById('theoryText'),
                    modeBtns: document.querySelectorAll('.mode-btn'),
                    playBtn: document.getElementById('playBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    vectorsBtn: document.getElementById('vectorsBtn'),
                    hintToast: document.getElementById('hintToast')
                };

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.bindEvents();
                this.animate();
                
                // Show hint
                setTimeout(() => this.ui.hintToast.classList.add('visible'), 1000);
                setTimeout(() => this.ui.hintToast.classList.remove('visible'), 4000);
            }

            bindEvents() {
                // Sliders
                this.ui.weightSlider.addEventListener('input', (e) => {
                    this.config.weight = parseFloat(e.target.value);
                    this.ui.weightVal.textContent = `${this.config.weight} N`;
                    this.updateStats();
                });

                this.ui.pulleyWeightSlider.addEventListener('input', (e) => {
                    this.config.pulleyWeight = parseFloat(e.target.value);
                    this.ui.pulleyWeightVal.textContent = `${this.config.pulleyWeight} N`;
                    this.updateStats();
                });

                this.ui.frictionSlider.addEventListener('input', (e) => {
                    this.config.friction = parseFloat(e.target.value);
                    this.ui.frictionVal.textContent = this.config.friction.toFixed(2);
                    this.updateStats();
                });

                // Mode Buttons
                this.ui.modeBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.ui.modeBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.setMode(btn.dataset.type);
                    });
                });

                // Overlay Controls
                this.ui.playBtn.addEventListener('click', () => {
                    this.config.isPlaying = !this.config.isPlaying;
                    this.ui.playBtn.textContent = this.config.isPlaying ? '▶' : '⏸';
                    this.ui.playBtn.classList.toggle('active', this.config.isPlaying);
                });

                this.ui.resetBtn.addEventListener('click', () => {
                    this.physics.liftHeight = 0;
                    this.physics.velocity = 0;
                    this.physics.targetHeight = 0;
                });

                this.ui.vectorsBtn.addEventListener('click', () => {
                    this.config.showVectors = !this.config.showVectors;
                    this.ui.vectorsBtn.classList.toggle('active', this.config.showVectors);
                });

                // Canvas Interaction
                this.canvas.addEventListener('mousedown', (e) => this.startDrag(e));
                this.canvas.addEventListener('mousemove', (e) => this.drag(e));
                window.addEventListener('mouseup', () => this.endDrag());
                
                this.canvas.addEventListener('touchstart', (e) => this.startDrag(e.touches[0]));
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    this.drag(e.touches[0]);
                });
                window.addEventListener('touchend', () => this.endDrag());
            }

            resize() {
                this.canvas.width = this.container.clientWidth;
                this.canvas.height = this.container.clientHeight;
            }

            setMode(type) {
                this.config.type = type;
                this.physics.liftHeight = 0;
                this.physics.targetHeight = 0;
                
                // Update Theory Text
                const texts = {
                    fixed: "定滑轮不省力，但可以改变力的方向。理想情况下 F = G。",
                    movable: "动滑轮可以省一半力，但不能改变力的方向。F = (G + G₀)/2。",
                    compound: "简单滑轮组（2段绳子）结合了定滑轮和动滑轮的优点，既省力又改变方向。",
                    complex: "复杂滑轮组（3段绳子）更省力。F = (G + G₀)/3。"
                };
                this.ui.theoryText.textContent = texts[type];
                this.updateStats();
            }

            updateStats() {
                const { F, n, efficiency } = this.calculatePhysics();
                this.ui.forceVal.textContent = `${F.toFixed(1)} N`;
                this.ui.maVal.textContent = `${(this.config.weight / F).toFixed(2)}x`;
                this.ui.effVal.textContent = `${(efficiency * 100).toFixed(1)}%`;
                this.ui.effBar.style.width = `${efficiency * 100}%`;
            }

            calculatePhysics() {
                const G = this.config.weight;
                const G0 = this.config.pulleyWeight;
                const mu = this.config.friction;
                
                let n = 1; // Rope segments
                let F_ideal = G;
                
                if (this.config.type === 'fixed') n = 1;
                else if (this.config.type === 'movable') n = 2;
                else if (this.config.type === 'compound') n = 2;
                else if (this.config.type === 'complex') n = 3;

                // Force calculation considering friction and pulley weight
                // Simple model: F = (G + G_movable_pulleys) / n * (1 + mu)
                let load = G;
                if (this.config.type !== 'fixed') load += G0;
                
                let F = (load / n) * (1 + mu);
                
                // Efficiency = W_useful / W_total = G*h / (F * n*h) = G / (n*F)
                let efficiency = G / (n * F);
                if (efficiency > 1) efficiency = 1; // Should not happen with this formula but safe guard

                return { F, n, efficiency };
            }

            // Animation Loop
            animate() {
                this.updatePhysics();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }

            updatePhysics() {
                if (this.physics.isDragging) return;

                if (this.config.isPlaying) {
                    // Simple spring/easing to target
                    // If target is set (e.g. by auto-play or released drag)
                    // For demo, let's make it bob up and down slightly if idle
                    // Or just ease to targetHeight
                    
                    const k = 0.1;
                    const damp = 0.8;
                    // For now simple lerp
                    const diff = this.physics.targetHeight - this.physics.liftHeight;
                    if (Math.abs(diff) > 0.001) {
                        this.physics.liftHeight += diff * 0.1;
                    }
                }
            }

            startDrag(e) {
                // Check if clicking near rope end or weight
                // For simplicity, click anywhere to control height
                this.physics.isDragging = true;
                this.physics.isPlaying = false; // Pause auto animation
                this.drag(e);
            }

            drag(e) {
                if (!this.physics.isDragging) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const y = e.clientY - rect.top;
                
                // Map Y to height (inverse)
                // Bottom (canvas.height - 150) -> 0
                // Top (150) -> 1
                const bottomY = this.canvas.height - 150;
                const topY = 150;
                
                let h = 1 - (y - topY) / (bottomY - topY);
                h = Math.max(0, Math.min(1, h));
                
                this.physics.liftHeight = h;
                this.physics.targetHeight = h;
            }

            endDrag() {
                this.physics.isDragging = false;
                this.config.isPlaying = true;
            }

            // Drawing
            draw() {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;
                const cx = w / 2;
                
                // Clear
                ctx.clearRect(0, 0, w, h);
                
                // Grid/Background
                this.drawBackground(ctx, w, h);

                const lift = this.physics.liftHeight;
                const groundY = h - 50;
                const ceilingY = 50;
                const travel = groundY - ceilingY - 200; // Max travel distance
                
                // Weight Position
                const weightY = (groundY - 100) - lift * travel;
                const rotation = (lift * travel) / 25; // r=25
                
                ctx.save();
                ctx.translate(cx, 0);

                switch (this.config.type) {
                    case 'fixed':
                        this.drawFixedSystem(ctx, weightY, ceilingY, rotation);
                        break;
                    case 'movable':
                        this.drawMovableSystem(ctx, weightY, ceilingY, rotation);
                        break;
                    case 'compound':
                        this.drawCompoundSystem(ctx, weightY, ceilingY, rotation);
                        break;
                    case 'complex':
                        this.drawComplexSystem(ctx, weightY, ceilingY, rotation);
                        break;
                }

                ctx.restore();
            }

            drawBackground(ctx, w, h) {
                // Grid lines
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let x=0; x<w; x+=40) { ctx.moveTo(x,0); ctx.lineTo(x,h); }
                for(let y=0; y<h; y+=40) { ctx.moveTo(0,y); ctx.lineTo(w,y); }
                ctx.stroke();

                // Ceiling
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(0, 0, w, 50);
                ctx.strokeStyle = '#94a3b8';
                ctx.beginPath();
                ctx.moveTo(0, 50);
                ctx.lineTo(w, 50);
                ctx.stroke();

                // Floor
                ctx.fillStyle = '#f1f5f9';
                ctx.fillRect(0, h-50, w, 50);
                ctx.strokeStyle = '#cbd5e1';
                ctx.beginPath();
                ctx.moveTo(0, h-50);
                ctx.lineTo(w, h-50);
                ctx.stroke();
            }

            drawWeight(ctx, x, y) {
                const size = 60;
                ctx.fillStyle = '#f59e0b'; // Amber
                ctx.fillRect(x - size/2, y, size, size);
                
                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 2;
                ctx.strokeRect(x - size/2, y, size, size);
                
                ctx.fillStyle = '#78350f';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`${this.config.weight}N`, x, y + size/2);

                if (this.config.showVectors) {
                    this.drawVector(ctx, x, y + size, this.config.weight, 'down', 'G');
                }
            }

            drawPulley(ctx, x, y, r=25, isMovable=false, rotation=0) {
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(rotation);

                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fillStyle = isMovable ? '#bfdbfe' : '#e2e8f0';
                ctx.fill();
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 3;
                ctx.stroke();
                
                // Spokes/Detail for rotation visibility
                ctx.beginPath();
                ctx.moveTo(0, -r);
                ctx.lineTo(0, r);
                ctx.moveTo(-r, 0);
                ctx.lineTo(r, 0);
                ctx.strokeStyle = 'rgba(71, 85, 105, 0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Axle
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#475569';
                ctx.fill();

                ctx.restore();

                if (isMovable && this.config.showVectors) {
                    // Draw pulley weight vector
                    this.drawVector(ctx, x, y, this.config.pulleyWeight, 'down', 'G₀');
                }
            }

            drawRope(ctx, points) {
                ctx.beginPath();
                ctx.strokeStyle = '#3b82f6'; // Blue rope
                ctx.lineWidth = 4;
                ctx.lineJoin = 'round';
                ctx.moveTo(points[0].x, points[0].y);
                for(let i=1; i<points.length; i++) {
                    ctx.lineTo(points[i].x, points[i].y);
                }
                ctx.stroke();
            }

            drawVector(ctx, x, y, mag, dir, label) {
                const len = Math.min(mag * 0.8 + 20, 80);
                const endY = dir === 'down' ? y + len : y - len;
                
                ctx.beginPath();
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.moveTo(x, y);
                ctx.lineTo(x, endY);
                ctx.stroke();

                // Arrow head
                ctx.beginPath();
                const headSize = 8;
                if (dir === 'down') {
                    ctx.moveTo(x, endY);
                    ctx.lineTo(x - headSize, endY - headSize);
                    ctx.lineTo(x + headSize, endY - headSize);
                } else {
                    ctx.moveTo(x, endY);
                    ctx.lineTo(x - headSize, endY + headSize);
                    ctx.lineTo(x + headSize, endY + headSize);
                }
                ctx.fillStyle = '#ef4444';
                ctx.fill();

                // Label
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 14px sans-serif';
                const textY = dir === 'down' ? endY + 15 : endY - 15;
                ctx.fillText(label || `${mag}N`, x + 15, textY);
            }

            // --- Systems ---

            drawFixedSystem(ctx, weightY, ceilingY, rotation) {
                const pulleyX = 0;
                const pulleyY = ceilingY + 40;
                
                // Rope
                const ropePoints = [
                    {x: pulleyX - 25, y: weightY}, // Attached to weight
                    {x: pulleyX - 25, y: pulleyY}, // Up to pulley left
                    {x: pulleyX + 25, y: pulleyY}, // Across pulley (visual simplified)
                    {x: pulleyX + 25, y: weightY + 100 + (this.physics.liftHeight * 100)} // Hand pull
                ];
                
                // Draw Rope over pulley
                ctx.beginPath();
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 4;
                ctx.moveTo(ropePoints[0].x, ropePoints[0].y);
                ctx.lineTo(ropePoints[1].x, ropePoints[1].y);
                ctx.arc(pulleyX, pulleyY, 25, Math.PI, 0); // Top arc
                ctx.lineTo(ropePoints[3].x, ropePoints[3].y);
                ctx.stroke();

                // Pulley
                this.drawPulley(ctx, pulleyX, pulleyY, 25, false, rotation);
                
                // Pulley support
                ctx.beginPath();
                ctx.moveTo(pulleyX, ceilingY);
                ctx.lineTo(pulleyX, pulleyY);
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Weight
                this.drawWeight(ctx, pulleyX - 25, weightY);

                // Hand/Force
                if (this.config.showVectors) {
                    const {F} = this.calculatePhysics();
                    this.drawVector(ctx, ropePoints[3].x, ropePoints[3].y, F, 'down', 'F');
                }
            }

            drawMovableSystem(ctx, weightY, ceilingY, rotation) {
                const pulleyX = 0;
                const pulleyY = weightY - 30;
                const weightPosY = pulleyY + 30 + 10; 

                // Rope: Ceiling -> Pulley Left -> Pulley Right -> Hand
                const ropeHandY = ceilingY - 100 - (this.physics.liftHeight * 100);

                ctx.beginPath();
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 4;
                ctx.moveTo(-25, ceilingY); // Anchor
                ctx.lineTo(-25, pulleyY);
                
                // Under pulley: Left (PI) -> Bottom -> Right (0)
                // PI -> 0 via Bottom is CCW (true)
                ctx.arc(pulleyX, pulleyY, 25, Math.PI, 0, true); 
                
                ctx.lineTo(25, -100); // Up to infinity
                ctx.stroke();

                this.drawPulley(ctx, pulleyX, pulleyY, 25, true, -rotation); 
                
                // Hook to weight
                ctx.beginPath();
                ctx.moveTo(pulleyX, pulleyY + 5);
                ctx.lineTo(pulleyX, weightPosY);
                ctx.strokeStyle = '#475569';
                ctx.stroke();

                this.drawWeight(ctx, pulleyX, weightPosY);

                if (this.config.showVectors) {
                    const {F} = this.calculatePhysics();
                    this.drawVector(ctx, 25, pulleyY - 100, F, 'up', 'F');
                }
            }

            drawCompoundSystem(ctx, weightY, ceilingY, rotation) {
                // n=2, Pull Down
                // Fixed (Top), Movable (Bottom)
                const fixedY = ceilingY + 40;
                const movableY = weightY - 30;
                
                ctx.beginPath();
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 4;
                
                // Anchor
                ctx.moveTo(-15, fixedY + 25); // Hook at bottom of fixed
                ctx.lineTo(-25, movableY);    // Down to Movable Left
                
                // Under Movable
                ctx.arc(0, movableY, 25, Math.PI, 0, true); // Left -> Bottom -> Right (true=CCW)
                
                // Up to Fixed Right
                ctx.lineTo(25, fixedY);
                
                // Over Fixed
                ctx.arc(0, fixedY, 25, 0, Math.PI, true); // Right -> Top -> Left (true=CCW)
                
                // Down to Hand
                ctx.lineTo(-25, weightY + 100);
                ctx.stroke();

                // Pulleys
                this.drawPulley(ctx, 0, fixedY, 25, false, rotation);
                this.drawPulley(ctx, 0, movableY, 25, true, -rotation);

                // Supports
                ctx.beginPath();
                ctx.moveTo(0, ceilingY);
                ctx.lineTo(0, fixedY);
                ctx.stroke();

                // Weight
                this.drawWeight(ctx, 0, movableY + 40);

                if (this.config.showVectors) {
                    const {F} = this.calculatePhysics();
                    this.drawVector(ctx, -25, weightY + 50, F, 'down', 'F');
                }
            }

            drawComplexSystem(ctx, weightY, ceilingY, rotation) {
                // n=3, Pull Up
                // Anchor Movable -> Fixed -> Movable -> Hand
                
                const fixedY = ceilingY + 40;
                const movableY = weightY - 30;
                
                ctx.beginPath();
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 4;

                // Anchor at Movable Hook (Center)
                ctx.moveTo(0, movableY - 25); // Top of movable
                
                // Up to Fixed Left
                ctx.lineTo(-25, fixedY);
                
                // Over Fixed
                ctx.arc(0, fixedY, 25, Math.PI, 0, false); // Left -> Top -> Right (false? No. PI->0 is CW (false) via Top? PI->2PI is CW. Yes false.)
                // Wait. 
                // Left is PI. Right is 0.
                // PI -> 2PI (Right) is CW (false).
                // So false gives Top. Correct.
                
                // Down to Movable Right
                ctx.lineTo(25, movableY);
                
                // Under Movable
                ctx.arc(0, movableY, 25, 0, Math.PI, false); // Right -> Bottom -> Left (false=CW)
                // 0 -> PI.
                // 0 -> PI/2 (Down) -> PI. Increasing.
                // CW (false) is Increasing.
                // So false gives Bottom. Correct.
                
                // Up to Hand
                ctx.lineTo(-25, -100);
                ctx.stroke();

                this.drawPulley(ctx, 0, fixedY, 25, false, rotation);
                this.drawPulley(ctx, 0, movableY, 25, true, -rotation);
                
                // Anchor point visual
                ctx.beginPath();
                ctx.arc(0, movableY - 25, 4, 0, Math.PI*2);
                ctx.fillStyle = '#3b82f6';
                ctx.fill();

                // Supports
                ctx.beginPath();
                ctx.moveTo(0, ceilingY);
                ctx.lineTo(0, fixedY);
                ctx.stroke();

                this.drawWeight(ctx, 0, movableY + 40);

                if (this.config.showVectors) {
                    const {F} = this.calculatePhysics();
                    this.drawVector(ctx, -25, fixedY - 50, F, 'up', 'F');
                }
            }
        }

        // Start
        new PulleySim();
    </script>
</body>
