    <style>

<body class="h-screen flex overflow-hidden">

    <!-- Main Game Area -->
    <div class="flex-1 bg-gray-50 flex flex-col items-center justify-center p-4 overflow-auto">
        <div id="gameContainer" class="bg-white p-4 rounded-xl shadow-lg relative">
            <!-- Game board will be injected here -->
        </div>
        <div id="message" class="mt-4 h-6 text-lg font-bold text-green-600"></div>
    </div>

<script>
class NonogramGame {
    constructor() {
        this.size = 10;
        this.grid = []; // The solution grid (0 or 1)
        this.playerGrid = []; // The player's grid (0: empty, 1: filled, 2: crossed)
        this.rowClues = [];
        this.colClues = [];
        this.isDragging = false;
        this.dragType = null; // 1: fill, 2: cross, 0: erase
        this.currentMode = 1; // 1: Fill, 2: Cross (for Left Click/Touch)
        this.timer = 0;
        this.timerInterval = null;
        this.isPlaying = false;

        this.container = document.getElementById('gameContainer');
        this.sizeSelect = document.getElementById('sizeSelect');
        this.timerDisplay = document.getElementById('timer');
        this.messageEl = document.getElementById('message');
        
        this.modeFillBtn = document.getElementById('modeFill');
        this.modeCrossBtn = document.getElementById('modeCross');

        this.initEvents();
        this.startNewGame();
    }

    initEvents() {
        document.getElementById('newGameBtn').addEventListener('click', () => this.startNewGame());
        document.getElementById('checkBtn').addEventListener('click', () => this.checkSolution());
        document.getElementById('resetBtn').addEventListener('click', () => this.resetBoard());
        
        this.modeFillBtn.addEventListener('click', () => this.setMode(1));
        this.modeCrossBtn.addEventListener('click', () => this.setMode(2));

        // Prevent context menu on game board
        this.container.addEventListener('contextmenu', (e) => e.preventDefault());
        
        // Mouse events for the grid handled in render but attached to container for drag
        document.addEventListener('mouseup', () => {
            this.isDragging = false;
            this.dragType = null;
        });
        
        // Touch events for mobile dragging support
        document.addEventListener('touchend', () => {
             this.isDragging = false;
             this.dragType = null;
        });
    }

    setMode(mode) {
        this.currentMode = mode;
        if (mode === 1) {
            this.modeFillBtn.className = 'flex-1 py-2 px-2 rounded-md text-sm font-bold transition shadow-sm bg-white text-indigo-700';
            this.modeCrossBtn.className = 'flex-1 py-2 px-2 rounded-md text-sm font-bold transition text-gray-500 hover:text-gray-700';
        } else {
            this.modeFillBtn.className = 'flex-1 py-2 px-2 rounded-md text-sm font-bold transition text-gray-500 hover:text-gray-700';
            this.modeCrossBtn.className = 'flex-1 py-2 px-2 rounded-md text-sm font-bold transition shadow-sm bg-white text-red-600';
        }
    }

    startNewGame() {
        this.size = parseInt(this.sizeSelect.value);
        this.generatePuzzle();
        this.resetPlayerGrid();
        this.render();
        this.startTimer();
        this.messageEl.textContent = '';
        this.isPlaying = true;
    }

    resetBoard() {
        this.resetPlayerGrid();
        this.renderGridState(); // Only re-render grid cells, not whole layout
    }

    generatePuzzle() {
        // 1. Generate random grid
        this.grid = Array(this.size).fill().map(() => 
            Array(this.size).fill().map(() => Math.random() > 0.4 ? 1 : 0) // 60% fill rate approximation
        );

        // Ensure not empty
        let totalFilled = this.grid.flat().reduce((a, b) => a + b, 0);
        if (totalFilled === 0) {
            this.grid[Math.floor(Math.random()*this.size)][Math.floor(Math.random()*this.size)] = 1;
        }

        // 2. Calculate Row Clues
        this.rowClues = this.grid.map(row => {
            const clues = [];
            let count = 0;
            for (let val of row) {
                if (val === 1) count++;
                else if (count > 0) {
                    clues.push(count);
                    count = 0;
                }
            }
            if (count > 0) clues.push(count);
            return clues.length ? clues : [0];
        });

        // 3. Calculate Col Clues
        this.colClues = [];
        for (let c = 0; c < this.size; c++) {
            const clues = [];
            let count = 0;
            for (let r = 0; r < this.size; r++) {
                if (this.grid[r][c] === 1) count++;
                else if (count > 0) {
                    clues.push(count);
                    count = 0;
                }
            }
            if (count > 0) clues.push(count);
            this.colClues.push(clues.length ? clues : [0]);
        }
    }

    resetPlayerGrid() {
        this.playerGrid = Array(this.size).fill().map(() => Array(this.size).fill(0));
    }

    render() {
        this.container.innerHTML = '';
        
        // Use CSS Grid
        // Layout: Top-Left (Empty), Top-Right (Col Clues)
        //         Bottom-Left (Row Clues), Bottom-Right (Game Grid)
        
        const wrapper = document.createElement('div');
        wrapper.style.display = 'grid';
        // First column auto (row clues), second column auto (game grid)
        wrapper.style.gridTemplateColumns = `auto 1fr`;
        wrapper.style.gridTemplateRows = `auto 1fr`;
        
        // 1. Top-Left Spacer
        const spacer = document.createElement('div');
        wrapper.appendChild(spacer);

        // 2. Top-Right: Col Clues
        const colCluesContainer = document.createElement('div');
        colCluesContainer.style.display = 'grid';
        colCluesContainer.style.gridTemplateColumns = `repeat(${this.size}, 1fr)`;
        colCluesContainer.style.gap = '1px';
        colCluesContainer.style.marginBottom = '2px'; // Separation
        
        this.colClues.forEach((clues, idx) => {
            const el = document.createElement('div');
            el.className = 'clue-col';
            if ((idx + 1) % 5 === 0 && idx !== this.size - 1) el.style.borderRight = '2px solid #4b5563';
            
            clues.forEach(num => {
                const span = document.createElement('span');
                span.className = 'clue-num';
                span.textContent = num;
                el.appendChild(span);
            });
            colCluesContainer.appendChild(el);
        });
        wrapper.appendChild(colCluesContainer);

        // 3. Bottom-Left: Row Clues
        const rowCluesContainer = document.createElement('div');
        rowCluesContainer.style.display = 'grid';
        rowCluesContainer.style.gridTemplateRows = `repeat(${this.size}, 1fr)`;
        rowCluesContainer.style.gap = '1px';
        rowCluesContainer.style.marginRight = '2px'; // Separation
        
        this.rowClues.forEach((clues, idx) => {
            const el = document.createElement('div');
            el.className = 'clue-row';
            if ((idx + 1) % 5 === 0 && idx !== this.size - 1) el.style.borderBottom = '2px solid #4b5563';
            
            clues.forEach(num => {
                const span = document.createElement('span');
                span.className = 'clue-num';
                span.textContent = num;
                el.appendChild(span);
            });
            rowCluesContainer.appendChild(el);
        });
        wrapper.appendChild(rowCluesContainer);

        // 4. Bottom-Right: Game Grid
        const gridEl = document.createElement('div');
        gridEl.className = 'game-grid';
        gridEl.style.gridTemplateColumns = `repeat(${this.size}, 30px)`; // Fixed cell size 30px
        gridEl.style.gridTemplateRows = `repeat(${this.size}, 30px)`;

        // Adjust total width based on size
        const cellSize = 30;
        
        for (let r = 0; r < this.size; r++) {
            for (let c = 0; c < this.size; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.r = r;
                cell.dataset.c = c;
                
                // Add thick borders for 5x5 blocks
                if ((c + 1) % 5 === 0 && c !== this.size - 1) cell.classList.add('thick-right');
                if ((r + 1) % 5 === 0 && r !== this.size - 1) cell.classList.add('thick-bottom');

                cell.addEventListener('mousedown', (e) => this.handleMouseDown(e, r, c));
                cell.addEventListener('mouseenter', (e) => this.handleMouseEnter(e, r, c));
                
                // Mobile Touch Support
                cell.addEventListener('touchstart', (e) => {
                    e.preventDefault(); // Prevent scroll
                    this.handleMouseDown({ button: 0, preventDefault: ()=>{} }, r, c);
                }, { passive: false });
                
                // Touch move is trickier, we need to track element from coordinates
                
                gridEl.appendChild(cell);
            }
        }
        this.gridEl = gridEl;
        wrapper.appendChild(gridEl);
        
        // Touch move handler on the grid container
        gridEl.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!this.isDragging) return;
            const touch = e.touches[0];
            const el = document.elementFromPoint(touch.clientX, touch.clientY);
            if (el && el.classList.contains('cell')) {
                const r = parseInt(el.dataset.r);
                const c = parseInt(el.dataset.c);
                if (!isNaN(r) && !isNaN(c)) {
                    this.applyMove(r, c);
                }
            }
        }, { passive: false });
        
        this.container.appendChild(wrapper);
    }

    renderGridState() {
        const cells = this.gridEl.children;
        for (let i = 0; i < cells.length; i++) {
            const cell = cells[i];
            const r = parseInt(cell.dataset.r);
            const c = parseInt(cell.dataset.c);
            const state = this.playerGrid[r][c];
            
            cell.classList.remove('filled', 'crossed');
            if (state === 1) cell.classList.add('filled');
            if (state === 2) cell.classList.add('crossed');
        }
    }

    handleMouseDown(e, r, c) {
        if (!this.isPlaying) return;
        this.isDragging = true;
        e.preventDefault();

        // Determine action based on button and current state
        const currentState = this.playerGrid[r][c];
        
        if (e.button === 2) { // Right click -> Always toggle cross
            if (currentState === 2) this.dragType = 0;
            else this.dragType = 2;
        } else { // Left click -> Use current mode
             const targetMode = this.currentMode; // 1 (Fill) or 2 (Cross)
             
             if (currentState === targetMode) this.dragType = 0; // Toggle off
             else this.dragType = targetMode;
        }

        this.applyMove(r, c);
    }

    handleMouseEnter(e, r, c) {
        if (this.isDragging && this.isPlaying) {
            this.applyMove(r, c);
        }
    }

    applyMove(r, c) {
        // Don't overwrite if not empty when filling/crossing, unless erasing
        // Standard logic: dragging 'fill' should only fill empty cells
        // Dragging 'erase' should only erase matching cells
        
        const current = this.playerGrid[r][c];
        
        if (this.dragType === 1) { // Fill
            if (current !== 1) this.playerGrid[r][c] = 1;
        } else if (this.dragType === 2) { // Cross
            if (current !== 2) this.playerGrid[r][c] = 2;
        } else if (this.dragType === 0) { // Erase
            this.playerGrid[r][c] = 0;
        }
        
        this.renderGridState();
        
        // Optional: Check win on every move? Or wait for button?
        // Let's wait for button or check implicitly?
        // Usually auto-check is satisfying.
        if (this.checkWin(true)) {
            this.endGame(true);
        }
    }

    checkSolution() {
        if (this.checkWin(false)) {
            this.endGame(true);
        } else {
            // Show errors?
            this.messageEl.textContent = '还有错误，请继续加油！';
            this.messageEl.className = 'mt-4 h-6 text-lg font-bold text-red-600';
            setTimeout(() => this.messageEl.textContent = '', 2000);
        }
    }

    checkWin(silent) {
        for (let r = 0; r < this.size; r++) {
            for (let c = 0; c < this.size; c++) {
                const target = this.grid[r][c];
                const actual = this.playerGrid[r][c] === 1 ? 1 : 0;
                if (target !== actual) return false;
            }
        }
        return true;
    }

    endGame(win) {
        this.isPlaying = false;
        this.stopTimer();
        if (win) {
            this.messageEl.textContent = '恭喜！你成功解开了谜题！';
            this.messageEl.className = 'mt-4 h-6 text-lg font-bold text-green-600';
        }
    }

    startTimer() {
        this.stopTimer();
        this.timer = 0;
        this.updateTimerDisplay();
        this.timerInterval = setInterval(() => {
            this.timer++;
            this.updateTimerDisplay();
        }, 1000);
    }

    stopTimer() {
        if (this.timerInterval) clearInterval(this.timerInterval);
    }

    updateTimerDisplay() {
        const m = Math.floor(this.timer / 60).toString().padStart(2, '0');
        const s = (this.timer % 60).toString().padStart(2, '0');
        this.timerDisplay.textContent = `${m}:${s}`;
    }
}

// Start game
new NonogramGame();
</script>
