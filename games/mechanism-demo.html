                theory: '适用于中心距较大的传动，可缓冲吸振，但传动比不精确，效率较低。'
            },
            chain: {
                name: '链传动',
                subtitle: 'Chain Drive',
                info: '链传动依靠链条啮合传递动力，适合中心距较大的传动，传动比精确。',
                formula: '传动比 i = n₁/n₂ = z₂/z₁',
                theory: '常用于自行车、摩托车、传动链条、输送带等中低速传动。'
            },
            screw: {
                name: '螺旋千斤顶',
                subtitle: 'Screw Jack',
                info: '螺旋千斤顶利用螺旋传动将旋转运动转换为直线运动，具有自锁性。',
                formula: '导程 S = nP (n为头数，P为螺距)',
                theory: '具有自锁性，常用于举升重物，如汽车千斤顶、机床升降台等。'
            },
            ratchet: {
                name: '棘轮机构',
                subtitle: 'Ratchet Mechanism',
                info: '棘轮机构是间歇运动机构，由棘轮和棘爪组成，可实现单向间歇运动。',
                formula: '运动角 = 360°/齿数',
                theory: '用于千斤顶、钟表自动上弦、输送带止动、机械式计数器等。'
            },
            hydraulic: {
                name: '液压传动',
                subtitle: 'Hydraulic Drive',
                info: '液压传动利用液体压力传递动力，输出力大而平稳，易于控制。',
                formula: 'F₂/F₁ = A₂/A₁ (帕斯卡原理)',
                theory: '广泛应用于工程机械(挖掘机、起重机)、机床、飞机液压系统等。'
            },
            spring: {
                name: '弹簧机构',
                subtitle: 'Spring Mechanism',
                info: '弹簧机构储存和释放能量，实现缓冲、减振、复位等功能。',
                formula: 'F = kx (胡克定律)',
                theory: '用于汽车悬挂、仪器仪表复位、玩具发条、弹簧门等。'
            }
        };

        class MechanismSim {
            constructor() {
                this.canvas = document.getElementById('mechanismCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.container = document.getElementById('canvasContainer');

                this.config = {
                    type: 'fourbar',
                    speed: 1.0,
                    size: 1.0,
                    showTrail: true,
                    showLabels: true,
                    isPlaying: true,
                    direction: 1
                };

                this.physics = {
                    angle: 0,
                    trailPoints: []
                };

                this.ui = {
                    speedSlider: document.getElementById('speedSlider'),
                    sizeSlider: document.getElementById('sizeSlider'),
                    speedVal: document.getElementById('speedVal'),
                    sizeVal: document.getElementById('sizeVal'),
                    trailToggle: document.getElementById('trailToggle'),
                    labelToggle: document.getElementById('labelToggle'),
                    infoText: document.getElementById('infoText'),
                    infoFormula: document.getElementById('infoFormula'),
                    theoryText: document.getElementById('theoryText'),
                    mechTitle: document.getElementById('mechTitle'),
                    mechSubtitle: document.getElementById('mechSubtitle'),
                    mechanismBtns: document.querySelectorAll('.mechanism-btn'),
                    playBtn: document.getElementById('playBtn'),
                    resetBtn: document.getElementById('resetBtn'),
                    directionBtn: document.getElementById('directionBtn'),
                    speedDot: document.getElementById('speedDot'),
                    speedText: document.getElementById('speedText'),
                    // Four-bar controls
                    fourbarControls: document.getElementById('fourbarControls'),
                    basicControls: document.getElementById('basicControls'),
                    crankLenSlider: document.getElementById('crankLenSlider'),
                    couplerLenSlider: document.getElementById('couplerLenSlider'),
                    rockerLenSlider: document.getElementById('rockerLenSlider'),
                    baseLenSlider: document.getElementById('baseLenSlider'),
                    crankLenVal: document.getElementById('crankLenVal'),
                    couplerLenVal: document.getElementById('couplerLenVal'),
                    rockerLenVal: document.getElementById('rockerLenVal'),
                    baseLenVal: document.getElementById('baseLenVal')
                };

                // Four-bar link lengths
                this.fourbar = {
                    crankLen: 1.2,
                    couplerLen: 2.0,
                    rockerLen: 1.8,
                    baseLen: 2.2
                };

                this.init();
            }

            init() {
                this.resize();
                window.addEventListener('resize', () => this.resize());
                this.bindEvents();
                this.setMechanism('fourbar'); // Initialize with four-bar controls
                this.animate();
            }

            bindEvents() {
                this.ui.speedSlider.addEventListener('input', (e) => {
                    this.config.speed = parseFloat(e.target.value);
                    this.ui.speedVal.textContent = `${this.config.speed.toFixed(1)}x`;
                });

                this.ui.sizeSlider.addEventListener('input', (e) => {
                    this.config.size = parseFloat(e.target.value);
                    this.ui.sizeVal.textContent = this.config.size.toFixed(1);
                });

                this.ui.trailToggle.addEventListener('change', (e) => {
                    this.config.showTrail = e.target.checked;
                    if (!e.target.checked) this.physics.trailPoints = [];
                });

                this.ui.labelToggle.addEventListener('change', (e) => {
                    this.config.showLabels = e.target.checked;
                });

                this.ui.mechanismBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.ui.mechanismBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.setMechanism(btn.dataset.type);
                    });
                });

                this.ui.playBtn.addEventListener('click', () => {
                    this.config.isPlaying = !this.config.isPlaying;
                    this.ui.playBtn.textContent = this.config.isPlaying ? '▶' : '⏸';
                    this.ui.playBtn.classList.toggle('active', this.config.isPlaying);
                    this.ui.speedDot.classList.toggle('paused', !this.config.isPlaying);
                    this.ui.speedText.textContent = this.config.isPlaying ? '运行中' : '已暂停';
                });

                this.ui.resetBtn.addEventListener('click', () => {
                    this.physics.angle = 0;
                    this.physics.trailPoints = [];
                });

                this.ui.directionBtn.addEventListener('click', () => {
                    this.config.direction *= -1;
                });

                // Four-bar mechanism controls
                this.ui.crankLenSlider.addEventListener('input', (e) => {
                    this.fourbar.crankLen = parseFloat(e.target.value);
                    this.ui.crankLenVal.textContent = this.fourbar.crankLen.toFixed(1);
                    this.updateFourbarFormula();
                    this.physics.trailPoints = [];
                });

                this.ui.couplerLenSlider.addEventListener('input', (e) => {
                    this.fourbar.couplerLen = parseFloat(e.target.value);
                    this.ui.couplerLenVal.textContent = this.fourbar.couplerLen.toFixed(1);
                    this.updateFourbarFormula();
                    this.physics.trailPoints = [];
                });

                this.ui.rockerLenSlider.addEventListener('input', (e) => {
                    this.fourbar.rockerLen = parseFloat(e.target.value);
                    this.ui.rockerLenVal.textContent = this.fourbar.rockerLen.toFixed(1);
                    this.updateFourbarFormula();
                    this.physics.trailPoints = [];
                });

                this.ui.baseLenSlider.addEventListener('input', (e) => {
                    this.fourbar.baseLen = parseFloat(e.target.value);
                    this.ui.baseLenVal.textContent = this.fourbar.baseLen.toFixed(1);
                    this.updateFourbarFormula();
                    this.physics.trailPoints = [];
                });
            }

            resize() {
                this.canvas.width = this.container.clientWidth;
                this.canvas.height = this.container.clientHeight;
            }

            setMechanism(type) {
                this.config.type = type;
                this.physics.angle = 0;
                this.physics.trailPoints = [];

                const data = mechanismData[type];
                this.ui.mechTitle.textContent = data.name;
                this.ui.mechSubtitle.textContent = data.subtitle;
                this.ui.infoText.textContent = data.info;
                this.ui.infoFormula.textContent = data.formula;
                this.ui.theoryText.textContent = data.theory;

                // Show/hide four-bar specific controls
                if (type === 'fourbar') {
                    this.ui.fourbarControls.style.display = 'block';
                    this.ui.basicControls.style.display = 'none';
                    this.updateFourbarFormula();
                } else {
                    this.ui.fourbarControls.style.display = 'none';
                    this.ui.basicControls.style.display = 'block';
                }
            }

            updateFourbarFormula() {
                const { crankLen, couplerLen, rockerLen, baseLen } = this.fourbar;
                // Find the shortest杆
                const lengths = [crankLen, couplerLen, rockerLen, baseLen];
                const a = Math.min(...lengths);
                const b = lengths.filter(l => l !== a).sort((x, y) => x - y)[0];
                const c = lengths.filter(l => l !== a).sort((x, y) => x - y)[1];
                const d = lengths.filter(l => l !== a).sort((x, y) => x - y)[2];

                const canRotate = a + b <= c + d;
                const condition = `${a.toFixed(1)} + ${b.toFixed(1)} ${canRotate ? '≤' : '>'} ${c.toFixed(1)} + ${d.toFixed(1)}`;

                this.ui.infoFormula.innerHTML = `
                    曲柄存在条件: a + b ≤ c + d<br>
                    当前: ${condition}<br>
                    <span style="color: ${canRotate ? '#00aa55' : '#ff6644'}">${canRotate ? '✓ 可作曲柄' : '✗ 无法整周转动'}</span>
                `;
            }

            animate() {
                this.updatePhysics();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }

            updatePhysics() {
                if (!this.config.isPlaying) return;
                this.physics.angle += 0.025 * this.config.speed * this.config.direction;
            }

            draw() {
                const ctx = this.ctx;
                const w = this.canvas.width;
                const h = this.canvas.height;

                ctx.clearRect(0, 0, w, h);

                // Light background
                ctx.fillStyle = '#fafbfc';
                ctx.fillRect(0, 0, w, h);

                // Grid
                ctx.strokeStyle = 'rgba(0, 102, 255, 0.08)';
                ctx.lineWidth = 1;
                const gridSize = 40;
                for (let x = 0; x < w; x += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                    ctx.stroke();
                }
                for (let y = 0; y < h; y += gridSize) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(w, y);
                    ctx.stroke();
                }

                ctx.save();
                ctx.translate(w / 2, h / 2);
                ctx.scale(this.config.size, this.config.size);

                switch (this.config.type) {
                    case 'fourbar': this.drawFourbar(ctx); break;
                    case 'slider': this.drawSlider(ctx); break;
                    case 'cam': this.drawCam(ctx); break;
                    case 'gear': this.drawGear(ctx); break;
                    case 'belt': this.drawBelt(ctx); break;
                    case 'chain': this.drawChain(ctx); break;
                    case 'screw': this.drawScrew(ctx); break;
                    case 'ratchet': this.drawRatchet(ctx); break;
                    case 'hydraulic': this.drawHydraulic(ctx); break;
                    case 'spring': this.drawSpring(ctx); break;
                }

                ctx.restore();
            }

            // Drawing helpers
            drawLink(ctx, x1, y1, x2, y2, color = '#64748b', width = 6) {
                ctx.beginPath();
                ctx.strokeStyle = color;
                ctx.lineWidth = width;
                ctx.lineCap = 'round';
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }

            drawJoint(ctx, x, y, r = 10, color = '#0066ff') {
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            drawLabel(ctx, text, x, y) {
                if (!this.config.showLabels) return;
                ctx.font = '13px "Noto Sans SC", sans-serif';
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.textAlign = 'center';
                ctx.fillText(text, x, y);
            }

            // ===== Four-bar Mechanism =====
            drawFourbar(ctx) {
                const angle = this.physics.angle;
                const scale = 70;

                const { crankLen, rockerLen, couplerLen, baseLen } = this.fourbar;

                const cx = 0, cy = 0;

                const A = { x: cx + crankLen * scale * Math.cos(angle), y: cy + crankLen * scale * Math.sin(angle) };
                const D = { x: cx - baseLen/2 * scale, y: cy };

                const rockAngle = angle * 1.5 + Math.PI * 0.3;
                const C = {
                    x: D.x + baseLen * scale + rockerLen * scale * 0.7 * Math.cos(rockAngle),
                    y: D.y + rockerLen * scale * 0.7 * Math.sin(rockAngle)
                };

                // Trail
                if (this.config.showTrail) {
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(0, 170, 85, 0.25)';
                    ctx.lineWidth = 3;
                    const trail = this.physics.trailPoints;
                    if (trail.length > 1) {
                        ctx.moveTo(trail[0].x, trail[0].y);
                        for (let i = 1; i < trail.length; i++) {
                            ctx.lineTo(trail[i].x, trail[i].y);
                        }
                    }
                    ctx.stroke();
                    this.physics.trailPoints.push({...C});
                    if (this.physics.trailPoints.length > 80) this.physics.trailPoints.shift();
                }

                // Draw links
                this.drawLink(ctx, D.x, D.y, A.x, A.y, '#0066ff', 8);
                this.drawLink(ctx, A.x, A.y, C.x, C.y, '#00aa55', 6);
                this.drawLink(ctx, C.x, C.y, D.x + baseLen * scale, D.y, '#ff6644', 6);

                // Base
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(D.x - 10, D.y - 8, baseLen * scale + 20, 16);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.strokeRect(D.x - 10, D.y - 8, baseLen * scale + 20, 16);

                // Joints
                this.drawJoint(ctx, D.x, D.y, 12);
                this.drawJoint(ctx, D.x + baseLen * scale, D.y, 12);
                this.drawJoint(ctx, A.x, A.y, 10);
                this.drawJoint(ctx, C.x, C.y, 10);

                this.drawLabel(ctx, '曲柄', A.x, A.y - 18);
                this.drawLabel(ctx, '摇杆', C.x + 30, C.y);
                this.drawLabel(ctx, '连杆', (A.x + C.x)/2, (A.y + C.y)/2 - 12);
            }

            // ===== Slider-Crank Mechanism =====
            drawSlider(ctx) {
                const angle = this.physics.angle;
                const crankR = 50;
                const connLen = 100;

                // Calculate slider position using proper geometry
                // Slider moves on horizontal line at y = 50
                const sliderY = 50;
                // The slider x position is determined by the geometry
                const crankX = crankR * Math.cos(angle);
                const crankY = crankR * Math.sin(angle);

                // Calculate slider x using the connecting rod length constraint
                // (sliderX - crankX)^2 + (sliderY - crankY)^2 = connLen^2
                const dx = Math.sqrt(connLen * connLen - (sliderY - crankY) * (sliderY - crankY));
                const sliderX = crankX + dx;

                // Trail
                if (this.config.showTrail) {
                    ctx.beginPath();
                    ctx.strokeStyle = 'rgba(0, 170, 85, 0.25)';
                    ctx.lineWidth = 3;
                    const trail = this.physics.trailPoints;
                    if (trail.length > 1) {
                        ctx.moveTo(trail[0].x, trail[0].y);
                        for (let i = 1; i < trail.length; i++) {
                            ctx.lineTo(trail[i].x, trail[i].y);
                        }
                    }
                    ctx.stroke();
                    this.physics.trailPoints.push({x: sliderX, y: sliderY});
                    if (this.physics.trailPoints.length > 80) this.physics.trailPoints.shift();
                }

                // Guide/Track
                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(-120, 40, 300, 20);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.strokeRect(-120, 40, 300, 20);

                // Track grooves
                ctx.beginPath();
                ctx.moveTo(-120, 47);
                ctx.lineTo(180, 47);
                ctx.moveTo(-120, 53);
                ctx.lineTo(180, 53);
                ctx.strokeStyle = '#cbd5e1';
                ctx.lineWidth = 1;
                ctx.stroke();

                // Crank pivot (at origin)
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#94a3b8';
                ctx.fill();

                // Crank arm
                this.drawLink(ctx, 0, 0, crankX, crankY, '#0066ff', 8);

                // Crank pin
                this.drawJoint(ctx, crankX, crankY, 8, '#0066ff');

                // Connecting rod
                this.drawLink(ctx, crankX, crankY, sliderX, sliderY, '#00aa55', 8);

                // Connecting rod big end
                ctx.beginPath();
                ctx.arc(crankX, crankY, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#00aa55';
                ctx.fill();

                // Slider/Piston
                ctx.fillStyle = '#0066ff';
                ctx.beginPath();
                ctx.roundRect(sliderX - 25, sliderY - 12, 50, 24, 4);
                ctx.fill();
                ctx.strokeStyle = '#0052cc';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Slider pin
                this.drawJoint(ctx, sliderX, sliderY, 6, '#0066ff');

                // Crank center
                this.drawJoint(ctx, 0, 0, 10, '#64748b');

                // Labels
                this.drawLabel(ctx, '曲柄', crankX / 2, crankY - 15);
                this.drawLabel(ctx, '连杆', (crankX + sliderX) / 2, (crankY + sliderY) / 2 - 8);
                this.drawLabel(ctx, '滑块', sliderX, sliderY + 35);
            }

            // ===== Cam Mechanism =====
            drawCam(ctx) {
                const angle = this.physics.angle;
                const camR = 50;
                const followerR = 25;

                ctx.save();
                ctx.rotate(angle);

                ctx.beginPath();
                for (let a = 0; a < Math.PI * 2; a += 0.05) {
                    const r = camR + 18 * Math.sin(a * 2);
                    if (a === 0) ctx.moveTo(r * Math.cos(a), r * Math.sin(a));
                    else ctx.lineTo(r * Math.cos(a), r * Math.sin(a));
                }
                ctx.closePath();

                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, camR + 20);
                gradient.addColorStop(0, '#94a3b8');
                gradient.addColorStop(1, '#64748b');
                ctx.fillStyle = gradient;
                ctx.fill();
                ctx.strokeStyle = '#0066ff';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#0066ff';
                ctx.fill();

                ctx.restore();

                const followerOffset = 15 * Math.sin(angle * 2);
                const fy = -camR - 30 + followerOffset;

                ctx.fillStyle = '#e2e8f0';
                ctx.fillRect(-20, -camR - 70, 40, 45);
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.strokeRect(-20, -camR - 70, 40, 45);

                ctx.fillStyle = '#00aa55';
                ctx.fillRect(-8, fy, 16, -fy - camR + 20);

                ctx.beginPath();
                ctx.arc(0, fy, followerR, 0, Math.PI * 2);
                ctx.fillStyle = '#ff6644';
                ctx.fill();
                ctx.strokeStyle = '#ee4433';
                ctx.lineWidth = 2;
                ctx.stroke();

                this.drawLabel(ctx, '凸轮', 0, -85);
                this.drawLabel(ctx, '从动件', 0, fy - 35);
            }

            // ===== Gear Mechanism =====
            drawGear(ctx) {
                const angle = this.physics.angle;
                const teeth1 = 16;
                const teeth2 = 32;
                const module = 3.5;
                const pitchR1 = teeth1 * module / 2;
                const pitchR2 = teeth2 * module / 2;
                const centerDist = pitchR1 + pitchR2;

                ctx.save();
                ctx.rotate(angle);
                this.drawGearShape(ctx, 0, 0, pitchR1, teeth1, '#0066ff');
                this.drawJoint(ctx, 0, 0, 10, '#00aa55');
                ctx.restore();

                ctx.save();
                ctx.translate(centerDist, 0);
                ctx.rotate(-angle * teeth1 / teeth2);
                this.drawGearShape(ctx, 0, 0, pitchR2, teeth2, '#00aa55');
                this.drawJoint(ctx, 0, 0, 10, '#0066ff');
                ctx.restore();

                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(0, 0, pitchR1, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 102, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(centerDist, 0, pitchR2, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(0, 170, 85, 0.4)';
                ctx.stroke();
                ctx.setLineDash([]);

                this.drawLabel(ctx, '主动轮', 0, pitchR1 + 25);
                this.drawLabel(ctx, '从动轮', centerDist, pitchR2 + 25);
            }

            drawGearShape(ctx, x, y, r, teeth, color) {
                const addendum = r * 0.2;
                const dedendum = r * 0.15;

                ctx.beginPath();
                for (let i = 0; i < teeth; i++) {
                    const a1 = (i * 2 * Math.PI) / teeth;
                    const a2 = ((i + 0.35) * 2 * Math.PI) / teeth;
                    const a3 = ((i + 0.65) * 2 * Math.PI) / teeth;
                    const a4 = ((i + 1) * 2 * Math.PI) / teeth;

                    if (i === 0) ctx.moveTo((r + addendum) * Math.cos(a1), (r + addendum) * Math.sin(a1));
                    ctx.lineTo((r + addendum) * Math.cos(a2), (r + addendum) * Math.sin(a2));
                    ctx.lineTo((r - dedendum) * Math.cos(a3), (r - dedendum) * Math.sin(a3));
                    ctx.lineTo((r - dedendum) * Math.cos(a4), (r - dedendum) * Math.sin(a4));
                }
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x, y, r * 0.4, 0, Math.PI * 2);
                ctx.fillStyle = '#fafbfc';
                ctx.fill();
            }

            // ===== Belt Mechanism =====
            drawBelt(ctx) {
                const angle = this.physics.angle;
                const r1 = 50;  // Smaller pulley
                const r2 = 70;  // Larger pulley
                const dist = 200;
                const x1 = -dist / 2;
                const x2 = dist / 2;

                // Calculate tangent angles for belt path
                const tangent = Math.atan2(r2 - r1, dist);
                const angle1 = Math.PI + tangent;  // Top tangent angle
                const angle2 = -tangent;           // Bottom tangent angle

                // Belt path - outer edge
                ctx.beginPath();
                ctx.moveTo(x1 + r1 * Math.cos(angle2), r1 * Math.sin(angle2));
                ctx.lineTo(x2 + r2 * Math.cos(angle2), r2 * Math.sin(angle2));
                ctx.arc(x2, 0, r2, angle2, angle1, false);
                ctx.lineTo(x1 + r1 * Math.cos(angle1), r1 * Math.sin(angle1));
                ctx.arc(x1, 0, r1, angle1, angle2, true);
                ctx.closePath();

                // Belt gradient (V-belt look)
                const beltGrad = ctx.createLinearGradient(x1, -r1-15, x2, r2+15);
                beltGrad.addColorStop(0, '#8B7355');
                beltGrad.addColorStop(0.3, '#A08060');
                beltGrad.addColorStop(0.5, '#B8956E');
                beltGrad.addColorStop(0.7, '#A08060');
                beltGrad.addColorStop(1, '#8B7355');
                ctx.fillStyle = beltGrad;
                ctx.fill();

                // Belt edges
                ctx.strokeStyle = '#5D4E37';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Belt inner groove (V-shape)
                ctx.beginPath();
                ctx.moveTo(x1 + (r1-5) * Math.cos(angle2), (r1-5) * Math.sin(angle2));
                ctx.lineTo(x2 + (r2-8) * Math.cos(angle2), (r2-8) * Math.sin(angle2));
                ctx.arc(x2, 0, r2-8, angle2, angle1, false);
                ctx.lineTo(x1 + (r1-5) * Math.cos(angle1), (r1-5) * Math.sin(angle1));
                ctx.arc(x1, 0, r1-5, angle1, angle2, true);
                ctx.closePath();
                ctx.strokeStyle = '#4A3F2F';
                ctx.lineWidth = 3;
                ctx.stroke();

                // === Small Pulley (Driver - Left) ===
                ctx.save();
                ctx.translate(x1, 0);
                ctx.rotate(angle);

                // Pulley body
                ctx.beginPath();
                ctx.arc(0, 0, r1, 0, Math.PI * 2);
                const grad1 = ctx.createRadialGradient(0, 0, 0, 0, 0, r1);
                grad1.addColorStop(0, '#B8C4CE');
                grad1.addColorStop(0.5, '#8899A6');
                grad1.addColorStop(1, '#5A6772');
                ctx.fillStyle = grad1;
                ctx.fill();
                ctx.strokeStyle = '#4A5568';
                ctx.lineWidth = 3;
                ctx.stroke();

                // V-groove
                ctx.beginPath();
                ctx.arc(0, 0, r1 - 10, 0, Math.PI * 2);
                ctx.strokeStyle = '#3D4A54';
                ctx.lineWidth = 8;
                ctx.stroke();

                // Center hub
                ctx.beginPath();
                ctx.arc(0, 0, 12, 0, Math.PI * 2);
                ctx.fillStyle = '#4A5568';
                ctx.fill();
                ctx.strokeStyle = '#2D3748';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Mounting plate
                ctx.fillStyle = '#6B7B8A';
                ctx.fillRect(-r1 - 5, -8, 20, 16);
                ctx.strokeStyle = '#4A5568';
                ctx.strokeRect(-r1 - 5, -8, 20, 16);

                ctx.restore();

                // === Large Pulley (Driven - Right) ===
                ctx.save();
                ctx.translate(x2, 0);
                ctx.rotate(-angle * r1 / r2);  // Slower rotation

                // Pulley body
                ctx.beginPath();
                ctx.arc(0, 0, r2, 0, Math.PI * 2);
                const grad2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r2);
                grad2.addColorStop(0, '#B8C4CE');
                grad2.addColorStop(0.5, '#8899A6');
                grad2.addColorStop(1, '#5A6772');
                ctx.fillStyle = grad2;
                ctx.fill();
                ctx.strokeStyle = '#38A169';
                ctx.lineWidth = 3;
                ctx.stroke();

                // V-groove
                ctx.beginPath();
                ctx.arc(0, 0, r2 - 12, 0, Math.PI * 2);
                ctx.strokeStyle = '#3D4A54';
                ctx.lineWidth = 10;
                ctx.stroke();

                // Center hub
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fillStyle = '#38A169';
                ctx.fill();
                ctx.strokeStyle = '#276749';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Mounting plate
                ctx.fillStyle = '#6B7B8A';
                ctx.fillRect(-r2 - 5, -10, 25, 20);
                ctx.strokeStyle = '#4A5568';
                ctx.strokeRect(-r2 - 5, -10, 25, 20);

                ctx.restore();

                // === Labels ===
                // Transmission ratio
                const ratio = (r2 / r1).toFixed(1);
                ctx.font = 'bold 14px "Noto Sans SC"';
                ctx.fillStyle = '#0066ff';
                ctx.textAlign = 'center';
                ctx.fillText(`i = 1:${ratio}`, (x1 + x2) / 2, -r2 - 20);

                this.drawLabel(ctx, '主动轮\n(小)', x1, r1 + 40);
                this.drawLabel(ctx, '从动轮\n(大)', x2, r2 + 45);

                // Direction arrows
                const arrowY = r1 + 60;
                ctx.font = '12px "Noto Sans SC"';
                ctx.fillStyle = '#00aa55';
                ctx.fillText('转速快 →', x1, arrowY);
                ctx.fillText('转速慢 →', x2 - 30, arrowY);
            }

            // ===== Chain Mechanism =====
            drawChain(ctx) {
                const angle = this.physics.angle;
                const r1 = 45;   // Small sprocket
                const r2 = 65;   // Large sprocket
                const teeth1 = 12;
                const teeth2 = 18;
                const dist = 190;
                const x1 = -dist / 2;
                const x2 = dist / 2;

                // Chain path parameters
                const tangent = Math.atan2(r2 - r1, dist);

                // === Draw Chain First (behind sprockets) ===

                // Outer chain
                ctx.beginPath();
                ctx.moveTo(x1 + r1 * Math.cos(-tangent), r1 * Math.sin(-tangent));
                ctx.lineTo(x2 + r2 * Math.cos(-tangent), r2 * Math.sin(-tangent));
                ctx.arc(x2, 0, r2, -tangent, Math.PI + tangent, true);
                ctx.lineTo(x1 + r1 * Math.cos(Math.PI - tangent), r1 * Math.sin(Math.PI - tangent));
                ctx.arc(x1, 0, r1, Math.PI - tangent, -tangent, false);
                ctx.closePath();
                ctx.strokeStyle = '#4A4A4A';
                ctx.lineWidth = 14;
                ctx.stroke();

                // Inner chain edge
                ctx.strokeStyle = '#6A6A6A';
                ctx.lineWidth = 8;
                ctx.stroke();

                // Chain rollers (animated)
                const linkSpacing = 18;
                const chainLen = 2 * (Math.PI * (r1 + r2) / 2 + dist);
                const numLinks = Math.floor(chainLen / linkSpacing);

                for (let i = 0; i < numLinks; i++) {
                    const offset = (angle * r1 * 2) % linkSpacing;
                    const pos = (i * linkSpacing + offset) % chainLen;

                    // Calculate position along chain path
                    let lx, ly;
                    const pos1 = r1 * Math.PI;
                    const pos2 = pos1 + dist;

                    if (pos < pos1) {
                        // Top arc (small sprocket)
                        const a = -tangent + pos / r1;
                        lx = x1 + r1 * Math.cos(a);
                        ly = r1 * Math.sin(a);
                    } else if (pos < pos2) {
                        // Top tangent line
                        const t = (pos - pos1) / dist;
                        lx = x1 + (r1 * Math.cos(-tangent)) + t * (x2 + r2 * Math.cos(-tangent) - x1 - r1 * Math.cos(-tangent));
                        ly = (1 - t) * r1 * Math.sin(-tangent) + t * r2 * Math.sin(-tangent);
                    } else if (pos < pos2 + r2 * Math.PI) {
                        // Bottom arc (large sprocket)
                        const a = Math.PI + tangent + (pos - pos2) / r2;
                        lx = x2 + r2 * Math.cos(a);
                        ly = r2 * Math.sin(a);
                    } else {
                        // Bottom tangent line
                        const t = (pos - pos2 - r2 * Math.PI) / dist;
                        lx = x2 + r2 * Math.cos(Math.PI + tangent) - t * (x2 + r2 * Math.cos(Math.PI + tangent) - x1 - r1 * Math.cos(Math.PI + tangent));
                        ly = (1 - t) * r2 * Math.sin(Math.PI + tangent) + t * r1 * Math.sin(Math.PI + tangent);
                    }

                    // Draw roller
                    ctx.beginPath();
                    ctx.arc(lx, ly, 4, 0, Math.PI * 2);
                    ctx.fillStyle = i % 2 === 0 ? '#C9A227' : '#9A7B1A';
                    ctx.fill();
                    ctx.strokeStyle = '#5A4A0A';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // === Small Sprocket (Driver - Left) ===
                ctx.save();
                ctx.translate(x1, 0);
                ctx.rotate(angle);

                // Sprocket body
                ctx.beginPath();
                ctx.arc(0, 0, r1, 0, Math.PI * 2);
                const grad1 = ctx.createRadialGradient(0, 0, 0, 0, 0, r1);
                grad1.addColorStop(0, '#A8B4BA');
                grad1.addColorStop(0.7, '#78848E');
                grad1.addColorStop(1, '#4A5258');
                ctx.fillStyle = grad1;
                ctx.fill();
                ctx.strokeStyle = '#0066ff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Teeth
                for (let i = 0; i < teeth1; i++) {
                    const a = (i * 2 * Math.PI) / teeth1;
                    const toothR = r1 - 5;
                    ctx.beginPath();
                    ctx.arc(toothR * Math.cos(a), toothR * Math.sin(a), 7, 0, Math.PI * 2);
                    ctx.fillStyle = '#505860';
                    ctx.fill();
                }

                // Center hub
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fillStyle = '#0066ff';
                ctx.fill();
                ctx.strokeStyle = '#0044AA';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Keyway
                ctx.fillStyle = '#003366';
                ctx.fillRect(-3, -r1 + 8, 6, 14);

                ctx.restore();

                // === Large Sprocket (Driven - Right) ===
                ctx.save();
                ctx.translate(x2, 0);
                ctx.rotate(-angle * teeth1 / teeth2);  // Slower rotation

                // Sprocket body
                ctx.beginPath();
                ctx.arc(0, 0, r2, 0, Math.PI * 2);
                const grad2 = ctx.createRadialGradient(0, 0, 0, 0, 0, r2);
                grad2.addColorStop(0, '#A8B4BA');
                grad2.addColorStop(0.7, '#78848E');
                grad2.addColorStop(1, '#4A5258');
                ctx.fillStyle = grad2;
                ctx.fill();
                ctx.strokeStyle = '#00aa55';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Teeth
                for (let i = 0; i < teeth2; i++) {
                    const a = (i * 2 * Math.PI) / teeth2;
                    const toothR = r2 - 7;
                    ctx.beginPath();
                    ctx.arc(toothR * Math.cos(a), toothR * Math.sin(a), 8, 0, Math.PI * 2);
                    ctx.fillStyle = '#505860';
                    ctx.fill();
                }

                // Center hub
                ctx.beginPath();
                ctx.arc(0, 0, 16, 0, Math.PI * 2);
                ctx.fillStyle = '#00aa55';
                ctx.fill();
                ctx.strokeStyle = '#008844';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Keyway
                ctx.fillStyle = '#005522';
                ctx.fillRect(-4, -r2 + 10, 8, 18);

                ctx.restore();

                // === Labels ===
                const ratio = (teeth2 / teeth1).toFixed(1);
                ctx.font = 'bold 14px "Noto Sans SC"';
                ctx.fillStyle = '#0066ff';
                ctx.textAlign = 'center';
                ctx.fillText(`i = 1:${ratio}`, (x1 + x2) / 2, -r2 - 20);

                this.drawLabel(ctx, '主动链轮', x1, r1 + 40);
                this.drawLabel(ctx, '从动链轮', x2, r2 + 45);

                // Direction arrows
                const arrowY = r1 + 65;
                ctx.font = '12px "Noto Sans SC"';
                ctx.fillStyle = '#00aa55';
                ctx.fillText('转速快 →', x1, arrowY);
                ctx.fillText('转速慢 →', x2 - 30, arrowY);
            }

            // ===== Screw Mechanism (Screw Jack) =====
            drawScrew(ctx) {
                const angle = this.physics.angle;
                const lead = 8;  // Lead (distance per rotation)
                const turns = 6;  // Number of thread turns

                // Calculate vertical movement based on rotation
                // Negative because rotation lifts the load
                const lift = (angle * lead) % (turns * lead);
                const baseY = 50;

                // Base/Housing
                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.roundRect(-60, baseY, 120, 30, 6);
                ctx.fill();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Housing detail
                ctx.fillStyle = '#cbd5e1';
                ctx.fillRect(-50, baseY + 5, 100, 20);

                // Threaded screw (rotates and moves up)
                const screwTop = baseY - lift - 20;
                const screwBottom = baseY + 20;
                const screwWidth = 24;

                // Screw body
                ctx.fillStyle = '#94a3b8';
                ctx.fillRect(-screwWidth/2, screwTop, screwWidth, screwBottom - screwTop);

                // Thread grooves (helical pattern)
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                for (let i = 0; i < turns; i++) {
                    const t = i / turns;
                    const y1 = screwBottom - t * (screwBottom - screwTop);
                    const y2 = screwBottom - (t + 0.5) * (screwBottom - screwTop);
                    const offset = (angle % (Math.PI * 2)) / (Math.PI * 2) * lead;

                    ctx.beginPath();
                    ctx.moveTo(-screwWidth/2 - 2, y1 + offset);
                    ctx.lineTo(screwWidth/2 + 2, y2 + offset);
                    ctx.stroke();
                }

                // Screw threads (diagonal lines)
                ctx.strokeStyle = '#0066ff';
                ctx.lineWidth = 2;
                for (let i = 0; i < turns * 2; i++) {
                    const y = screwTop + 5 + i * (screwBottom - screwTop - 10) / (turns * 2);
                    if (y < screwBottom - 5) {
                        ctx.beginPath();
                        ctx.moveTo(-screwWidth/2, y);
                        ctx.lineTo(screwWidth/2, y + 4);
                        ctx.stroke();
                    }
                }

                // Load platform (moves with screw)
                const platformY = screwTop - 15;
                ctx.fillStyle = '#d4a017';
                ctx.beginPath();
                ctx.roundRect(-40, platformY - 10, 80, 25, 4);
                ctx.fill();
                ctx.strokeStyle = '#a08020';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Load/Weight on top
                ctx.fillStyle = '#ff6644';
                ctx.beginPath();
                ctx.roundRect(-30, platformY - 50, 60, 40, 6);
                ctx.fill();
                ctx.strokeStyle = '#ee4433';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Weight text
                ctx.font = 'bold 14px "Noto Sans SC"';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText('重物', 0, platformY - 20);

                // Force arrow
                ctx.beginPath();
                ctx.moveTo(0, platformY - 55);
                ctx.lineTo(0, platformY - 80);
                ctx.strokeStyle = '#00aa55';
                ctx.lineWidth = 4;
                ctx.stroke();

                // Arrow head
                ctx.beginPath();
                ctx.moveTo(-6, platformY - 70);
                ctx.lineTo(0, platformY - 80);
                ctx.lineTo(6, platformY - 70);
                ctx.fillStyle = '#00aa55';
                ctx.fill();

                // Handle arm (rotates)
                const handleAngle = angle;
                const handleLen = 50;
                const handleY = baseY + 15;

                ctx.save();
                ctx.translate(0, handleY);
                ctx.rotate(handleAngle);

                // Handle bar
                ctx.fillStyle = '#ff6644';
                ctx.beginPath();
                ctx.roundRect(-handleLen, -6, handleLen, 12, 6);
                ctx.fill();
                ctx.strokeStyle = '#ee4433';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Handle knob
                ctx.beginPath();
                ctx.arc(handleLen, 0, 10, 0, Math.PI * 2);
                ctx.fillStyle = '#d4a017';
                ctx.fill();
                ctx.strokeStyle = '#a08020';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Handle center pivot
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#64748b';
                ctx.fill();

                ctx.restore();

                // Labels
                ctx.font = '13px "Noto Sans SC"';
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                this.drawLabel(ctx, '手柄', handleLen + 20, handleY);
                this.drawLabel(ctx, '螺杆', 0, (screwTop + screwBottom) / 2);
                this.drawLabel(ctx, '重物', 0, platformY - 65);
                this.drawLabel(ctx, '底座', 0, baseY + 45);
            }

            // ===== Ratchet Mechanism =====
            drawRatchet(ctx) {
                const angle = this.physics.angle;
                const r = 55;
                const teeth = 10;

                // Determine if pawl is engaging or releasing
                // Pawl clicks when passing teeth
                const toothAngle = (2 * Math.PI) / teeth;
                const currentPhase = (angle % toothAngle) / toothAngle;
                const isClicking = currentPhase < 0.3 || currentPhase > 0.7;
                const pawlAngle = isClicking ? 0.3 : 0.5;

                // Ratchet wheel (rotates continuously)
                ctx.save();
                ctx.rotate(angle);

                // Main wheel body
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
                grad.addColorStop(0, '#a8a8a8');
                grad.addColorStop(0.7, '#787878');
                grad.addColorStop(1, '#585858');
                ctx.fillStyle = grad;
                ctx.fill();

                // Outer rim
                ctx.beginPath();
                ctx.arc(0, 0, r + 3, 0, Math.PI * 2);
                ctx.strokeStyle = '#404040';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Teeth (asymmetric - sloped for engagement)
                for (let i = 0; i < teeth; i++) {
                    const a = (i * 2 * Math.PI) / teeth;
                    const nextA = ((i + 0.5) * 2 * Math.PI) / teeth;

                    // Draw tooth (asymmetric - steep on one side, sloped on other)
                    ctx.beginPath();
                    ctx.moveTo(r * Math.cos(a), r * Math.sin(a));
                    // Steep side
                    ctx.lineTo((r + 15) * Math.cos(a * 0.97), (r + 15) * Math.sin(a * 0.97));
                    // Sloped side to next tooth
                    ctx.lineTo((r + 15) * Math.cos(nextA * 1.03), (r + 15) * Math.sin(nextA * 1.03));
                    ctx.lineTo(r * Math.cos(nextA), r * Math.sin(nextA));
                    ctx.closePath();
                    ctx.fillStyle = '#606060';
                    ctx.fill();
                    ctx.strokeStyle = '#404040';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                }

                // Inner hub
                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.fillStyle = '#505050';
                ctx.fill();
                ctx.strokeStyle = '#404040';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Spokes
                ctx.strokeStyle = '#606060';
                ctx.lineWidth = 4;
                for (let i = 0; i < 4; i++) {
                    const a = i * Math.PI / 2;
                    ctx.beginPath();
                    ctx.moveTo(12 * Math.cos(a), 12 * Math.sin(a));
                    ctx.lineTo(18 * Math.cos(a), 18 * Math.sin(a));
                    ctx.stroke();
                }

                // Center axle
                ctx.beginPath();
                ctx.arc(0, 0, 8, 0, Math.PI * 2);
                ctx.fillStyle = '#303030';
                ctx.fill();

                ctx.restore();

                // Pawl (pivots at center, engages with teeth)
                const pawlPivotX = 0;
                const pawlPivotY = 0;

                // Calculate pawl position based on wheel rotation
                // Pawl should rock back and forth as teeth pass
                const rockAmount = 0.4;
                const pawlRock = Math.sin(angle * teeth) * rockAmount;

                ctx.save();
                ctx.translate(pawlPivotX, pawlPivotY);
                ctx.rotate(pawlRock);

                // Pawl body
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(r + 5, 8);
                ctx.lineTo(r + 20, 6);
                ctx.lineTo(r + 20, -6);
                ctx.lineTo(r + 5, -8);
                ctx.closePath();

                const pawlGrad = ctx.createLinearGradient(0, 0, r + 20, 0);
                pawlGrad.addColorStop(0, '#ff8055');
                pawlGrad.addColorStop(1, '#cc4422');
                ctx.fillStyle = pawlGrad;
                ctx.fill();
                ctx.strokeStyle = '#992211';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Pawl tip (engages with teeth)
                ctx.beginPath();
                ctx.moveTo(r + 5, -8);
                ctx.lineTo(r + 10, -10);
                ctx.lineTo(r + 10, 10);
                ctx.lineTo(r + 5, 8);
                ctx.closePath();
                ctx.fillStyle = '#dd5533';
                ctx.fill();

                // Pawl pivot
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#505050';
                ctx.fill();
                ctx.strokeStyle = '#303030';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();

                // Pawl spring (shows the return force)
                ctx.beginPath();
                ctx.moveTo(-15, 10);
                ctx.quadraticCurveTo(-25, 0, -15, -10);
                ctx.strokeStyle = '#ffcc00';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Stop (fixed pawl on other side)
                ctx.fillStyle = '#505050';
                ctx.beginPath();
                ctx.roundRect(r + 25, -20, 15, 40, 3);
                ctx.fill();
                ctx.strokeStyle = '#303030';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Direction arrow
                ctx.font = 'bold 12px "Noto Sans SC"';
                ctx.fillStyle = '#0066ff';
                ctx.textAlign = 'center';

                // Animated rotation indicator
                const arrowX = -r - 30;
                const arrowY = 0;
                ctx.save();
                ctx.translate(arrowX, arrowY);

                // Circular arrow
                ctx.beginPath();
                ctx.arc(0, 0, 15, 0, Math.PI * 1.5);
                ctx.strokeStyle = '#0066ff';
                ctx.lineWidth = 3;
                ctx.stroke();

                // Arrow head
                ctx.beginPath();
                ctx.moveTo(15, -15);
                ctx.lineTo(20, -5);
                ctx.lineTo(10, -5);
                ctx.closePath();
                ctx.fillStyle = '#0066ff';
                ctx.fill();

                ctx.restore();

                // Labels
                this.drawLabel(ctx, '棘轮', 0, r + 40);
                this.drawLabel(ctx, '棘爪', r + 40, 0);
                this.drawLabel(ctx, '止动', r + 40, -35);
            }

            // ===== Hydraulic Mechanism =====
            drawHydraulic(ctx) {
                const angle = this.physics.angle;
                const pumpX = -90;
                const cylinderX = 70;

                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.roundRect(pumpX - 40, -45, 80, 90, 8);
                ctx.fill();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.stroke();

                const pistonOffset = 20 * Math.sin(angle);
                ctx.fillStyle = '#0066ff';
                ctx.fillRect(pumpX - 12 + pistonOffset, -35, 24, 70);

                ctx.beginPath();
                ctx.moveTo(pumpX + 40, 0);
                ctx.lineTo(pumpX + 55, 0);
                ctx.lineTo(pumpX + 55, 35);
                ctx.lineTo(cylinderX - 45, 35);
                ctx.lineTo(cylinderX - 45, 10);
                ctx.strokeStyle = '#0066ff';
                ctx.lineWidth = 10;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(pumpX + 55, -25);
                ctx.lineTo(pumpX + 55, -45);
                ctx.lineTo(cylinderX - 45, -45);
                ctx.lineTo(cylinderX - 45, -25);
                ctx.strokeStyle = '#6699cc';
                ctx.lineWidth = 8;
                ctx.stroke();

                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.roundRect(cylinderX - 40, -60, 80, 120, 8);
                ctx.fill();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.stroke();

                const cylOffset = 30 * Math.sin(angle);
                ctx.fillStyle = '#00aa55';
                ctx.fillRect(cylinderX - 30 + cylOffset, -50, 25, 100);

                ctx.fillStyle = '#64748b';
                ctx.fillRect(cylinderX - 18 + cylOffset, -100, 12, 55);

                ctx.fillStyle = '#d4a017';
                ctx.beginPath();
                ctx.roundRect(cylinderX - 35, -130, 70, 30, 6);
                ctx.fill();
                ctx.strokeStyle = '#a08020';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(cylinderX, -95);
                ctx.lineTo(cylinderX, -140);
                ctx.strokeStyle = '#ff6644';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(cylinderX - 8, -125);
                ctx.lineTo(cylinderX, -140);
                ctx.lineTo(cylinderX + 8, -125);
                ctx.fillStyle = '#ff6644';
                ctx.fill();

                this.drawLabel(ctx, '液压泵', pumpX, 60);
                this.drawLabel(ctx, '液压缸', cylinderX, 80);
            }

            // ===== Spring Mechanism =====
            drawSpring(ctx) {
                const angle = this.physics.angle;
                const coils = 10;
                const springR = 18;
                const compression = 25 * Math.sin(angle);

                ctx.fillStyle = '#e2e8f0';
                ctx.beginPath();
                ctx.roundRect(-50, -10, 100, 15, 4);
                ctx.fill();
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.strokeStyle = '#0066ff';
                ctx.lineWidth = 6;
                ctx.lineCap = 'round';

                const springLen = 100 - compression;
                for (let i = 0; i < coils; i++) {
                    const y1 = 5 + springLen * i / coils;
                    const y2 = 5 + springLen * (i + 0.5) / coils;
                    const y3 = 5 + springLen * (i + 1) / coils;
                    ctx.moveTo(-springR, y1);
                    ctx.quadraticCurveTo(springR, (y1 + y2) / 2, -springR, y2);
                    ctx.quadraticCurveTo(springR, (y2 + y3) / 2, -springR, y3);
                }
                ctx.stroke();

                const endY = 5 + springLen;
                ctx.fillStyle = '#00aa55';
                ctx.beginPath();
                ctx.roundRect(-50, endY, 100, 15, 4);
                ctx.fill();
                ctx.strokeStyle = '#008844';
                ctx.lineWidth = 2;
                ctx.stroke();

                const massY = endY + 45;
                ctx.beginPath();
                ctx.arc(0, massY, 30, 0, Math.PI * 2);
                const massGrad = ctx.createRadialGradient(0, massY - 10, 0, 0, massY, 30);
                massGrad.addColorStop(0, '#d4a017');
                massGrad.addColorStop(1, '#a08020');
                ctx.fillStyle = massGrad;
                ctx.fill();
                ctx.strokeStyle = '#a08020';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, endY - 8);
                ctx.lineTo(0, endY + 8);
                ctx.strokeStyle = '#ff6644';
                ctx.lineWidth = 4;
                ctx.stroke();

                this.drawLabel(ctx, '弹簧', 30, 50);
                this.drawLabel(ctx, 'm', 0, massY + 5);
                this.drawLabel(ctx, 'F = kx', 40, endY + 25);
            }
        }

        // Initialize
        new MechanismSim();
    </script>
