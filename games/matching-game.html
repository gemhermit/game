<body>
    <div class="sidebar">
        <div class="header">
            <h1 class="title">消消乐</h1>
            <p class="subtitle">交换相邻宝石，三个或更多相同宝石连线消除</p>
        </div>

        <div class="level-select">
            <button class="level-btn active" data-mode="easy">简单</button>
            <button class="level-btn" data-mode="hard">困难</button>
            <button class="level-btn" data-mode="time">限时</button>
        </div>

        <div class="stats-bar">
            <div class="stat-box">
                <span class="stat-label">步数</span>
                <span class="stat-value" id="moves">30</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">分数</span>
                <span class="stat-value" id="score">0</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">连击</span>
                <span class="stat-value" id="combo">0</span>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-secondary" id="hintBtn">提示</button>
            <button class="btn btn-primary" id="restartBtn">重新开始</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <div class="main-area">
        <div class="game-container">
            <div class="game-board" id="board"></div>
        </div>
    </div>

    <div class="combo-display" id="comboDisplay"></div>

    <div class="game-over-modal" id="gameOverModal">
        <div class="modal-content">
            <h2 class="modal-title">游戏结束!</h2>
            <p>最终得分</p>
            <div class="final-score" id="finalScore">0</div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" id="closeModal">关闭</button>
                <button class="btn btn-primary" id="playAgain">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        const GEM_TYPES = ['💎', '🔮', '🌸', '🍀', '⭐', '🔷'];
        const BOARD_SIZE = 8;
        const INITIAL_MOVES = 30;
        const TIME_MODES = {
            easy: { moves: 40, time: 0 },
            hard: { moves: 25, time: 0 },
            time: { moves: 0, time: 180 }
        };

        let currentMode = 'easy';
        let board = [];
        let selectedCell = null;
        let score = 0;
        let moves = INITIAL_MOVES;
        let timeLeft = 0;
        let timer = null;
        let combo = 0;
        let isProcessing = false;
        let gameOver = false;

        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const movesEl = document.getElementById('moves');
        const comboEl = document.getElementById('combo');
        const messageEl = document.getElementById('message');
        const comboDisplayEl = document.getElementById('comboDisplay');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreEl = document.getElementById('finalScore');

        function updateBoardSize() {
            const container = document.querySelector('.game-container');
            const mainArea = document.querySelector('.main-area');

            // 获取主区域尺寸
            let w = mainArea.clientWidth || 400;
            let h = mainArea.clientHeight || 400;

            // 留出边距
            w = w - 30;
            h = h - 30;

            // 计算格子大小（8x8 网格）
            const gap = 6;
            const cellSize = Math.min(
                Math.floor((w - gap * 7) / 8),
                Math.floor((h - gap * 7) / 8),
                55
            );
            const size = Math.max(cellSize, 35);

            // 设置容器尺寸
            container.style.width = `${size * 8 + gap * 7 + 20}px`;
            container.style.height = `${size * 8 + gap * 7 + 20}px`;

            // 设置 grid
            boardEl.style.display = 'grid';
            boardEl.style.gridTemplateColumns = `repeat(8, ${size}px)`;
            boardEl.style.gridTemplateRows = `repeat(8, ${size}px)`;
            boardEl.style.gap = `${gap}px`;

            // 更新格子字体
            setTimeout(() => {
                document.querySelectorAll('.cell').forEach(cell => {
                    if (cell.textContent) {
                        cell.style.fontSize = `${size * 0.55}px`;
                    }
                });
            }, 50);
        }

        function init() {
            const modeConfig = TIME_MODES[currentMode];

            board = [];
            selectedCell = null;
            score = 0;
            moves = modeConfig.moves;
            timeLeft = modeConfig.time;
            combo = 0;
            isProcessing = false;
            gameOver = false;

            // 清除计时器
            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            updateUI();
            hideMessage();
            gameOverModal.classList.remove('show');

            for (let row = 0; row < BOARD_SIZE; row++) {
                board[row] = [];
                for (let col = 0; col < BOARD_SIZE; col++) {
                    let gem;
                    do {
                        gem = getRandomGem();
                    } while (wouldMatch(row, col, gem));
                    board[row][col] = { type: gem, special: null };
                }
            }

            renderBoard();

            // 如果是限时模式，开始计时
            if (currentMode === 'time') {
                startTimer();
            }

            // 延迟一点时间确保 DOM 已渲染
            setTimeout(updateBoardSize, 200);
        }

        function getRandomGem() {
            return GEM_TYPES[Math.floor(Math.random() * GEM_TYPES.length)];
        }

        function wouldMatch(row, col, gem) {
            if (col >= 2 && board[row][col-1]?.type === gem && board[row][col-2]?.type === gem) {
                return true;
            }
            if (row >= 2 && board[row-1]?.[col]?.type === gem && board[row-2]?.[col]?.type === gem) {
                return true;
            }
            return false;
        }

        function renderBoard() {
            boardEl.innerHTML = '';

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    if (board[row][col]) {
                        cell.textContent = board[row][col].type;
                        if (board[row][col].special === 'bomb') {
                            cell.classList.add('special-bomb');
                        } else if (board[row][col].special === 'rainbow') {
                            cell.classList.add('special-rainbow');
                        }
                    }

                    cell.addEventListener('click', () => handleCellClick(row, col));

                    let touchStartX = 0;
                    let touchStartY = 0;

                    cell.addEventListener('touchstart', (e) => {
                        touchStartX = e.touches[0].clientX;
                        touchStartY = e.touches[0].clientY;
                    }, { passive: true });

                    cell.addEventListener('touchend', (e) => {
                        if (isProcessing || gameOver) return;

                        const touchEndX = e.changedTouches[0].clientX;
                        const touchEndY = e.changedTouches[0].clientY;

                        const diffX = touchEndX - touchStartX;
                        const diffY = touchEndY - touchStartY;

                        if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;

                        let targetRow = row;
                        let targetCol = col;

                        if (Math.abs(diffX) > Math.abs(diffY)) {
                            if (diffX > 0) targetCol = Math.min(col + 1, BOARD_SIZE - 1);
                            else targetCol = Math.max(col - 1, 0);
                        } else {
                            if (diffY > 0) targetRow = Math.min(row + 1, BOARD_SIZE - 1);
                            else targetRow = Math.max(row - 1, 0);
                        }

                        if (selectedCell && selectedCell.row === row && selectedCell.col === col) {
                            const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                            prevCell.classList.remove('selected');
                            swapGems(selectedCell, { row: targetRow, col: targetCol });
                            selectedCell = null;
                        } else {
                            if (selectedCell) {
                                const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                                prevCell.classList.remove('selected');
                            }
                            selectedCell = { row, col };
                            cell.classList.add('selected');
                        }
                    }, { passive: true });

                    boardEl.appendChild(cell);
                }
            }
        }

        function getCellElement(row, col) {
            return boardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        function handleCellClick(row, col) {
            if (isProcessing || gameOver || !board[row][col]) return;

            const cell = getCellElement(row, col);

            if (selectedCell === null) {
                selectedCell = { row, col };
                cell.classList.add('selected');
            } else if (selectedCell.row === row && selectedCell.col === col) {
                cell.classList.remove('selected');
                selectedCell = null;
            } else if (isAdjacent(selectedCell, { row, col })) {
                const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                prevCell.classList.remove('selected');

                if (board[selectedCell.row][selectedCell.col].special === 'rainbow' ||
                    board[row][col].special === 'rainbow') {
                    handleRainbowSwap(selectedCell, { row, col });
                    return;
                }

                swapGems(selectedCell, { row, col });
                selectedCell = null;
            } else {
                const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                prevCell.classList.remove('selected');
                selectedCell = { row, col };
                cell.classList.add('selected');
            }
        }

        function isAdjacent(cell1, cell2) {
            const rowDiff = Math.abs(cell1.row - cell2.row);
            const colDiff = Math.abs(cell1.col - cell2.col);
            return (rowDiff === 1 && colDiff === 0) || (rowDiff === 0 && colDiff === 1);
        }

        async function swapGems(cell1, cell2) {
            isProcessing = true;

            const temp = board[cell1.row][cell1.col];
            board[cell1.row][cell1.col] = board[cell2.row][cell2.col];
            board[cell2.row][cell2.col] = temp;

            renderBoard();

            const matches = findMatches();

            if (matches.length === 0) {
                await sleep(200);
                const temp2 = board[cell1.row][cell1.col];
                board[cell1.row][cell1.col] = board[cell2.row][cell2.col];
                board[cell2.row][cell2.col] = temp2;
                renderBoard();
                showMessage('无效的移动!', 'warning');
                isProcessing = false;
                return;
            }

            if (currentMode !== 'time') {
                moves--;
            }
            combo = 0;
            updateUI();

            await processMatches();
        }

        async function handleRainbowSwap(rainbowCell, targetCell) {
            isProcessing = true;

            const targetType = board[targetCell.row][targetCell.col].type;

            const cellsToMatch = [];
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col] && board[row][col].type === targetType) {
                        cellsToMatch.push({ row, col });
                    }
                }
            }

            board[rainbowCell.row][rainbowCell.col] = null;
            if (currentMode !== 'time') {
                moves--;
            combo = 0;
            updateUI();

            cellsToMatch.forEach(cell => {
                const cellEl = getCellElement(cell.row, cell.col);
                if (cellEl) cellEl.classList.add('matched');
            });

            await sleep(300);

            const matchScore = cellsToMatch.length * 10;
            addScore(matchScore);

            cellsToMatch.forEach(cell => {
                board[cell.row][cell.col] = null;
            });

            if (cellsToMatch.length >= 5) {
                board[targetCell.row][targetCell.col] = { type: '🌈', special: 'rainbow' };
            } else if (cellsToMatch.length >= 4) {
                board[targetCell.row][targetCell.col] = { type: '💥', special: 'bomb' };
            }

            renderBoard();
            await processMatches();
        }

        function findMatches() {
            const matches = new Set();

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE - 2; col++) {
                    const gem = board[row][col]?.type;
                    if (gem && gem !== '🌈') {
                        let matchLength = 1;
                        while (col + matchLength < BOARD_SIZE && board[row][col + matchLength]?.type === gem) {
                            matchLength++;
                        }
                        if (matchLength >= 3) {
                            for (let i = 0; i < matchLength; i++) {
                                matches.add(`${row},${col + i}`);
                            }
                        }
                    }
                }
            }

            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = 0; row < BOARD_SIZE - 2; row++) {
                    const gem = board[row][col]?.type;
                    if (gem && gem !== '🌈') {
                        let matchLength = 1;
                        while (row + matchLength < BOARD_SIZE && board[row + matchLength]?.[col]?.type === gem) {
                            matchLength++;
                        }
                        if (matchLength >= 3) {
                            for (let i = 0; i < matchLength; i++) {
                                matches.add(`${row + i},${col}`);
                            }
                        }
                    }
                }
            }

            return Array.from(matches).map(pos => {
                const [row, col] = pos.split(',').map(Number);
                return { row, col };
            });
        }

        async function processMatches() {
            let matches = findMatches();

            while (matches.length > 0) {
                combo++;
                if (combo > 1) {
                    showCombo(combo);
                }

                const bombMatches = matches.filter(m =>
                    board[m.row][m.col]?.special === 'bomb'
                );

                for (const bomb of bombMatches) {
                    const affected = getBombAffectedCells(bomb.row, bomb.col);
                    affected.forEach(cell => {
                        if (!matches.some(m => m.row === cell.row && m.col === cell.col)) {
                            matches.push(cell);
                        }
                    });
                }

                matches.forEach(m => {
                    const cell = getCellElement(m.row, m.col);
                    if (cell) cell.classList.add('matched');
                });

                await sleep(300);

                const baseScore = matches.length * 10;
                const comboMultiplier = Math.min(combo, 5);
                const specialBonus = bombMatches.length * 50;
                const totalScore = (baseScore * comboMultiplier) + specialBonus;
                addScore(totalScore);

                if (matches.length >= 5) {
                    const centerMatch = matches[Math.floor(matches.length / 2)];
                    board[centerMatch.row][centerMatch.col] = { type: '🌈', special: 'rainbow' };
                } else if (matches.length >= 4) {
                    const centerMatch = matches[Math.floor(matches.length / 2)];
                    board[centerMatch.row][centerMatch.col] = { type: '💥', special: 'bomb' };
                }

                matches.forEach(m => {
                    board[m.row][m.col] = null;
                });

                renderBoard();
                await sleep(100);

                await dropGems();
                await fillBoard();

                matches = findMatches();
            }

            if (!hasValidMoves()) {
                showMessage('没有可用的移动! 重新洗牌...', 'warning');
                await sleep(1000);
                reshuffle();
            }

            if (moves <= 0 || (currentMode === 'time' && timeLeft <= 0)) {
                endGame();
            }

            isProcessing = false;
        }

        function getBombAffectedCells(row, col) {
            const cells = [];
            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < BOARD_SIZE && c >= 0 && c < BOARD_SIZE) {
                        cells.push({ row: r, col: c });
                    }
                }
            }
            return cells;
        }

        async function dropGems() {
            let dropped = false;

            for (let col = 0; col < BOARD_SIZE; col++) {
                let emptyRow = BOARD_SIZE - 1;

                for (let row = BOARD_SIZE - 1; row >= 0; row--) {
                    if (board[row][col]) {
                        if (row !== emptyRow) {
                            board[emptyRow][col] = board[row][col];
                            board[row][col] = null;
                            dropped = true;
                        }
                        emptyRow--;
                    }
                }
            }

            if (dropped) {
                renderBoard();
                await sleep(200);
            }
        }

        async function fillBoard() {
            for (let col = 0; col < BOARD_SIZE; col++) {
                for (let row = 0; row < BOARD_SIZE; row++) {
                    if (!board[row][col]) {
                        board[row][col] = { type: getRandomGem(), special: null };
                    }
                }
            }

            renderBoard();
            await sleep(200);
        }

        function addScore(points) {
            score += points;
            updateUI();
        }

        function updateUI() {
            scoreEl.textContent = score;
            if (currentMode === 'time') {
                movesEl.textContent = timeLeft;
                document.querySelector('.stat-box:first-child .stat-label').textContent = '时间';
            } else {
                movesEl.textContent = moves;
                document.querySelector('.stat-box:first-child .stat-label').textContent = '步数';
            }
            comboEl.textContent = combo;
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                updateUI();

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endGame();
                }
            }, 1000);
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = `message show ${type}`;
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 2000);
        }

        function hideMessage() {
            messageEl.classList.remove('show');
        }

        function showCombo(count) {
            comboDisplayEl.textContent = `${count} 连击!`;
            comboDisplayEl.classList.add('show');
            setTimeout(() => {
                comboDisplayEl.classList.remove('show');
            }, 800);
        }

        function hasValidMoves() {
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (col < BOARD_SIZE - 1) {
                        swap(row, col, row, col + 1);
                        if (findMatches().length > 0) {
                            swap(row, col, row, col + 1);
                            return true;
                        }
                        swap(row, col, row, col + 1);
                    }
                    if (row < BOARD_SIZE - 1) {
                        swap(row, col, row + 1, col);
                        if (findMatches().length > 0) {
                            swap(row, col, row + 1, col);
                            return true;
                        }
                        swap(row, col, row + 1, col);
                    }
                }
            }
            return false;
        }

        function swap(r1, c1, r2, c2) {
            const temp = board[r1][c1];
            board[r1][c1] = board[r2][c2];
            board[r2][c2] = temp;
        }

        async function reshuffle() {
            const gems = [];
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (board[row][col]) {
                        gems.push(board[row][col].type);
                    }
                }
            }

            for (let i = gems.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [gems[i], gems[j]] = [gems[j], gems[i]];
            }

            let index = 0;
            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    board[row][col] = { type: gems[index++], special: null };
                }
            }

            renderBoard();
            await sleep(300);

            const matches = findMatches();
            if (matches.length > 0) {
                await processMatches();
            }

            if (!hasValidMoves()) {
                await reshuffle();
            }
        }

        function showHint() {
            if (isProcessing || gameOver) return;

            for (let row = 0; row < BOARD_SIZE; row++) {
                for (let col = 0; col < BOARD_SIZE; col++) {
                    if (col < BOARD_SIZE - 1) {
                        swap(row, col, row, col + 1);
                        if (findMatches().length > 0) {
                            swap(row, col, row, col + 1);

                            const cell1 = getCellElement(row, col);
                            const cell2 = getCellElement(row, col + 1);
                            cell1.classList.add('hint');
                            cell2.classList.add('hint');

                            setTimeout(() => {
                                cell1.classList.remove('hint');
                                cell2.classList.remove('hint');
                            }, 2000);
                            return;
                        }
                        swap(row, col, row, col + 1);
                    }
                    if (row < BOARD_SIZE - 1) {
                        swap(row, col, row + 1, col);
                        if (findMatches().length > 0) {
                            swap(row, col, row + 1, col);

                            const cell1 = getCellElement(row, col);
                            const cell2 = getCellElement(row + 1, col);
                            cell1.classList.add('hint');
                            cell2.classList.add('hint');

                            setTimeout(() => {
                                cell1.classList.remove('hint');
                                cell2.classList.remove('hint');
                            }, 2000);
                            return;
                        }
                        swap(row, col, row + 1, col);
                    }
                }
            }

            showMessage('没有可用的移动!', 'warning');
            setTimeout(() => reshuffle(), 1000);
        }

        function endGame() {
            gameOver = true;
            finalScoreEl.textContent = score;
            gameOverModal.classList.add('show');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        document.getElementById('restartBtn').addEventListener('click', init);
        document.getElementById('playAgain').addEventListener('click', init);
        document.getElementById('closeModal').addEventListener('click', () => {
            gameOverModal.classList.remove('show');
        });
        document.getElementById('hintBtn').addEventListener('click', showHint);

        // 模式切换
        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                init();
            });
        });

        window.addEventListener('resize', () => {
            if (board.length > 0) {
                updateBoardSize();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (isProcessing || gameOver || !selectedCell) return;

            const { row, col } = selectedCell;
            let newRow = row, newCol = col;

            switch(e.key) {
                case 'ArrowUp': newRow = Math.max(0, row - 1); break;
                case 'ArrowDown': newRow = Math.min(BOARD_SIZE - 1, row + 1); break;
                case 'ArrowLeft': newCol = Math.max(0, col - 1); break;
                case 'ArrowRight': newCol = Math.min(BOARD_SIZE - 1, col + 1); break;
                case 'Enter':
                case ' ':
                    const cell = getCellElement(row, col);
                    cell.classList.remove('selected');
                    selectedCell = null;
                    return;
                default: return;
            }

            e.preventDefault();

            const prevCell = getCellElement(row, col);
            prevCell.classList.remove('selected');

            if (isAdjacent({ row, col }, { row: newRow, col: newCol })) {
                swapGems({ row, col }, { row: newRow, col: newCol });
                selectedCell = null;
            } else {
                selectedCell = { row: newRow, col: newCol };
                const newCell = getCellElement(newRow, newCol);
                newCell.classList.add('selected');
            }
        });

        init();
    </script>
</body>
</html>
