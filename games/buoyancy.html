    <script>
        class BuoyancyGame {
            constructor() {
                this.canvas = document.getElementById('simCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                
                // Constants
                this.g = 980; // Adjusted for pixel scale (approx 1000px/m)
                this.scale = 2; 
                
                // State
                this.params = {
                    objDensity: 0.6, // g/cm3
                    objVolume: 100, // cm3 (Visual size linked to cube root)
                    liquidDensity: 1.0, // g/cm3
                    viscosity: 0.05, // Damping factor
                    showForces: true
                };

                // Object Physics State
                this.obj = {
                    x: 0,
                    y: 0, // Top-left corner
                    w: 0, // Calculated from volume
                    h: 0,
                    vy: 0,
                    ay: 0,
                    color: '#8B4513'
                };

                this.interaction = {
                    isDragging: false,
                    dragOffsetX: 0,
                    dragOffsetY: 0,
                    lastY: 0,
                    lastTime: 0,
                    throwVy: 0
                };

                // Materials Library
                this.materials = [
                    { id: 'wood', name: '木块', density: 0.6, color: '#8B4513' },
                    { id: 'plastic', name: '塑料', density: 0.9, color: '#38bdf8' },
                    { id: 'water', name: '水球', density: 1.0, color: '#60a5fa' },
                    { id: 'brick', name: '砖块', density: 2.0, color: '#b91c1c' },
                    { id: 'iron', name: '铁块', density: 7.8, color: '#475569' },
                    { id: 'gold', name: '金块', density: 19.3, color: '#fbbf24' }
                ];

                this.init();
            }

            init() {
                this.setupUI();
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                // Canvas Interactions
                this.canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                window.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                window.addEventListener('mouseup', () => this.handleMouseUp());

                // Start Loop
                this.resetObject();
                this.animate();
            }

            setupUI() {
                // Material Buttons
                const grid = document.getElementById('materialGrid');
                this.materials.forEach(mat => {
                    const btn = document.createElement('div');
                    btn.className = `material-btn ${mat.id === 'wood' ? 'active' : ''}`;
                    btn.textContent = mat.name;
                    btn.dataset.id = mat.id;
                    btn.onclick = () => this.selectMaterial(mat, btn);
                    grid.appendChild(btn);
                });

                // Sliders
                const bindSlider = (id, param, cb) => {
                    const el = document.getElementById(id);
                    el.addEventListener('input', (e) => {
                        this.params[param] = parseFloat(e.target.value);
                        if (cb) cb(this.params[param]);
                        this.updateObjectProps();
                    });
                };

                bindSlider('input-density', 'objDensity', (v) => {
                    document.getElementById('val-density').textContent = v.toFixed(1);
                    // Deselect material if custom density
                    document.querySelectorAll('.material-btn').forEach(b => b.classList.remove('active'));
                });

                bindSlider('input-size', 'objVolume', (v) => {
                    document.getElementById('val-size').textContent = v + 'cm³';
                });

                bindSlider('input-liquid-density', 'liquidDensity', (v) => {
                    document.getElementById('val-liquid-density').textContent = v.toFixed(1);
                    let type = '其他液体';
                    if (v === 1.0) type = '纯水';
                    else if (v < 1.0) type = '油/酒精';
                    else if (v > 1.0) type = '盐水/浓液';
                    document.getElementById('liquid-type').textContent = type;
                });

                bindSlider('input-viscosity', 'viscosity', (v) => {
                    document.getElementById('val-viscosity').textContent = v.toFixed(2);
                });

                // Toggle
                document.getElementById('btn-forces').addEventListener('click', (e) => {
                    this.params.showForces = !this.params.showForces;
                    const el = e.currentTarget;
                    el.classList.toggle('active');
                    el.querySelector('.toggle-status').textContent = this.params.showForces ? '开启' : '关闭';
                });

                document.getElementById('btn-reset').addEventListener('click', () => this.resetObject());
            }

            selectMaterial(mat, btn) {
                document.querySelectorAll('.material-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                this.params.objDensity = mat.density;
                this.obj.color = mat.color;
                
                // Update slider
                document.getElementById('input-density').value = mat.density;
                document.getElementById('val-density').textContent = mat.density.toFixed(1);
                
                this.updateObjectProps();
            }

            updateObjectProps() {
                // Volume to Side Length (assume cube)
                const side = Math.pow(this.params.objVolume, 1/3) * 10; // Visual scale factor
                this.obj.w = side;
                this.obj.h = side;
            }

            resetObject() {
                this.updateObjectProps();
                this.obj.x = this.width / 2 - this.obj.w / 2;
                this.obj.y = 100; // Drop from air
                this.obj.vy = 0;
                this.obj.ay = 0;
            }

            resize() {
                const parent = this.canvas.parentElement;
                this.canvas.width = parent.clientWidth;
                this.canvas.height = parent.clientHeight;
                this.width = this.canvas.width;
                this.height = this.canvas.height;
                
                // Keep object in bounds
                this.obj.x = Math.min(Math.max(0, this.obj.x), this.width - this.obj.w);
            }

            handleMouseDown(e) {
                const rect = this.canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                if (mx >= this.obj.x && mx <= this.obj.x + this.obj.w &&
                    my >= this.obj.y && my <= this.obj.y + this.obj.h) {
                    this.interaction.isDragging = true;
                    this.interaction.dragOffsetX = mx - this.obj.x;
                    this.interaction.dragOffsetY = my - this.obj.y;
                    this.obj.vy = 0; // Stop momentum on grab
                    
                    // Reset throw tracking
                    this.interaction.lastY = this.obj.y;
                    this.interaction.lastTime = Date.now();
                    this.interaction.throwVy = 0;
                }
            }

            handleMouseMove(e) {
                if (!this.interaction.isDragging) return;
                
                const rect = this.canvas.getBoundingClientRect();
                const mx = e.clientX - rect.left;
                const my = e.clientY - rect.top;

                this.obj.x = mx - this.interaction.dragOffsetX;
                this.obj.y = my - this.interaction.dragOffsetY;
                
                // Track velocity for throw
                const now = Date.now();
                const dt = now - this.interaction.lastTime;
                if (dt > 0) {
                    const dy = this.obj.y - this.interaction.lastY;
                    // Smoothing factor
                    this.interaction.throwVy = (dy / (dt / 1000)); 
                    this.interaction.lastY = this.obj.y;
                    this.interaction.lastTime = now;
                }
            }

            handleMouseUp() {
                if (this.interaction.isDragging) {
                    this.interaction.isDragging = false;
                    // Apply throw velocity (cap it to prevent crazy speeds)
                    this.obj.vy = Math.max(-2000, Math.min(2000, this.interaction.throwVy));
                }
            }

            physicsStep() {
                if (this.interaction.isDragging) return;

                const dt = 1/60;
                const liquidLevel = this.height * 0.4; // Liquid surface Y coordinate (from top)
                const liquidY = liquidLevel;
                const bottomY = this.height;

                // 1. Gravity
                // Mass = Density * Volume
                const mass = this.params.objDensity * this.params.objVolume;
                const Fg = mass * this.g;

                // 2. Buoyancy
                // Calculate submerged volume
                let vSub = 0;
                let submergedHeight = 0;
                
                const objBottom = this.obj.y + this.obj.h;
                const objTop = this.obj.y;
                
                if (objBottom > liquidY) {
                    if (objTop > liquidY) {
                        // Fully submerged
                        submergedHeight = this.obj.h;
                    } else {
                        // Partially submerged
                        submergedHeight = objBottom - liquidY;
                    }
                }
                
                // Ratio of submerged height to total height * Total Volume
                const ratio = Math.min(Math.max(submergedHeight / this.obj.h, 0), 1);
                vSub = ratio * this.params.objVolume;
                
                const Fb = this.params.liquidDensity * this.g * vSub;

                // 3. Drag (Water resistance)
                let dragCoeff = 0.05; // Air
                if (ratio > 0) dragCoeff = 0.5 * ratio; // Liquid drag is higher
                const Fd = -dragCoeff * this.obj.vy * Math.abs(this.obj.vy) * 2; // Quadratic drag for stability

                // Damping (linear) - Adjusted for new scale
                // a = -k * v. We want reasonable decay.
                // Let's use F_damping = -k * m * v, so a_damping is independent of mass.
                // Use viscosity parameter
                const damping = -2.0 * mass * this.obj.vy * this.params.viscosity; 

                // Net Force
                const Fnet = Fg - Fb + damping;

                // Acceleration
                this.obj.ay = Fnet / mass;

                // Integration
                this.obj.vy += this.obj.ay * dt;
                this.obj.y += this.obj.vy * dt;

                // Boundary Collisions
                // Floor
                if (this.obj.y + this.obj.h > bottomY) {
                    this.obj.y = bottomY - this.obj.h;
                    this.obj.vy *= -0.3; // Bounce with energy loss
                    if (Math.abs(this.obj.vy) < 10) this.obj.vy = 0; // Threshold increased for higher scale
                }
                
                // Ceiling (prevent flying off screen)
                if (this.obj.y < 0) {
                    this.obj.y = 0;
                    this.obj.vy *= -0.3;
                }

                // Walls
                if (this.obj.x < 0) {
                    this.obj.x = 0;
                    this.obj.vy *= 0.9;
                }
                if (this.obj.x + this.obj.w > this.width) {
                    this.obj.x = this.width - this.obj.w;
                    this.obj.vy *= 0.9;
                }

                // Update Stats (Scale Fg/Fb down to realistic Newton values)
                // Assuming 100px = 0.1m, so scale factor 1000
                const forceScale = 0.001; 
                this.updateStats(Fg * forceScale, Fb * forceScale, vSub, mass);
            }

            updateStats(Fg, Fb, vSub, mass) {
                document.getElementById('stat-gravity').textContent = Fg.toFixed(1);
                document.getElementById('stat-buoyancy').textContent = Fb.toFixed(1);
                document.getElementById('stat-vsub').textContent = vSub.toFixed(1);
                
                let state = '--';
                const densityDiff = this.params.objDensity - this.params.liquidDensity;
                if (this.obj.y + this.obj.h >= this.height - 1) state = '沉底';
                else if (Math.abs(densityDiff) < 0.01) state = '悬浮';
                else if (densityDiff < 0) state = '漂浮';
                else state = '下沉中';
                
                document.getElementById('stat-state').textContent = state;
                
                // Color code state
                const stateEl = document.getElementById('stat-state');
                if (state === '漂浮') stateEl.style.color = '#22c55e';
                else if (state === '沉底') stateEl.style.color = '#ef4444';
                else stateEl.style.color = '#f59e0b';
            }

            draw() {
                const ctx = this.ctx;
                ctx.clearRect(0, 0, this.width, this.height);

                const liquidLevel = this.height * 0.4;

                // 1. Draw Liquid
                const grad = ctx.createLinearGradient(0, liquidLevel, 0, this.height);
                grad.addColorStop(0, 'rgba(14, 165, 233, 0.4)'); // Sky blue transparent
                grad.addColorStop(1, 'rgba(3, 105, 161, 0.6)'); // Darker blue

                ctx.fillStyle = grad;
                ctx.fillRect(0, liquidLevel, this.width, this.height - liquidLevel);

                // Surface Line
                ctx.beginPath();
                ctx.moveTo(0, liquidLevel);
                // Simple wave effect
                for(let i=0; i<=this.width; i+=10) {
                    ctx.lineTo(i, liquidLevel + Math.sin(i/50 + Date.now()/500)*5);
                }
                ctx.lineTo(this.width, this.height);
                ctx.lineTo(0, this.height);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fill();

                // 2. Draw Object
                ctx.fillStyle = this.obj.color;
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                
                // Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetY = 5;
                
                ctx.fillRect(this.obj.x, this.obj.y, this.obj.w, this.obj.h);
                ctx.shadowColor = 'transparent'; // Reset shadow
                ctx.strokeRect(this.obj.x, this.obj.y, this.obj.w, this.obj.h);

                // Submerged Part Visualization (Darker overlay)
                if (this.obj.y + this.obj.h > liquidLevel) {
                    const subY = Math.max(this.obj.y, liquidLevel);
                    const subH = Math.min(this.obj.h, (this.obj.y + this.obj.h) - subY);
                    
                    if (subH > 0) {
                        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                        ctx.fillRect(this.obj.x, subY, this.obj.w, subH);
                    }
                }

                // 3. Draw Forces
                if (this.params.showForces) {
                    const cx = this.obj.x + this.obj.w / 2;
                    const cy = this.obj.y + this.obj.h / 2;
                    
                    // Scale forces for visualization
                    // Fg is now ~58000. We want a line of ~100px.
                    // Scale factor approx 0.002
                    const scaleFactor = 0.002; 
                    
                    // Gravity (Down)
                    const Fg = this.params.objDensity * this.params.objVolume * this.g;
                    const lenG = Math.min(Fg * scaleFactor, 150);
                    this.drawArrow(cx, cy, cx, cy + lenG, '#ef4444', 'G');

                    // Buoyancy (Up) - Calculate strictly for vis
                    let subH = 0;
                    if (this.obj.y + this.obj.h > liquidLevel) {
                        subH = Math.min(this.obj.h, (this.obj.y + this.obj.h) - Math.max(this.obj.y, liquidLevel));
                    }
                    const ratio = subH / this.obj.h;
                    const Fb = this.params.liquidDensity * this.g * (ratio * this.params.objVolume);
                    
                    if (Fb > 0.1) {
                        const lenB = Math.min(Fb * scaleFactor, 150);
                        // Draw from bottom center up? Or center up? Center is better for FBD.
                        this.drawArrow(cx, cy, cx, cy - lenB, '#22c55e', 'F浮');
                    }
                }
            }

            drawArrow(x1, y1, x2, y2, color, label) {
                const ctx = this.ctx;
                const headlen = 10;
                const angle = Math.atan2(y2 - y1, x2 - x1);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.strokeStyle = color;
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x2, y2);
                ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
                ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
                ctx.fillStyle = color;
                ctx.fill();

                // Label
                ctx.fillStyle = color;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                const labelX = x2 + 10;
                const labelY = y2;
                ctx.fillText(label, labelX, labelY);
            }

            animate() {
                this.physicsStep();
                this.draw();
                requestAnimationFrame(() => this.animate());
            }
        }

        window.onload = () => {
            new BuoyancyGame();
        };
    </script>
</body>
