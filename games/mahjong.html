                    <div class="player-hand" id="playerHand0"></div>
                </div>

                <!-- Dice -->
                <div class="dice-container" id="diceContainer" style="display: none;">
                    <div class="dice" id="dice1">⚀</div>
                    <div class="dice" id="dice2">⚁</div>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="action-bar" id="actionBar" style="display: none;">
            <button class="action-btn hu" id="huBtn">胡</button>
            <button class="action-btn gang" id="gangBtn">杠</button>
            <button class="action-btn peng" id="pengBtn">碰</button>
            <button class="action-btn guo" id="guoBtn">过</button>
        </div>

        <!-- Tile Pool (for drawing) -->
        <div class="tile-pool" id="tilePool" style="display: none;">
            <div class="mahjong-tile" id="drawTile" title="摸牌">🀄</div>
        </div>
    </div>

    <!-- Game Start Overlay -->
    <div class="game-overlay" id="gameOverlay">
        <div class="overlay-content">
            <h2>🀄 麻将游戏</h2>
            <p id="overlayText">选择麻将类型和玩家数量，点击"新游戏"开始游戏。</p>
            <button class="btn btn-primary" id="startGameBtn">
                开始游戏
            </button>
        </div>
    </div>

    <script>
        // Mahjong Game Logic
        class MahjongGame {
            constructor() {
                this.mahjongType = 'guobiao';
                this.playerCount = 4;
                this.players = [];
                this.currentPlayer = 0;
                this.round = 1;
                this.totalRounds = 8;
                this.remainingTiles = 0;
                this.tilePool = [];
                this.discardPiles = [[], [], [], []];
                this.selectedTile = null;
                this.gameStarted = false;
                this.canHu = false;
                this.canGang = false;
                this.canPeng = false;

                this.tileCounts = {
                    guobiao: { total: 136, perPlayer: 13 },
                    sichuan: { total: 108, perPlayer: 13 },
                    guangdong: { total: 136, perPlayer: 13 },
                    hongzhong: { total: 84, perPlayer: 13 },
                    rijup: { total: 136, perPlayer: 13 }
                };

                this.rules = {
                    guobiao: [
                        '136张牌，144张（含花牌）',
                        '可吃、碰、杠',
                        '8局结束',
                        '有番种计分'
                    ],
                    sichuan: [
                        '108张牌（无字牌）',
                        '只能碰、杠，不能吃',
                        '血战到底',
                        '缺一门才能胡'
                    ],
                    guangdong: [
                        '136张牌',
                        '可吃、碰、杠',
                        '十三幺特殊胡法',
                        '买马规则'
                    ],
                    hongzhong: [
                        '84张牌（只有筒条万+红中）',
                        '只能碰、杠',
                        '红中可替任意牌',
                        '简单易上手'
                    ],
                    rijup: [
                        '136张牌（含3张赤宝牌）',
                        '只能碰、杠，不能吃',
                        '有宝牌（dora）机制',
                        '断幺九/立直等番种'
                    ]
                };

                this.initElements();
                this.initEventListeners();
                this.updateUI();
            }

            initElements() {
                this.mahjongTypeSelect = document.getElementById('mahjongType');
                this.playerCountBtns = document.querySelectorAll('.player-count-btn');
                this.newGameBtn = document.getElementById('newGameBtn');
                this.undoBtn = document.getElementById('undoBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.startGameBtn = document.getElementById('startGameBtn');
                this.gameOverlay = document.getElementById('gameOverlay');
                this.overlayText = document.getElementById('overlayText');
                this.currentPlayerDot = document.getElementById('currentPlayerDot');
                this.currentPlayerText = document.getElementById('currentPlayerText');
                this.roundInfo = document.getElementById('roundInfo');
                this.remainingTiles = document.getElementById('remainingTiles');
                this.turnInfo = document.getElementById('turnInfo');
                this.playerList = document.getElementById('playerList');
                this.rulesList = document.getElementById('rulesList');
                this.actionBar = document.getElementById('actionBar');
                this.tilePool = document.getElementById('tilePool');
                this.diceContainer = document.getElementById('diceContainer');
            }

            initEventListeners() {
                this.mahjongTypeSelect.addEventListener('change', (e) => {
                    this.mahjongType = e.target.value;
                    this.updateRules();
                });

                this.playerCountBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.playerCount = parseInt(e.target.dataset.count);
                        this.playerCountBtns.forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                    });
                });

                this.newGameBtn.addEventListener('click', () => this.startNewGame());
                this.startGameBtn.addEventListener('click', () => this.startNewGame());
                this.resetBtn.addEventListener('click', () => this.resetGame());
                this.undoBtn.addEventListener('click', () => this.undoLastAction());

                // Action buttons
                document.getElementById('huBtn').addEventListener('click', () => this.hu());
                document.getElementById('gangBtn').addEventListener('click', () => this.gang());
                document.getElementById('pengBtn').addEventListener('click', () => this.peng());
                document.getElementById('guoBtn').addEventListener('click', () => this.guo());

                // Draw tile
                document.getElementById('drawTile').addEventListener('click', () => this.drawTile());
            }

            getTileSet() {
                // Generate tiles based on mahjong type
                const tiles = [];
                const types = {
                    guobiao: ['筒', '条', '万', '东南西北中发白'],
                    sichuan: ['筒', '条', '万'],
                    guangdong: ['筒', '条', '万', '东南西北中发白'],
                    hongzhong: ['筒', '条', '万', '中'],
                    rijup: ['筒', '条', '万', '东南西北白发中']
                };

                const tileTypes = types[this.mahjongType] || types.guobiao;

                tileTypes.forEach(type => {
                    if (type.length === 1) {
                        // Number tiles 1-9
                        for (let i = 1; i <= 9; i++) {
                            // Check for red five in Japanese mahjong
                            let count = 4;
                            if (this.mahjongType === 'rijup' && type === '筒' && i === 5) {
                                count = 3; // 3 red fives + 1 normal
                            }
                            for (let j = 0; j < count; j++) {
                                const isRed = (this.mahjongType === 'rijup' && type === '筒' && i === 5 && j < 3);
                                tiles.push({
                                    type,
                                    value: i,
                                    display: `${type}${i}`,
                                    isRed: isRed,
                                    isDora: false
                                });
                            }
                        }
                    } else {
                        // Honor tiles
                        for (let j = 0; j < 4; j++) {
                            tiles.push({ type, value: type, display: type, isRed: false, isDora: false });
                        }
                    }
                });

                // Japanese mahjong - add red 5筒 (3 red dora)
                if (this.mahjongType === 'rijup') {
                    for (let i = 0; i < 3; i++) {
                        tiles.push({ type: '筒', value: 5, display: '筒5', isRed: true, isDora: true });
                    }
                }

                return this.shuffle(tiles);
            }

            shuffle(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            startNewGame() {
                const config = this.tileCounts[this.mahjongType];
                this.tilePool = this.getTileSet();
                this.remainingTiles = config.total - (config.perPlayer * this.playerCount);
                this.currentPlayer = 0;
                this.round = 1;
                this.discardPiles = [[], [], [], []];
                this.gameStarted = true;

                // Deal tiles to each player
                this.players = [];
                for (let i = 0; i < this.playerCount; i++) {
                    this.players.push({
                        id: i,
                        hand: [],
                        name: this.getPlayerName(i),
                        score: 0,
                        peng: [],
                        gang: [],
                        hu: false
                    });

                    // Deal initial tiles
                    for (let j = 0; j < config.perPlayer; j++) {
                        if (this.tilePool.length > 0) {
                            this.players[i].hand.push(this.tilePool.pop());
                        }
                    }
                }

                // Sort hand for human player
                this.players[0].hand.sort((a, b) => {
                    const order = { '筒': 1, '条': 2, '万': 3 };
                    const aOrder = order[a.type] || 10;
                    const bOrder = order[b.type] || 10;
                    if (aOrder !== bOrder) return aOrder - bOrder;
                    return a.value - b.value;
                });

                // Show dice animation then start
                this.showDice();
                this.gameOverlay.classList.add('hidden');
                this.actionBar.style.display = 'flex';
                this.tilePool.style.display = 'flex';

                this.updateUI();
                this.checkActions();
            }

            getPlayerName(index) {
                const names = {
                    0: ['你', '下家', '对家', '上家'],
                    1: ['东家', '你', '下家', '对家'],
                    2: ['上家', '东家', '你', '下家'],
                    3: ['对家', '上家', '东家', '你']
                };
                return names[index]?.[this.currentPlayer] || `玩家${index + 1}`;
            }

            showDice() {
                this.diceContainer.style.display = 'flex';
                const dice1 = Math.floor(Math.random() * 6) + 1;
                const dice2 = Math.floor(Math.random() * 6) + 1;
                const diceChars = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
                document.getElementById('dice1').textContent = diceChars[dice1 - 1];
                document.getElementById('dice2').textContent = diceChars[dice2 - 1];

                setTimeout(() => {
                    this.diceContainer.style.display = 'none';
                }, 1500);
            }

            drawTile() {
                if (this.tilePool.length === 0) {
                    alert('牌已摸完！');
                    return;
                }

                const tile = this.tilePool.pop();
                this.remainingTiles = this.tilePool.length;
                this.players[0].hand.push(tile);

                // Sort hand
                this.players[0].hand.sort((a, b) => {
                    const order = { '筒': 1, '条': 2, '万': 3 };
                    const aOrder = order[a.type] || 10;
                    const bOrder = order[b.type] || 10;
                    if (aOrder !== bOrder) return aOrder - bOrder;
                    return a.value - b.value;
                });

                this.checkActions();
                this.updateUI();
            }

            checkActions() {
                const hand = this.players[0].hand;
                this.canHu = this.checkHu(hand);
                this.canGang = this.checkGang(hand);
                this.canPeng = this.checkPeng(hand);

                // Show action buttons if available
                const hasAction = this.canHu || this.canGang || this.canPeng;
                if (hasAction) {
                    document.getElementById('huBtn').style.display = this.canHu ? 'flex' : 'none';
                    document.getElementById('gangBtn').style.display = this.canGang ? 'flex' : 'none';
                    document.getElementById('pengBtn').style.display = this.canPeng ? 'flex' : 'none';
                }
            }

            checkHu(hand) {
                // Simplified check - in real game would need complete algorithm
                // For now, allow any 14 tiles (13 + 1 drawn)
                if (hand.length !== 14) return false;

                // Simple seven pairs check
                const counts = {};
                hand.forEach(tile => {
                    counts[tile.display] = (counts[tile.display] || 0) + 1;
                });

                let pairs = 0;
                let triples = 0;
                Object.values(counts).forEach(count => {
                    pairs += Math.floor(count / 2);
                    triples += Math.floor(count / 3);
                });

                return pairs >= 1;
            }

            checkGang(hand) {
                const counts = {};
                hand.forEach(tile => {
                    counts[tile.display] = (counts[tile.display] || 0) + 1;
                });

                return Object.values(counts).some(count => count === 4);
            }

            checkPeng(hand) {
                // Simplified - would need to check against last discarded tile
                return false;
            }

            hu() {
                if (!this.canHu) return;
                alert('🎉 胡了！恭喜你！');
                this.resetGame();
            }

            gang() {
                if (!this.canGang) return;
                alert('杠了！');
                this.nextTurn();
            }

            peng() {
                if (!this.canPeng) return;
                alert('碰了！');
                this.nextTurn();
            }

            guo() {
                this.nextTurn();
            }

            nextTurn() {
                this.currentPlayer = (this.currentPlayer + 1) % this.playerCount;
                this.selectedTile = null;
                this.updateUI();
                this.checkActions();
            }

            selectTile(index) {
                if (this.selectedTile === index) {
                    // Discard selected tile
                    const tile = this.players[0].hand.splice(index, 1)[0];
                    this.discardPiles[0].push(tile);
                    this.nextTurn();
                } else {
                    this.selectedTile = index;
                }
                this.updateUI();
            }

            resetGame() {
                this.gameStarted = false;
                this.players = [];
                this.currentPlayer = 0;
                this.round = 1;
                this.remainingTiles = 0;
                this.discardPiles = [[], [], [], []];
                this.selectedTile = null;
                this.gameOverlay.classList.remove('hidden');
                this.actionBar.style.display = 'none';
                this.tilePool.style.display = 'none';
                this.updateUI();
            }

            undoLastAction() {
                alert('撤销功能开发中...');
            }

            updateUI() {
                // Update turn indicator
                if (this.gameStarted) {
                    const playerNames = ['你', '下家', '对家', '上家'];
                    this.currentPlayerDot.className = `turn-dot player-${this.currentPlayer}`;
                    this.currentPlayerText.textContent = playerNames[this.currentPlayer];
                    this.turnInfo.textContent = playerNames[this.currentPlayer];
                } else {
                    this.currentPlayerText.textContent = '等待开始';
                    this.turnInfo.textContent = '-';
                }

                // Update round info
                this.roundInfo.textContent = `${this.round}/${this.totalRounds}`;
                this.remainingTiles.textContent = this.remainingTiles || this.tileCounts[this.mahjongType].total;

                // Update player list
                this.renderPlayerList();

                // Render hands
                this.renderHands();
            }

            renderPlayerList() {
                const container = this.playerList;
                container.innerHTML = '';

                const positionClass = ['bottom', 'left', 'top', 'right'];

                for (let i = 0; i < this.playerCount; i++) {
                    const player = this.players[i];
                    if (!player) continue;

                    const item = document.createElement('div');
                    item.className = `player-item ${i === this.currentPlayer ? 'active' : ''}`;
                    item.innerHTML = `
                        <div class="player-avatar ${positionClass[i]}">${i === 0 ? '你' : (i + 1)}</div>
                        <div class="player-name">${player.name || this.getPlayerName(i)}</div>
                        <div class="player-score">${player.score}分</div>
                    `;
                    container.appendChild(item);
                }
            }

            renderHands() {
                const positionClass = ['bottom', 'left', 'top', 'right'];
                const positionLabels = ['你', '上家', '对家', '下家'];

                for (let i = 0; i < this.playerCount; i++) {
                    const handContainer = document.getElementById(`playerHand${i}`);
                    const labelEl = document.getElementById(`playerLabel${i}`);
                    if (labelEl) labelEl.textContent = positionLabels[i];

                    handContainer.innerHTML = '';

                    const player = this.players[i];
                    if (!player) {
                        // Render placeholder for empty game
                        for (let j = 0; j < 13; j++) {
                            const tile = document.createElement('div');
                            tile.className = 'mahjong-tile';
                            tile.textContent = '🀄';
                            tile.style.opacity = '0.5';
                            handContainer.appendChild(tile);
                        }
                        continue;
                    }

                    player.hand.forEach((tile, index) => {
                        const tileEl = document.createElement('div');

                        // Check if it's a red tile (Japanese mahjong)
                        const isRedTile = tile.isRed === true;

                        if (i === 0) {
                            // Human player's hand - interactive
                            tileEl.className = `mahjong-tile ${this.selectedTile === index ? 'selected' : ''} ${isRedTile ? 'red' : ''}`;
                            tileEl.textContent = this.getTileDisplay(tile);
                            if (isRedTile) {
                                tileEl.style.background = 'linear-gradient(145deg, #ffcdd2, #e57373)';
                                tileEl.style.borderColor = '#c62828';
                            }
                            tileEl.addEventListener('click', () => this.selectTile(index));
                        } else {
                            // Other players - show backs
                            tileEl.className = 'mahjong-tile';
                            tileEl.textContent = '🀄';
                            tileEl.style.background = 'linear-gradient(145deg, #8B7355, #6B5344)';
                            tileEl.style.borderColor = '#4A3728';
                        }

                        handContainer.appendChild(tileEl);
                    });
                }
            }

            getTileDisplay(tile) {
                // Japanese mahjong red 5
                if (tile.isRed) {
                    return '🀥'; // Red five pin
                }

                const tileMap = {
                    '筒': { 1: '🀙', 2: '🀚', 3: '🀛', 4: '🀜', 5: '🀝', 6: '🀞', 7: '🀟', 8: '🀠', 9: '🀡' },
                    '条': { 1: '🀐', 2: '🀑', 3: '🀒', 4: '🀓', 5: '🀔', 6: '🀕', 7: '🀖', 8: '🀗', 9: '🀘' },
                    '万': { 1: '🀇', 2: '🀈', 3: '🀉', 4: '🀊', 5: '🀋', 6: '🀌', 7: '🀍', 8: '🀎', 9: '🀏' },
                    '东': '🀀', '南': '🀁', '西': '🀂', '北': '🀃',
                    '中': '🀄', '发': '🀅', '白': '🀆'
                };

                if (tileMap[tile.type] && typeof tileMap[tile.type] === 'object') {
                    return tileMap[tile.type][tile.value] || tile.display;
                }
                return tileMap[tile.type] || tile.display;
            }

            updateRules() {
                const rules = this.rules[this.mahjongType] || [];
                this.rulesList.innerHTML = rules.map(rule => `<li>${rule}</li>`).join('');
            }
        }

        // Initialize game
        const game = new MahjongGame();
    </script>
</body>
</html>
