        <div class="stats-bar">

            </div>

            </div>
            <div class="modal-buttons">

    <script>
        // 图标集
        const ICONS = [
            '🍎', '🍊', '🍋', '🍇', '🍓', '🍒',
            '🥝', '🍑', '🥭', '🍍', '🥥', '🥑',
            '🍆', '🥕', '🌽', '🥦', '🍄', '🥜',
            '🌸', '🌺', '🌻', '🌷', '🌹', '💐',
            '⭐', '🌙', '☀️', '🌈', '❄️', '🔥',
            '💎', '🎀', '🎈', '🎁', '🍭', '🍬',
            '🎵', '🎶', '🎤', '🎧', '🎼', '🎹',
            '🐶', '🐱', '🐭', '🐹', '🐰', '🦊',
            '🐻', '🐼', '🐨', '🐯', '🦁', '🐮'
        ];

        // 难度配置
        const LEVELS = {
            easy: { rows: 4, cols: 6, time: 180 },
            medium: { rows: 6, cols: 8, time: 240 },
            hard: { rows: 8, cols: 10, time: 300 }
        };

        let currentLevel = 'easy';
        let board = [];
        let selectedCell = null;
        let score = 0;
        let pairsMatched = 0;
        let totalPairs = 0;
        let timeLeft = 180;
        let timer = null;
        let isProcessing = false;
        let gameOver = false;

        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const remainingEl = document.getElementById('remaining');
        const timeEl = document.getElementById('time');
        const messageEl = document.getElementById('message');
        const gameOverModal = document.getElementById('gameOverModal');
        const modalTitle = document.getElementById('modalTitle');
        const finalScoreEl = document.getElementById('finalScore');
        const finalPairsEl = document.getElementById('finalPairs');

        function init() {
            const level = LEVELS[currentLevel];
            const { rows, cols, time } = level;
            const totalTiles = rows * cols;
            const pairs = totalTiles / 2;

            selectedCell = null;
            score = 0;
            pairsMatched = 0;
            totalPairs = pairs;
            timeLeft = time;
            isProcessing = false;
            gameOver = false;

            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            updateUI();
            hideMessage();
            gameOverModal.classList.remove('show');
            clearPath();

            generateBoard(rows, cols, pairs);
            updateBoardSize(rows + 2, cols + 2);
            startTimer();
        }

        function updateBoardSize(rows, cols) {
            const container = document.querySelector('.game-container');
            const mainArea = document.querySelector('.main-area');

            // 获取可用空间，考虑 padding
            let availableWidth = mainArea.clientWidth || 400;
            let availableHeight = mainArea.clientHeight || 400;

            // 减去 padding
            availableWidth = Math.max(availableWidth - 40, 100);
            availableHeight = Math.max(availableHeight - 40, 100);

            // 计算格子尺寸，留出 gap 的空间
            const gap = 4;
            const totalGapWidth = gap * (cols - 1);
            const totalGapHeight = gap * (rows - 1);

            const cellWidth = (availableWidth - totalGapWidth) / cols;
            const cellHeight = (availableHeight - totalGapHeight) / rows;
            const cellSize = Math.min(cellWidth, cellHeight, 50);
            const finalSize = Math.max(cellSize, 30);

            // 设置容器尺寸
            container.style.width = `${finalSize * cols + gap * (cols - 1) + 20}px`;
            container.style.height = `${finalSize * rows + gap * (rows - 1) + 20}px`;

            // 设置 grid 布局 - 使用固定像素值
            boardEl.style.gridTemplateColumns = `repeat(${cols}, ${finalSize}px)`;
            boardEl.style.gridTemplateRows = `repeat(${rows}, ${finalSize}px)`;
            boardEl.style.gap = `${gap}px`;

            // 更新格子字体大小
            setTimeout(() => {
                document.querySelectorAll('.cell').forEach(cell => {
                    if (!cell.classList.contains('empty')) {
                        cell.style.fontSize = `${finalSize * 0.5}px`;
                    }
                });
            }, 10);
        }

        function generateBoard(rows, cols, pairs) {
            const selectedIcons = ICONS.slice(0, pairs);
            let tiles = [];

            for (let i = 0; i < pairs; i++) {
                const icon = selectedIcons[i];
                tiles.push(icon, icon);
            }

            shuffleArray(tiles);

            board = [];
            for (let row = 0; row < rows + 2; row++) {
                board[row] = [];
                for (let col = 0; col < cols + 2; col++) {
                    if (row === 0 || row === rows + 1 || col === 0 || col === cols + 1) {
                        board[row][col] = null;
                    } else {
                        board[row][col] = tiles[(row - 1) * cols + (col - 1)];
                    }
                }
            }

            renderBoard();
            // 确保 grid 尺寸正确
            const gameRows = rows + 2;
            const gameCols = cols + 2;
            updateBoardSize(gameRows, gameCols);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderBoard() {
            const rows = board.length;
            const cols = board[0].length;

            boardEl.innerHTML = '';

            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = row;
                    cell.dataset.col = col;

                    const value = board[row][col];
                    if (value === null || value === '') {
                        cell.classList.add('empty');
                    } else {
                        cell.textContent = value;
                        cell.addEventListener('click', () => handleCellClick(row, col));
                    }

                    boardEl.appendChild(cell);
                }
            }

            let remaining = 0;
            for (let row = 0; row < rows; row++) {
                for (let col = 0; col < cols; col++) {
                    if (board[row][col]) remaining++;
                }
            }
            remainingEl.textContent = remaining / 2;
        }

        function getCellElement(row, col) {
            return boardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        function handleCellClick(row, col) {
            if (isProcessing || gameOver) return;
            if (!board[row][col]) return;

            const cell = getCellElement(row, col);

            if (selectedCell === null) {
                selectedCell = { row, col };
                cell.classList.add('selected');
            } else if (selectedCell.row === row && selectedCell.col === col) {
                cell.classList.remove('selected');
                selectedCell = null;
            } else if (board[selectedCell.row][selectedCell.col] === board[row][col]) {
                const path = findPath(selectedCell.row, selectedCell.col, row, col);

                if (path) {
                    const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                    prevCell.classList.remove('selected');

                    drawPath(path);

                    isProcessing = true;
                    setTimeout(() => {
                        board[selectedCell.row][selectedCell.col] = null;
                        board[row][col] = null;

                        clearPath();

                        const prevEl = getCellElement(selectedCell.row, selectedCell.col);
                        const currEl = getCellElement(row, col);
                        if (prevEl) prevEl.classList.add('matched');
                        if (currEl) currEl.classList.add('matched');

                        pairsMatched++;
                        score += 100;
                        updateUI();

                        setTimeout(() => {
                            renderBoard();
                            isProcessing = false;
                            selectedCell = null;

                            if (checkWin()) {
                                endGame(true);
                            } else if (!hasValidMoves()) {
                                showMessage('没有可用的连接了!', 'warning');
                                setTimeout(() => shuffleBoard(), 1000);
                            }
                        }, 300);
                    }, 250);
                } else {
                    const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                    prevCell.classList.remove('selected');
                    selectedCell = { row, col };
                    cell.classList.add('selected');
                }
            } else {
                const prevCell = getCellElement(selectedCell.row, selectedCell.col);
                prevCell.classList.remove('selected');
                selectedCell = { row, col };
                cell.classList.add('selected');
            }
        }

        function findPath(r1, c1, r2, c2) {
            const rows = board.length;
            const cols = board[0].length;

            if (canConnectDirect(r1, c1, r2, c2)) {
                return [{ row: r1, col: c1 }, { row: r2, col: c2 }];
            }

            if (canConnectDirect(r1, c1, r1, c2) && canConnectDirect(r1, c2, r2, c2) && isEmpty(r1, c2)) {
                return [{ row: r1, col: c1 }, { row: r1, col: c2 }, { row: r2, col: c2 }];
            }
            if (canConnectDirect(r1, c1, r2, c1) && canConnectDirect(r2, c1, r2, c2) && isEmpty(r2, c1)) {
                return [{ row: r1, col: c1 }, { row: r2, col: c1 }, { row: r2, col: c2 }];
            }

            for (let r = 0; r < rows; r++) {
                if (r === r1 || r === r2) continue;
                if (isEmpty(r, c1) && canConnectDirect(r1, c1, r, c1) &&
                    canConnectDirect(r, c1, r, c2) && canConnectDirect(r, c2, r2, c2) && isEmpty(r, c2)) {
                    return [{ row: r1, col: c1 }, { row: r, col: c1 }, { row: r, col: c2 }, { row: r2, col: c2 }];
                }
            }

            for (let c = 0; c < cols; c++) {
                if (c === c1 || c === c2) continue;
                if (isEmpty(r1, c) && canConnectDirect(r1, c1, r1, c) &&
                    canConnectDirect(r1, c, r2, c) && canConnectDirect(r2, c, r2, c2) && isEmpty(r2, c)) {
                    return [{ row: r1, col: c1 }, { row: r1, col: c }, { row: r2, col: c }, { row: r2, col: c2 }];
                }
            }

            return null;
        }

        function canConnectDirect(r1, c1, r2, c2) {
            if (r1 === r2) {
                const minC = Math.min(c1, c2);
                const maxC = Math.max(c1, c2);
                for (let c = minC + 1; c < maxC; c++) {
                    if (!isEmpty(r1, c)) return false;
                }
                return true;
            } else if (c1 === c2) {
                const minR = Math.min(r1, r2);
                const maxR = Math.max(r1, r2);
                for (let r = minR + 1; r < maxR; r++) {
                    if (!isEmpty(r, c1)) return false;
                }
                return true;
            }
            return false;
        }

        function isEmpty(row, col) {
            return board[row] && (board[row][col] === null || board[row][col] === '');
        }

        function drawPath(path) {
            clearPath();

            for (let i = 0; i < path.length - 1; i++) {
                const p1 = path[i];
                const p2 = path[i + 1];

                const line = document.createElement('div');
                line.className = 'path-line';

                const cell1 = getCellElement(p1.row, p1.col);
                const cell2 = getCellElement(p2.row, p2.col);

                if (!cell1 || !cell2) continue;

                const rect1 = cell1.getBoundingClientRect();
                const rect2 = cell2.getBoundingClientRect();
                const boardRect = boardEl.getBoundingClientRect();

                const x1 = rect1.left - boardRect.left + rect1.width / 2;
                const y1 = rect1.top - boardRect.top + rect1.height / 2;
                const x2 = rect2.left - boardRect.left + rect2.width / 2;
                const y2 = rect2.top - boardRect.top + rect2.height / 2;

                const length = Math.sqrt((x2 - x1) ** 2 + (y2 - y1) ** 2);
                const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;

                line.style.width = `${length}px`;
                line.style.height = '4px';
                line.style.left = `${x1}px`;
                line.style.top = `${y1}px`;
                line.style.transformOrigin = '0 50%';
                line.style.transform = `rotate(${angle}deg)`;

                boardEl.appendChild(line);
            }

            path.forEach(p => {
                const point = document.createElement('div');
                point.className = 'path-point';

                const cell = getCellElement(p.row, p.col);
                if (!cell) return;

                const rect = cell.getBoundingClientRect();
                const boardRect = boardEl.getBoundingClientRect();

                point.style.left = `${rect.left - boardRect.left + rect.width / 2}px`;
                point.style.top = `${rect.top - boardRect.top + rect.height / 2}px`;

                boardEl.appendChild(point);
            });
        }

        function clearPath() {
            boardEl.querySelectorAll('.path-line, .path-point').forEach(el => el.remove());
        }

        function hasValidMoves() {
            const rows = board.length;
            const cols = board[0].length;
            const tiles = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) {
                        tiles.push({ row: r, col: c, value: board[r][c] });
                    }
                }
            }

            for (let i = 0; i < tiles.length; i++) {
                for (let j = i + 1; j < tiles.length; j++) {
                    if (tiles[i].value === tiles[j].value) {
                        if (findPath(tiles[i].row, tiles[i].col, tiles[j].row, tiles[j].col)) {
                            return true;
                        }
                    }
                }
            }
            return false;
        }

        function shuffleBoard() {
            const rows = board.length;
            const cols = board[0].length;
            const tiles = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) {
                        tiles.push(board[r][c]);
                    }
                }
            }

            shuffleArray(tiles);

            let index = 0;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) {
                        board[r][c] = tiles[index++];
                    }
                }
            }

            renderBoard();
            selectedCell = null;
            clearPath();

            if (!hasValidMoves()) {
                setTimeout(() => shuffleBoard(), 300);
            }
        }

        function showHint() {
            if (isProcessing || gameOver) return;

            const rows = board.length;
            const cols = board[0].length;
            const tiles = [];

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) {
                        tiles.push({ row: r, col: c, value: board[r][c] });
                    }
                }
            }

            for (let i = 0; i < tiles.length; i++) {
                for (let j = i + 1; j < tiles.length; j++) {
                    if (tiles[i].value === tiles[j].value) {
                        if (findPath(tiles[i].row, tiles[i].col, tiles[j].row, tiles[j].col)) {
                            const cell1 = getCellElement(tiles[i].row, tiles[i].col);
                            const cell2 = getCellElement(tiles[j].row, tiles[j].col);

                            cell1.classList.add('hint');
                            cell2.classList.add('hint');

                            setTimeout(() => {
                                cell1.classList.remove('hint');
                                cell2.classList.remove('hint');
                            }, 1500);

                            return;
                        }
                    }
                }
            }

            showMessage('没有可用的连接! 正在洗牌...', 'warning');
            setTimeout(() => shuffleBoard(), 1000);
        }

        function checkWin() {
            const rows = board.length;
            const cols = board[0].length;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c]) return false;
                }
            }
            return true;
        }

        function startTimer() {
            timer = setInterval(() => {
                timeLeft--;
                timeEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(timer);
                    endGame(false);
                }
            }, 1000);
        }

        function endGame(win) {
            gameOver = true;
            if (timer) {
                clearInterval(timer);
                timer = null;
            }

            modalTitle.textContent = win ? '恭喜通关!' : '时间到!';
            modalTitle.className = `modal-title ${win ? 'win' : 'lose'}`;

            const finalScore = win ? score + timeLeft * 10 : score;
            finalScoreEl.textContent = finalScore;
            finalPairsEl.textContent = pairsMatched;

            gameOverModal.classList.add('show');
        }

        function updateUI() {
            scoreEl.textContent = score;
            timeEl.textContent = timeLeft;
        }

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = `message show ${type}`;
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, 1800);
        }

        function hideMessage() {
            messageEl.classList.remove('show');
        }

        document.querySelectorAll('.level-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.level-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLevel = btn.dataset.level;
                init();
            });
        });

        document.getElementById('restartBtn').addEventListener('click', init);
        document.getElementById('playAgain').addEventListener('click', init);
        document.getElementById('closeModal').addEventListener('click', () => {
            gameOverModal.classList.remove('show');
        });
        document.getElementById('shuffleBtn').addEventListener('click', shuffleBoard);
        document.getElementById('hintBtn').addEventListener('click', showHint);

        window.addEventListener('resize', () => {
            if (board.length > 0) {
                updateBoardSize(board.length - 2, board[0].length - 2);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (isProcessing || gameOver || !selectedCell) return;

            const { row, col } = selectedCell;
            const rows = board.length;
            const cols = board[0].length;
            let newRow = row, newCol = col;

            switch(e.key) {
                case 'ArrowUp': newRow = Math.max(0, row - 1); break;
                case 'ArrowDown': newRow = Math.min(rows - 1, row + 1); break;
                case 'ArrowLeft': newCol = Math.max(0, col - 1); break;
                case 'ArrowRight': newCol = Math.min(cols - 1, col + 1); break;
                case 'Enter':
                case ' ':
                    const cell = getCellElement(row, col);
                    if (cell) cell.classList.remove('selected');
                    selectedCell = null;
                    return;
                default: return;
            }

            e.preventDefault();

            const prevCell = getCellElement(row, col);
            if (prevCell) prevCell.classList.remove('selected');

            if (board[newRow][newCol]) {
                const newCell = getCellElement(newRow, newCol);
                if (newCell) newCell.classList.add('selected');
                selectedCell = { row: newRow, col: newCol };
            } else {
                selectedCell = { row: newRow, col: newCol };
            }
        });

        init();
    </script>
</body>
</html>
