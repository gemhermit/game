        </div>

        <div style="margin-top: auto; font-size: 13px; color: #64748b; line-height: 1.6;">
            <strong>规则：</strong><br>
            • 点击试管倒水<br>

    <div class="main-area">
        <div class="tubes-container" id="gameBoard">
            <!-- Tubes generated here -->
        </div>

    <div class="toast" id="toast">🎉 完美！</div>

    <script>
        class WaterSortGame {
            constructor() {
                this.boardEl = document.getElementById('gameBoard');
                this.levelDisplay = document.getElementById('levelDisplay');
                this.resetBtn = document.getElementById('resetBtn');
                this.undoBtn = document.getElementById('undoBtn');
                this.addTubeBtn = document.getElementById('addTubeBtn');
                this.nextLevelBtn = document.getElementById('nextLevelBtn');
                this.toast = document.getElementById('toast');

                this.level = 1;
                this.tubes = [];
                this.history = [];
                this.selectedTube = null;
                this.tubeCapacity = 4;
                this.isAnimating = false;

                this.bindEvents();
                this.initLevel();
            }

            bindEvents() {
                this.resetBtn.addEventListener('click', () => this.initLevel());
                this.undoBtn.addEventListener('click', () => this.undo());
                this.addTubeBtn.addEventListener('click', () => this.addEmptyTube());
                this.nextLevelBtn.addEventListener('click', () => {
                    this.level++;
                    this.initLevel();
                });
            }

            initLevel() {
                this.history = [];
                this.selectedTube = null;
                this.isAnimating = false;
                this.levelDisplay.textContent = this.level;
                this.nextLevelBtn.style.display = 'none';
                this.addTubeBtn.disabled = false;

                // Generate level data
                // Level 1: 2 colors, 3 tubes
                // Level 2: 3 colors, 5 tubes
                // Level N: min(N+1, 8) colors, colors+2 tubes
                const numColors = Math.min(this.level + 2, 8);
                const numTubes = numColors + 2;
                
                // Create initial liquid segments
                let liquids = [];
                for(let i=0; i<numColors; i++) {
                    for(let j=0; j<4; j++) liquids.push(i);
                }
                
                // Shuffle
                for(let i = liquids.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [liquids[i], liquids[j]] = [liquids[j], liquids[i]];
                }

                // Distribute to tubes
                this.tubes = [];
                for(let i=0; i<numTubes; i++) {
                    const tube = [];
                    if (i < numColors) {
                        for(let j=0; j<4; j++) {
                            tube.push(liquids.pop());
                        }
                    }
                    this.tubes.push(tube);
                }

                this.render();
            }

            render() {
                this.boardEl.innerHTML = '';
                this.tubes.forEach((tube, idx) => {
                    const tubeEl = document.createElement('div');
                    tubeEl.className = 'tube';
                    if (this.selectedTube === idx) tubeEl.classList.add('selected');
                    
                    tubeEl.onclick = () => this.handleTubeClick(idx);

                    // Render liquids with merging
                    // Group adjacent same colors
                    let currentBottom = 0;
                    
                    if (tube.length > 0) {
                        let currentGroup = { color: tube[0], count: 1 };
                        
                        for (let i = 1; i < tube.length; i++) {
                            if (tube[i] === currentGroup.color) {
                                currentGroup.count++;
                            } else {
                                // Render previous group
                                this.createLiquidElement(tubeEl, currentGroup.color, currentGroup.count, currentBottom);
                                currentBottom += currentGroup.count * 25;
                                // Start new group
                                currentGroup = { color: tube[i], count: 1 };
                            }
                        }
                        // Render last group
                        this.createLiquidElement(tubeEl, currentGroup.color, currentGroup.count, currentBottom);
                    }

                    this.boardEl.appendChild(tubeEl);
                });
            }

            createLiquidElement(container, color, count, bottomPct) {
                const liquidEl = document.createElement('div');
                liquidEl.className = `liquid color-${color}`;
                liquidEl.style.height = (count * 25) + '%';
                liquidEl.style.bottom = bottomPct + '%';
                // Store color data for easy checking later
                liquidEl.dataset.color = color;
                container.appendChild(liquidEl);
            }

            handleTubeClick(idx) {
                if (this.isAnimating) return;

                if (this.selectedTube === null) {
                    // Select source
                    if (this.tubes[idx].length > 0) {
                        this.selectedTube = idx;
                        this.render();
                    }
                } else {
                    if (this.selectedTube === idx) {
                        // Deselect
                        this.selectedTube = null;
                        this.render();
                    } else {
                        // Try move
                        this.tryMove(this.selectedTube, idx);
                    }
                }
            }

            async tryMove(fromIdx, toIdx) {
                if (this.isAnimating) return;

                const fromTube = this.tubes[fromIdx];
                const toTube = this.tubes[toIdx];

                if (toTube.length >= this.tubeCapacity) {
                    // Target full
                    this.shakeTube(toIdx);
                    this.selectedTube = null;
                    this.render();
                    return;
                }

                const colorToMove = fromTube[fromTube.length - 1];

                // Check if move is valid
                // 1. Target empty OR
                // 2. Target top color matches moving color
                if (toTube.length === 0 || toTube[toTube.length - 1] === colorToMove) {
                    
                    // Count how many to move FIRST, considering capacity
                    let moveCount = 0;
                    // Peek at fromTube without modifying it yet
                    // We need to count from the top (end of array)
                    // The items to move are at indices: length-1, length-2, etc.
                    for (let i = fromTube.length - 1; i >= 0; i--) {
                        if (fromTube[i] === colorToMove) {
                            // Check if target has space
                            if (toTube.length + moveCount < this.tubeCapacity) {
                                moveCount++;
                            } else {
                                // Target full, stop counting
                                break;
                            }
                        } else {
                            // Different color, stop counting
                            break;
                        }
                    }
                    
                    if (moveCount > 0) {
                        // Valid move with count > 0
                        this.saveState();
                        
                        // Now actually remove from source
                        for(let i=0; i<moveCount; i++) {
                            fromTube.pop();
                        }

                        // Animate
                        await this.animatePour(fromIdx, toIdx, colorToMove, moveCount);

                        // Update target tube
                        for (let i = 0; i < moveCount; i++) {
                            toTube.push(colorToMove);
                        }

                        this.selectedTube = null;
                        this.render();
                        this.checkWin();
                    } else {
                        // Move valid but no space? Treat as invalid/full
                        this.shakeTube(toIdx);
                        this.selectedTube = null;
                        this.render();
                    }
                } else {
                    // Invalid move
                    this.shakeTube(toIdx);
                    this.selectedTube = null;
                    this.render();
                }
            }

            async animatePour(fromIdx, toIdx, color, count) {
                this.isAnimating = true;

                const fromTubeEl = this.boardEl.children[fromIdx];
                const toTubeEl = this.boardEl.children[toIdx];

                // Calculate positions to determine pour direction
                const fromRect = fromTubeEl.getBoundingClientRect();
                const toRect = toTubeEl.getBoundingClientRect();
                const isRight = toRect.left > fromRect.left;

                // 1. Tilt Animation
                if (isRight) {
                    fromTubeEl.classList.add('pouring-right');
                } else {
                    fromTubeEl.classList.add('pouring');
                }
                toTubeEl.classList.add('pouring-to');

                // Wait for tilt transition to complete (300ms defined in CSS)
                await this.delay(300);

                // 2. Create Stream
                const stream = document.createElement('div');
                stream.className = 'pour-stream';
                stream.style.background = this.getColorValue(color);
                
                // Position stream relative to source tube
                if (isRight) {
                    stream.style.right = '-12px'; // Adjusted for border
                    stream.style.left = 'auto';
                    stream.style.transformOrigin = 'top right';
                    stream.style.transform = 'rotate(-45deg)'; 
                } else {
                    stream.style.left = '-12px';
                    stream.style.transformOrigin = 'top left';
                    stream.style.transform = 'rotate(45deg)'; 
                }
                
                fromTubeEl.appendChild(stream);

                // 3. Calculate Dynamic Height
                // Now that tube is tilted and stream is attached, we can get its screen coordinates
                const streamRect = stream.getBoundingClientRect();
                const targetRect = toTubeEl.getBoundingClientRect();
                
                // Calculate target surface Y position
                // Tube content height is roughly height - bottom border
                // But we use % for liquids. 25% of 240px = 60px.
                // We need to account for border (4px) and radius maybe?
                // Let's rely on the liquids inside.
                const existingLiquids = toTubeEl.querySelectorAll('.liquid').length;
                const liquidUnitHeight = targetRect.height / 4; // Approx
                // Better: get the actual bottom position in screen space
                const targetBottom = targetRect.bottom - 4; // Minus border
                const targetSurfaceY = targetBottom - (existingLiquids * (targetRect.height * 0.25));

                // Distance from spout (stream top) to target surface
                // Stream top is streamRect.top
                let streamHeight = targetSurfaceY - streamRect.top;
                
                // Safety check: if negative or too small, default to something visible
                if (streamHeight < 20) streamHeight = 20;
                
                // Apply height
                stream.style.height = streamHeight + 'px';
                stream.style.opacity = '0.9';
                // Remove the animation class that was overriding height, use transition instead
                stream.style.transition = 'height 0.2s ease-in, opacity 0.2s';
                
                // Force reflow to ensure transition happens
                stream.offsetHeight; 
                
                // 4. Fill Animation
                const pourDuration = 500; // ms per unit
                const step = pourDuration / count;

                // Add splash effect at target surface
                const splash = document.createElement('div');
                splash.className = 'splash';
                splash.style.background = this.getColorValue(color);
                splash.style.bottom = (existingLiquids * 25) + '%';
                toTubeEl.appendChild(splash);

                for (let i = 0; i < count; i++) {
                    await this.addLiquidToTube(toTubeEl, color, step);
                    // Update splash position
                    splash.style.bottom = ((existingLiquids + i + 1) * 25) + '%';
                    
                    // Update stream height as liquid rises
                    // New surface is higher, so height is smaller
                    // One unit is roughly targetRect.height * 0.25
                    const riseAmount = targetRect.height * 0.25;
                    streamHeight -= riseAmount;
                    if (streamHeight < 0) streamHeight = 0;
                    stream.style.height = streamHeight + 'px';
                }

                // Remove splash
                splash.remove();

                // Fade out stream
                stream.style.opacity = '0';
                stream.style.height = '0px';
                await this.delay(200);
                stream.remove();

                // 5. Reset Tubes
                fromTubeEl.classList.remove('pouring');
                fromTubeEl.classList.remove('pouring-right');
                toTubeEl.classList.remove('pouring-to');

                this.isAnimating = false;
            }

            async addLiquidToTube(tubeEl, color, delayMs) {
                await this.delay(delayMs);

                // Find top liquid element
                // Since we append in order, last child that is a liquid is the top one
                // But wait, tubeEl contains 'pour-stream', 'splash', 'bubble' too potentially?
                // Our liquid elements have class 'liquid'.
                
                const liquids = Array.from(tubeEl.querySelectorAll('.liquid'));
                const topLiquid = liquids[liquids.length - 1];
                
                // Check if we can merge
                let canMerge = false;
                if (topLiquid && parseInt(topLiquid.dataset.color) === color) {
                    canMerge = true;
                }
                
                if (canMerge) {
                    // Animate height increase
                    // Current height
                    const currentHeight = parseFloat(topLiquid.style.height);
                    // New height
                    const newHeight = currentHeight + 25;
                    
                    topLiquid.style.height = newHeight + '%';
                } else {
                    // Create new liquid
                    // Calculate bottom position based on previous liquids
                    let bottom = 0;
                    if (topLiquid) {
                        bottom = parseFloat(topLiquid.style.bottom) + parseFloat(topLiquid.style.height);
                    }
                    
                    const newLiquid = document.createElement('div');
                    newLiquid.className = `liquid color-${color}`;
                    newLiquid.dataset.color = color;
                    newLiquid.style.height = '0%';
                    newLiquid.style.bottom = bottom + '%';
                    
                    tubeEl.appendChild(newLiquid);
    
                    // Force reflow
                    newLiquid.offsetHeight;
    
                    // Animate height
                    newLiquid.style.height = '25%';
                }

                // Add bubble
                this.addBubble(tubeEl, color);
            }

            addBubble(tubeEl, color) {
                // Add multiple small bubbles
                for(let i=0; i<3; i++) {
                    setTimeout(() => {
                        const bubble = document.createElement('div');
                        bubble.className = 'bubble';
                        // Random position
                        bubble.style.left = (20 + Math.random() * 60) + '%';
                        bubble.style.width = (4 + Math.random() * 4) + 'px';
                        bubble.style.height = bubble.style.width;
                        tubeEl.appendChild(bubble);
                        setTimeout(() => bubble.remove(), 800);
                    }, i * 100);
                }
            }

            getColorValue(colorIndex) {
                const colors = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#f97316', '#ec4899', '#14b8a6'];
                return colors[colorIndex % colors.length];
            }

            delay(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            shakeTube(idx) {
                const tubeEl = this.boardEl.children[idx];
                tubeEl.style.animation = 'none';
                tubeEl.offsetHeight; // Trigger reflow
                tubeEl.style.animation = 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both';
                setTimeout(() => tubeEl.style.animation = '', 400);
            }

            saveState() {
                // Deep copy
                this.history.push(JSON.parse(JSON.stringify(this.tubes)));
                if (this.history.length > 10) this.history.shift();
            }

            undo() {
                if (this.history.length > 0) {
                    this.tubes = this.history.pop();
                    this.selectedTube = null;
                    this.render();
                }
            }

            addEmptyTube() {
                this.saveState();
                this.tubes.push([]);
                this.addTubeBtn.disabled = true;
                this.render();
            }

            checkWin() {
                // Win if all tubes are either empty or full of same color
                const won = this.tubes.every(tube => {
                    if (tube.length === 0) return true;
                    if (tube.length !== this.tubeCapacity) return false;
                    const firstColor = tube[0];
                    return tube.every(c => c === firstColor);
                });

                if (won) {
                    this.toast.classList.add('show');
                    setTimeout(() => this.toast.classList.remove('show'), 3000);
                    this.nextLevelBtn.style.display = 'block';
                    this.celebrate();
                }
            }
            
            celebrate() {
                // Generate confetti
                const colors = ['#ef4444', '#3b82f6', '#22c55e', '#eab308', '#a855f7'];
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    confetti.style.animationDelay = (Math.random() * 1) + 's';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 4000);
                }
            }
        }

        new WaterSortGame();
    </script>
</body>
</html>
