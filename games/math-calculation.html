<body>

        <div class="game-settings">
            <div class="setting-group">
                <div class="setting-label">运算类型</div>
                <div class="setting-buttons">
                    <div class="setting-btn active" data-operation="+">加法</div>
                    <div class="setting-btn" data-operation="-">减法</div>
                    <div class="setting-btn" data-operation="*">乘法</div>
                    <div class="setting-btn" data-operation="/">除法</div>
                    <div class="setting-btn" data-operation="mixed">混合</div>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">难度等级</div>
                <div class="setting-buttons">
                    <div class="setting-btn active" data-difficulty="easy">简单</div>
                    <div class="setting-btn" data-difficulty="medium">中等</div>
                    <div class="setting-btn" data-difficulty="hard">困难</div>
                </div>
            </div>
            <div class="setting-group">
                <div class="setting-label">练习模式</div>
                <div class="setting-buttons">
                    <div class="setting-btn active" data-mode="endless">无限</div>
                    <div class="setting-btn" data-mode="timed">限时</div>
                    <div class="setting-btn" data-mode="count">定量</div>
                </div>
            </div>
        </div>
        
        <div class="score-panel">
            <div class="score-item">
                得分
                <span class="score-value" id="score">0</span>
            </div>
            <div class="score-item">
                题目数
                <span class="score-value" id="questionCount">0</span>
            </div>
            <div class="score-item">
                正确数
                <span class="score-value" id="correctCount">0</span>
            </div>
            <div class="score-item">
                正确率
                <span class="score-value" id="accuracy">0%</span>
            </div>
        </div>
        
        <div class="timer" id="timer" style="display: none;">时间: 60秒</div>
        
        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        
        <div class="game-area">
            <div class="question-display">
                <div class="question-text" id="questionText">点击开始练习</div>
            </div>
            
            <input type="number" class="answer-input" id="answerInput" placeholder="输入答案" disabled>
            
            <div class="feedback neutral" id="feedback">
                准备好了吗？选择设置后点击开始！
            </div>
            
            <div class="controls">
                <button class="btn btn-primary" id="startBtn">开始练习</button>
                <button class="btn btn-warning" id="pauseBtn" style="display: none;">暂停</button>
                <button class="btn btn-success" id="newGameBtn" style="display: none;">新游戏</button>
            </div>
        </div>
        
        <div class="game-over" id="gameOver" style="display: none;">
            <h3>练习结束！</h3>
            <div class="final-stats">
                <div class="final-stat">
                    总题数
                    <div class="final-stat-value" id="finalQuestions">0</div>
                </div>
                <div class="final-stat">
                    正确数
                    <div class="final-stat-value" id="finalCorrect">0</div>
                </div>
                <div class="final-stat">
                    最终得分
                    <div class="final-stat-value" id="finalScore">0</div>
                </div>
                <div class="final-stat">
                    正确率
                    <div class="final-stat-value" id="finalAccuracy">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class MathCalculationGame {
            constructor() {
                this.operation = '+';
                this.difficulty = 'easy';
                this.mode = 'endless';
                this.isPlaying = false;
                this.isPaused = false;
                
                this.currentQuestion = null;
                this.currentAnswer = null;
                this.score = 0;
                this.questionCount = 0;
                this.correctCount = 0;
                
                this.timeLimit = 60; // 限时模式的时间
                this.questionLimit = 20; // 定量模式的题目数
                this.timeRemaining = this.timeLimit;
                this.timer = null;
                
                this.initElements();
                this.bindEvents();
            }
            
            initElements() {
                this.questionText = document.getElementById('questionText');
                this.answerInput = document.getElementById('answerInput');
                this.feedback = document.getElementById('feedback');
                this.startBtn = document.getElementById('startBtn');
                this.pauseBtn = document.getElementById('pauseBtn');
                this.newGameBtn = document.getElementById('newGameBtn');
                this.timerDisplay = document.getElementById('timer');
                this.progressBar = document.getElementById('progressBar');
                this.progressFill = document.getElementById('progressFill');
                this.gameOver = document.getElementById('gameOver');
                
                this.scoreSpan = document.getElementById('score');
                this.questionCountSpan = document.getElementById('questionCount');
                this.correctCountSpan = document.getElementById('correctCount');
                this.accuracySpan = document.getElementById('accuracy');
            }
            
            bindEvents() {
                // 设置按钮
                document.querySelectorAll('[data-operation]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-operation]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.operation = e.target.dataset.operation;
                    });
                });
                
                document.querySelectorAll('[data-difficulty]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-difficulty]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.difficulty = e.target.dataset.difficulty;
                    });
                });
                
                document.querySelectorAll('[data-mode]').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('[data-mode]').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.mode = e.target.dataset.mode;
                    });
                });
                
                // 游戏控制
                this.startBtn.addEventListener('click', () => this.startGame());
                this.pauseBtn.addEventListener('click', () => this.pauseGame());
                this.newGameBtn.addEventListener('click', () => this.newGame());
                
                // 答案输入
                this.answerInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.checkAnswer();
                    }
                });
                
                this.answerInput.addEventListener('input', () => {
                    this.answerInput.classList.remove('correct', 'wrong');
                });
            }
            
            startGame() {
                this.isPlaying = true;
                this.isPaused = false;
                this.score = 0;
                this.questionCount = 0;
                this.correctCount = 0;
                this.timeRemaining = this.timeLimit;
                
                this.startBtn.style.display = 'none';
                this.pauseBtn.style.display = 'inline-block';
                this.newGameBtn.style.display = 'inline-block';
                this.gameOver.style.display = 'none';
                
                this.answerInput.disabled = false;
                
                if (this.mode === 'timed') {
                    this.timerDisplay.style.display = 'block';
                    this.startTimer();
                } else if (this.mode === 'count') {
                    this.progressBar.style.display = 'block';
                }
                
                this.generateQuestion();
                this.updateStats();
            }
            
            pauseGame() {
                if (this.isPaused) {
                    this.isPaused = false;
                    this.pauseBtn.textContent = '暂停';
                    this.answerInput.disabled = false;
                    if (this.mode === 'timed') {
                        this.startTimer();
                    }
                } else {
                    this.isPaused = true;
                    this.pauseBtn.textContent = '继续';
                    this.answerInput.disabled = true;
                    if (this.timer) {
                        clearInterval(this.timer);
                    }
                }
            }
            
            newGame() {
                this.isPlaying = false;
                this.isPaused = false;
                
                if (this.timer) {
                    clearInterval(this.timer);
                }
                
                this.startBtn.style.display = 'inline-block';
                this.pauseBtn.style.display = 'none';
                this.newGameBtn.style.display = 'none';
                this.timerDisplay.style.display = 'none';
                this.progressBar.style.display = 'none';
                this.gameOver.style.display = 'none';
                
                this.questionText.textContent = '点击开始练习';
                this.answerInput.value = '';
                this.answerInput.disabled = true;
                this.answerInput.classList.remove('correct', 'wrong');
                this.feedback.textContent = '准备好了吗？选择设置后点击开始！';
                this.feedback.className = 'feedback neutral';
                
                this.score = 0;
                this.questionCount = 0;
                this.correctCount = 0;
                this.updateStats();
            }
            
            startTimer() {
                this.timer = setInterval(() => {
                    this.timeRemaining--;
                    this.timerDisplay.textContent = `时间: ${this.timeRemaining}秒`;
                    
                    if (this.timeRemaining <= 0) {
                        this.endGame();
                    }
                }, 1000);
            }
            
            generateQuestion() {
                if (!this.isPlaying || this.isPaused) return;
                
                let num1, num2, operation, answer;
                
                // 根据难度设置数字范围
                let range;
                switch (this.difficulty) {
                    case 'easy':
                        range = { min: 1, max: 20 };
                        break;
                    case 'medium':
                        range = { min: 10, max: 100 };
                        break;
                    case 'hard':
                        range = { min: 50, max: 500 };
                        break;
                }
                
                // 选择运算类型
                if (this.operation === 'mixed') {
                    const operations = ['+', '-', '*', '/'];
                    operation = operations[Math.floor(Math.random() * operations.length)];
                } else {
                    operation = this.operation;
                }
                
                // 生成数字和答案
                switch (operation) {
                    case '+':
                        num1 = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                        num2 = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                        answer = num1 + num2;
                        break;
                    case '-':
                        num1 = Math.floor(Math.random() * (range.max - range.min + 1)) + range.min;
                        num2 = Math.floor(Math.random() * (num1 - range.min + 1)) + range.min;
                        answer = num1 - num2;
                        break;
                    case '*':
                        const maxMult = this.difficulty === 'easy' ? 10 : this.difficulty === 'medium' ? 15 : 20;
                        num1 = Math.floor(Math.random() * maxMult) + 1;
                        num2 = Math.floor(Math.random() * maxMult) + 1;
                        answer = num1 * num2;
                        break;
                    case '/':
                        const maxDiv = this.difficulty === 'easy' ? 10 : this.difficulty === 'medium' ? 15 : 20;
                        num2 = Math.floor(Math.random() * maxDiv) + 1;
                        answer = Math.floor(Math.random() * maxDiv) + 1;
                        num1 = num2 * answer;
                        break;
                }
                
                this.currentQuestion = { num1, num2, operation };
                this.currentAnswer = answer;
                
                this.questionText.textContent = `${num1} ${operation} ${num2} = ?`;
                this.answerInput.value = '';
                this.answerInput.focus();
            }
            
            checkAnswer() {
                if (!this.isPlaying || this.isPaused) return;
                
                const userAnswer = parseInt(this.answerInput.value);
                
                if (isNaN(userAnswer)) {
                    this.feedback.textContent = '请输入一个有效的数字！';
                    this.feedback.className = 'feedback wrong';
                    return;
                }
                
                this.questionCount++;
                
                if (userAnswer === this.currentAnswer) {
                    this.correctCount++;
                    this.score += this.getPoints();
                    this.answerInput.classList.add('correct');
                    this.feedback.textContent = '正确！很棒！';
                    this.feedback.className = 'feedback correct';
                } else {
                    this.answerInput.classList.add('wrong');
                    this.feedback.textContent = `错误！正确答案是 ${this.currentAnswer}`;
                    this.feedback.className = 'feedback wrong';
                }
                
                this.updateStats();
                
                // 检查游戏结束条件
                if (this.mode === 'count' && this.questionCount >= this.questionLimit) {
                    setTimeout(() => this.endGame(), 1500);
                } else {
                    setTimeout(() => this.generateQuestion(), 1500);
                }
            }
            
            getPoints() {
                let points = 10;
                if (this.difficulty === 'medium') points = 15;
                if (this.difficulty === 'hard') points = 20;
                if (this.currentQuestion.operation === '*' || this.currentQuestion.operation === '/') {
                    points += 5;
                }
                return points;
            }
            
            updateStats() {
                this.scoreSpan.textContent = this.score;
                this.questionCountSpan.textContent = this.questionCount;
                this.correctCountSpan.textContent = this.correctCount;
                
                const accuracy = this.questionCount > 0 ? 
                    Math.round((this.correctCount / this.questionCount) * 100) : 0;
                this.accuracySpan.textContent = accuracy + '%';
                
                if (this.mode === 'count') {
                    const progress = (this.questionCount / this.questionLimit) * 100;
                    this.progressFill.style.width = progress + '%';
                }
            }
            
            endGame() {
                this.isPlaying = false;
                
                if (this.timer) {
                    clearInterval(this.timer);
                }
                
                this.answerInput.disabled = true;
                this.pauseBtn.style.display = 'none';
                
                // 显示最终结果
                document.getElementById('finalQuestions').textContent = this.questionCount;
                document.getElementById('finalCorrect').textContent = this.correctCount;
                document.getElementById('finalScore').textContent = this.score;
                const finalAccuracy = this.questionCount > 0 ? 
                    Math.round((this.correctCount / this.questionCount) * 100) : 0;
                document.getElementById('finalAccuracy').textContent = finalAccuracy + '%';
                
                this.gameOver.style.display = 'block';
            }
        }
        
        // 启动游戏
        new MathCalculationGame();
    </script>
