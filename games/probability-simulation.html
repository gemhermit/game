<style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary-color: #64748b;
            --accent-color: #f59e0b;
            --danger-color: #ef4444;
            --success-color: #22c55e;
            --bg-color: #f8fafc;
            --panel-bg: #ffffff;
            --border-color: #e2e8f0;
            --text-color: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 360px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px;
            overflow-y: auto;
            z-index: 10;
        }

        .header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
        }

        /* Experiment Selector */
        .experiment-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .experiment-btn {
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .experiment-btn:hover {
            background: #f1f5f9;
            border-color: var(--primary-color);
        }

        .experiment-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .experiment-btn .icon {
            font-size: 18px;
        }

        /* Stats Panel */
        .stats-panel {
            background: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .stats-title {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            background: white;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'SF Mono', 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 16px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 16px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--text-color);
        }
        .btn-secondary:hover { background: #f1f5f9; }

        .btn-accent {
            background: var(--accent-color);
            color: white;
        }
        .btn-accent:hover { filter: brightness(0.9); }

        /* Settings */
        .settings-row {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .setting-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-label {
            font-size: 16px;
            font-weight: 500;
            color: #475569;
        }

        .setting-input {
            padding: 10px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            width: 100px;
            text-align: center;
        }

        .setting-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Results Panel in Sidebar */
        .results-panel {
            margin-top: auto;
        }

        .results-title {
            font-size: 14px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 12px;
        }

        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: #f8fafc;
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .result-label {
            font-size: 13px;
            font-weight: 500;
        }

        .result-bar {
            flex: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin: 0 12px;
            overflow: hidden;
        }

        .result-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .result-count {
            font-size: 12px;
            color: #64748b;
            min-width: 60px;
            text-align: right;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            padding: 20px;
            position: relative;
        }

        .simulation-area {
            background: white;
            padding: 60px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 600px;
            border: 1px solid var(--border-color);
        }

        .simulation-title {
            font-size: 28px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 40px;
        }

        /* Coin */
        .coin-container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }

        .coin {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.8em;
            font-weight: bold;
            color: #8B4513;
            cursor: pointer;
            transition: transform 0.6s ease;
            user-select: none;
            border: 2px solid #cc9900;
        }

        .coin.flipping {
            animation: coinFlip 0.8s ease-in-out;
        }

        @keyframes coinFlip {
            0% { transform: rotateY(0deg); }
            50% { transform: rotateY(900deg); }
            100% { transform: rotateY(1800deg); }
        }

        /* Dice */
        .dice-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 40px;
        }

        .dice {
            width: 110px;
            height: 110px;
            background: white;
            border-radius: 16px;
            border: 1px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #333;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .dice.rolling {
            animation: diceRoll 0.6s ease-in-out;
        }

        @keyframes diceRoll {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(90deg) scale(1.1); }
            50% { transform: rotate(180deg) scale(1.2); }
            75% { transform: rotate(270deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Wheel */
        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 40px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(#ff6b6b 0deg 60deg, #4ecdc4 60deg 120deg, #45b7d1 120deg 180deg, #96ceb4 180deg 240deg, #ffeaa7 240deg 300deg, #dda0dd 300deg 360deg);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            position: relative;
            border: 3px solid #e2e8f0;
        }

        .wheel.spinning {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-top: 40px solid #e74c3c;
            z-index: 10;
        }

        .wheel-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            z-index: 5;
            border: 2px solid #e2e8f0;
        }

        .wheel-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
        }

        .wheel-legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .wheel-legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        /* Color Grid */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .color-box {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.6em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .color-box:hover {
            transform: scale(1.1);
        }

        .color-box.selected {
            box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--primary-color);
            transform: scale(1.1);
        }

        /* Law Demo */
        .law-demo {
            width: 100%;
            margin-bottom: 40px;
        }

        .law-bar-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .law-bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
            color: #64748b;
        }

        .law-bar {
            height: 40px;
            background: #e2e8f0;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
        }

        .law-bar-fill {
            height: 100%;
            border-radius: 20px;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 16px;
            color: white;
            font-size: 16px;
            font-weight: 600;
        }

        .law-error {
            text-align: center;
            font-size: 16px;
            color: #64748b;
            margin-bottom: 24px;
        }

        .law-error strong {
            color: var(--primary-color);
        }

        .auto-run-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .auto-btn {
            padding: 12px 20px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .auto-btn:hover {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* Custom Prob */
        .prob-inputs {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 40px;
            width: 100%;
        }

        .prob-input-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .prob-input-group input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
        }

        .prob-input-group .item-input {
            flex: 1;
        }

        .prob-input-group .weight-input {
            width: 80px;
            text-align: center;
        }

        /* Experiment Panels */
        .experiment-panel {
            display: none;
        }

        .experiment-panel.active {
            display: block;
        }

        /* History */
        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-height: 100px;
            overflow-y: auto;
            padding: 10px;
            background: #f8fafc;
            border-radius: 8px;
            margin-top: 20px;
        }

        .history-item {
            padding: 4px 10px;
            background: white;
            border-radius: 12px;
            font-size: 12px;
            color: #64748b;
            border: 1px solid var(--border-color);
        }

        /* Chart */
        .chart-area {
            width: 100%;
            margin-top: 24px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 12px;
        }

        .chart-canvas {
            width: 100%;
            height: 200px;
        }

        @media (max-width: 1024px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 16px;
            }
            .main-content {
                padding: 16px;
            }
            .simulation-area {
                min-width: auto;
                width: 100%;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="header">
            <h1>概率模拟实验室</h1>
            <div class="subtitle">探索概率的奥秘</div>
        </div>

        <div class="experiment-selector">
            <button class="experiment-btn active" data-experiment="coin">
                <span class="icon">🪙</span> 硬币抛掷
            </button>
            <button class="experiment-btn" data-experiment="dice">
                <span class="icon">🎲</span> 掷骰子
            </button>
            <button class="experiment-btn" data-experiment="wheel">
                <span class="icon">🎡</span> 幸运转盘
            </button>
            <button class="experiment-btn" data-experiment="color">
                <span class="icon">🎨</span> 颜色抽奖
            </button>
            <button class="experiment-btn" data-experiment="law">
                <span class="icon">📈</span> 大数定律
            </button>
            <button class="experiment-btn" data-experiment="custom">
                <span class="icon">⚙️</span> 自定义概率
            </button>
        </div>

        <div class="stats-panel">
            <div class="stats-title">📊 实验统计</div>
            <div class="stats-grid" id="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">总次数</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
            </div>
        </div>

        <div class="settings-row" id="sidebar-settings"></div>

        <div class="action-buttons" id="sidebar-actions"></div>

        <div class="results-panel" id="results-panel">
            <div class="results-title">📈 结果分布</div>
            <div id="results-list"></div>
        </div>
    </aside>

    <main class="main-content">
        <div class="simulation-area">
            <!-- 硬币抛掷 -->
            <div class="experiment-panel active" id="coin-panel">
                <div class="simulation-title">🪙 硬币抛掷</div>
                <div class="coin-container" id="coin-container">
                    <div class="coin" id="coin">正</div>
                </div>
                <div class="settings-row">
                    <div class="setting-item">
                        <span class="setting-label">硬币数量</span>
                        <input type="number" class="setting-input" id="coin-count" min="1" max="10" value="1">
                    </div>
                </div>
                <button class="btn btn-primary" id="flip-coin" style="width: 100%;">抛掷硬币</button>
                <div class="history-list" id="coin-history"></div>
            </div>

            <!-- 掷骰子 -->
            <div class="experiment-panel" id="dice-panel">
                <div class="simulation-title">🎲 掷骰子</div>
                <div class="dice-container" id="dice-container"></div>
                <div class="settings-row">
                    <div class="setting-item">
                        <span class="setting-label">骰子数量</span>
                        <input type="number" class="setting-input" id="dice-count" min="1" max="6" value="1">
                    </div>
                </div>
                <button class="btn btn-primary" id="roll-dice" style="width: 100%;">掷骰子</button>
                <div class="history-list" id="dice-history"></div>
            </div>

            <!-- 幸运转盘 -->
            <div class="experiment-panel" id="wheel-panel">
                <div class="simulation-title">🎡 幸运转盘</div>
                <div class="wheel-container">
                    <div class="wheel-pointer"></div>
                    <div class="wheel" id="wheel"></div>
                    <div class="wheel-center" id="wheel-result">?</div>
                </div>
                <div class="wheel-legend" id="wheel-legend"></div>
                <button class="btn btn-primary" id="spin-wheel" style="width: 100%;">旋转转盘</button>
            </div>

            <!-- 颜色抽奖 -->
            <div class="experiment-panel" id="color-panel">
                <div class="simulation-title">🎨 颜色抽奖</div>
                <div class="color-grid" id="color-grid"></div>
                <button class="btn btn-primary" id="draw-color" style="width: 100%;">抽取颜色</button>
            </div>

            <!-- 大数定律 -->
            <div class="experiment-panel" id="law-panel">
                <div class="simulation-title">📈 大数定律演示</div>
                <div class="law-demo">
                    <div class="law-bar-container">
                        <div class="law-bar-label">
                            <span>正面概率</span>
                            <span id="law-actual">0%</span>
                        </div>
                        <div class="law-bar">
                            <div class="law-bar-fill" id="law-bar-fill" style="width: 0%; background: linear-gradient(90deg, #667eea, #764ba2);">0%</div>
                        </div>
                    </div>
                    <div class="law-bar-label">
                        <span>理论概率</span>
                        <span>50%</span>
                    </div>
                    <div class="law-error">
                        实验次数: <strong id="law-count">0</strong> | 误差: <strong id="law-error">0%</strong>
                    </div>
                </div>
                <div class="auto-run-controls">
                    <button class="auto-btn" id="law-single">单次</button>
                    <button class="auto-btn" id="law-10">+10</button>
                    <button class="auto-btn" id="law-100">+100</button>
                    <button class="auto-btn" id="law-1000">+1000</button>
                    <button class="auto-btn" id="law-reset">重置</button>
                </div>
                <div class="chart-area">
                    <canvas id="law-chart" class="chart-canvas"></canvas>
                </div>
            </div>

            <!-- 自定义概率 -->
            <div class="experiment-panel" id="custom-panel">
                <div class="simulation-title">⚙️ 自定义概率</div>
                <div class="prob-inputs" id="prob-inputs"></div>
                <button class="btn btn-primary" id="custom-draw" style="width: 100%;">抽取</button>
            </div>
        </div>
    </main>

    <script>
        // 全局状态
        const state = {
            coin: { heads: 0, tails: 0, history: [] },
            dice: {},
            wheel: {},
            color: {},
            law: { heads: 0, total: 0, history: [] },
            custom: { results: {}, history: [], items: ['A', 'B', 'C'], weights: [1, 1, 1] }
        };

        // 颜色选项
        const colors = [
            { name: '红', value: '#ff6b6b' },
            { name: '蓝', value: '#4ecdc4' },
            { name: '绿', value: '#45b7d1' },
            { name: '黄', value: '#96ceb4' },
            { name: '紫', value: '#dda0dd' },
            { name: '橙', value: '#ffeaa7' },
            { name: '粉', value: '#fd79a8' },
            { name: '棕', value: '#a29bfe' }
        ];

        // 转盘选项
        const wheelOptions = [
            { name: '一等奖', weight: 1 },
            { name: '二等奖', weight: 2 },
            { name: '三等奖', weight: 3 },
            { name: '四等奖', weight: 4 },
            { name: '五等奖', weight: 5 },
            { name: '六等奖', weight: 6 }
        ];
        let currentWheelRotation = 0;

        // 计算总权重
        function getTotalWeight() {
            return wheelOptions.reduce((sum, opt) => sum + opt.weight, 0);
        }

        // 生成转盘渐变
        function generateWheelGradient() {
            const totalWeight = getTotalWeight();
            let currentAngle = 0;
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dda0dd'];
            let gradient = '';

            wheelOptions.forEach((opt, idx) => {
                const angle = (opt.weight / totalWeight) * 360;
                const endAngle = currentAngle + angle;
                gradient += `${colors[idx]} ${currentAngle}deg ${endAngle}deg, `;
                currentAngle = endAngle;
            });

            return gradient.slice(0, -2);
        }

        // 生成转盘图例
        function generateWheelLegend() {
            const totalWeight = getTotalWeight();
            const legendContainer = document.getElementById('wheel-legend');
            legendContainer.innerHTML = '';
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#ffeaa7', '#dda0dd'];

            wheelOptions.forEach((opt, idx) => {
                const probability = ((opt.weight / totalWeight) * 100).toFixed(1);
                const item = document.createElement('div');
                item.className = 'wheel-legend-item';
                item.innerHTML = `
                    <div class="wheel-legend-color" style="background: ${colors[idx]}"></div>
                    <span>${opt.name} (${probability}%)</span>
                `;
                legendContainer.appendChild(item);
            });
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            initExperimentButtons();
            initDiceResults();
            initWheelResults();
            initColorGrid();
            initCustomProb();
            initLawChart();
            updateCoinCount();
        });

        // 实验选择器
        function initExperimentButtons() {
            const buttons = document.querySelectorAll('.experiment-btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => {
                    buttons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const experiment = btn.dataset.experiment;
                    document.querySelectorAll('.experiment-panel').forEach(panel => {
                        panel.classList.remove('active');
                    });
                    document.getElementById(`${experiment}-panel`).classList.add('active');
                    updateStatsPanel(experiment);
                });
            });
        }

        function updateStatsPanel(experiment) {
            const statsGrid = document.getElementById('stats-grid');
            const total = Object.values(state[experiment] || {}).reduce((a, b) => a + (typeof b === 'number' ? b : 0), 0);
            statsGrid.innerHTML = `
                <div class="stat-item">
                    <span class="stat-label">总次数</span>
                    <span class="stat-value" id="stat-total">${total}</span>
                </div>
            `;
            renderResults(experiment);
        }

        function renderResults(experiment) {
            const container = document.getElementById('results-list');
            container.innerHTML = '';

            let data, labels;
            switch(experiment) {
                case 'coin':
                    data = { '正面': state.coin.heads, '反面': state.coin.tails };
                    break;
                case 'dice':
                    data = {};
                    for (let i = 1; i <= 6; i++) data[i] = state.dice[i] || 0;
                    break;
                case 'wheel':
                    data = {};
                    wheelOptions.forEach(opt => data[opt.name] = state.wheel[opt.name] || 0);
                    break;
                case 'color':
                    data = {};
                    colors.forEach(c => data[c.name] = state.color[c.name] || 0);
                    break;
                case 'custom':
                    data = {};
                    state.custom.items.forEach(item => data[item] = state.custom.results[item] || 0);
                    break;
                case 'law':
                    data = { '正面': state.law.heads, '反面': state.law.total - state.law.heads };
                    break;
                default:
                    return;
            }

            const total = Object.values(data).reduce((a, b) => a + b, 0);

            Object.entries(data).forEach(([label, count], idx) => {
                const percent = total > 0 ? (count / total * 100) : 0;
                const hue = idx * 60;
                const item = document.createElement('div');
                item.className = 'result-item';
                item.innerHTML = `
                    <span class="result-label">${label}</span>
                    <div class="result-bar">
                        <div class="result-bar-fill" style="width: ${percent}%; background: linear-gradient(90deg, hsl(${hue}, 70%, 60%), hsl(${hue}, 70%, 40%));"></div>
                    </div>
                    <span class="result-count">${count} (${percent.toFixed(1)}%)</span>
                `;
                container.appendChild(item);
            });
        }

        // 硬币相关
        document.getElementById('flip-coin').addEventListener('click', flipCoin);
        document.getElementById('coin-count').addEventListener('change', updateCoinCount);

        function updateCoinCount() {
            const count = parseInt(document.getElementById('coin-count').value) || 1;
            const container = document.getElementById('coin-container');
            container.innerHTML = '';
            for (let i = 0; i < Math.min(count, 10); i++) {
                const coin = document.createElement('div');
                coin.className = 'coin';
                coin.textContent = '正';
                coin.id = `coin-${i}`;
                container.appendChild(coin);
            }
        }

        function flipCoin() {
            const count = Math.min(parseInt(document.getElementById('coin-count').value) || 1, 10);
            const results = [];

            document.querySelectorAll('.coin').forEach(coin => {
                coin.classList.remove('flipping');
                void coin.offsetWidth; // 强制重排
                coin.classList.add('flipping');
                setTimeout(() => {
                    const isHeads = Math.random() < 0.5;
                    coin.textContent = isHeads ? '正' : '反';
                    coin.style.background = isHeads ?
                        'linear-gradient(145deg, #ffd700, #ffaa00)' :
                        'linear-gradient(145deg, #c0c0c0, #a0a0a0)';
                    results.push(isHeads ? 'heads' : 'tails');
                    coin.classList.remove('flipping');
                    if (results.length === count) {
                        processCoinResults(results);
                    }
                }, 800);
            });
        }

        function processCoinResults(results) {
            results.forEach(result => {
                if (result === 'heads') state.coin.heads++;
                else state.coin.tails++;
            });
            state.coin.history.push(...results);

            const total = state.coin.heads + state.coin.tails;
            document.getElementById('stat-total').textContent = total;
            renderResults('coin');

            const historyEl = document.getElementById('coin-history');
            const historyItem = document.createElement('span');
            historyItem.className = 'history-item';
            historyItem.textContent = results.map(r => r === 'heads' ? '正' : '反').join('+');
            historyEl.insertBefore(historyItem, historyEl.firstChild);
            if (historyEl.children.length > 30) historyEl.removeChild(historyEl.lastChild);
        }

        // 骰子相关
        document.getElementById('roll-dice').addEventListener('click', rollDice);
        document.getElementById('dice-count').addEventListener('change', updateDiceCount);

        function initDiceResults() {
            for (let i = 1; i <= 6; i++) state.dice[i] = 0;
            updateDiceCount();
        }

        function updateDiceCount() {
            const container = document.getElementById('dice-container');
            container.innerHTML = '';
            const count = parseInt(document.getElementById('dice-count').value) || 1;
            for (let i = 0; i < Math.min(count, 6); i++) {
                const dice = document.createElement('div');
                dice.className = 'dice';
                dice.textContent = '?';
                dice.id = `dice-${i}`;
                container.appendChild(dice);
            }
        }

        function rollDice() {
            const count = Math.min(parseInt(document.getElementById('dice-count').value) || 1, 6);
            const results = [];

            document.querySelectorAll('.dice').forEach(dice => {
                dice.classList.remove('rolling');
                void dice.offsetWidth;
                dice.classList.add('rolling');
                setTimeout(() => {
                    const value = Math.floor(Math.random() * 6) + 1;
                    dice.textContent = value;
                    results.push(value);
                    dice.classList.remove('rolling');
                    if (results.length === count) {
                        processDiceResults(results);
                    }
                }, 600);
            });
        }

        function processDiceResults(results) {
            results.forEach(value => state.dice[value] = (state.dice[value] || 0) + 1);

            const total = Object.values(state.dice).reduce((a, b) => a + b, 0);
            document.getElementById('stat-total').textContent = total;
            renderResults('dice');

            const historyEl = document.getElementById('dice-history');
            const historyItem = document.createElement('span');
            historyItem.className = 'history-item';
            historyItem.textContent = results.join('+') + '=' + results.reduce((a, b) => a + b, 0);
            historyEl.insertBefore(historyItem, historyEl.firstChild);
            if (historyEl.children.length > 30) historyEl.removeChild(historyEl.lastChild);
        }

        // 转盘相关
        document.getElementById('spin-wheel').addEventListener('click', spinWheel);

        function initWheelResults() {
            wheelOptions.forEach(opt => state.wheel[opt.name] = 0);
            // 设置转盘渐变
            const wheel = document.getElementById('wheel');
            wheel.style.background = `conic-gradient(${generateWheelGradient()})`;
            // 生成图例
            generateWheelLegend();
        }

        let isWheelSpinning = false;

        function spinWheel() {
            if (isWheelSpinning) return;
            
            const wheel = document.getElementById('wheel');
            const resultEl = document.getElementById('wheel-result');
            const spinBtn = document.getElementById('spin-wheel');

            isWheelSpinning = true;
            spinBtn.disabled = true;
            spinBtn.textContent = '旋转中...';
            resultEl.textContent = '?';

            wheel.classList.remove('spinning');
            
            // 根据权重随机选择
            const totalWeight = getTotalWeight();
            let random = Math.random() * totalWeight;
            let selectedIdx = 0;
            for (let i = 0; i < wheelOptions.length; i++) {
                random -= wheelOptions[i].weight;
                if (random <= 0) {
                    selectedIdx = i;
                    break;
                }
            }

            // 计算每个奖项的起始角度和中心角度
            let angleRanges = [];
            let startAngle = 0;
            for (let i = 0; i < wheelOptions.length; i++) {
                const angle = (wheelOptions[i].weight / totalWeight) * 360;
                const centerAngle = startAngle + angle / 2;
                angleRanges.push({ start: startAngle, center: centerAngle, end: startAngle + angle });
                startAngle += angle;
            }

            // 选中奖项的中心角度
            const targetCenterAngle = angleRanges[selectedIdx].center;

            // 让选中区域的中心对准指针(0度)
            // 计算当前实际角度 (0-360)
            const actualRotation = currentWheelRotation % 360;
            
            // 计算目标角度 (0-360): 我们希望 targetCenterAngle 转到 0 度位置
            // 需要旋转的角度 = 360 - targetCenterAngle
            const desiredRotation = (360 - targetCenterAngle) % 360;
            
            // 计算需要增加的角度 delta
            let delta = desiredRotation - actualRotation;
            if (delta < 0) delta += 360;
            
            // 增加额外的旋转圈数 (5-8圈)
            const extraRotations = 5 + Math.floor(Math.random() * 4);
            const totalRotation = currentWheelRotation + (extraRotations * 360) + delta;

            wheel.style.transform = `rotate(${totalRotation}deg)`;
            wheel.classList.add('spinning');
            currentWheelRotation = totalRotation;

            setTimeout(() => {
                resultEl.textContent = wheelOptions[selectedIdx].name;
                state.wheel[wheelOptions[selectedIdx].name]++;
                const total = Object.values(state.wheel).reduce((a, b) => a + b, 0);
                document.getElementById('stat-total').textContent = total;
                renderResults('wheel');
                
                isWheelSpinning = false;
                spinBtn.disabled = false;
                spinBtn.textContent = '旋转转盘';
            }, 4000);
        }

        // 颜色抽奖
        function initColorGrid() {
            const grid = document.getElementById('color-grid');
            grid.innerHTML = '';
            colors.forEach((color, idx) => {
                const box = document.createElement('div');
                box.className = 'color-box';
                box.style.background = color.value;
                box.textContent = color.name;
                box.dataset.index = idx;
                grid.appendChild(box);
            });
        }

        document.getElementById('draw-color').addEventListener('click', drawColor);

        function drawColor() {
            const idx = Math.floor(Math.random() * colors.length);
            const box = document.querySelectorAll('.color-box')[idx];

            box.classList.add('selected');
            setTimeout(() => box.classList.remove('selected'), 500);

            state.color[colors[idx].name] = (state.color[colors[idx].name] || 0) + 1;

            const total = Object.values(state.color).reduce((a, b) => a + b, 0);
            document.getElementById('stat-total').textContent = total;
            renderResults('color');
        }

        // 大数定律
        let lawChart = null;

        function initLawChart() {
            const canvas = document.getElementById('law-chart');
            canvas.width = canvas.offsetWidth * 2;
            canvas.height = canvas.offsetHeight * 2;
            drawLawChart();
        }

        function drawLawChart() {
            const canvas = document.getElementById('law-chart');
            const ctx = canvas.getContext('2d');
            const width = canvas.offsetWidth;
            const height = canvas.offsetHeight;

            ctx.clearRect(0, 0, width, height);

            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const y = (height / 10) * i;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            if (state.law.history.length > 0) {
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 2;
                ctx.beginPath();

                const stepX = width / Math.max(state.law.history.length, 100);
                state.law.history.forEach((ratio, idx) => {
                    const x = (idx + 1) * stepX;
                    const y = height - (ratio / 100) * height;
                    if (idx === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.stroke();
            }

            ctx.strokeStyle = '#ef4444';
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(0, height / 2);
            ctx.lineTo(width, height / 2);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function updateLawDisplay() {
            const total = state.law.total;
            const headsPercent = total > 0 ? (state.law.heads / total * 100) : 0;
            const error = total > 0 ? Math.abs(headsPercent - 50).toFixed(2) : 0;

            document.getElementById('law-count').textContent = total;
            document.getElementById('law-actual').textContent = headsPercent.toFixed(1) + '%';
            document.getElementById('law-error').textContent = error + '%';
            document.getElementById('law-bar-fill').style.width = headsPercent + '%';
            document.getElementById('law-bar-fill').textContent = headsPercent.toFixed(1) + '%';

            document.getElementById('stat-total').textContent = total;
            renderResults('law');
        }

        document.getElementById('law-single').addEventListener('click', () => {
            const isHeads = Math.random() < 0.5;
            state.law.total++;
            if (isHeads) state.law.heads++;
            state.law.history.push(state.law.heads / state.law.total * 100);
            updateLawDisplay();
            drawLawChart();
        });

        document.getElementById('law-10').addEventListener('click', () => {
            for (let i = 0; i < 10; i++) {
                const isHeads = Math.random() < 0.5;
                state.law.total++;
                if (isHeads) state.law.heads++;
            }
            state.law.history.push(state.law.heads / state.law.total * 100);
            updateLawDisplay();
            drawLawChart();
        });

        document.getElementById('law-100').addEventListener('click', () => {
            for (let i = 0; i < 100; i++) {
                const isHeads = Math.random() < 0.5;
                state.law.total++;
                if (isHeads) state.law.heads++;
            }
            state.law.history.push(state.law.heads / state.law.total * 100);
            updateLawDisplay();
            drawLawChart();
        });

        document.getElementById('law-1000').addEventListener('click', () => {
            for (let i = 0; i < 1000; i++) {
                const isHeads = Math.random() < 0.5;
                state.law.total++;
                if (isHeads) state.law.heads++;
            }
            state.law.history.push(state.law.heads / state.law.total * 100);
            updateLawDisplay();
            drawLawChart();
        });

        document.getElementById('law-reset').addEventListener('click', () => {
            state.law.heads = 0;
            state.law.total = 0;
            state.law.history = [];
            updateLawDisplay();
            drawLawChart();
        });

        // 自定义概率
        function initCustomProb() {
            renderProbInputs();
            renderResults('custom');
        }

        function renderProbInputs() {
            const container = document.getElementById('prob-inputs');
            container.innerHTML = '';

            state.custom.items.forEach((item, idx) => {
                const group = document.createElement('div');
                group.className = 'prob-input-group';
                group.innerHTML = `
                    <input type="text" class="item-input" value="${item}" data-idx="${idx}">
                    <span>权重:</span>
                    <input type="number" class="weight-input" value="${state.custom.weights[idx]}" min="1" max="100" data-idx="${idx}">
                `;
                container.appendChild(group);
            });

            container.querySelectorAll('.item-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    state.custom.items[idx] = e.target.value;
                    renderResults('custom');
                });
            });

            container.querySelectorAll('.weight-input').forEach(input => {
                input.addEventListener('change', (e) => {
                    const idx = parseInt(e.target.dataset.idx);
                    state.custom.weights[idx] = parseInt(e.target.value) || 1;
                });
            });
        }

        document.getElementById('custom-draw').addEventListener('click', customDraw);

        function customDraw() {
            const totalWeight = state.custom.weights.reduce((a, b) => a + b, 0);
            let random = Math.random() * totalWeight;
            let selectedIdx = 0;

            for (let i = 0; i < state.custom.weights.length; i++) {
                random -= state.custom.weights[i];
                if (random <= 0) {
                    selectedIdx = i;
                    break;
                }
            }

            const selectedItem = state.custom.items[selectedIdx];
            state.custom.results[selectedItem] = (state.custom.results[selectedItem] || 0) + 1;
            state.custom.history.push(selectedItem);

            const total = Object.values(state.custom.results).reduce((a, b) => a + b, 0);
            document.getElementById('stat-total').textContent = total;
            renderResults('custom');
        }

        window.addEventListener('resize', () => {
            if (document.getElementById('law-panel').classList.contains('active')) {
                initLawChart();
                drawLawChart();
            }
        });
    </script>
</body>
</html>
