            init() {
                this.renderLegend();
                this.renderTable();
                this.bindEvents();
                this.bindZoomEvents();
                // Select Hydrogen by default
                this.selectElement(1);
            }

            bindZoomEvents() {
                const zoomSlider = document.getElementById('zoomSlider');
                const zoomIn = document.getElementById('zoomIn');
                const zoomOut = document.getElementById('zoomOut');
                const zoomLevel = document.getElementById('zoomLevel');
                const tableContainer = document.querySelector('.table-container');
                const mainContent = document.querySelector('.main-content');

                // Drag state
                let isDragging = false;
                let startX, startY;
                let translateX = 0, translateY = 0;

                const updateZoom = (value) => {
                    this.state.zoom = value;
                    tableContainer.style.transform = `scale(${value / 100}) translate(${translateX}px, ${translateY}px)`;
                    zoomSlider.value = value;
                    zoomLevel.textContent = value + '%';
                };

                // Drag handling
                const handleDragStart = (e) => {
                    isDragging = true;
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    startX = clientX - translateX;
                    startY = clientY - translateY;
                    mainContent.style.cursor = 'grabbing';
                };

                const handleDrag = (e) => {
                    if (!isDragging) return;
                    e.preventDefault();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    translateX = clientX - startX;
                    translateY = clientY - startY;
                    tableContainer.style.transform = `scale(${this.state.zoom / 100}) translate(${translateX}px, ${translateY}px)`;
                };

                const handleDragEnd = () => {
                    isDragging = false;
                    mainContent.style.cursor = 'grab';
                };

                // Mouse events
                mainContent.addEventListener('mousedown', handleDragStart);
                mainContent.addEventListener('mousemove', handleDrag);
                mainContent.addEventListener('mouseup', handleDragEnd);
                mainContent.addEventListener('mouseleave', handleDragEnd);

                // Touch events for mobile
                mainContent.addEventListener('touchstart', handleDragStart, { passive: false });
                mainContent.addEventListener('touchmove', handleDrag, { passive: false });
                mainContent.addEventListener('touchend', handleDragEnd);

                // Zoom controls
                zoomSlider.addEventListener('input', (e) => {
                    updateZoom(parseInt(e.target.value));
                });

                zoomIn.addEventListener('click', () => {
                    const newZoom = Math.min(150, this.state.zoom + 10);
                    updateZoom(newZoom);
                });

                zoomOut.addEventListener('click', () => {
                    const newZoom = Math.max(50, this.state.zoom - 10);
                    updateZoom(newZoom);
                });
            }

            renderLegend() {
                const container = document.getElementById('legendGrid');
                Object.entries(this.types).forEach(([key, label]) => {
                    const item = document.createElement('div');
                    item.className = 'legend-item';
                    item.dataset.type = key;
                    item.innerHTML = `
                        <div class="legend-dot type-${key}"></div>
                        <span>${label}</span>
                    `;
                    item.addEventListener('click', () => this.toggleFilter(key));
                    container.appendChild(item);
                });
            }

            toggleFilter(type) {
                if (this.state.filter === type) {
                    this.state.filter = null;
                    document.querySelectorAll('.legend-item').forEach(el => el.classList.remove('active'));
                } else {
                    this.state.filter = type;
                    document.querySelectorAll('.legend-item').forEach(el => {
                        el.classList.toggle('active', el.dataset.type === type);
                    });
                }
                this.updateTableVisibility();
            }

            updateTableVisibility() {
                const els = document.querySelectorAll('.element-cell');
                els.forEach(el => {
                    if (el.classList.contains('empty-cell-label')) return;
                    const num = parseInt(el.dataset.n);
                    const data = this.elements.find(e => e.n === num);
                    
                    if (this.state.filter && data.t !== this.state.filter) {
                        el.classList.add('dimmed');
                    } else {
                        el.classList.remove('dimmed');
                    }
                });
            }

            renderTable() {
                const table = document.getElementById('periodicTable');
                table.innerHTML = '';

                // Generate grid 9 rows x 18 cols
                for (let r = 1; r <= 9; r++) {
                    // Spacer for Lanthanides/Actinides gap
                    if (r === 8) {
                        const gap = document.createElement('div');
                        gap.className = 'gap-row';
                        table.appendChild(gap);
                    }

                    for (let c = 1; c <= 18; c++) {
                        // Special handling for row 8,9 (Lanthanides/Actinides)
                        // They are shifted to align with group 3 visually in wide tables,
                        // but here we just render them in their assigned grid slots.
                        
                        // Find element
                        const el = this.elements.find(e => e.r === r && e.c_idx === c);

                        if (el) {
                            const div = document.createElement('div');
                            div.className = `element-cell type-${el.t}`;
                            div.dataset.n = el.n;
                            div.innerHTML = `
                                <span class="cell-num">${el.n}</span>
                                <span class="cell-symbol">${el.s}</span>
                                <span class="cell-name">${el.name}</span>
                            `;
                            div.addEventListener('click', () => this.handleElementClick(el));
                            table.appendChild(div);
                        } else {
                            const spacer = document.createElement('div');
                            spacer.className = 'spacer';
                            
                            // Add labels for Lanthanides/Actinides placeholders in main table
                            if (r === 6 && c === 3) {
                                spacer.className = 'element-cell empty-cell-label';
                                spacer.innerHTML = '57-71';
                            } else if (r === 7 && c === 3) {
                                spacer.className = 'element-cell empty-cell-label';
                                spacer.innerHTML = '89-103';
                            }
                            
                            table.appendChild(spacer);
                        }
                    }
                }
            }

            handleElementClick(el) {
                // In all modes, show element details on click
                this.selectElement(el.n);
                
                if (this.state.mode === 'quiz') {
                    this.checkAnswer(el);
                }
            }

            selectElement(n) {
                const el = this.elements.find(e => e.n === n);
                if (!el) return;

                this.state.currentElement = el;

                // Only update visual selection in explore mode or if needed
                // In quiz mode, checkAnswer handles visual feedback, but we can still highlight selected
                // if it doesn't conflict.
                // Let's keep selection highlighting active as it helps identify what was clicked.
                document.querySelectorAll('.element-cell').forEach(div => div.classList.remove('selected'));
                const target = document.querySelector(`.element-cell[data-n="${n}"]`);
                if (target) target.classList.add('selected');

                // Update detail card
                document.getElementById('dSymbol').textContent = el.s;
                document.getElementById('dName').textContent = el.name;
                document.getElementById('dEnName').textContent = el.en || '';
                document.getElementById('dNumber').textContent = el.n;
                document.getElementById('dWeight').textContent = el.w;
                document.getElementById('dConfig').textContent = el.c;
                document.getElementById('dType').textContent = this.types[el.t];
                document.getElementById('dDesc').textContent = el.desc || (el.en ? `${el.name} (${el.en}) 是一种化学元素。` : '暂无详细描述。');

                // Update mobile panel
                this.updateMobilePanel(el);
            }

            updateMobilePanel(el) {
                const mobileContent = document.getElementById('mobileDetailContent');
                if (!mobileContent) return;

                // Generate legend HTML
                const legendHtml = Object.entries(this.types).map(([key, label]) => `
                    <div class="legend-item ${this.state.filter === key ? 'active' : ''}" data-type="${key}" style="cursor: pointer; padding: 6px 8px; border-radius: 6px; background: ${this.state.filter === key ? '#e2e8f0' : 'transparent'};">
                        <div class="legend-dot type-${key}" style="width: 12px; height: 12px; border-radius: 4px; flex-shrink: 0;"></div>
                        <span style="font-size: 12px;">${label}</span>
                    </div>
                `).join('');

                mobileContent.innerHTML = `
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 12px;">
                        <div style="width: 56px; height: 56px; border-radius: 12px; background: linear-gradient(135deg, var(--c-${el.t}), var(--c-${el.t})); display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: white;">
                            ${el.s}
                        </div>
                        <div style="flex: 1;">
                            <div style="font-size: 20px; font-weight: bold;">${el.name}</div>
                            <div style="font-size: 13px; color: var(--text-secondary);">${el.en}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 24px; font-weight: bold; color: var(--primary-color);">${el.n}</div>
                            <div style="font-size: 11px; color: var(--text-secondary);">原子序数</div>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px;">
                        <div style="background: #f1f5f9; padding: 10px 8px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 10px; color: var(--text-secondary);">相对原子质量</div>
                            <div style="font-size: 13px; font-weight: bold; word-break: break-all;">${el.w}</div>
                        </div>
                        <div style="background: #f1f5f9; padding: 10px 8px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 10px; color: var(--text-secondary);">电子排布</div>
                            <div style="font-size: 11px; font-weight: bold; word-break: break-all;">${el.c}</div>
                        </div>
                        <div style="background: #f1f5f9; padding: 10px 8px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 10px; color: var(--text-secondary);">元素类别</div>
                            <div style="font-size: 12px; font-weight: bold;">${this.types[el.t]}</div>
                        </div>
                        <div style="background: #f1f5f9; padding: 10px 8px; border-radius: 8px; text-align: center;">
                            <div style="font-size: 10px; color: var(--text-secondary);">周期</div>
                            <div style="font-size: 13px; font-weight: bold;">${el.r}</div>
                        </div>
                    </div>
                    <div style="background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 12px;">
                        <div style="font-size: 11px; color: var(--text-secondary); margin-bottom: 4px;">简介</div>
                        <div style="font-size: 13px; line-height: 1.6;">${el.desc || (el.en ? `${el.name} (${el.en}) 是一种化学元素。` : '暂无详细描述。')}</div>
                    </div>
                    <div style="background: #fff; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
                        <div style="font-size: 12px; font-weight: 600; margin-bottom: 8px; color: var(--text-color);">元素分类 (点击筛选)</div>
                        <div style="display: flex; flex-wrap: wrap; gap: 6px;">
                            ${legendHtml}
                        </div>
                    </div>
                `;

                // Bind legend click events
                mobileContent.querySelectorAll('.legend-item').forEach(item => {
                    item.addEventListener('click', () => this.toggleFilter(item.dataset.type));
                });
            }

            setMode(mode) {
                this.state.mode = mode;
                
                // UI Toggle
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                document.querySelector(`[data-mode="${mode}"]`).classList.add('active');

                // Panel Visibility
                document.getElementById('quizControls').style.display = mode === 'quiz' ? 'block' : 'none';
                document.getElementById('questionBanner').style.display = mode === 'quiz' ? 'flex' : 'none';
                document.getElementById('legendGrid').parentElement.parentElement.style.display = mode === 'quiz' ? 'none' : 'block';

                if (mode === 'quiz') {
                    this.startQuiz();
                } else {
                    this.stopQuiz();
                }
            }

            startQuiz() {
                this.state.correct = 0;
                this.state.wrong = 0;
                this.updateStats();
                this.nextQuestion();
            }

            stopQuiz() {
                this.state.quizQuestion = null;
                // Reset visual state
                this.updateTableVisibility(); // clear dims
            }

            nextQuestion() {
                // Random element
                const el = this.elements[Math.floor(Math.random() * this.elements.length)];
                this.state.quizQuestion = el;
                
                document.getElementById('questionText').innerHTML = `请找出：${el.name} <span style="font-family:monospace">(${el.s})</span>`;
            }

            checkAnswer(el) {
                if (!this.state.quizQuestion) return;

                const feedbackEl = document.getElementById('quizFeedback');
                feedbackEl.style.display = 'block';

                if (el.n === this.state.quizQuestion.n) {
                    this.state.correct++;
                    this.updateStats();
                    
                    // Feedback in Sidebar
                    feedbackEl.textContent = '✅ 回答正确！';
                    feedbackEl.style.backgroundColor = '#d1fae5'; // green-100
                    feedbackEl.style.color = '#065f46'; // green-800
                    
                    // Visual feedback on table
                    const cell = document.querySelector(`.element-cell[data-n="${el.n}"]`);
                    cell.style.transform = 'scale(1.3)';
                    setTimeout(() => {
                        cell.style.transform = '';
                        // Delay next question slightly to let user see feedback
                        setTimeout(() => {
                            feedbackEl.style.display = 'none';
                            this.nextQuestion();
                        }, 1000);
                    }, 300);
                } else {
                    this.state.wrong++;
                    this.updateStats();
                    
                    // Feedback in Sidebar
                    feedbackEl.textContent = '❌ 回答错误，请重试';
                    feedbackEl.style.backgroundColor = '#fee2e2'; // red-100
                    feedbackEl.style.color = '#991b1b'; // red-800

                    // Shake effect
                    const cell = document.querySelector(`.element-cell[data-n="${el.n}"]`);
                    cell.style.backgroundColor = 'var(--danger-color)';
                    setTimeout(() => cell.style.backgroundColor = '', 300);
                }
            }

            updateStats() {
                document.getElementById('correctCount').textContent = this.state.correct;
                document.getElementById('wrongCount').textContent = this.state.wrong;
            }

            bindEvents() {
                // Mode switching
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.setMode(btn.dataset.mode));
                });

                // Quiz buttons
                document.getElementById('skipBtn').addEventListener('click', () => this.nextQuestion());
                document.getElementById('hintBtn').addEventListener('click', () => {
                    const q = this.state.quizQuestion;
                    alert(`提示：它是原子序数为 ${q.n} 的 ${this.types[q.t]}`);
                });
                document.getElementById('resetQuizBtn').addEventListener('click', () => this.startQuiz());
                document.getElementById('exitQuizBtn').addEventListener('click', () => this.setMode('explore'));

                // Search
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase().trim();
                    if (!term) return;
                    
                    const found = this.elements.find(el => 
                        el.name.includes(term) || 
                        el.s.toLowerCase() === term || 
                        el.n.toString() === term ||
                        (el.en && el.en.toLowerCase().includes(term))
                    );

                    if (found) {
                        this.selectElement(found.n);
                        // Scroll element into view if needed
                        const elDiv = document.querySelector(`.element-cell[data-n="${found.n}"]`);
                        if(elDiv) elDiv.scrollIntoView({behavior: 'smooth', block: 'center'});
                    }
                });
            }
        }

        const app = new PeriodicTable();
    </script>
</body>
</html>
