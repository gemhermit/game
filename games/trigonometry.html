<body>
    <aside class="sidebar">
        <div class="header">

        <div class="control-panel">
            <div class="control-group">

                <!-- 角度范围修改为 -360 到 360 -->

                </div>
                <!-- 显示范围控制，90到720度 -->
                <input type="range" id="zoomSlider" min="90" max="720" value="360" step="45">
            </div>
            
            <div class="control-group">
                <div class="control-header">
                    <span class="control-label">单位圆半径</span>
                    <span class="control-value" id="radiusDisplay">120</span>

                <input type="range" id="radiusSlider" min="80" max="150" value="120">
            </div>

            </div>
            <div class="info-card">
                <h3><span class="legend-dot" style="background: var(--cos-color)"></span> Cos(θ)</h3>

            </div>
            <div class="info-card">
                <h3><span class="legend-dot" style="background: var(--tan-color)"></span> Tan(θ)</h3>

    <main class="main-content">
        <div class="canvas-wrapper">
            <div class="canvas-card">
                <div class="canvas-title">单位圆 (Unit Circle)</div>
                <canvas id="unitCircleCanvas" width="400" height="400"></canvas>
            </div>
            <div class="canvas-card">
                <div class="canvas-title">函数图像 (Function Graph)</div>
                <canvas id="functionCanvas" width="500" height="400"></canvas>
            </div>
        </div>

    <script>
        // Configuration
        const config = {
            colors: {
                primary: '#2563eb',
                text: '#1e293b',
                grid: '#e2e8f0',
                axis: '#94a3b8',
                sin: '#ef4444',
                cos: '#22c55e',
                tan: '#f59e0b',
                highlight: '#8b5cf6'
            },
            fonts: {
                main: '14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif'
            }
        };

        // DOM Elements
        const elements = {
            angleSlider: document.getElementById('angleSlider'),
            radiusSlider: document.getElementById('radiusSlider'),
            zoomSlider: document.getElementById('zoomSlider'),
            angleDisplay: document.getElementById('angleDisplay'),
            radiusDisplay: document.getElementById('radiusDisplay'),
            zoomDisplay: document.getElementById('zoomDisplay'),
            sinValue: document.getElementById('sinValue'),
            cosValue: document.getElementById('cosValue'),
            tanValue: document.getElementById('tanValue'),
            unitCanvas: document.getElementById('unitCircleCanvas'),
            funcCanvas: document.getElementById('functionCanvas'),
            modeBtns: document.querySelectorAll('.mode-btn')
        };

        const ctx = {
            unit: elements.unitCanvas.getContext('2d'),
            func: elements.funcCanvas.getContext('2d')
        };

        // State
        let state = {
            angle: 0,
            radius: 120,
            mode: 'sine', // sine, cosine, tangent
            zoom: 360 // Display range in degrees
        };

        // Special Angles Logic
        const specialAngles = {
            0: { sin: '0', cos: '1', tan: '0' },
            30: { sin: '1/2', cos: '√3/2', tan: '√3/3' },
            45: { sin: '√2/2', cos: '√2/2', tan: '1' },
            60: { sin: '√3/2', cos: '1/2', tan: '√3' },
            90: { sin: '1', cos: '0', tan: '∞' },
            120: { sin: '√3/2', cos: '-1/2', tan: '-√3' },
            135: { sin: '√2/2', cos: '-√2/2', tan: '-1' },
            150: { sin: '1/2', cos: '-√3/2', tan: '-√3/3' },
            180: { sin: '0', cos: '-1', tan: '0' },
            210: { sin: '-1/2', cos: '-√3/2', tan: '√3/3' },
            225: { sin: '-√2/2', cos: '-√2/2', tan: '1' },
            240: { sin: '-√3/2', cos: '-1/2', tan: '√3' },
            270: { sin: '-1', cos: '0', tan: '∞' },
            300: { sin: '-√3/2', cos: '1/2', tan: '-√3' },
            315: { sin: '-√2/2', cos: '√2/2', tan: '-1' },
            330: { sin: '-1/2', cos: '√3/2', tan: '-√3/3' },
            360: { sin: '0', cos: '1', tan: '0' }
        };

        function formatValue(angle, type, val) {
            // Normalize angle to 0-360 for lookup
            let normAngle = angle % 360;
            if (normAngle < 0) normAngle += 360;
            
            // Check if close to integer
            if (Math.abs(normAngle - Math.round(normAngle)) < 0.1) {
                const intAngle = Math.round(normAngle);
                if (specialAngles[intAngle]) {
                    return specialAngles[intAngle][type];
                }
            }
            
            if (Math.abs(val) > 100) return '∞';
            return val.toFixed(3);
        }

        // Initialize
        function init() {
            setupListeners();
            animate();
        }

        function setupListeners() {
            elements.angleSlider.addEventListener('input', (e) => {
                state.angle = parseFloat(e.target.value);
                updateUI();
            });

            elements.radiusSlider.addEventListener('input', (e) => {
                state.radius = parseFloat(e.target.value);
                updateUI();
            });
            
            elements.zoomSlider.addEventListener('input', (e) => {
                state.zoom = parseFloat(e.target.value);
                updateUI();
            });

            elements.modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    elements.modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.mode = btn.dataset.mode;
                    updateUI();
                });
            });
        }

        function updateUI() {
            elements.angleDisplay.textContent = `${state.angle}°`;
            elements.radiusDisplay.textContent = state.radius;
            elements.zoomDisplay.textContent = `${state.zoom}°`;
            
            const rad = (state.angle * Math.PI) / 180;
            const sinVal = Math.sin(rad);
            const cosVal = Math.cos(rad);
            const tanVal = Math.tan(rad);

            elements.sinValue.textContent = formatValue(state.angle, 'sin', sinVal);
            elements.cosValue.textContent = formatValue(state.angle, 'cos', cosVal);
            elements.tanValue.textContent = formatValue(state.angle, 'tan', tanVal);

            draw();
        }

        function draw() {
            drawUnitCircle();
            drawFunction();
        }

        function drawUnitCircle() {
            const { unit } = ctx;
            const w = elements.unitCanvas.width;
            const h = elements.unitCanvas.height;
            const cx = w / 2;
            const cy = h / 2;
            const r = state.radius;
            const rad = (state.angle * Math.PI) / 180;

            // Clear
            unit.clearRect(0, 0, w, h);

            // Grid
            drawGrid(unit, w, h, 40);

            // Axes
            unit.strokeStyle = config.colors.axis;
            unit.lineWidth = 1;
            unit.beginPath();
            unit.moveTo(0, cy);
            unit.lineTo(w, cy);
            unit.moveTo(cx, 0);
            unit.lineTo(cx, h);
            unit.stroke();

            // Unit Circle
            unit.strokeStyle = config.colors.text;
            unit.lineWidth = 2;
            unit.beginPath();
            unit.arc(cx, cy, r, 0, Math.PI * 2);
            unit.stroke();

            // Calculate point
            const px = cx + Math.cos(rad) * r;
            const py = cy - Math.sin(rad) * r; // Canvas Y is inverted

            // Draw Triangle Components
            
            // Cosine Line (Horizontal)
            unit.strokeStyle = config.colors.cos;
            unit.lineWidth = 3;
            unit.beginPath();
            unit.moveTo(cx, cy);
            unit.lineTo(px, cy);
            unit.stroke();

            // Sine Line (Vertical)
            unit.strokeStyle = config.colors.sin;
            unit.lineWidth = 3;
            unit.beginPath();
            unit.moveTo(px, cy);
            unit.lineTo(px, py);
            unit.stroke();

            // Hypotenuse (Radius)
            unit.strokeStyle = config.colors.text;
            unit.lineWidth = 1;
            unit.beginPath();
            unit.moveTo(cx, cy);
            unit.lineTo(px, py);
            unit.stroke();

            // Angle Arc
            unit.strokeStyle = config.colors.highlight;
            unit.lineWidth = 2;
            unit.beginPath();
            // Handle negative angles for arc drawing
            unit.arc(cx, cy, 30, 0, -rad, rad > 0); 
            unit.stroke();

            // Tangent Line
            if (state.mode === 'tangent') {
                // Tangent is always vertical at x = r (if -90 < angle < 90) or x = -r
                // But typically visually we extend from origin through point to tangent line
                // Standard visual: Tangent line at (1,0) i.e. x=r
                
                // If cos is 0, tan is undefined
                if (Math.abs(Math.cos(rad)) > 0.01) {
                     // The tangent line is perpendicular to radius at (cx+r, cy)? 
                     // No, typically defined as segment on the line x=1.
                     // Point T is intersection of line OP and line x=1
                     
                     // If we want to show "tan theta", it's the Y-coordinate of the intersection 
                     // of the ray and the line x=1 (right side of circle)
                     
                     // Wait, if angle is in 2nd/3rd quadrant, we extend to left side?
                     // Let's stick to the line x=r for consistency or switch based on quadrant?
                     // Standard textbook: always tangent at (1,0). Ray extends backwards if needed.
                     
                     const tx = cx + r; // The vertical line x=r
                     const ty = cy - Math.tan(rad) * r;
                     
                     // Limit drawing range
                     if (Math.abs(ty - cy) < 2000) { // arbitrary large limit
                        unit.strokeStyle = config.colors.tan;
                        unit.lineWidth = 2;
                        unit.beginPath();
                        unit.moveTo(tx, cy);
                        unit.lineTo(tx, ty);
                        unit.stroke();
                        
                        // Extension line from center to tangent point
                        // This might be forward or backward extension
                        unit.strokeStyle = config.colors.axis;
                        unit.setLineDash([5, 5]);
                        unit.beginPath();
                        unit.moveTo(cx, cy);
                        unit.lineTo(tx, ty);
                        unit.stroke();
                        unit.setLineDash([]);
                     }
                }
            }

            // Point P
            unit.fillStyle = config.colors.primary;
            unit.beginPath();
            unit.arc(px, py, 6, 0, Math.PI * 2);
            unit.fill();
        }

        function drawFunction() {
            const { func } = ctx;
            const w = elements.funcCanvas.width;
            const h = elements.funcCanvas.height;
            const cy = h / 2;
            
            // X-axis settings
            const paddingX = 40;
            const graphW = w - 2 * paddingX;
            
            // Zoom determines the total degree range shown
            const totalRange = state.zoom; 
            const minDeg = -totalRange / 2;
            const maxDeg = totalRange / 2;
            
            const scaleX = graphW / totalRange; // pixels per degree
            const scaleY = state.radius; 

            func.clearRect(0, 0, w, h);
            
            // Grid
            drawGrid(func, w, h, 40);

            // Axes
            func.strokeStyle = config.colors.axis;
            func.lineWidth = 1;
            func.beginPath();
            
            // X axis
            func.moveTo(paddingX, cy);
            func.lineTo(w - paddingX, cy); 
            
            // Y axis (at 0 degrees)
            // 0 degrees is at the center of the graphW because minDeg = -maxDeg
            const zeroX = paddingX + (0 - minDeg) * scaleX;
            func.moveTo(zeroX, 20);
            func.lineTo(zeroX, h - 20); 
            
            func.stroke();

            // X Axis Labels
            func.fillStyle = config.colors.text;
            func.font = '10px sans-serif';
            func.textAlign = 'center';
            
            // Determine grid step based on zoom
            let step = 45;
            if (totalRange <= 180) step = 30;
            if (totalRange > 360) step = 90;

            // Start from first multiple of step after minDeg
            const startDeg = Math.ceil(minDeg / step) * step;

            for (let d = startDeg; d <= maxDeg; d += step) {
                const x = paddingX + (d - minDeg) * scaleX;
                func.fillText(`${d}°`, x, cy + 20);
                // Tick
                func.beginPath();
                func.moveTo(x, cy - 3);
                func.lineTo(x, cy + 3);
                func.stroke();
            }

            // Plot Function
            const mode = state.mode;
            let color = config.colors.sin;
            if (mode === 'cosine') color = config.colors.cos;
            if (mode === 'tangent') color = config.colors.tan;

            func.strokeStyle = color;
            func.lineWidth = 3;
            func.beginPath();

            let first = true;
            // Iterate pixels
            for (let x = 0; x <= graphW; x+=2) {
                const deg = minDeg + (x / graphW) * totalRange;
                const rad = (deg * Math.PI) / 180;
                let val;

                if (mode === 'sine') val = Math.sin(rad);
                else if (mode === 'cosine') val = Math.cos(rad);
                else if (mode === 'tangent') val = Math.tan(rad);

                // Clip tangent
                if (mode === 'tangent' && Math.abs(val) > 3) {
                    first = true;
                    continue;
                }

                const plotX = paddingX + x;
                const plotY = cy - val * scaleY;

                if (first) {
                    func.moveTo(plotX, plotY);
                    first = false;
                } else {
                    func.lineTo(plotX, plotY);
                }
            }
            func.stroke();

            // Current Value Marker
            // Only draw if current angle is within visible range
            if (state.angle >= minDeg && state.angle <= maxDeg) {
                const markerX = paddingX + (state.angle - minDeg) * scaleX;
                const rad = (state.angle * Math.PI) / 180;
                let val;
                if (mode === 'sine') val = Math.sin(rad);
                else if (mode === 'cosine') val = Math.cos(rad);
                else if (mode === 'tangent') val = Math.tan(rad);

                if (mode !== 'tangent' || Math.abs(val) < 3) {
                    const markerY = cy - val * scaleY;

                    // Guide line
                    func.strokeStyle = config.colors.text;
                    func.setLineDash([4, 4]);
                    func.lineWidth = 1;
                    func.beginPath();
                    func.moveTo(markerX, cy);
                    func.lineTo(markerX, markerY);
                    func.lineTo(zeroX, markerY); // Line to Y axis
                    func.stroke();
                    func.setLineDash([]);

                    // Dot
                    func.fillStyle = color;
                    func.beginPath();
                    func.arc(markerX, markerY, 6, 0, Math.PI * 2);
                    func.fill();
                    
                    // Value Label
                    func.fillStyle = config.colors.text;
                    func.textAlign = 'left';
                    // Prevent label from going off screen
                    let labelX = markerX + 10;
                    if (labelX > w - 50) labelX = markerX - 40;
                    
                    func.fillText(val.toFixed(2), labelX, markerY - 10);
                }
            }
        }

        function drawGrid(ctx, w, h, step) {
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let x = step; x < w; x += step) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, h);
            }
            for (let y = step; y < h; y += step) {
                ctx.moveTo(0, y);
                ctx.lineTo(w, y);
            }
            ctx.stroke();
        }

        function animate() {
            // requestAnimationFrame(animate); // Not needed unless we have continuous animation
            draw();
        }

        // Start
        init();
        // Initial Draw
        updateUI();

    </script>
</body>
