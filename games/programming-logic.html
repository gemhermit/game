    <script>
        class ProgrammingLogicGame {
            constructor() {
                this.topics = {
                    basic: {
                        title: "基础语法练习",
                        problems: [
                            {
                                title: "变量声明与赋值",
                                description: "声明一个整数变量 age 并赋值为 18，然后输出这个变量。",
                                code: [
                                    "<span class='keyword'>int</span> <span class='variable'>age</span> = <span class='blank' data-answer='18'>____</span>;",
                                    "<span class='keyword'>System.out.println</span>(<span class='blank' data-answer='age'>____</span>);"
                                ],
                                options: ["18", "age", "'age'", "int", "String", "'18'"],
                                hint: "第一个空格需要填入数字18，第二个空格需要填入变量名age（不加引号）"
                            },
                            {
                                title: "字符串操作",
                                description: "声明两个字符串变量，将它们连接后输出。",
                                code: [
                                    "<span class='keyword'>String</span> <span class='variable'>firstName</span> = <span class='string'>\"Hello\"</span>;",
                                    "<span class='keyword'>String</span> <span class='variable'>lastName</span> = <span class='string'>\"World\"</span>;",
                                    "<span class='keyword'>String</span> <span class='variable'>fullName</span> = firstName <span class='blank' data-answer='+'>____</span> <span class='blank' data-answer='lastName'>____</span>;",
                                    "<span class='keyword'>System.out.println</span>(fullName);"
                                ],
                                options: ["+", "lastName", "*", "&", "'lastName'", "-"],
                                hint: "字符串连接使用+号，变量名不需要引号"
                            }
                        ]
                    },
                    loop: {
                        title: "循环结构练习",
                        problems: [
                            {
                                title: "for循环基础",
                                description: "使用for循环输出1到5的数字。",
                                code: [
                                    "<span class='keyword'>for</span>(<span class='keyword'>int</span> <span class='variable'>i</span> = <span class='blank' data-answer='1'>____</span>; i <= <span class='blank' data-answer='5'>____</span>; <span class='blank' data-answer='i++'>____</span>) {",
                                    "    <span class='keyword'>System.out.println</span>(i);",
                                    "}"
                                ],
                                options: ["1", "5", "i++", "0", "i--", "10"],
                                hint: "for循环的三个部分：初始值1，条件i<=5，递增i++"
                            },
                            {
                                title: "while循环",
                                description: "使用while循环计算1到10的和。",
                                code: [
                                    "<span class='keyword'>int</span> <span class='variable'>sum</span> = 0;",
                                    "<span class='keyword'>int</span> <span class='variable'>i</span> = 1;",
                                    "<span class='keyword'>while</span>(i <= <span class='blank' data-answer='10'>____</span>) {",
                                    "    sum <span class='blank' data-answer='+='>____</span> i;",
                                    "    <span class='blank' data-answer='i++'>____</span>;",
                                    "}"
                                ],
                                options: ["10", "+=", "i++", "5", "=", "i--"],
                                hint: "循环到10，累加用+=，记得递增i"
                            }
                        ]
                    },
                    condition: {
                        title: "条件判断练习",
                        problems: [
                            {
                                title: "if-else语句",
                                description: "判断一个数字是否为正数、负数或零。",
                                code: [
                                    "<span class='keyword'>int</span> <span class='variable'>num</span> = -5;",
                                    "<span class='keyword'>if</span>(num <span class='blank' data-answer='>'>____</span> 0) {",
                                    "    <span class='keyword'>System.out.println</span>(<span class='string'>\"正数\"</span>);",
                                    "} <span class='keyword'>else if</span>(num <span class='blank' data-answer='<'>____</span> 0) {",
                                    "    <span class='keyword'>System.out.println</span>(<span class='string'>\"负数\"</span>);",
                                    "} <span class='keyword'>else</span> {",
                                    "    <span class='keyword'>System.out.println</span>(<span class='string'>\"零\"</span>);",
                                    "}"
                                ],
                                options: [">", "<", "==", ">=", "<=", "!="],
                                hint: "正数大于0，负数小于0"
                            },
                            {
                                title: "逻辑运算符",
                                description: "判断一个数字是否在1到100之间（包含1和100）。",
                                code: [
                                    "<span class='keyword'>int</span> <span class='variable'>num</span> = 50;",
                                    "<span class='keyword'>if</span>(num >= <span class='blank' data-answer='1'>____</span> <span class='blank' data-answer='&&'>____</span> num <= <span class='blank' data-answer='100'>____</span>) {",
                                    "    <span class='keyword'>System.out.println</span>(<span class='string'>\"在范围内\"</span>);",
                                    "} <span class='keyword'>else</span> {",
                                    "    <span class='keyword'>System.out.println</span>(<span class='string'>\"超出范围\"</span>);",
                                    "}"
                                ],
                                options: ["1", "&&", "100", "||", "0", "99"],
                                hint: "范围是1到100，需要同时满足两个条件，使用&&"
                            }
                        ]
                    },
                    function: {
                        title: "函数定义练习",
                        problems: [
                            {
                                title: "简单函数定义",
                                description: "定义一个函数，计算两个整数的和。",
                                code: [
                                    "<span class='keyword'>public static</span> <span class='blank' data-answer='int'>____</span> <span class='variable'>add</span>(<span class='keyword'>int</span> <span class='variable'>a</span>, <span class='keyword'>int</span> <span class='variable'>b</span>) {",
                                    "    <span class='keyword'>return</span> a <span class='blank' data-answer='+'>____</span> b;",
                                    "}",
                                    "",
                                    "<span class='comment'>// 调用函数</span>",
                                    "<span class='keyword'>int</span> <span class='variable'>result</span> = <span class='blank' data-answer='add'>____</span>(5, 3);"
                                ],
                                options: ["int", "+", "add", "void", "-", "sum"],
                                hint: "返回类型是int，操作是加法+，函数名是add"
                            },
                            {
                                title: "带条件的函数",
                                description: "定义一个函数，返回两个数中的较大值。",
                                code: [
                                    "<span class='keyword'>public static</span> <span class='keyword'>int</span> <span class='variable'>max</span>(<span class='keyword'>int</span> <span class='variable'>a</span>, <span class='keyword'>int</span> <span class='variable'>b</span>) {",
                                    "    <span class='keyword'>if</span>(a <span class='blank' data-answer='>'>____</span> b) {",
                                    "        <span class='keyword'>return</span> <span class='blank' data-answer='a'>____</span>;",
                                    "    } <span class='keyword'>else</span> {",
                                    "        <span class='keyword'>return</span> <span class='blank' data-answer='b'>____</span>;",
                                    "    }",
                                    "}"
                                ],
                                options: [">", "a", "b", "<", "1", "0"],
                                hint: "比较大小用>，返回较大的那个变量"
                            }
                        ]
                    }
                };
                
                this.currentTopic = 'basic';
                this.currentProblemIndex = 0;
                this.score = 0;
                this.completedCount = 0;
                this.totalQuestions = 0;
                this.selectedOptions = {};
                this.currentBlanks = [];
                
                this.initElements();
                this.bindEvents();
                this.loadProblem();
            }
            
            initElements() {
                this.problemTitle = document.getElementById('problemTitle');
                this.problemDescription = document.getElementById('problemDescription');
                this.codeEditor = document.getElementById('codeEditor');
                this.optionsGrid = document.getElementById('optionsGrid');
                this.hintPanel = document.getElementById('hintPanel');
                this.feedback = document.getElementById('feedback');
                this.progressFill = document.getElementById('progressFill');
                
                this.checkBtn = document.getElementById('checkBtn');
                this.hintBtn = document.getElementById('hintBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.gameComplete = document.getElementById('gameComplete');
                
                this.scoreSpan = document.getElementById('score');
                this.completedCountSpan = document.getElementById('completedCount');
                this.accuracySpan = document.getElementById('accuracy');
                this.questionNumberSpan = document.getElementById('questionNumber');
            }
            
            bindEvents() {
                // 主题选择
                document.querySelectorAll('.topic-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentTopic = e.target.dataset.topic;
                        this.resetGame();
                    });
                });
                
                this.checkBtn.addEventListener('click', () => this.checkAnswer());
                this.hintBtn.addEventListener('click', () => this.showHint());
                this.resetBtn.addEventListener('click', () => this.resetProblem());
                this.nextBtn.addEventListener('click', () => this.nextProblem());
            }
            
            resetGame() {
                this.currentProblemIndex = 0;
                this.score = 0;
                this.completedCount = 0;
                this.totalQuestions = 0;
                this.gameComplete.style.display = 'none';
                this.loadProblem();
            }
            
            loadProblem() {
                const topic = this.topics[this.currentTopic];
                const problem = topic.problems[this.currentProblemIndex];
                
                if (!problem) {
                    this.showGameComplete();
                    return;
                }
                
                this.selectedOptions = {};
                this.currentBlanks = [];
                
                this.problemTitle.textContent = problem.title;
                this.problemDescription.textContent = problem.description;
                
                this.renderCode(problem.code);
                this.renderOptions(problem.options);
                
                this.hintPanel.textContent = problem.hint;
                this.hintPanel.style.display = 'none';
                this.feedback.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.checkBtn.disabled = true;
                
                this.updateStats();
                this.updateProgress();
            }
            
            renderCode(codeLines) {
                this.codeEditor.innerHTML = '';
                
                codeLines.forEach((line, lineIndex) => {
                    const lineDiv = document.createElement('div');
                    lineDiv.className = 'code-line';
                    
                    const lineNumber = document.createElement('span');
                    lineNumber.className = 'line-number';
                    lineNumber.textContent = lineIndex + 1;
                    
                    const codeContent = document.createElement('div');
                    codeContent.className = 'code-content';
                    
                    // 处理代码中的空格
                    let processedLine = line.replace(/<span class='blank' data-answer='([^']*)'>[^<]*<\/span>/g, (match, answer) => {
                        const blankId = this.currentBlanks.length;
                        this.currentBlanks.push({ id: blankId, answer: answer, filled: false });
                        return `<span class='code-blank' data-blank-id='${blankId}' data-answer='${answer}'>____</span>`;
                    });
                    
                    codeContent.innerHTML = processedLine;
                    
                    // 为空格添加点击事件
                    codeContent.querySelectorAll('.code-blank').forEach(blank => {
                        blank.addEventListener('click', (e) => {
                            this.selectBlank(e.target);
                        });
                    });
                    
                    lineDiv.appendChild(lineNumber);
                    lineDiv.appendChild(codeContent);
                    this.codeEditor.appendChild(lineDiv);
                });
            }
            
            renderOptions(options) {
                this.optionsGrid.innerHTML = '';
                
                options.forEach((option, index) => {
                    const optionCard = document.createElement('div');
                    optionCard.className = 'option-card';
                    optionCard.textContent = option;
                    optionCard.dataset.option = option;
                    
                    optionCard.addEventListener('click', (e) => {
                        this.selectOption(e.target);
                    });
                    
                    this.optionsGrid.appendChild(optionCard);
                });
            }
            
            selectBlank(blankElement) {
                // 清除之前选中的空格
                document.querySelectorAll('.code-blank').forEach(blank => {
                    blank.style.background = '#4a5568';
                    blank.style.borderColor = '#667eea';
                });
                
                // 高亮当前选中的空格
                blankElement.style.background = '#667eea';
                blankElement.style.borderColor = '#667eea';
                
                this.selectedBlank = blankElement;
            }
            
            selectOption(optionElement) {
                if (!this.selectedBlank || optionElement.classList.contains('used')) {
                    return;
                }
                
                const blankId = parseInt(this.selectedBlank.dataset.blankId);
                const option = optionElement.dataset.option;
                
                // 如果该空格之前有选项，恢复该选项
                if (this.selectedOptions[blankId]) {
                    const prevOption = document.querySelector(`[data-option="${this.selectedOptions[blankId]}"]`);
                    if (prevOption) {
                        prevOption.classList.remove('used');
                    }
                }
                
                // 设置新选项
                this.selectedOptions[blankId] = option;
                this.selectedBlank.textContent = option;
                this.selectedBlank.classList.add('filled');
                this.currentBlanks[blankId].filled = true;
                
                // 标记选项为已使用
                optionElement.classList.add('used');
                
                // 清除选中状态
                this.selectedBlank.style.background = '#38a169';
                this.selectedBlank = null;
                
                // 检查是否可以提交
                this.checkBtn.disabled = !this.currentBlanks.every(blank => blank.filled);
            }
            
            checkAnswer() {
                let correctCount = 0;
                const totalBlanks = this.currentBlanks.length;
                
                this.currentBlanks.forEach(blank => {
                    const blankElement = document.querySelector(`[data-blank-id="${blank.id}"]`);
                    const userAnswer = this.selectedOptions[blank.id];
                    
                    if (userAnswer === blank.answer) {
                        blankElement.classList.add('correct');
                        blankElement.classList.remove('wrong');
                        correctCount++;
                    } else {
                        blankElement.classList.add('wrong');
                        blankElement.classList.remove('correct');
                    }
                });
                
                this.totalQuestions++;
                
                if (correctCount === totalBlanks) {
                    this.score += 20;
                    this.completedCount++;
                    this.feedback.className = 'feedback correct';
                    this.feedback.textContent = '恭喜！代码完全正确！';
                } else {
                    this.score += Math.floor(correctCount / totalBlanks * 10);
                    this.feedback.className = 'feedback wrong';
                    this.feedback.innerHTML = `
                        <strong>代码有误！</strong><br>
                        正确率：${correctCount}/${totalBlanks}<br>
                        请检查标红的部分。
                    `;
                }
                
                this.feedback.style.display = 'block';
                this.checkBtn.disabled = true;
                
                if (this.currentProblemIndex >= this.topics[this.currentTopic].problems.length - 1) {
                    this.nextBtn.textContent = '查看结果';
                } else {
                    this.nextBtn.textContent = '下一题';
                }
                this.nextBtn.style.display = 'inline-block';
                
                this.updateStats();
            }
            
            showHint() {
                this.hintPanel.style.display = 'block';
            }
            
            resetProblem() {
                this.selectedOptions = {};
                this.selectedBlank = null;
                
                // 重置空格
                document.querySelectorAll('.code-blank').forEach(blank => {
                    blank.textContent = '____';
                    blank.className = 'code-blank';
                    blank.style.background = '#4a5568';
                    blank.style.borderColor = '#667eea';
                });
                
                // 重置选项
                document.querySelectorAll('.option-card').forEach(option => {
                    option.classList.remove('used');
                });
                
                // 重置空格状态
                this.currentBlanks.forEach(blank => {
                    blank.filled = false;
                });
                
                this.feedback.style.display = 'none';
                this.hintPanel.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.checkBtn.disabled = true;
            }
            
            nextProblem() {
                this.currentProblemIndex++;
                
                if (this.currentProblemIndex >= this.topics[this.currentTopic].problems.length) {
                    this.showGameComplete();
                } else {
                    this.loadProblem();
                }
            }
            
            showGameComplete() {
                const accuracy = this.totalQuestions > 0 ? 
                    Math.round((this.completedCount / this.totalQuestions) * 100) : 0;
                
                document.getElementById('finalQuestions').textContent = this.totalQuestions;
                document.getElementById('finalCorrect').textContent = this.completedCount;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('finalAccuracy').textContent = accuracy + '%';
                
                this.gameComplete.style.display = 'block';
                this.nextBtn.style.display = 'none';
                this.checkBtn.style.display = 'none';
                this.hintBtn.style.display = 'none';
                this.resetBtn.textContent = '重新开始';
                this.resetBtn.onclick = () => this.resetGame();
            }
            
            updateStats() {
                this.scoreSpan.textContent = this.score;
                this.completedCountSpan.textContent = this.completedCount;
                this.questionNumberSpan.textContent = this.currentProblemIndex + 1;
                
                const accuracy = this.totalQuestions > 0 ? 
                    Math.round((this.completedCount / this.totalQuestions) * 100) : 0;
                this.accuracySpan.textContent = accuracy + '%';
            }
            
            updateProgress() {
                const totalProblems = this.topics[this.currentTopic].problems.length;
                const progress = (this.currentProblemIndex / totalProblems) * 100;
                this.progressFill.style.width = progress + '%';
            }
        }
        
        // 启动游戏
        new ProgrammingLogicGame();
    </script>
</body>
</html>
