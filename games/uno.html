            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            25% { transform: translate(-50%, -50%) scale(1.1) rotate(-5deg); }
            75% { transform: translate(-50%, -50%) scale(1.1) rotate(5deg); }
        }

        /* Current player indicator */
        .current-indicator {
            position: absolute;
            top: -10px;
            right: -10px;
            width: 24px;
            height: 24px;
            background: #22c55e;
            border-radius: 50%;
            border: 3px solid #1e293b;
            box-shadow: 0 0 0 2px #22c55e;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Responsive */
        @media (max-width: 900px) {
            .sidebar { display: none; }

            .my-card { 
                width: 60px; 
                height: 90px; 
                margin-left: -25px;
            }
            
            .card {
                width: 60px;
                height: 90px;
            }
            
            .draw-pile {
                width: 60px;
                height: 90px;
            }
            
            .draw-pile::after {
                width: 40px;
                height: 60px;
            }
            
            .card-value {
                font-size: 24px;
            }
            
            .card-corner {
                font-size: 12px;
            }

            .btn { padding: 10px 20px; font-size: 14px; min-width: auto; }
            
            .center-area { gap: 20px; }
            .player-area { padding: 10px; }
            .player-info { padding: 8px 12px; min-width: auto; }
            .player-name { display: none; }
            .player-cards-count { font-size: 12px; }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="uno-logo">🃏</div>
        <h1>UNO</h1>

        <div class="sidebar-stats">
            <div class="label">当前颜色</div>
            <div class="current-color" id="currentColor" style="background: #334155;">
                <span id="colorText">等待</span>
            </div>
        </div>

        <div class="direction-indicator">
            <span class="direction-arrow" id="directionArrow">⬇️</span>
            <div id="directionText">顺时针</div>
        </div>

        <button class="sidebar-btn btn-new-game" onclick="initGame()">🎮 新游戏</button>

        <div class="game-tip" id="gameTip">
            欢迎来到 UNO！<br>点击开始游戏
        </div>
    </div>

    <!-- Main Game Area -->
    <div class="game-area">
        <div class="uno-announce" id="unoAnnounceText">UNO!</div>
        
        <!-- Top Player -->
        <div class="player-area top" id="player2Area">
            <div class="player-info" id="topPlayerInfo">
                <div class="player-avatar top">🤖</div>
                <div class="player-details">
                    <div class="player-name">电脑 2</div>
                    <div class="player-cards-count" id="topCardCount">7张</div>
                </div>
            </div>
            <div class="player-cards-back" id="topCardsBack"></div>
        </div>

        <!-- Center Area -->
        <div class="center-area">
            <!-- Left Player -->
            <div class="side-player" id="player1Area">
                <div class="player-info" id="leftPlayerInfo">
                    <div class="player-avatar left">🤖</div>
                    <div class="player-details">
                        <div class="player-name">电脑 1</div>
                        <div class="player-cards-count" id="leftCardCount">7张</div>
                    </div>
                </div>
                <div class="player-cards-back" id="leftCardsBack"></div>
            </div>

            <!-- Play Area -->
            <div class="play-area">
                <div class="deck-area">
                    <div class="draw-pile" id="drawPile" onclick="playerDrawCard()"></div>
                    <div id="currentCardContainer"></div>
                </div>
            </div>

            <!-- Right Player -->
            <div class="side-player" id="player3Area">
                <div class="player-info" id="rightPlayerInfo">
                    <div class="player-avatar right">🤖</div>
                    <div class="player-details">
                        <div class="player-name">电脑 3</div>
                        <div class="player-cards-count" id="rightCardCount">7张</div>
                    </div>
                </div>
                <div class="player-cards-back" id="rightCardsBack"></div>
            </div>
        </div>

        <!-- Bottom Player -->
        <div class="player-area bottom" id="player0Area">
            <div class="my-cards-container">
                <div class="player-info" id="myPlayerInfo" style="margin-bottom: 20px;">
                    <div class="player-avatar me">👤</div>
                    <div class="player-details">
                        <div class="player-name">你</div>
                        <div class="player-cards-count" id="myCardCount">7张</div>
                    </div>
                </div>
                <div class="my-cards" id="myCards"></div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-play" id="playBtn" onclick="playerPlayCard()" disabled>出牌</button>
                <button class="btn btn-draw" id="drawBtn" onclick="playerDrawCard()">摸牌</button>
            </div>
        </div>

        <!-- Color Picker -->
        <div class="color-picker hidden" id="colorPicker">
            <h3>选择颜色</h3>
            <div class="color-option color-red" onclick="chooseColor('red')"></div>
            <div class="color-option color-blue" onclick="chooseColor('blue')"></div>
            <div class="color-option color-yellow" onclick="chooseColor('yellow')"></div>
            <div class="color-option color-green" onclick="chooseColor('green')"></div>
        </div>

        <!-- Game Modal -->
        <div class="modal-overlay" id="gameModal">
            <div class="modal">
                <h2 id="modalTitle">游戏结束</h2>
                <p id="modalText">恭喜!</p>
                <button class="btn btn-new-game" onclick="closeModal(); initGame()">再来一局</button>
            </div>
        </div>
    </div>

    <script>
        // Game Constants
        const COLORS = ['red', 'blue', 'yellow', 'green'];
        const SPECIALS = ['skip', 'reverse', 'draw2'];
        const WILDS = ['wild', 'wild4'];
        
        // Game State
        let deck = [];
        let discardPile = [];
        let players = [[], [], [], []]; // 0: User, 1: Left, 2: Top, 3: Right
        let currentPlayer = 0; // 0..3
        let direction = 1; // 1: Clockwise, -1: Counter-clockwise
        let currentColor = '';
        let currentValue = '';
        let gameActive = false;
        let turnState = 'idle'; // idle, waiting_for_play, waiting_for_color
        let selectedCardIndex = null;

        // UI Helpers
        const getCardHtml = (card, isSmall = false) => {
            if (!card) return '';
            const colorClass = `card-${card.color}`;
            let displayValue = card.value;
            let icon = displayValue;
            
            if (card.value === 'skip') icon = '⊘';
            if (card.value === 'reverse') icon = '⇄';
            if (card.value === 'draw2') icon = '+2';
            if (card.value === 'wild') icon = '🎨';
            if (card.value === 'wild4') icon = '+4';
            
            return `
                <div class="card ${colorClass} ${isSmall ? 'small' : ''}">
                    <div class="card-inner">
                        <div class="card-corner top-left">${icon}</div>
                        <div class="card-oval">
                            <div class="card-value">${icon}</div>
                        </div>
                        <div class="card-corner bottom-right">${icon}</div>
                    </div>
                </div>
            `;
        };

        const getColorHex = (c) => ({
            red: '#ef4444', blue: '#3b82f6', yellow: '#fbbf24', green: '#22c55e', wild: '#334155'
        }[c] || '#334155');

        // Initialization
        function initGame() {
            createDeck();
            shuffleDeck();
            dealCards();

            // Setup initial discard
            let firstCard = drawFromDeck();
            while (firstCard.type === 'wild') { // Reshuffle if first card is wild
                deck.push(firstCard);
                shuffleDeck();
                firstCard = drawFromDeck();
            }
            discardPile = [firstCard];
            currentColor = firstCard.color;
            currentValue = firstCard.value;

            currentPlayer = 0;
            direction = 1;
            gameActive = true;
            turnState = 'waiting_for_play';

            updateUI();

            // Apply first card special effect if it's a special card
            let initialSkip = 0;
            if (firstCard.value === 'skip') {
                initialSkip = 1;
            } else if (firstCard.value === 'reverse') {
                direction *= -1;
            } else if (firstCard.value === 'draw2') {
                // Next player draws 2 and skips
                drawCardsForPlayer(1, 2);
                initialSkip = 1;
            }

            // 如果第一张卡是特殊卡，显示提示并跳到正确的玩家
            if (initialSkip > 0 || firstCard.value === 'reverse') {
                const playerNames = ['你', '电脑1', '电脑2', '电脑3'];
                let tipMsg = `第一张牌是 ${getCardName(firstCard)}！`;
                if (firstCard.value === 'draw2') {
                    tipMsg = `第一张牌是 +2 ！电脑1 被加2张牌并跳过！`;
                } else if (firstCard.value === 'skip') {
                    tipMsg = `第一张牌是 跳过！电脑1 被跳过！`;
                } else if (firstCard.value === 'reverse') {
                    tipMsg = `第一张牌是 反向！方向改为逆时针！`;
                }
                document.getElementById('gameTip').textContent = tipMsg;

                setTimeout(() => {
                    currentPlayer = (currentPlayer + direction * (1 + initialSkip)) % 4;
                    if (currentPlayer < 0) currentPlayer += 4;
                    startTurn();
                }, 1500);
            } else if (currentPlayer === 0) {
                startTurn();
            } else {
                setTimeout(aiTurn, 1000);
            }
        }

        function getCardName(card) {
            if (card.value === 'skip') return '跳过';
            if (card.value === 'reverse') return '反向';
            if (card.value === 'draw2') return '+2';
            if (card.value === 'wild') return '变色';
            if (card.value === 'wild4') return '+4';
            return card.value;
        }

        function createDeck() {
            deck = [];
            COLORS.forEach(color => {
                deck.push({ color, value: '0', type: 'number' });
                for (let i = 1; i <= 9; i++) {
                    deck.push({ color, value: String(i), type: 'number' });
                    deck.push({ color, value: String(i), type: 'number' });
                }
                SPECIALS.forEach(special => {
                    deck.push({ color, value: special, type: 'special' });
                    deck.push({ color, value: special, type: 'special' });
                });
            });
            for (let i = 0; i < 4; i++) {
                deck.push({ color: 'wild', value: 'wild', type: 'wild' });
                deck.push({ color: 'wild', value: 'wild4', type: 'wild' });
            }
        }

        function shuffleDeck() {
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
        }

        function drawFromDeck() {
            if (deck.length === 0) {
                if (discardPile.length <= 1) return null; // No cards left
                const topCard = discardPile.pop();
                deck = discardPile;
                discardPile = [topCard];
                shuffleDeck();
            }
            return deck.pop();
        }

        function dealCards() {
            players = [[], [], [], []];
            for (let i = 0; i < 7; i++) {
                for (let p = 0; p < 4; p++) {
                    players[p].push(drawFromDeck());
                }
            }
        }

        // Game Logic
        function startTurn() {
            updateUI();
            
            if (currentPlayer === 0) {
                // User turn
                turnState = 'waiting_for_play';
                checkUserPlayable();
                document.getElementById('gameTip').textContent = "轮到你了！请出牌或摸牌";
            } else {
                // AI turn
                turnState = 'ai_thinking';
                document.getElementById('gameTip').textContent = `等待 电脑 ${currentPlayer} 出牌...`;
                setTimeout(aiTurn, 1000 + Math.random() * 500);
            }
        }
        
        function nextPlayer(skip = 0) {
            let steps = 1 + skip;
            // Handle negative wrapping correctly
            let next = (currentPlayer + (direction * steps)) % 4;
            if (next < 0) next += 4;
            currentPlayer = next;
            startTurn();
        }

        function checkUserPlayable() {
            const hasPlayable = players[0].some(c => isPlayable(c));
            document.getElementById('drawBtn').disabled = false;
            document.getElementById('playBtn').disabled = true; // Enabled only when card selected
        }

        function isPlayable(card) {
            if (card.type === 'wild') return true;
            if (card.color === currentColor) return true;
            if (card.value === currentValue) return true;
            return false;
        }

        // User Actions
        function toggleSelectCard(index) {
            if (currentPlayer !== 0 || turnState !== 'waiting_for_play') return;
            
            const card = players[0][index];
            if (!isPlayable(card)) {
                // Shake animation maybe?
                return;
            }

            if (selectedCardIndex === index) {
                selectedCardIndex = null;
            } else {
                selectedCardIndex = index;
            }
            updateMyCardsUI();
            document.getElementById('playBtn').disabled = selectedCardIndex === null;
        }

        function playerPlayCard() {
            if (selectedCardIndex === null) return;
            const card = players[0][selectedCardIndex];
            playCard(0, selectedCardIndex, card);
        }

        function playerDrawCard() {
            // 玩家在等待颜色选择时不能摸牌
            if (currentPlayer !== 0 || turnState !== 'waiting_for_play') return;

            const card = drawFromDeck();
            if (card) {
                players[0].push(card);
                updateUI();

                // If playable, can play immediately
                if (isPlayable(card)) {
                    document.getElementById('gameTip').textContent = "摸到了可出的牌！可以选择出牌或摸牌按钮跳过";
                } else {
                    // No playable card, auto pass
                    document.getElementById('gameTip').textContent = "没有可出的牌，跳过回合";
                    selectedCardIndex = null;
                    updateMyCardsUI();
                    setTimeout(() => nextPlayer(), 800);
                }
            }
        }

        // Core Play Logic
        function playCard(playerIndex, cardIndex, card) {
            // Remove card from hand
            players[playerIndex].splice(cardIndex, 1);
            discardPile.push(card);
            
            // Update state
            currentValue = card.value;
            
            // Check Win
            if (players[playerIndex].length === 0) {
                updateUI();
                showWinModal(playerIndex);
                return;
            }

            // Check Uno
            if (players[playerIndex].length === 1) {
                showUnoAnnounce();
            }

            // Handle Wild
            if (card.type === 'wild') {
                if (playerIndex === 0) {
                    turnState = 'waiting_for_color';
                    document.getElementById('colorPicker').classList.remove('hidden');
                } else {
                    // AI chooses color
                    const color = aiChooseColor(playerIndex);
                    finishPlay(card, color);
                }
            } else {
                currentColor = card.color;
                finishPlay(card);
            }
        }

        function chooseColor(color) {
            document.getElementById('colorPicker').classList.add('hidden');
            currentColor = color;
            // The card played was the last one in discard pile
            const card = discardPile[discardPile.length - 1];
            finishPlay(card, color);
        }

        function finishPlay(card, chosenColor = null) {
            if (chosenColor) currentColor = chosenColor;

            updateUI();

            let skip = 0;
            let drawInfo = null; // 记录加牌信息

            // Special Effects
            if (card.value === 'reverse') {
                direction *= -1;
                // In 2 player game, reverse acts like skip
                if (players.length === 2) skip = 1;
            } else if (card.value === 'skip') {
                skip = 1;
            } else if (card.value === 'draw2') {
                const nextP = getNextPlayerIndex(1);
                drawCardsForPlayer(nextP, 2);
                drawInfo = { player: nextP, count: 2 };
                skip = 1;
            } else if (card.value === 'wild4') {
                const nextP = getNextPlayerIndex(1);
                drawCardsForPlayer(nextP, 4);
                drawInfo = { player: nextP, count: 4 };
                skip = 1;
            }

            // 显示加牌信息
            if (drawInfo) {
                const playerNames = ['你', '电脑1', '电脑2', '电脑3'];
                if (drawInfo.player === 0) {
                    document.getElementById('gameTip').textContent = `你被加了 ${drawInfo.count} 张牌！`;
                } else {
                    document.getElementById('gameTip').textContent = `${playerNames[drawInfo.player]} 被加了 ${drawInfo.count} 张牌！`;
                }
            }

            setTimeout(() => nextPlayer(skip), 1000);
        }

        function getNextPlayerIndex(steps) {
            let next = (currentPlayer + (direction * steps)) % 4;
            if (next < 0) next += 4;
            return next;
        }

        function drawCardsForPlayer(pIndex, count) {
            for (let i = 0; i < count; i++) {
                const c = drawFromDeck();
                if (c) players[pIndex].push(c);
            }
            updateUI(); // Show cards flying to player?
        }

        // AI Logic
        function aiTurn() {
            const hand = players[currentPlayer];
            
            // Simple Strategy:
            // 1. Find all playable cards
            const playable = hand.map((c, i) => ({c, i})).filter(item => isPlayable(item.c));
            
            if (playable.length > 0) {
                // Priority:
                // 1. Play Draw2/Skip/Reverse if next player has few cards
                // 2. Play Number of same color (keep Wilds for later)
                // 3. Play Wild
                
                // Sort by priority (descending)
                playable.sort((a, b) => {
                    const score = (c) => {
                        if (c.value === 'wild4') return 1;
                        if (c.value === 'wild') return 2;
                        if (c.type === 'special') return 4;
                        return 3;
                    };
                    return score(a.c) - score(b.c);
                });
                
                // Pick best
                const best = playable[playable.length - 1]; // Highest score
                playCard(currentPlayer, best.i, best.c);
            } else {
                // Draw
                const card = drawFromDeck();
                if (card) {
                    players[currentPlayer].push(card);
                    updateUI();
                    
                    if (isPlayable(card)) {
                        setTimeout(() => {
                            // Play the drawn card
                            // Note: index is last
                            playCard(currentPlayer, players[currentPlayer].length - 1, card);
                        }, 800);
                    } else {
                        setTimeout(() => nextPlayer(), 800);
                    }
                } else {
                    nextPlayer();
                }
            }
        }

        function aiChooseColor(pIndex) {
            const hand = players[pIndex];
            const counts = { red: 0, blue: 0, green: 0, yellow: 0 };
            hand.forEach(c => {
                if (c.color && c.color !== 'wild') counts[c.color]++;
            });
            // Return color with max count
            return Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
        }

        // UI Updates
        function updateUI() {
            // Update Current Card
            const topCard = discardPile[discardPile.length - 1];
            const container = document.getElementById('currentCardContainer');
            container.innerHTML = `
                <div class="card card-${currentColor}">
                    <div class="card-inner">
                        <div class="card-oval">
                            <div class="card-value" style="color:${getColorHex(currentColor)}">
                                ${getDisplayValue(topCard)}
                            </div>
                        </div>
                        <div class="card-corner top-left">${getDisplayIcon(topCard)}</div>
                        <div class="card-corner bottom-right">${getDisplayIcon(topCard)}</div>
                    </div>
                </div>
            `;
            
            // Update Sidebar
            document.getElementById('currentColor').style.background = getColorHex(currentColor);
            document.getElementById('colorText').textContent = {red:'红', blue:'蓝', green:'绿', yellow:'黄', wild:'彩'}[currentColor] || currentColor;
            
            const arrow = document.getElementById('directionArrow');
            if (direction === 1) {
                arrow.classList.remove('reverse');
                arrow.textContent = '⬇️';
                document.getElementById('directionText').textContent = '顺时针';
            } else {
                arrow.classList.add('reverse');
                arrow.textContent = '⬆️';
                document.getElementById('directionText').textContent = '逆时针';
            }

            // Update Players
            updateMyCardsUI();
            updateOtherPlayersUI();
            
            // Active Player Highlight
            [0,1,2,3].forEach(p => {
                const el = document.getElementById(getPlayerId(p));
                if (p === currentPlayer) el.classList.add('current-turn');
                else el.classList.remove('current-turn');
            });
        }

        function getPlayerId(index) {
            if (index === 0) return 'myPlayerInfo';
            if (index === 1) return 'leftPlayerInfo';
            if (index === 2) return 'topPlayerInfo';
            return 'rightPlayerInfo';
        }

        function updateMyCardsUI() {
            const container = document.getElementById('myCards');
            container.innerHTML = '';
            players[0].forEach((card, index) => {
                const el = document.createElement('div');
                el.className = `my-card card-${card.color}`;
                if (index === selectedCardIndex) el.classList.add('selected');
                if (!isPlayable(card) && currentPlayer === 0) el.style.opacity = '0.7';
                
                el.innerHTML = `
                    <div class="card-inner">
                        <div class="card-corner top-left">${getDisplayIcon(card)}</div>
                        <div class="card-oval">
                            <div class="card-value">${getDisplayIcon(card)}</div>
                        </div>
                    </div>
                `;
                el.onclick = () => toggleSelectCard(index);
                container.appendChild(el);
            });
            document.getElementById('myCardCount').textContent = `${players[0].length}张`;
        }

        function updateOtherPlayersUI() {
            // Player 1 (Left)
            updateBotUI('left', players[1]);
            // Player 2 (Top)
            updateBotUI('top', players[2]);
            // Player 3 (Right)
            updateBotUI('right', players[3]);
        }

        function updateBotUI(pos, cards) {
            const countId = `${pos}CardCount`;
            const backsId = `${pos}CardsBack`;
            document.getElementById(countId).textContent = `${cards.length}张`;
            
            const container = document.getElementById(backsId);
            container.innerHTML = '';
            // Show max 5 card backs
            const showCount = Math.min(cards.length, 5);
            for (let i = 0; i < showCount; i++) {
                const back = document.createElement('div');
                back.className = 'card-back-small';
                container.appendChild(back);
            }
        }

        function getDisplayValue(card) {
            if (card.value === 'wild') return '🎨';
            if (card.value === 'wild4') return '+4';
            if (card.value === 'draw2') return '+2';
            if (card.value === 'skip') return '⊘';
            if (card.value === 'reverse') return '⇄';
            return card.value;
        }

        function getDisplayIcon(card) {
            if (card.value === 'wild') return '🎨';
            if (card.value === 'wild4') return '+4';
            if (card.value === 'draw2') return '+2';
            if (card.value === 'skip') return '⊘';
            if (card.value === 'reverse') return '⇄';
            return card.value;
        }

        function showUnoAnnounce() {
            const el = document.getElementById('unoAnnounceText');
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 2000);
        }

        function showWinModal(winnerIndex) {
            const modal = document.getElementById('gameModal');
            const title = document.getElementById('modalTitle');
            const text = document.getElementById('modalText');
            
            if (winnerIndex === 0) {
                title.textContent = "胜利！";
                text.textContent = "恭喜你赢得了比赛！";
            } else {
                title.textContent = "游戏结束";
                text.textContent = `电脑 ${winnerIndex} 赢了！再接再厉。`;
            }
            modal.classList.add('active');
            gameActive = false;
        }

        function closeModal() {
            document.getElementById('gameModal').classList.remove('active');
        }

        // Init
        initGame();
    </script>
</body>
</html>
