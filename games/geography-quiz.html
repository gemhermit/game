                this.skipBtn = document.getElementById('skipBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.restartBtn = document.getElementById('restartBtn');
                this.gameComplete = document.getElementById('gameComplete');
                this.progressFill = document.getElementById('progressFill');
                
                this.scoreSpan = document.getElementById('score');
                this.currentQuestionSpan = document.getElementById('currentQuestion');
                this.totalQuestionsSpan = document.getElementById('totalQuestions');
                this.correctCountSpan = document.getElementById('correctCount');
                this.accuracySpan = document.getElementById('accuracy');
            }
            
            bindEvents() {
                // 分类选择
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentCategory = e.target.dataset.category;
                        this.restartGame();
                    });
                });
                
                this.submitBtn.addEventListener('click', () => this.submitAnswer());
                this.skipBtn.addEventListener('click', () => this.skipQuestion());
                this.nextBtn.addEventListener('click', () => this.nextQuestion());
                this.restartBtn.addEventListener('click', () => this.restartGame());
            }

                this.isAnswered = false;
                this.gameComplete.style.display = 'none';
                this.restartBtn.style.display = 'none';
                this.loadQuestion();
                this.updateStats();
            }
            
            loadQuestion() {
                const questions = this.questions[this.currentCategory];
                const question = questions[this.currentQuestionIndex % questions.length];
                
                this.questionNumber.textContent = `第 ${this.currentQuestionIndex + 1} 题`;
                this.questionText.textContent = question.question;
                
                this.optionsContainer.innerHTML = '';
                this.feedback.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.submitBtn.disabled = true;
                this.selectedAnswer = null;
                this.isAnswered = false;
                
                question.options.forEach((option, index) => {
                    const optionBtn = document.createElement('div');
                    optionBtn.className = 'option-btn';
                    optionBtn.innerHTML = `
                        <div class="option-label">${String.fromCharCode(65 + index)}</div>
                        ${option}
                    `;
                    optionBtn.addEventListener('click', () => this.selectOption(index));
                    this.optionsContainer.appendChild(optionBtn);
                });
                
                this.updateProgress();
            }
            
            selectOption(index) {
                if (this.isAnswered) return;
                
                // 清除之前的选择
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.classList.remove('selected');
                });
                
                // 选择当前选项
                const selectedBtn = this.optionsContainer.children[index];
                selectedBtn.classList.add('selected');
                
                this.selectedAnswer = index;
                this.submitBtn.disabled = false;
            }
            
            submitAnswer() {
                if (this.selectedAnswer === null || this.isAnswered) return;
                
                const questions = this.questions[this.currentCategory];
                const question = questions[this.currentQuestionIndex % questions.length];
                const isCorrect = this.selectedAnswer === question.correct;
                
                this.isAnswered = true;
                
                // 显示答案结果
                document.querySelectorAll('.option-btn').forEach((btn, index) => {
                    btn.classList.add('disabled');
                    if (index === question.correct) {
                        btn.classList.add('correct');
                    } else if (index === this.selectedAnswer && !isCorrect) {
                        btn.classList.add('wrong');
                    }
                });
                
                // 更新分数和统计
                if (isCorrect) {
                    this.score += 10;
                    this.correctCount++;
                    this.feedback.className = 'feedback correct';
                    this.feedback.innerHTML = `
                        <strong>回答正确！</strong><br>
                        <div class="explanation">
                            <div class="explanation-title">知识点：</div>
                            ${question.explanation}
                        </div>
                    `;
                } else {
                    this.feedback.className = 'feedback wrong';
                    this.feedback.innerHTML = `
                        <strong>回答错误！</strong><br>
                        正确答案是：${question.options[question.correct]}<br>
                        <div class="explanation">
                            <div class="explanation-title">知识点：</div>
                            ${question.explanation}
                        </div>
                    `;
                }
                
                this.feedback.style.display = 'block';
                this.submitBtn.disabled = true;
                
                if (this.currentQuestionIndex + 1 >= this.totalQuestions) {
                    this.nextBtn.textContent = '查看结果';
                } else {
                    this.nextBtn.textContent = '下一题';
                }
                this.nextBtn.style.display = 'inline-block';
                
                this.updateStats();
            }
            
            skipQuestion() {
                if (this.isAnswered) return;
                
                const questions = this.questions[this.currentCategory];
                const question = questions[this.currentQuestionIndex % questions.length];
                
                this.isAnswered = true;
                
                // 显示正确答案
                document.querySelectorAll('.option-btn').forEach((btn, index) => {
                    btn.classList.add('disabled');
                    if (index === question.correct) {
                        btn.classList.add('correct');
                    }
                });
                
                this.feedback.className = 'feedback wrong';
                this.feedback.innerHTML = `
                    <strong>已跳过此题</strong><br>
                    正确答案是：${question.options[question.correct]}<br>
                    <div class="explanation">
                        <div class="explanation-title">知识点：</div>
                        ${question.explanation}
                    </div>
                `;
                this.feedback.style.display = 'block';
                
                this.submitBtn.disabled = true;
                
                if (this.currentQuestionIndex + 1 >= this.totalQuestions) {
                    this.nextBtn.textContent = '查看结果';
                } else {
                    this.nextBtn.textContent = '下一题';
                }
                this.nextBtn.style.display = 'inline-block';
            }
            
            nextQuestion() {
                this.currentQuestionIndex++;
                
                if (this.currentQuestionIndex >= this.totalQuestions) {
                    this.showGameComplete();
                } else {
                    this.loadQuestion();
                }
            }
            
            showGameComplete() {
                const accuracy = Math.round((this.correctCount / this.totalQuestions) * 100);
                
                document.getElementById('finalTotal').textContent = this.totalQuestions;
                document.getElementById('finalCorrect').textContent = this.correctCount;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('finalAccuracy').textContent = accuracy + '%';
                
                this.gameComplete.style.display = 'block';
                this.restartBtn.style.display = 'inline-block';
                this.nextBtn.style.display = 'none';
                this.skipBtn.style.display = 'none';
                this.submitBtn.style.display = 'none';
            }
            
            updateProgress() {
                const progress = ((this.currentQuestionIndex + 1) / this.totalQuestions) * 100;
                this.progressFill.style.width = progress + '%';
            }
            
            updateStats() {
                this.scoreSpan.textContent = this.score;
                this.currentQuestionSpan.textContent = this.currentQuestionIndex + 1;
                this.totalQuestionsSpan.textContent = this.totalQuestions;
                this.correctCountSpan.textContent = this.correctCount;
                
                const accuracy = this.currentQuestionIndex > 0 ? 
                    Math.round((this.correctCount / (this.currentQuestionIndex + (this.isAnswered ? 1 : 0))) * 100) : 0;
                this.accuracySpan.textContent = accuracy + '%';
            }
        }
        
        // 启动游戏
        new GeographyQuiz();
    </script>
</body>
</html>
