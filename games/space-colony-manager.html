                choices: [
                    { label: "批准完整名额", cost: { food: 8 }, effect: { population: 6, morale: 4 }, note: "新家庭带来了新的技能和笑声。" },
                    { label: "只接收工程师", cost: { credits: 80 }, effect: { population: 2, ore: 8, science: 4 }, note: "工程师小队开始优化采矿流程。" },
                    { label: "暂缓移民", cost: {}, effect: { morale: -4, credits: 80 }, note: "你选择稳住库存，联盟给了少量安置补贴。" }
                ]
            },
            {
                title: "地下冰层发现",
                text: "矿井探测到一片浅层冰。开采它能缓解粮食链路，但也可能耽误矿石生产。",
                choices: [
                    { label: "转为温室用水", cost: { ore: 4 }, effect: { food: 20 }, note: "藻类农场产能短期暴涨。" },
                    { label: "提炼为工业冷媒", cost: { science: 10 }, effect: { ore: 12, credits: 60 }, note: "冷媒交易很抢手，矿井也更稳定。" },
                    { label: "封存冰层", cost: {}, effect: { science: 8, morale: 2 }, note: "完整样本被送入研究舱，科研团队很满意。" }
                ]
            },
            {
                title: "议会质询",
                text: "殖民者对资源分配提出质询。透明公开会付出成本，但能稳住民心。",
                choices: [
                    { label: "公开预算并补贴家庭", cost: { credits: 130 }, effect: { morale: 10 }, note: "公开账目后，居民对管理层更信任。" },
                    { label: "用数据说明长期计划", cost: { science: 12 }, effect: { morale: 6, credits: 45 }, note: "研究报告让争议降温，还拿到一点联盟奖励。" },
                    { label: "维持原计划", cost: {}, effect: { morale: -6, ore: 5 }, note: "生产没有停，但殖民者的不满也没有消失。" }
                ]
            }
        ];

        const els = {
            stats: document.getElementById("stats"),
            nextBtn: document.getElementById("nextBtn"),
            restartBtn: document.getElementById("restartBtn"),
            autoBtn: document.getElementById("autoBtn"),
            policyRow: document.getElementById("policyRow"),
            policyPill: document.getElementById("policyPill"),
            statusTitle: document.getElementById("statusTitle"),
            statusText: document.getElementById("statusText"),
            scoreValue: document.getElementById("scoreValue"),
            buildList: document.getElementById("buildList"),
            facilitySummary: document.getElementById("facilitySummary"),
            meters: document.getElementById("meters"),
            log: document.getElementById("log"),
            eventModal: document.getElementById("eventModal"),
            eventTitle: document.getElementById("eventTitle"),
            eventText: document.getElementById("eventText"),
            eventChoices: document.getElementById("eventChoices")
        };

        let state = createInitialState();

        function createInitialState() {
            return {
                sol: 1,
                credits: 420,
                food: 34,
                ore: 18,
                science: 0,
                population: 14,
                morale: 72,
                policy: "balanced",
                ended: false,
                pendingEvent: null,
                metrics: {
                    energyGenerated: 12,
                    energyNeed: 6,
                    energyBalance: 6,
                    capacity: 18,
                    efficiency: 1
                },
                facilities: Object.fromEntries(facilityDefs.map((item) => [item.id, 0])),
                log: ["第 1 天：殖民核心上线，第一批居民开始整理生活舱。"],
                best: readBestScore()
            };
        }

        function readBestScore() {
            try {
                return Number(localStorage.getItem("space-colony-best") || 0);
            } catch (error) {
                return 0;
            }
        }

        function saveBestScore(score) {
            if (score <= state.best) return;
            state.best = score;
            try {
                localStorage.setItem("space-colony-best", String(score));
            } catch (error) {
                // localStorage may be unavailable in private browsing.
            }
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function round(value) {
            return Math.round(value);
        }

        function format(value) {
            return Math.round(value).toLocaleString("zh-CN");
        }

        function totalFacilities() {
            return Object.values(state.facilities).reduce((sum, value) => sum + value, 0);
        }

        function getCost(def) {
            const owned = state.facilities[def.id];
            const scale = 1 + owned * 0.36;
            const result = {};
            for (const [key, value] of Object.entries(def.cost)) {
                result[key] = Math.ceil(value * scale);
            }
            return result;
        }

        function canAfford(cost) {
            return Object.entries(cost).every(([key, value]) => state[key] >= value);
        }

        function applyCost(cost) {
            for (const [key, value] of Object.entries(cost)) {
                state[key] -= value;
            }
        }

        function applyEffect(effect) {
            for (const [key, value] of Object.entries(effect)) {
                if (key in state) {
                    state[key] += value;
                }
            }
            normalizeState();
        }

        function normalizeState() {
            state.credits = Math.max(0, state.credits);
            state.food = Math.max(0, state.food);
            state.ore = Math.max(0, state.ore);
            state.science = Math.max(0, state.science);
            state.population = Math.max(0, Math.round(state.population));
            state.morale = clamp(Math.round(state.morale), 0, 100);
        }

        function costText(cost) {
            const entries = Object.entries(cost);
            if (entries.length === 0) return "<span class=\"chip\">免费</span>";
            return entries.map(([key, value]) => `<span class="chip">${resourceLabels[key]} ${format(value)}</span>`).join("");
        }

        function buildFacility(def) {
            if (state.ended || state.pendingEvent) return;
            const owned = state.facilities[def.id];
            if (owned >= def.max) return;
            const cost = getCost(def);
            if (!canAfford(cost)) return;
            applyCost(cost);
            state.facilities[def.id] += 1;
            if (def.id === "habitat") {
                state.morale += 2;
            }
            addLog(`第 ${state.sol} 天：建成 ${def.name}，设施总数达到 ${totalFacilities()}。`);
            updateMetrics();
            render();
        }

        function updateMetrics() {
            const f = state.facilities;
            const capacity = 18 + f.habitat * 9;
            const energyGenerated = 12 + f.solar * 6 + f.reactor * 15;
            const energyNeed = 6 + f.farm * 2 + f.mine * 3 + f.lab * 4 + f.habitat * 1 + f.shield * 3 + f.port * 2 + state.population * 0.12;
            const efficiency = energyGenerated >= energyNeed ? 1 : clamp(energyGenerated / energyNeed, 0.38, 1);
            state.metrics = {
                capacity,
                energyGenerated,
                energyNeed,
                energyBalance: energyGenerated - energyNeed,
                efficiency
            };
        }

        function advanceDay() {
            if (state.ended || state.pendingEvent) return;
            updateMetrics();
            const f = state.facilities;
            const policy = policies[state.policy];
            const efficiency = state.metrics.efficiency;
            const foodDelta = f.farm * 6.2 * efficiency * policy.food - state.population * (state.policy === "austerity" ? 0.44 : 0.56);
            const oreDelta = f.mine * 5.1 * efficiency * policy.ore - totalFacilities() * 0.08;
            const scienceDelta = f.lab * 4.4 * efficiency * policy.science + f.shield * 0.6;
            const creditDelta = (34 + state.population * 2.1 + f.port * 28) * policy.credits;
            state.food += foodDelta;
            state.ore += oreDelta;
            state.science += scienceDelta;
            state.credits += creditDelta;
            state.morale += policy.morale;

            if (state.metrics.energyBalance < 0) {
                const penalty = Math.ceil(Math.abs(state.metrics.energyBalance) / 3);
                state.morale -= penalty;
                addLog(`第 ${state.sol} 天：能源缺口影响生产，士气 -${penalty}。`);
            }

            if (state.food <= 0) {
                const lost = Math.max(1, Math.ceil(state.population * 0.08));
                state.population -= lost;
                state.morale -= 10;
                state.food = 0;
                addLog(`第 ${state.sol} 天：食物耗尽，${lost} 名居民离开殖民地。`);
            } else if (state.food > state.population * 1.5 && state.morale >= 62 && state.population < state.metrics.capacity) {
                const growth = Math.min(state.metrics.capacity - state.population, 1 + f.port + (state.policy === "growth" ? 2 : 0));
                if (growth > 0) {
                    state.population += growth;
                    state.food -= growth * 0.8;
                    addLog(`第 ${state.sol} 天：生活条件稳定，新增 ${growth} 名居民。`);
                }
            }

            if (state.population >= state.metrics.capacity) {
                state.morale -= 2;
            }

            normalizeState();
            state.sol += 1;
            updateMetrics();

            if (!state.ended && state.sol % 5 === 0 && state.sol < 60) {
                openEvent();
            }

            checkEnd();
            render();
        }

        function addLog(message) {
            state.log.unshift(message);
            state.log = state.log.slice(0, 18);
        }

        function openEvent() {
            const eventIndex = (state.sol / 5 + totalFacilities() + state.population) % events.length;
            state.pendingEvent = events[eventIndex];
        }

        function applyChoice(choice) {
            if (!state.pendingEvent || !canAfford(choice.cost)) return;
            applyCost(choice.cost);
            const effect = { ...choice.effect };
            if (choice.shieldReduce && state.facilities.shield > 0) {
                effect.morale = Math.min(0, effect.morale + state.facilities.shield * 3);
                effect.food = Math.min(0, effect.food + state.facilities.shield * 2);
                effect.ore = Math.min(0, effect.ore + state.facilities.shield * 2);
            }
            applyEffect(effect);
            addLog(`第 ${state.sol} 天事件：${choice.note}`);
            state.pendingEvent = null;
            checkEnd();
            render();
        }

        function calculateScore() {
            return Math.max(0, Math.round(
                state.credits +
                state.food * 4 +
                state.ore * 7 +
                state.science * 10 +
                state.population * 42 +
                state.morale * 12 +
                totalFacilities() * 115 -
                Math.max(0, 60 - state.sol) * 8
            ));
        }

        function checkEnd() {
            if (state.ended) return;
            let title = "";
            let text = "";
            if (state.population <= 0 || state.morale <= 0) {
                state.ended = true;
                title = "殖民地撤离";
                text = "人口或士气跌破底线，联盟宣布撤离计划。下一局可以更早补食物和居住环。";
            } else if (state.sol > 60) {
                state.ended = true;
                const won = state.population >= 45 && state.morale >= 50 && state.science >= 90;
                title = won ? "自治星港成立" : "自治申请延期";
                text = won
                    ? "殖民地通过自治评估，成为边境星区新的补给节点。"
                    : "基地活了下来，但人口、士气或科研没有达标，需要再规划一次发展节奏。";
            }

            if (!state.ended) return;
            const score = calculateScore();
            saveBestScore(score);
            addLog(`${title}：最终评分 ${format(score)}。${text}`);
            els.statusTitle.textContent = title;
            els.statusText.textContent = text;
        }

        function renderStats() {
            const items = [
                ["太阳日", `${state.sol}/60`],
                ["信用点", format(state.credits)],
                ["食物", format(state.food)],
                ["矿石", format(state.ore)],
                ["科研", format(state.science)],
                ["人口", `${format(state.population)}/${format(state.metrics.capacity)}`],
                ["士气", `${state.morale}%`],
                ["最佳", format(state.best)]
            ];
            els.stats.innerHTML = items.map(([label, value]) => `
                <div class="stat">
                    <span>${label}</span>
                    <strong>${value}</strong>
                </div>
            `).join("");
        }

        function renderPolicies() {
            els.policyRow.innerHTML = Object.entries(policies).map(([id, policy]) => `
                <button class="policy ${state.policy === id ? "is-active" : ""}" data-policy="${id}">
                    ${policy.name}
                    <span>${policy.detail}</span>
                </button>
            `).join("");

            els.policyRow.querySelectorAll("button").forEach((button) => {
                button.disabled = state.ended || Boolean(state.pendingEvent);
                button.addEventListener("click", () => {
                    state.policy = button.dataset.policy;
                    addLog(`第 ${state.sol} 天：殖民政策调整为「${policies[state.policy].name}」。`);
                    render();
                });
            });
        }

        function renderBuildList() {
            els.buildList.innerHTML = facilityDefs.map((def) => {
                const owned = state.facilities[def.id];
                const cost = getCost(def);
                const maxed = owned >= def.max;
                return `
                    <article class="build-card">
                        <div class="build-card__head">
                            <div class="build-card__name">
                                <span class="build-card__icon" aria-hidden="true">${def.icon}</span>
                                <span>${def.name}</span>
                            </div>
                            <span class="chip">${owned}/${def.max}</span>
                        </div>
                        <p>${def.desc}</p>
                        <div class="cost">${maxed ? "<span class=\"chip\">已满级</span>" : costText(cost)}</div>
                        <button data-build="${def.id}" ${maxed || !canAfford(cost) || state.ended || state.pendingEvent ? "disabled" : ""}>建设</button>
                    </article>
                `;
            }).join("");

            els.buildList.querySelectorAll("button[data-build]").forEach((button) => {
                button.addEventListener("click", () => {
                    const def = facilityDefs.find((item) => item.id === button.dataset.build);
                    buildFacility(def);
                });
            });
        }

        function renderMeters() {
            const efficiency = Math.round(state.metrics.efficiency * 100);
            const energyPercent = clamp((state.metrics.energyGenerated / Math.max(1, state.metrics.energyNeed)) * 100, 0, 130);
            const capacityPercent = clamp((state.population / state.metrics.capacity) * 100, 0, 100);
            const sciencePercent = clamp((state.science / 90) * 100, 0, 100);
            const items = [
                ["能源", `${format(state.metrics.energyGenerated)} / ${format(state.metrics.energyNeed)}`, energyPercent],
                ["产能效率", `${efficiency}%`, efficiency],
                ["人口容量", `${format(state.population)} / ${format(state.metrics.capacity)}`, capacityPercent],
                ["自治科研", `${format(state.science)} / 90`, sciencePercent],
                ["士气稳定", `${state.morale}%`, state.morale]
            ];
            els.meters.innerHTML = items.map(([label, value, percent]) => `
                <div class="meter">
                    <div class="meter__label"><span>${label}</span><strong>${value}</strong></div>
                    <div class="meter__track"><div class="meter__fill" style="width:${clamp(percent, 0, 100)}%"></div></div>
                </div>
            `).join("");
        }

        function renderFacilitySummary() {
            const items = [
                ["设施", `${totalFacilities()} 座`],
                ["能源差", `${state.metrics.energyBalance >= 0 ? "+" : ""}${format(state.metrics.energyBalance)}`],
                ["住房", `${format(state.metrics.capacity)} 人`],
                ["政策", policies[state.policy].name]
            ];
            els.facilitySummary.innerHTML = items.map(([label, value]) => `
                <div class="mini">
                    <span>${label}</span>
                    <strong>${value}</strong>
                </div>
            `).join("");
        }

        function renderLog() {
            els.log.innerHTML = state.log.map((item) => `<p>${item}</p>`).join("");
        }

        function renderEvent() {
            if (!state.pendingEvent) {
                els.eventModal.hidden = true;
                return;
            }
            const event = state.pendingEvent;
            els.eventTitle.textContent = event.title;
            els.eventText.textContent = event.text;
            els.eventChoices.innerHTML = event.choices.map((choice, index) => `
                <button class="choice" data-choice="${index}" ${canAfford(choice.cost) ? "" : "disabled"}>
                    <strong>${choice.label}</strong>
                    <span>${costText(choice.cost).replaceAll("span", "em")} ${choice.note}</span>
                </button>
            `).join("");
            els.eventChoices.querySelectorAll("button").forEach((button) => {
                button.addEventListener("click", () => applyChoice(event.choices[Number(button.dataset.choice)]));
            });
            els.eventModal.hidden = false;
        }

        function renderStatus() {
            if (!state.ended) {
                const balance = state.metrics.energyBalance;
                els.statusTitle.textContent = balance < 0 ? "能源吃紧" : state.morale < 45 ? "民心需要安抚" : "殖民地运转中";
                els.statusText.textContent = balance < 0
                    ? "能源不足会拖慢所有生产，优先补太阳阵列或反应堆。"
                    : state.morale < 45
                        ? "士气过低会触发撤离风险，可以通过居住环、事件选择和稳健政策回血。"
                        : "继续平衡人口、科研、食物和矿石。越早建立正循环，后期越容易冲自治目标。";
            }
            els.policyPill.textContent = policies[state.policy].name;
            els.scoreValue.textContent = format(calculateScore());
            els.nextBtn.disabled = state.ended || Boolean(state.pendingEvent);
            els.autoBtn.disabled = state.ended || Boolean(state.pendingEvent);
        }

        function render() {
            updateMetrics();
            renderStats();
            renderPolicies();
            renderBuildList();
            renderFacilitySummary();
            renderMeters();
            renderLog();
            renderStatus();
            renderEvent();
        }

        els.nextBtn.addEventListener("click", advanceDay);
        els.restartBtn.addEventListener("click", () => {
            state = createInitialState();
            render();
        });
        els.autoBtn.addEventListener("click", () => {
            for (let i = 0; i < 5; i += 1) {
                if (state.ended || state.pendingEvent) break;
                advanceDay();
            }
        });

        window.addEventListener("keydown", (event) => {
            if (event.key.toLowerCase() === "n") {
                advanceDay();
            }
        });

        render();
    </script>
</body>
</html>
