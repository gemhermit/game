                    {symbol: 'Fe', name: '铁', number: 26, mass: 55.85, group: 8, period: 4, hint: '重要金属'},
                    {symbol: 'Cu', name: '铜', number: 29, mass: 63.55, group: 11, period: 4, hint: '红色金属'},
                    {symbol: 'Zn', name: '锌', number: 30, mass: 65.38, group: 12, period: 4, hint: '防锈镀层'},
                    {symbol: 'Ag', name: '银', number: 47, mass: 107.9, group: 11, period: 5, hint: '最佳导电'},
                    {symbol: 'Au', name: '金', number: 79, mass: 197.0, group: 11, period: 6, hint: '贵金属'}
                ];

                this.bindEvents();
                this.newQuestion();
                this.updateStats();
            }

            newQuestion() {
                this.currentElement = this.elements[Math.floor(Math.random() * this.elements.length)];
                this.timeLeft = 30;

                this.updateElementInfo();
                this.clearInputs();
                this.hideResult();
                this.hideHint();
                this.resetTimer();

                document.getElementById('resultPanel').classList.remove('show');

                switch (this.currentMode) {
                    case 'symbol':
                        this.setupSymbolMode();
                        break;
                    case 'name':
                        this.setupNameMode();
                        break;
                    case 'memory':
                        this.setupMemoryMode();
                        break;
                    case 'quiz':
                        this.setupQuizMode();
                        break;
                }
            }

            setupSymbolMode() {
                document.getElementById('questionText').textContent = '请输入元素符号';
                document.getElementById('displaySymbol').textContent = '?';
                document.getElementById('symbolInput').style.display = 'block';
                document.getElementById('nameInput').style.display = 'none';
                document.getElementById('inputArea').style.display = 'block';
                document.getElementById('memoryCards').style.display = 'none';
                document.getElementById('optionsArea').style.display = 'none';
                document.getElementById('elementDisplayCard').style.display = 'flex';
                document.getElementById('checkBtn').style.display = 'flex';
                document.getElementById('resetBtn').style.display = 'none';
                this.startTimer();
            }

            setupNameMode() {
                document.getElementById('questionText').textContent = '请输入元素名称';
                document.getElementById('displaySymbol').textContent = this.currentElement.symbol;
                document.getElementById('symbolInput').style.display = 'none';
                document.getElementById('nameInput').style.display = 'block';
                document.getElementById('inputArea').style.display = 'block';
                document.getElementById('memoryCards').style.display = 'none';
                document.getElementById('optionsArea').style.display = 'none';
                document.getElementById('elementDisplayCard').style.display = 'flex';
                document.getElementById('checkBtn').style.display = 'flex';
                document.getElementById('resetBtn').style.display = 'none';
                this.startTimer();
            }

            setupMemoryMode() {
                document.getElementById('questionText').textContent = '找出配对的符号和名称';
                document.getElementById('elementDisplayCard').style.display = 'none';
                document.getElementById('inputArea').style.display = 'none';
                document.getElementById('memoryCards').style.display = 'grid';
                document.getElementById('optionsArea').style.display = 'none';
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('resetBtn').style.display = 'flex';
                this.generateMemoryCards();
                this.stopTimer();
            }

            setupQuizMode() {
                document.getElementById('questionText').textContent = '选择正确答案';
                document.getElementById('displaySymbol').textContent = this.currentElement.symbol;
                document.getElementById('inputArea').style.display = 'none';
                document.getElementById('memoryCards').style.display = 'none';
                document.getElementById('optionsArea').style.display = 'grid';
                document.getElementById('elementDisplayCard').style.display = 'flex';
                document.getElementById('checkBtn').style.display = 'none';
                document.getElementById('resetBtn').style.display = 'none';
                this.generateQuizOptions();
                this.startTimer();
            }

            generateMemoryCards() {
                const container = document.getElementById('memoryCards');
                container.innerHTML = '';

                const selectedElements = this.elements.slice(0, 8);
                this.memoryCards = [];

                selectedElements.forEach((element, index) => {
                    const symbolCard = {
                        id: `symbol-${index}`,
                        content: element.symbol,
                        type: 'symbol',
                        elementIndex: index,
                        matched: false
                    };
                    const nameCard = {
                        id: `name-${index}`,
                        content: element.name,
                        type: 'name',
                        elementIndex: index,
                        matched: false
                    };
                    this.memoryCards.push(symbolCard, nameCard);
                });

                this.memoryCards = this.shuffleArray(this.memoryCards);

                this.memoryCards.forEach((card, index) => {
                    const cardElement = document.createElement('div');
                    cardElement.className = 'memory-card';
                    cardElement.dataset.id = card.id;
                    cardElement.innerHTML = `
                        <div class="card-face card-front">?</div>
                        <div class="card-face card-back">${card.content}</div>
                    `;
                    container.appendChild(cardElement);
                });

                this.flippedCards = [];
                this.matchedPairs = 0;
            }

            generateQuizOptions() {
                const container = document.getElementById('optionsArea');
                container.innerHTML = '';

                const options = [this.currentElement.name];
                let attempts = 0;
                while (options.length < 4 && attempts < 100) {
                    const randomElement = this.elements[Math.floor(Math.random() * this.elements.length)];
                    if (!options.includes(randomElement.name)) {
                        options.push(randomElement.name);
                    }
                    attempts++;
                }

                const shuffledOptions = this.shuffleArray(options);
                shuffledOptions.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.dataset.answer = option;
                    btn.textContent = option;
                    container.appendChild(btn);
                });
            }

            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            updateElementInfo() {
                const el = this.currentElement;
                document.getElementById('elementSymbolDisplay').textContent = el.symbol;
                document.getElementById('elementNameDisplay').textContent = el.name;
                document.getElementById('elementNumber').textContent = el.number;
                document.getElementById('elementMass').textContent = el.mass;
                document.getElementById('elementPeriod').textContent = el.period;
                document.getElementById('elementGroup').textContent = el.group;
                document.getElementById('displayNumber').textContent = el.number;
                document.getElementById('displayMass').textContent = el.mass;
            }

            checkAnswer() {
                let userAnswer = '';
                let correctAnswer = '';

                switch (this.currentMode) {
                    case 'symbol':
                        userAnswer = document.getElementById('symbolInput').value.trim().toUpperCase();
                        correctAnswer = this.currentElement.symbol.toUpperCase();
                        break;
                    case 'name':
                        userAnswer = document.getElementById('nameInput').value.trim();
                        correctAnswer = this.currentElement.name;
                        break;
                }

                if (userAnswer === correctAnswer) {
                    this.correctCount++;
                    this.streak++;
                    this.showResult('✅', '回答正确!', '太棒了!', 'success');
                    this.stopTimer();
                } else {
                    this.wrongCount++;
                    this.streak = 0;
                    this.showResult('❌', '回答错误', `正确答案是: ${correctAnswer}`, 'error');
                    this.stopTimer();
                }

                this.updateStats();
            }

            handleMemoryCardClick(cardElement) {
                if (cardElement.classList.contains('flipped') || cardElement.classList.contains('matched')) {
                    return;
                }

                cardElement.classList.add('flipped');
                const cardId = cardElement.dataset.id;
                const card = this.memoryCards.find(c => c.id === cardId);

                this.flippedCards.push({ element: cardElement, card: card });

                if (this.flippedCards.length === 2) {
                    setTimeout(() => this.checkMemoryMatch(), 800);
                }
            }

            checkMemoryMatch() {
                const [first, second] = this.flippedCards;

                if (first.card.elementIndex === second.card.elementIndex && first.card.type !== second.card.type) {
                    first.element.classList.add('matched');
                    second.element.classList.add('matched');
                    first.card.matched = true;
                    second.card.matched = true;
                    this.matchedPairs++;
                    this.correctCount++;

                    if (this.matchedPairs === 8) {
                        this.showResult('🎉', '游戏完成!', '恭喜你完成所有配对!', 'success');
                    }
                } else {
                    first.element.classList.remove('flipped');
                    second.element.classList.remove('flipped');
                    this.wrongCount++;
                    this.streak = 0;
                }

                this.flippedCards = [];
                this.updateStats();
            }

            handleQuizAnswer(selectedAnswer) {
                if (selectedAnswer === this.currentElement.name) {
                    this.correctCount++;
                    this.streak++;
                    const btn = document.querySelector(`[data-answer="${selectedAnswer}"]`);
                    btn.classList.add('correct');
                    this.showResult('✅', '回答正确!', '太棒了!', 'success');
                } else {
                    this.wrongCount++;
                    this.streak = 0;
                    const wrongBtn = document.querySelector(`[data-answer="${selectedAnswer}"]`);
                    wrongBtn.classList.add('wrong');
                    const correctBtn = document.querySelector(`[data-answer="${this.currentElement.name}"]`);
                    if (correctBtn) correctBtn.classList.add('correct');
                    this.showResult('❌', '回答错误', `正确答案是: ${this.currentElement.name}`, 'error');
                }

                this.stopTimer();
                this.updateStats();
            }

            showHint() {
                document.getElementById('hintText').textContent = this.currentElement.hint;
                document.getElementById('hintBox').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('hintBox').style.display = 'none';
                }, 4000);
            }

            startTimer() {
                this.stopTimer();
                this.timer = setInterval(() => {
                    this.timeLeft--;
                    const timerEl = document.getElementById('timer');
                    timerEl.textContent = `时间: ${this.timeLeft}s`;
                    timerEl.classList.toggle('warning', this.timeLeft <= 10);

                    if (this.timeLeft <= 0) {
                        this.stopTimer();
                        this.wrongCount++;
                        this.streak = 0;
                        this.showResult('⏰', '时间到!', '继续下一题吧', 'error');
                        this.updateStats();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timer) {
                    clearInterval(this.timer);
                    this.timer = null;
                }
            }

            resetTimer() {
                this.timeLeft = 30;
                const timerEl = document.getElementById('timer');
                timerEl.textContent = `时间: ${this.timeLeft}s`;
                timerEl.classList.remove('warning');
            }

            clearInputs() {
                document.getElementById('symbolInput').value = '';
                document.getElementById('nameInput').value = '';
            }

            showResult(icon, title, text, type) {
                const panel = document.getElementById('resultPanel');
                document.getElementById('resultIcon').textContent = icon;
                const titleEl = document.getElementById('resultTitle');
                titleEl.textContent = title;
                titleEl.className = `result-title ${type}`;
                document.getElementById('resultText').textContent = text;
                panel.classList.add('show');
            }

            hideResult() {
                document.getElementById('resultPanel').classList.remove('show');
            }

            hideHint() {
                document.getElementById('hintBox').style.display = 'none';
            }

            updateStats() {
                document.getElementById('correctCount').textContent = this.correctCount;
                document.getElementById('wrongCount').textContent = this.wrongCount;
                document.getElementById('streak').textContent = this.streak;

                const total = this.correctCount + this.wrongCount;
                const accuracy = total > 0 ? Math.round((this.correctCount / total) * 100) : 0;
                document.getElementById('accuracy').textContent = `${accuracy}%`;
                document.getElementById('progressFill').style.width = `${accuracy}%`;
            }

            setMode(mode) {
                this.currentMode = mode;
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.mode === mode);
                });
                this.newQuestion();
            }

            resetMemoryGame() {
                this.generateMemoryCards();
            }

            bindEvents() {
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => this.setMode(btn.dataset.mode));
                });

                document.getElementById('memoryCards').addEventListener('click', (e) => {
                    const card = e.target.closest('.memory-card');
                    if (card) this.handleMemoryCardClick(card);
                });

                document.getElementById('optionsArea').addEventListener('click', (e) => {
                    if (e.target.classList.contains('option-btn')) {
                        this.handleQuizAnswer(e.target.dataset.answer);
                    }
                });

                document.getElementById('symbolInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkAnswer();
                });

                document.getElementById('nameInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.checkAnswer();
                });

                document.getElementById('checkBtn').addEventListener('click', () => this.checkAnswer());
                document.getElementById('hintBtn').addEventListener('click', () => this.showHint());
                document.getElementById('nextBtn').addEventListener('click', () => this.newQuestion());
                document.getElementById('resetBtn').addEventListener('click', () => this.resetMemoryGame());
            }
        }

        new ChemistryMemoryGame();
    </script>
</body>
</html>
