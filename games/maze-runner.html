<script>
class MazeGame {
    constructor() {
        this.canvas = document.getElementById('mazeCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.levelEl = document.getElementById('level');
        this.winModal = document.getElementById('win-modal');
        this.startModal = document.getElementById('start-modal');
        this.nextBtn = document.getElementById('nextLevelBtn');
        this.startBtn = document.getElementById('startBtn');
        this.hintBtn = document.getElementById('hintBtn');
        
        // Config
        this.cellSize = 20; // Default, will adjust
        this.cols = 15;
        this.rows = 15;
        this.level = 1;
        
        // State
        this.maze = []; // 2D array: object { top, right, bottom, left, visited }
        this.player = { c: 0, r: 0 };
        this.trail = [];
        this.goal = { c: 0, r: 0 };
        this.isPlaying = false; // Wait for start
        this.hintPath = [];
        
        // Touch state
        this.touchStartX = 0;
        this.touchStartY = 0;
        this.isDragging = false;

        this.initEvents();
        // this.startLevel(); // Wait for button
    }

    initEvents() {
        this.startBtn.addEventListener('click', () => {
            this.startModal.classList.add('hidden');
            this.startLevel();
        });
        
        this.hintBtn.addEventListener('click', () => this.showHint());

        window.addEventListener('keydown', (e) => this.handleKey(e));
        
        // Touch Drag Control
        this.canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (!this.isPlaying) return;
            this.touchStartX = e.touches[0].clientX;
            this.touchStartY = e.touches[0].clientY;
            this.isDragging = true;
        }, { passive: false });
        
        this.canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!this.isPlaying || !this.isDragging) return;

            const x = e.touches[0].clientX;
            const y = e.touches[0].clientY;
            const dx = x - this.touchStartX;
            const dy = y - this.touchStartY;
            const threshold = 25; // Sensitivity in pixels

            // Check if moved enough to trigger a step
            if (Math.abs(dx) > threshold || Math.abs(dy) > threshold) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    // Horizontal
                    this.move(dx > 0 ? 1 : -1, 0);
                } else {
                    // Vertical
                    this.move(0, dy > 0 ? 1 : -1);
                }
                // Reset anchor to current position to allow continuous dragging
                this.touchStartX = x;
                this.touchStartY = y;
            }
        }, { passive: false });

        this.canvas.addEventListener('touchend', () => {
            this.isDragging = false;
        });
        
        // Button controls
        document.getElementById('upBtn').addEventListener('touchstart', (e) => { e.preventDefault(); this.move(0, -1); });
        document.getElementById('downBtn').addEventListener('touchstart', (e) => { e.preventDefault(); this.move(0, 1); });
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); this.move(-1, 0); });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); this.move(1, 0); });
        
        this.nextBtn.addEventListener('click', () => {
            this.level++;
            this.startLevel();
        });
        
        // Resize handler
        this.resize();
        window.addEventListener('resize', () => this.resize());
    }
    
    resize() {
        const maxSize = Math.min(window.innerWidth - 40, window.innerHeight - 200);
        // Ensure multiple of cols/rows
        this.canvas.width = maxSize;
        this.canvas.height = maxSize;
        this.cellSize = maxSize / this.cols; // Approximation
        this.render();
    }

    startLevel() {
        this.winModal.classList.add('hidden');
        this.isPlaying = true;
        this.levelEl.textContent = this.level;
        
        // Increase difficulty
        this.cols = 10 + this.level * 2;
        this.rows = 10 + this.level * 2;
        if (this.cols > 40) { this.cols = 40; this.rows = 40; } // Cap size
        
        this.generateMaze();
        this.player = { c: 0, r: 0 };
        this.trail = [];
        this.goal = { c: this.cols - 1, r: this.rows - 1 };
        
        this.resize(); // Recalculate cell size
    }

    generateMaze() {
        // Initialize grid
        this.maze = [];
        for (let r = 0; r < this.rows; r++) {
            const row = [];
            for (let c = 0; c < this.cols; c++) {
                row.push({
                    c, r,
                    walls: { top: true, right: true, bottom: true, left: true },
                    visited: false
                });
            }
            this.maze.push(row);
        }

        // Recursive Backtracker
        const stack = [];
        const start = this.maze[0][0];
        start.visited = true;
        stack.push(start);

        while (stack.length > 0) {
            const current = stack[stack.length - 1];
            const next = this.getUnvisitedNeighbor(current);

            if (next) {
                next.visited = true;
                this.removeWalls(current, next);
                stack.push(next);
            } else {
                stack.pop();
            }
        }
    }

    getUnvisitedNeighbor(cell) {
        const neighbors = [];
        const { c, r } = cell;
        
        if (r > 0 && !this.maze[r-1][c].visited) neighbors.push(this.maze[r-1][c]); // Top
        if (c < this.cols-1 && !this.maze[r][c+1].visited) neighbors.push(this.maze[r][c+1]); // Right
        if (r < this.rows-1 && !this.maze[r+1][c].visited) neighbors.push(this.maze[r+1][c]); // Bottom
        if (c > 0 && !this.maze[r][c-1].visited) neighbors.push(this.maze[r][c-1]); // Left
        
        if (neighbors.length === 0) return undefined;
        return neighbors[Math.floor(Math.random() * neighbors.length)];
    }

    removeWalls(a, b) {
        const dx = a.c - b.c;
        const dy = a.r - b.r;
        
        if (dx === 1) { a.walls.left = false; b.walls.right = false; }
        else if (dx === -1) { a.walls.right = false; b.walls.left = false; }
        
        if (dy === 1) { a.walls.top = false; b.walls.bottom = false; }
        else if (dy === -1) { a.walls.bottom = false; b.walls.top = false; }
    }

    handleKey(e) {
        if (!this.isPlaying) return;
        
        switch(e.key) {
            case 'ArrowUp': case 'w': this.move(0, -1); break;
            case 'ArrowDown': case 's': this.move(0, 1); break;
            case 'ArrowLeft': case 'a': this.move(-1, 0); break;
            case 'ArrowRight': case 'd': this.move(1, 0); break;
        }
    }

    move(dc, dr) {
        const { c, r } = this.player;
        const cell = this.maze[r][c];
        
        // Check walls
        if (dr === -1 && cell.walls.top) return;
        if (dr === 1 && cell.walls.bottom) return;
        if (dc === -1 && cell.walls.left) return;
        if (dc === 1 && cell.walls.right) return;
        
        // Clear hint on move
        this.hintPath = [];

        // Add to trail before moving
        this.trail.push({ c, r });
        
        // Update position
        this.player.c += dc;
        this.player.r += dr;
        
        this.checkWin();
        this.render();
    }

    showHint() {
        if (!this.isPlaying) return;
        
        // BFS to find shortest path to goal
        const queue = [{ c: this.player.c, r: this.player.r, path: [] }];
        const visited = new Set();
        visited.add(`${this.player.c},${this.player.r}`);

        while (queue.length > 0) {
            const current = queue.shift();
            
            if (current.c === this.goal.c && current.r === this.goal.r) {
                this.hintPath = current.path;
                this.render();
                return;
            }

            const directions = [
                { dc: 0, dr: -1, wall: 'top' },
                { dc: 0, dr: 1, wall: 'bottom' },
                { dc: -1, dr: 0, wall: 'left' },
                { dc: 1, dr: 0, wall: 'right' }
            ];

            for (const dir of directions) {
                const cell = this.maze[current.r][current.c];
                // Check if wall blocks exit
                if (!cell.walls[dir.wall]) {
                    const nc = current.c + dir.dc;
                    const nr = current.r + dir.dr;
                    const key = `${nc},${nr}`;
                    
                    if (nc >= 0 && nc < this.cols && nr >= 0 && nr < this.rows && !visited.has(key)) {
                        visited.add(key);
                        queue.push({
                            c: nc, r: nr,
                            path: [...current.path, { c: nc, r: nr }]
                        });
                    }
                }
            }
        }
    }

    checkWin() {
        if (this.player.c === this.goal.c && this.player.r === this.goal.r) {
            this.isPlaying = false;
            // Confetti or just modal
            this.winModal.classList.remove('hidden');
        }
    }

    render() {
        const w = this.canvas.width;
        const h = this.canvas.height;
        this.ctx.clearRect(0, 0, w, h);
        
        // Draw Maze Walls
        this.ctx.strokeStyle = '#94a3b8'; // Slate-400
        this.ctx.lineWidth = 2;
        this.ctx.beginPath();
        
        const cs = this.cellSize;
        
        for (let r = 0; r < this.rows; r++) {
            for (let c = 0; c < this.cols; c++) {
                const cell = this.maze[r][c];
                const x = c * cs;
                const y = r * cs;
                
                if (cell.walls.top) { this.ctx.moveTo(x, y); this.ctx.lineTo(x + cs, y); }
                if (cell.walls.right) { this.ctx.moveTo(x + cs, y); this.ctx.lineTo(x + cs, y + cs); }
                if (cell.walls.bottom) { this.ctx.moveTo(x + cs, y + cs); this.ctx.lineTo(x, y + cs); }
                if (cell.walls.left) { this.ctx.moveTo(x, y + cs); this.ctx.lineTo(x, y); }
            }
        }
        this.ctx.stroke();
        
        // Draw Trail
        this.ctx.fillStyle = 'rgba(239, 68, 68, 0.3)'; // Faint red
        this.trail.forEach(pos => {
             this.ctx.fillRect(pos.c * cs + cs/4, pos.r * cs + cs/4, cs/2, cs/2);
        });

        // Draw Hint Path
        if (this.hintPath.length > 0) {
            this.ctx.fillStyle = 'rgba(251, 191, 36, 0.6)'; // Amber
            this.hintPath.forEach(pos => {
                this.ctx.beginPath();
                this.ctx.arc(pos.c * cs + cs/2, pos.r * cs + cs/2, cs/5, 0, Math.PI * 2);
                this.ctx.fill();
            });
        }
        
        // Draw Goal
        this.ctx.fillStyle = '#22c55e'; // Green
        this.ctx.fillRect(this.goal.c * cs + 4, this.goal.r * cs + 4, cs - 8, cs - 8);
        
        // Draw Player
        this.ctx.fillStyle = '#ef4444'; // Red
        this.ctx.beginPath();
        this.ctx.arc(this.player.c * cs + cs/2, this.player.r * cs + cs/2, cs/3, 0, Math.PI * 2);
        this.ctx.fill();
    }
}

new MazeGame();
</script>
