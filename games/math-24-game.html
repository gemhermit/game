<body>
    <div class="message" id="messageBox"></div>

    <div class="container">
        <header>
            <h1>🧮 24点挑战赛</h1>
            <div class="stats-bar">
                <div class="stat-item">
                    <span>得分</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-item">
                    <span>连胜</span>
                    <span class="stat-value" id="streak">0</span>
                </div>
                <div class="stat-item">
                    <span id="questionLabel">题目</span>
                    <span class="stat-value" id="questionCount">1</span>
                </div>
            </div>
        </header>

        <div class="game-area">
            <div class="instruction" id="instruction">
                选择一张卡片开始计算
            </div>

            <div class="cards-container" id="cardsContainer">
                <!-- Cards will be injected here -->
            </div>

            <div class="operator-bar">
                <button class="btn-op" data-op="+">＋</button>
                <button class="btn-op" data-op="-">－</button>
                <button class="btn-op" data-op="*">×</button>
                <button class="btn-op" data-op="/">÷</button>
            </div>

            <div class="actions">
                <button class="btn btn-secondary" id="undoBtn">
                    ↩️ 撤销
                </button>
                <button class="btn btn-secondary" id="resetBtn">
                    🔄 重置
                </button>
                <button class="btn btn-secondary" id="hintBtn">
                    💡 提示
                </button>
                <button class="btn btn-secondary" id="skipBtn">
                    ⏭️ 跳过
                </button>
            </div>
        </div>
    </div>

    <script>
        class Game24 {
            constructor() {
                // 经典题目库
                this.classicPuzzles = [
                    [1, 2, 3, 4], [2, 4, 6, 8], [3, 3, 8, 8], [1, 5, 5, 5],
                    [4, 4, 10, 10], [3, 3, 7, 7], [1, 3, 4, 6], [1, 4, 5, 6],
                    [5, 5, 5, 1], [2, 4, 10, 10], [2, 5, 5, 10], [4, 4, 7, 7],
                    [5, 5, 5, 5], [6, 6, 6, 6], [1, 2, 7, 7], [3, 8, 8, 10],
                    [3, 5, 7, 13], [10, 10, 4, 4]
                ];

                // Filter out puzzles that require fractions/decimals to solve
                // Since solve24 is now strict integer-only, this removes impossible ones
                this.classicPuzzles = this.classicPuzzles.filter(p => this.solve24(p));

                this.state = {
                    score: 0,
                    streak: 0,
                    questionCount: 1,
                    cards: [], // { id, val, expr, suit }
                    history: [], // For undo
                    selectedCardId: null,
                    selectedOp: null,
                    solution: null,
                    isClassic: false
                };

                this.dom = {
                    cards: document.getElementById('cardsContainer'),
                    score: document.getElementById('score'),
                    streak: document.getElementById('streak'),
                    questionCount: document.getElementById('questionCount'),
                    message: document.getElementById('messageBox'),
                    instruction: document.getElementById('instruction'),
                    ops: document.querySelectorAll('.btn-op')
                };

                this.init();
            }

            init() {
                this.bindEvents();
                this.startNewRound();
            }

            bindEvents() {
                // Operators
                this.dom.ops.forEach(btn => {
                    btn.addEventListener('click', () => this.handleOpClick(btn.dataset.op));
                });

                // Controls
                document.getElementById('undoBtn').addEventListener('click', () => this.undo());
                document.getElementById('resetBtn').addEventListener('click', () => this.resetRound());
                document.getElementById('hintBtn').addEventListener('click', () => this.showHint());
                document.getElementById('skipBtn').addEventListener('click', () => this.startNewRound(false));
            }

            startNewRound(keepStreak = true) {
                if (!keepStreak) {
                    this.state.streak = 0;
                    this.updateStats();
                }

                // Decide puzzle source
                const useClassic = Math.random() < 0.2 || (this.state.questionCount % 5 === 0);
                let numbers;

                if (useClassic && this.classicPuzzles.length > 0) {
                    numbers = [...this.classicPuzzles[Math.floor(Math.random() * this.classicPuzzles.length)]];
                    this.state.isClassic = true;
                    this.state.solution = this.solve24(numbers);
                } else {
                    this.state.isClassic = false;
                    let attempts = 0;
                    do {
                        numbers = Array.from({length: 4}, () => Math.floor(Math.random() * 13) + 1);
                        this.state.solution = this.solve24(numbers);
                        attempts++;
                    } while (!this.state.solution && attempts < 100);

                    if (!this.state.solution) {
                        numbers = [3, 3, 8, 8];
                        this.state.solution = "8÷(3-8÷3)";
                    }
                }

                // Initial Cards
                const suits = ['♠', '♥', '♣', '♦'];
                this.state.cards = numbers.map((num, idx) => ({
                    id: `c_${Date.now()}_${idx}`,
                    val: num,
                    expr: num.toString(),
                    suit: suits[Math.floor(Math.random() * suits.length)],
                    rank: this.getCardRank(num)
                }));

                this.state.history = [];
                this.state.selectedCardId = null;
                this.state.selectedOp = null;
                
                this.updateUI();
                
                // Update Label
                const qLabel = document.getElementById('questionLabel');
                if (qLabel) {
                    qLabel.textContent = this.state.isClassic ? "题目 (经典)" : "题目 (随机)";
                    qLabel.style.color = this.state.isClassic ? "#f59e0b" : "#64748b";
                }
            }

            resetRound() {
                // Restore initial state from history if available, or just reload logic
                // Easier: just reload current numbers. But since we didn't store initial numbers separately,
                // we can just use the first entry of history if it exists, or... 
                // Actually, the cleanest way is to implement history properly.
                // Let's rely on Undo until empty for "Reset" visually, or re-init with same numbers.
                // For simplicity, let's just use undo all.
                while(this.state.history.length > 0) {
                    this.undo();
                }
            }

            handleCardClick(cardId) {
                const { selectedCardId, selectedOp } = this.state;

                // Case 1: Select first card
                if (!selectedCardId) {
                    this.state.selectedCardId = cardId;
                    this.updateUI();
                    this.setInstruction('请选择运算符');
                    return;
                }

                // Case 2: Deselect or switch selection (if no op selected)
                if (selectedCardId === cardId) {
                    this.state.selectedCardId = null;
                    this.state.selectedOp = null;
                    this.updateUI();
                    this.setInstruction('选择一张卡片');
                    return;
                }

                if (!selectedOp) {
                    this.state.selectedCardId = cardId;
                    this.updateUI();
                    this.setInstruction('请选择运算符');
                    return;
                }

                // Case 3: Merge cards (selectedCard + op + clickedCard)
                this.mergeCards(selectedCardId, cardId, selectedOp);
            }

            handleOpClick(op) {
                if (!this.state.selectedCardId) {
                    this.showMessage('请先选择数字卡片', 'info');
                    return;
                }
                this.state.selectedOp = op;
                this.updateUI();
                this.setInstruction('请选择另一张卡片进行计算');
            }

            mergeCards(id1, id2, op) {
                const c1 = this.state.cards.find(c => c.id === id1);
                const c2 = this.state.cards.find(c => c.id === id2);
                
                if (!c1 || !c2) return;

                let newVal;
                let newExpr;
                
                // Calculate
                if (op === '+') newVal = c1.val + c2.val;
                else if (op === '-') newVal = c1.val - c2.val;
                else if (op === '*') newVal = c1.val * c2.val;
                else if (op === '/') {
                    if (Math.abs(c2.val) < 0.0001) {
                        this.showMessage('不能除以零', 'error');
                        return;
                    }
                    // Integer division only check
                    if (c1.val % c2.val !== 0) {
                        this.showMessage('不能除不尽', 'error');
                        return;
                    }
                    newVal = c1.val / c2.val;
                }

                // Save history
                this.state.history.push({
                    cards: [...this.state.cards],
                    instruction: this.dom.instruction.textContent
                });

                // Create new card
                const opSym = op === '*' ? '×' : op === '/' ? '÷' : op;
                // Add brackets if needed for precedence, but for safety always adding them is fine visually for now
                // Or try to be smart? Let's just wrap in ()
                newExpr = `(${c1.expr}${opSym}${c2.expr})`;

                const newCard = {
                    id: `c_${Date.now()}`,
                    val: newVal,
                    expr: newExpr,
                    suit: '★', // Merged card symbol
                    rank: ''
                };

                // Update state: remove c1, c2, add newCard
                this.state.cards = this.state.cards.filter(c => c.id !== id1 && c.id !== id2);
                this.state.cards.push(newCard);
                
                // Reset selection
                this.state.selectedCardId = null;
                this.state.selectedOp = null;

                this.updateUI();
                this.checkWin();
            }

            undo() {
                if (this.state.history.length === 0) return;
                const lastState = this.state.history.pop();
                this.state.cards = lastState.cards;
                this.state.selectedCardId = null;
                this.state.selectedOp = null;
                this.updateUI();
                this.setInstruction(lastState.instruction);
            }

            checkWin() {
                if (this.state.cards.length === 1) {
                    const finalCard = this.state.cards[0];
                    if (Math.abs(finalCard.val - 24) < 0.0001) {
                        this.handleWin();
                    } else {
                        this.setInstruction('结果不是 24，请撤销重试');
                    }
                } else {
                    this.setInstruction('继续计算...');
                }
            }

            handleWin() {
                this.showMessage('🎉 恭喜！计算成功！', 'success');
                this.state.score += 10 + (this.state.streak * 2);
                this.state.streak++;
                this.state.questionCount++;
                this.updateStats();
                
                setTimeout(() => {
                    this.startNewRound();
                }, 1500);
            }

            updateUI() {
                // Render Cards
                this.dom.cards.innerHTML = '';
                this.state.cards.forEach(card => {
                    const el = document.createElement('div');
                    el.className = `card ${this.state.selectedCardId === card.id ? 'selected' : ''}`;
                    // Style merged cards differently? Maybe not needed, uniform look is fine.
                    // If it's a merged card (no rank), show center value prominently
                    const isRed = card.suit === '♥' || card.suit === '♦';
                    if (isRed) el.classList.add('suit-red');
                    else el.classList.add('suit-black');

                    // Display float with max 2 decimals if not integer
                    const displayVal = Number.isInteger(card.val) ? card.val : card.val.toFixed(2).replace(/\.00$/, '');

                    el.innerHTML = `
                        <div class="card-corner top-left">
                            <span>${card.rank || ''}</span>
                            <span>${card.suit}</span>
                        </div>
                        <div class="card-center">${displayVal}</div>
                        <div class="card-corner bottom-right">
                            <span>${card.rank || ''}</span>
                            <span>${card.suit}</span>
                        </div>
                    `;
                    el.onclick = () => this.handleCardClick(card.id);
                    this.dom.cards.appendChild(el);
                });

                // Highlight Operators
                this.dom.ops.forEach(btn => {
                    if (btn.dataset.op === this.state.selectedOp) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            setInstruction(text) {
                this.dom.instruction.textContent = text;
            }

            getCardRank(num) {
                if (num === 1) return 'A';
                if (num === 11) return 'J';
                if (num === 12) return 'Q';
                if (num === 13) return 'K';
                return num;
            }

            // Solver (Same as before)
            solve24(nums) {
                const EPSILON = 0.0001;
                const ops = [
                    { sym: '+', apply: (a, b) => a + b },
                    { sym: '-', apply: (a, b) => a - b },
                    { sym: '*', apply: (a, b) => a * b },
                    { sym: '/', apply: (a, b) => {
                        // Integer division only: non-zero divisor and no remainder
                        if (Math.abs(b) < EPSILON) return null;
                        if (a % b !== 0) return null;
                        return a / b;
                    }},
                ];

                const solve = (list) => {
                    if (list.length === 1) {
                        if (Math.abs(list[0].val - 24) < EPSILON) return list[0].expr;
                        return null;
                    }
                    for (let i = 0; i < list.length; i++) {
                        for (let j = 0; j < list.length; j++) {
                            if (i === j) continue;
                            const a = list[i];
                            const b = list[j];
                            const remaining = list.filter((_, idx) => idx !== i && idx !== j);
                            for (const op of ops) {
                                const newVal = op.apply(a.val, b.val);
                                if (newVal === null) continue;

                                const newExpr = `(${a.expr}${op.sym}${b.expr})`;
                                const res = solve([...remaining, { val: newVal, expr: newExpr }]);
                                if (res) return res;
                            }
                        }
                    }
                    return null;
                };
                return solve(nums.map(n => ({ val: n, expr: n.toString() })));
            }

            showHint() {
                if (this.state.solution) {
                    const displaySol = this.state.solution
                        .replace(/\*/g, '×')
                        .replace(/\//g, '÷');
                    this.showMessage(`参考答案: ${displaySol}`, 'info');
                    this.state.streak = 0;
                    this.updateStats();
                } else {
                    this.showMessage('计算中...', 'info');
                }
            }

            showMessage(text, type) {
                this.dom.message.textContent = text;
                this.dom.message.className = `message show msg-${type}`;
                setTimeout(() => this.dom.message.classList.remove('show'), 3000);
            }

            updateStats() {
                this.dom.score.textContent = this.state.score;
                this.dom.streak.textContent = this.state.streak;
                this.dom.questionCount.textContent = this.state.questionCount;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new Game24();
        });
    </script>
</body>
</html>
