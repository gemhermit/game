    <script>
        class SudokuGame {
            constructor() {
                this.grid = []; // Current state
                this.solution = []; // Solution
                this.given = []; // Initial fixed cells
                this.notes = []; // Notes for each cell
                this.history = []; // Undo stack
                
                this.selectedCell = null; // {r, c}
                this.difficulty = 'easy';
                this.timer = null;
                this.startTime = 0;
                this.errors = 0;
                this.maxErrors = 3;
                this.isNotesMode = false;
                this.realTimeCheck = false; // Default off
                this.isGameOver = false;

                this.dom = {
                    grid: document.getElementById('grid'),
                    timer: document.getElementById('timer'),
                    errors: document.getElementById('errors'),
                    diffDisplay: document.getElementById('difficulty-display'),
                    notesToggle: document.getElementById('notesMode'),
                    checkToggle: document.getElementById('realTimeCheck'),
                    diffBtns: document.querySelectorAll('.difficulty-btn'),
                    numBtns: document.querySelectorAll('.num-btn'),
                    newGameBtn: document.getElementById('newGameBtn'),
                    restartBtn: document.getElementById('restartBtn'),
                    checkBtn: document.getElementById('checkBtn'),
                    undoBtn: document.getElementById('undoBtn'),
                    hintBtn: document.getElementById('hintBtn'),
                    modal: document.getElementById('modalOverlay'),
                    modalTitle: document.getElementById('modalTitle'),
                    modalText: document.getElementById('modalText'),
                    modalBtn: document.getElementById('modalBtn')
                };

                this.init();
            }

            init() {
                this.bindEvents();
                this.startNewGame();
            }

            bindEvents() {
                // Difficulty Selection
                this.dom.diffBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.dom.diffBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.difficulty = btn.dataset.level;
                        this.startNewGame();
                    });
                });

                // Controls
                this.dom.newGameBtn.addEventListener('click', () => this.startNewGame());
                this.dom.restartBtn.addEventListener('click', () => this.restartLevel());
                this.dom.checkBtn.addEventListener('click', () => this.checkBoard());
                this.dom.undoBtn.addEventListener('click', () => this.undo());
                this.dom.hintBtn.addEventListener('click', () => this.getHint());
                this.dom.modalBtn.addEventListener('click', () => {
                    this.dom.modal.classList.remove('active');
                    this.startNewGame();
                });
                
                this.dom.notesToggle.addEventListener('change', (e) => {
                    this.isNotesMode = e.target.checked;
                });

                this.dom.checkToggle.addEventListener('change', (e) => {
                    this.realTimeCheck = e.target.checked;
                    this.updateErrorDisplay();
                    // If turned on, check existing errors? Or just start checking from now?
                    // Let's clear visual errors when toggled
                    if (!this.realTimeCheck) {
                         const cells = this.dom.grid.children;
                         for(let i=0; i<81; i++) cells[i].classList.remove('error');
                    }
                });

                // Numpad
                this.dom.numBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        const val = btn.dataset.num;
                        if (val === 'clear') this.handleInput(0);
                        else this.handleInput(parseInt(val));
                    });
                });

                // Keyboard
                document.addEventListener('keydown', (e) => this.handleKeydown(e));
            }

            startNewGame() {
                this.isGameOver = false;
                this.errors = 0;
                this.history = [];
                this.grid = Array(9).fill().map(() => Array(9).fill(0));
                this.notes = Array(9).fill().map(() => Array(9).fill().map(() => new Set()));
                this.given = Array(9).fill().map(() => Array(9).fill(false));
                this.dom.modal.classList.remove('active');
                
                this.dom.diffDisplay.textContent = {
                    easy: '简单', medium: '中等', hard: '困难', expert: '专家'
                }[this.difficulty];
                
                this.updateErrorDisplay();
                this.generatePuzzle();
                this.renderGrid();
                this.startTimer();
                this.selectCell(0, 0);
            }

            restartLevel() {
                this.isGameOver = false;
                this.errors = 0;
                this.history = [];
                this.updateErrorDisplay();
                this.dom.modal.classList.remove('active');
                
                // Reset grid to given
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        if (!this.given[r][c]) {
                            this.grid[r][c] = 0;
                            this.notes[r][c].clear();
                        }
                    }
                }
                this.renderGrid();
                this.startTimer();
            }

            generatePuzzle() {
                // Simplified generator
                // 1. Generate full valid board
                this.fillDiagonal();
                this.solve(this.grid);
                this.solution = this.grid.map(row => [...row]);
                
                // 2. Remove cells based on difficulty
                const attempts = {
                    easy: 30, medium: 45, hard: 55, expert: 65
                }[this.difficulty];
                
                let count = attempts;
                while (count > 0) {
                    let r = Math.floor(Math.random() * 9);
                    let c = Math.floor(Math.random() * 9);
                    if (this.grid[r][c] !== 0) {
                        this.grid[r][c] = 0;
                        count--;
                    }
                }

                // 3. Mark given cells
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        if (this.grid[r][c] !== 0) {
                            this.given[r][c] = true;
                        }
                    }
                }
            }

            fillDiagonal() {
                for (let i = 0; i < 9; i = i + 3) {
                    this.fillBox(i, i);
                }
            }

            fillBox(row, col) {
                let num;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        do {
                            num = Math.floor(Math.random() * 9) + 1;
                        } while (!this.isSafeInBox(row, col, num));
                        this.grid[row + i][col + j] = num;
                    }
                }
            }

            isSafeInBox(rowStart, colStart, num) {
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (this.grid[rowStart + i][colStart + j] === num) {
                            return false;
                        }
                    }
                }
                return true;
            }

            isSafe(grid, row, col, num) {
                for (let x = 0; x < 9; x++) {
                    if (grid[row][x] === num) return false;
                }
                for (let x = 0; x < 9; x++) {
                    if (grid[x][col] === num) return false;
                }
                let startRow = row - row % 3, startCol = col - col % 3;
                for (let i = 0; i < 3; i++) {
                    for (let j = 0; j < 3; j++) {
                        if (grid[i + startRow][j + startCol] === num) return false;
                    }
                }
                return true;
            }

            solve(grid) {
                let row = -1, col = -1, isEmpty = true;
                for (let i = 0; i < 9; i++) {
                    for (let j = 0; j < 9; j++) {
                        if (grid[i][j] === 0) {
                            row = i;
                            col = j;
                            isEmpty = false;
                            break;
                        }
                    }
                    if (!isEmpty) break;
                }
                if (isEmpty) return true;

                for (let num = 1; num <= 9; num++) {
                    if (this.isSafe(grid, row, col, num)) {
                        grid[row][col] = num;
                        if (this.solve(grid)) return true;
                        grid[row][col] = 0;
                    }
                }
                return false;
            }

            renderGrid() {
                this.dom.grid.innerHTML = '';
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        
                        const val = this.grid[r][c];
                        if (val !== 0) {
                            cell.textContent = val;
                            if (this.given[r][c]) cell.classList.add('given');
                            else cell.classList.add('input');
                        } else {
                            // Render Notes
                            if (this.notes[r][c].size > 0) {
                                const noteGrid = document.createElement('div');
                                noteGrid.className = 'notes-grid';
                                for(let n=1; n<=9; n++) {
                                    const noteNum = document.createElement('div');
                                    noteNum.className = 'note-num';
                                    if (this.notes[r][c].has(n)) noteNum.textContent = n;
                                    noteGrid.appendChild(noteNum);
                                }
                                cell.appendChild(noteGrid);
                            }
                        }

                        cell.addEventListener('click', () => this.selectCell(r, c));
                        this.dom.grid.appendChild(cell);
                    }
                }
                this.updateHighlights();
            }

            selectCell(r, c) {
                this.selectedCell = {r, c};
                this.updateHighlights();
            }

            updateHighlights() {
                if (!this.selectedCell) return;
                const {r, c} = this.selectedCell;
                const selectedVal = this.grid[r][c];

                const cells = this.dom.grid.children;
                for(let i=0; i<81; i++) {
                    const cell = cells[i];
                    const cr = parseInt(cell.dataset.r);
                    const cc = parseInt(cell.dataset.c);
                    
                    cell.classList.remove('selected', 'highlight', 'same-number');
                    
                    if (cr === r && cc === c) {
                        cell.classList.add('selected');
                    } else if (cr === r || cc === c || (Math.floor(cr/3) === Math.floor(r/3) && Math.floor(cc/3) === Math.floor(c/3))) {
                        cell.classList.add('highlight');
                    }

                    if (selectedVal !== 0 && this.grid[cr][cc] === selectedVal) {
                        cell.classList.add('same-number');
                    }
                }
            }

            handleKeydown(e) {
                if (this.isGameOver) return;
                
                // Navigation
                if (this.selectedCell) {
                    let {r, c} = this.selectedCell;
                    if (e.key === 'ArrowUp') r = Math.max(0, r-1);
                    if (e.key === 'ArrowDown') r = Math.min(8, r+1);
                    if (e.key === 'ArrowLeft') c = Math.max(0, c-1);
                    if (e.key === 'ArrowRight') c = Math.min(8, c+1);
                    if (r !== this.selectedCell.r || c !== this.selectedCell.c) {
                        this.selectCell(r, c);
                        e.preventDefault();
                        return;
                    }
                }

                // Numbers
                if (e.key >= '1' && e.key <= '9') {
                    this.handleInput(parseInt(e.key));
                } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                    this.handleInput(0);
                } else if (e.key.toLowerCase() === 'n') {
                    this.isNotesMode = !this.isNotesMode;
                    this.dom.notesToggle.checked = this.isNotesMode;
                } else if (e.key === 'z' && (e.ctrlKey || e.metaKey)) {
                    this.undo();
                }
            }

            handleInput(num) {
                if (this.isGameOver || !this.selectedCell) return;
                const {r, c} = this.selectedCell;
                if (this.given[r][c]) return;

                // Save state for undo
                this.history.push({
                    r, c, 
                    prevVal: this.grid[r][c], 
                    prevNotes: new Set(this.notes[r][c])
                });

                if (this.isNotesMode && num !== 0) {
                    // Toggle note
                    if (this.notes[r][c].has(num)) this.notes[r][c].delete(num);
                    else this.notes[r][c].add(num);
                } else {
                    if (num !== 0 && this.realTimeCheck) {
                        // Check validity immediately only if realTimeCheck is true
                        if (num !== this.solution[r][c]) {
                            this.errors++;
                            this.updateErrorDisplay();
                            // Visual feedback
                            const index = r * 9 + c;
                            this.dom.grid.children[index].classList.add('error');
                            setTimeout(() => this.dom.grid.children[index].classList.remove('error'), 1000);
                            
                            if (this.errors >= this.maxErrors) {
                                this.gameOver(false);
                                return;
                            }
                            return; // Don't fill if wrong in strict mode
                        }
                    }
                    
                    this.grid[r][c] = num;
                    this.notes[r][c].clear(); // Clear notes on input
                    
                    // Auto check win if board is full
                    if (this.isBoardFull()) {
                        if (this.checkWin()) {
                            this.gameOver(true);
                        }
                    }
                }
                
                this.renderGrid();
                // Restore selection focus
                this.selectCell(r, c);
            }

            checkBoard() {
                if (this.isGameOver) return;
                
                let hasErrors = false;
                const cells = this.dom.grid.children;
                
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        const val = this.grid[r][c];
                        if (val !== 0 && val !== this.solution[r][c]) {
                            hasErrors = true;
                            const index = r * 9 + c;
                            cells[index].classList.add('error');
                            // Optional: auto-remove error class after delay? 
                            // Or keep it until user changes it?
                            // Let's keep it but remove on next input
                        }
                    }
                }
                
                if (hasErrors) {
                    // Flash message or alert? 
                    // Let's just rely on the red cells
                } else {
                    if (this.isBoardFull()) {
                        this.gameOver(true);
                    } else {
                        // Show "Looks good so far" message?
                    }
                }
            }
            
            isBoardFull() {
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        if (this.grid[r][c] === 0) return false;
                    }
                }
                return true;
            }
            undo() {
                if (this.history.length === 0 || this.isGameOver) return;
                const action = this.history.pop();
                this.grid[action.r][action.c] = action.prevVal;
                this.notes[action.r][action.c] = action.prevNotes;
                this.renderGrid();
                this.selectCell(action.r, action.c);
            }

            getHint() {
                if (this.isGameOver) return;
                // Find an empty cell
                let empty = [];
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        if (this.grid[r][c] === 0) empty.push({r, c});
                    }
                }
                if (empty.length === 0) return;
                
                const target = empty[Math.floor(Math.random() * empty.length)];
                this.grid[target.r][target.c] = this.solution[target.r][target.c];
                this.notes[target.r][target.c].clear();
                
                this.renderGrid();
                this.selectCell(target.r, target.c);
                if (this.checkWin()) this.gameOver(true);
            }

            checkWin() {
                for(let r=0; r<9; r++) {
                    for(let c=0; c<9; c++) {
                        if (this.grid[r][c] !== this.solution[r][c]) return false;
                    }
                }
                return true;
            }

            gameOver(win) {
                this.isGameOver = true;
                clearInterval(this.timer);
                
                this.dom.modalTitle.textContent = win ? '🎉 恭喜通关！' : '💔 游戏结束';
                this.dom.modalText.textContent = win 
                    ? `用时: ${this.dom.timer.textContent}\n难度: ${this.dom.diffDisplay.textContent}`
                    : '错误次数过多，请再接再厉！';
                this.dom.modal.classList.add('active');
            }

            startTimer() {
                if (this.timer) clearInterval(this.timer);
                this.startTime = Date.now();
                this.timer = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.startTime) / 1000);
                    const mins = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const secs = (elapsed % 60).toString().padStart(2, '0');
                    this.dom.timer.textContent = `${mins}:${secs}`;
                }, 1000);
            }

            updateErrorDisplay() {
                if (this.realTimeCheck) {
                    this.dom.errors.textContent = `${this.errors}/${this.maxErrors}`;
                } else {
                    this.dom.errors.textContent = `${this.errors}`;
                }
            }
        }

        new SudokuGame();
    </script>
</body>
</html>
