<body>
    <!-- Sidebar Controls -->
    <div class="sidebar">

                        <span>电阻 R2</span>

                <div class="slider-group" id="group-r3" style="display:none;">

    <script>
        /**
         * Circuit Game Logic
         * Handles simulation, physics, and rendering
         */
        class CircuitGame {
            constructor() {
                this.canvas = document.getElementById('circuitCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.animationId = null;
                
                // Simulation State
                this.type = 'series';
                this.params = {
                    voltage: 9,
                    r1: 10,
                    r2: 10,
                    r3: 10,
                    bulbR: 5 // Fixed bulb resistance for physics accuracy
                };
                this.switches = {
                    main: true,
                    s1: true,
                    s2: true
                };
                this.physics = {
                    current: 0,
                    totalR: 0,
                    power: 0,
                    isLit: false,
                    components: {} // Stores {v, i, p} for each component ID
                };

                // Definitions
                this.definitions = this.getDefinitions();
                
                // Rendering State
                this.scale = 1;
                this.offsetX = 0;
                this.offsetY = 0;
                this.time = 0;
                this.showReadings = false; // Toggle for showing V/I readings

                this.init();
            }

            getDefinitions() {
                return {
                    series: {
                        name: '串联电路',
                        theory: [
                            '电流：处处相等 (I = I₁ = I₂)',
                            '电压：U = U₁ + U₂ + U_灯',
                            '电阻：R_总 = R₁ + R₂ + R_灯'
                        ],
                        components: [
                            { type: 'battery', x: 0, y: 200, w: 60, h: 30, id: 'bat' },
                            { type: 'switch', x: 0, y: 100, w: 40, h: 20, id: 'main' },
                            { type: 'resistor', x: 100, y: 100, w: 60, h: 20, id: 'r1' },
                            { type: 'resistor', x: 200, y: 100, w: 60, h: 20, id: 'r2' },
                            { type: 'bulb', x: 300, y: 100, w: 40, h: 40, id: 'bulb' }
                        ],
                        wires: [
                            [0, 200, 0, 120], // Battery+ to Switch
                            [0, 100, 0, 100], // Switch internal (handled by component)
                            [0, 100, 100, 100], // Switch to R1
                            [160, 100, 200, 100], // R1 to R2
                            [260, 100, 300, 100], // R2 to Bulb
                            [340, 100, 380, 100], // Bulb to right
                            [380, 100, 380, 200], // Right down (to 200)
                            [380, 200, 60, 200]   // Bottom return (to Battery Center)
                        ],
                        bbox: { x: -20, y: 80, w: 420, h: 160 }
                    },
                    parallel: {
                        name: '并联电路',
                        theory: [
                            '电压：各支路电压相等 (U = U₁ = U₂)',
                            '电流：干路电流等于支路电流之和',
                            '电阻：1/R_并 = 1/R₁ + 1/R₂'
                        ],
                        components: [
                            { type: 'battery', x: 50, y: 250, w: 60, h: 30, id: 'bat' },
                            { type: 'switch', x: 50, y: 150, w: 40, h: 20, id: 'main' },
                            { type: 'resistor', x: 200, y: 80, w: 60, h: 20, id: 'r1' },
                            { type: 'resistor', x: 200, y: 180, w: 60, h: 20, id: 'r2' },
                            { type: 'bulb', x: 350, y: 130, w: 40, h: 40, id: 'bulb' }
                        ],
                        wires: [
                            [80, 250, 80, 170], // Bat to Switch (Start from Center 80)
                            [80, 150, 150, 150], // Switch to Split
                            [150, 150, 150, 80], // Split up (To y=80)
                            [150, 80, 200, 80],  // To R1 (R1 y=80)
                            [150, 150, 150, 180], // Split down (To y=180)
                            [150, 180, 200, 180], // To R2 (R2 y=180)
                            [260, 80, 300, 80],   // R1 out
                            [260, 180, 300, 180], // R2 out
                            [300, 80, 300, 180],  // Join vertical
                            [300, 130, 350, 130], // Join to Bulb (Bulb y=130)
                            [390, 130, 420, 130], // Bulb out
                            [420, 130, 420, 250], // Right down
                            [420, 250, 110, 250]  // Return
                        ],
                        bbox: { x: 30, y: 60, w: 410, h: 220 }
                    },
                    mixed: {
                        name: '混联电路',
                        theory: [
                            '结构：R2与R3并联，再与R1串联',
                            '计算：先算并联部分等效电阻',
                            'R_总 = R₁ + (R₂//R₃) + R_灯'
                        ],
                        components: [
                            { type: 'battery', x: 50, y: 250, w: 60, h: 30, id: 'bat' },
                            { type: 'switch', x: 50, y: 150, w: 40, h: 20, id: 'main' },
                            { type: 'resistor', x: 140, y: 150, w: 60, h: 20, id: 'r1' },
                            { type: 'resistor', x: 280, y: 80, w: 60, h: 20, id: 'r2' },
                            { type: 'resistor', x: 280, y: 220, w: 60, h: 20, id: 'r3' },
                            { type: 'bulb', x: 400, y: 150, w: 40, h: 40, id: 'bulb' }
                        ],
                        wires: [
                            [80, 250, 80, 170], // Bat to Switch
                            [80, 150, 140, 150], // Switch to R1
                            [200, 150, 240, 150], // R1 to Split
                            [240, 150, 240, 80],  // Split up (To y=80)
                            [240, 80, 280, 80],   // To R2 (R2 y=80)
                            [240, 150, 240, 220], // Split down (To y=220)
                            [240, 220, 280, 220], // To R3 (R3 y=220)
                            [340, 80, 370, 80],   // R2 out
                            [340, 220, 370, 220], // R3 out
                            [370, 80, 370, 220],  // Join vertical
                            [370, 150, 400, 150], // Join to Bulb (Bulb y=150)
                            [440, 150, 460, 150], // Bulb out
                            [460, 150, 460, 250], // Right down
                            [460, 250, 110, 250]  // Return
                        ],
                        bbox: { x: 30, y: 60, w: 450, h: 220 }
                    },
                    simple: {
                        name: '简单电路',
                        theory: [
                            '最基础的电路结构',
                            '欧姆定律：I = U / R',
                            '电功率：P = U × I'
                        ],
                        components: [
                            { type: 'battery', x: 50, y: 200, w: 60, h: 30, id: 'bat' },
                            { type: 'switch', x: 150, y: 100, w: 40, h: 20, id: 'main' },
                            { type: 'resistor', x: 250, y: 100, w: 60, h: 20, id: 'r1' },
                            { type: 'bulb', x: 350, y: 100, w: 40, h: 40, id: 'bulb' }
                        ],
                        wires: [
                            [80, 200, 80, 100], // Bat to Switch (To y=100)
                            [80, 100, 150, 100], // Switch to Split (Switch y=100)
                            [190, 100, 250, 100], // Switch to R1 (R1 y=100)
                            [310, 100, 350, 100], // R1 to Bulb (Bulb y=100)
                            [390, 100, 420, 100], // Bulb out
                            [420, 100, 420, 200], // Right down
                            [420, 200, 110, 200]  // Return
                        ],
                        bbox: { x: 30, y: 80, w: 400, h: 150 }
                    }
                };
            }

            init() {
                this.bindEvents();
                window.addEventListener('resize', () => this.resize());
                this.resize();
                this.updateUI();
                this.animate();
            }

            bindEvents() {
                // Circuit Types
                document.querySelectorAll('.circuit-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.circuit-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.type = e.target.dataset.type;
                        
                        // Update UI controls visibility
                        document.getElementById('group-r2').style.display = 
                            ['series', 'parallel', 'mixed'].includes(this.type) ? 'block' : 'none';
                        document.getElementById('group-r3').style.display = 
                            this.type === 'mixed' ? 'block' : 'none';
                        
                        // Handle switches visibility if needed (simplified for now)
                        
                        this.resize(); // Recalculate layout
                        this.updateUI();
                    });
                });

                // Sliders
                const sliders = {
                    'input-voltage': 'voltage',
                    'input-r1': 'r1',
                    'input-r2': 'r2',
                    'input-r3': 'r3'
                };

                for (const [id, param] of Object.entries(sliders)) {
                    const el = document.getElementById(id);
                    el.addEventListener('input', (e) => {
                        this.params[param] = parseFloat(e.target.value);
                        document.getElementById(id.replace('input', 'val')).textContent = 
                            this.params[param] + (param === 'voltage' ? 'V' : 'Ω');
                        this.calculatePhysics();
                    });
                }

                // Switches
                document.getElementById('btn-main-switch').addEventListener('click', (e) => {
                    this.toggleSwitch('main', e.currentTarget);
                });
                
                // Extra switches placeholders (logic can be expanded)
                document.getElementById('btn-switch-1').style.display = 'none'; // Simplify for now

                // Show Readings Toggle
                const toggleContainer = document.createElement('div');
                toggleContainer.className = 'control-section';
                toggleContainer.innerHTML = `
                    <div class="switch-container">
                        <div class="toggle-btn" id="btn-show-readings">
                            <span class="toggle-label">显示分支读数</span>
                            <span class="toggle-status">隐藏</span>
                        </div>
                    </div>
                `;
                document.querySelector('.sidebar-content').appendChild(toggleContainer);

                document.getElementById('btn-show-readings').addEventListener('click', (e) => {
                    this.showReadings = !this.showReadings;
                    const el = e.currentTarget;
                    el.classList.toggle('active');
                    const status = el.querySelector('.toggle-status');
                    status.textContent = this.showReadings ? '显示' : '隐藏';
                    status.style.background = this.showReadings ? 'var(--success-color)' : '#cbd5e1';
                    status.style.color = this.showReadings ? 'white' : '#64748b';
                    this.draw();
                });
            }

            toggleSwitch(id, el) {
                this.switches[id] = !this.switches[id];
                el.classList.toggle('active');
                el.classList.toggle('inactive');
                const status = el.querySelector('.toggle-status');
                status.textContent = this.switches[id] ? '闭合' : '断开';
                this.calculatePhysics();
            }

            resize() {
                const parent = this.canvas.parentElement;
                this.canvas.width = parent.clientWidth;
                this.canvas.height = parent.clientHeight;

                // Calculate scale to fit circuit
                const def = this.definitions[this.type];
                const padding = 50;
                const availW = this.canvas.width - padding * 2;
                const availH = this.canvas.height - padding * 2;
                
                const scaleX = availW / def.bbox.w;
                const scaleY = availH / def.bbox.h;
                this.scale = Math.min(scaleX, scaleY, 2.5); // Max scale 2.5
                
                this.offsetX = (this.canvas.width - def.bbox.w * this.scale) / 2 - def.bbox.x * this.scale;
                this.offsetY = (this.canvas.height - def.bbox.h * this.scale) / 2 - def.bbox.y * this.scale;
                
                this.calculatePhysics();
            }

            calculatePhysics() {
                const p = this.params;
                const s = this.switches;
                
                // Reset component data
                this.physics.components = {};
                
                if (!s.main) {
                    this.physics = { 
                        current: 0, 
                        totalR: Infinity, 
                        power: 0, 
                        isLit: false,
                        components: {} 
                    };
                    return;
                }

                let rTotal = 0;
                let iTotal = 0;
                let iR1=0, iR2=0, iR3=0, iBulb=0;
                let vR1=0, vR2=0, vR3=0, vBulb=0;
                
                // Helper to save component state
                const saveComp = (id, v, i) => {
                    this.physics.components[id] = { v: v, i: i, p: v*i };
                };

                // Battery always has full voltage (simplified model)
                saveComp('bat', p.voltage, 0); // Current will be updated later

                switch(this.type) {
                    case 'series':
                        // R1 + R2 + Bulb
                        rTotal = p.r1 + p.r2 + p.bulbR;
                        iTotal = p.voltage / rTotal;
                        
                        iR1 = iR2 = iBulb = iTotal;
                        vR1 = iTotal * p.r1;
                        vR2 = iTotal * p.r2;
                        vBulb = iTotal * p.bulbR;
                        
                        saveComp('r1', vR1, iR1);
                        saveComp('r2', vR2, iR2);
                        saveComp('bulb', vBulb, iBulb);
                        break;

                    case 'parallel':
                        // (R1 // R2) + Bulb
                        // Note: Diagram shows Bulb is in series with the parallel pair?
                        // Let's re-read getDefinitions visual structure:
                        // Switch -> Split -> (R1 // R2) -> Join -> Bulb -> Return
                        // Yes, (R1 // R2) is in series with Bulb.
                        
                        const rPar = 1 / (1/p.r1 + 1/p.r2);
                        rTotal = rPar + p.bulbR;
                        iTotal = p.voltage / rTotal;
                        
                        const vPar = iTotal * rPar; // Voltage across parallel part
                        vBulb = iTotal * p.bulbR;
                        
                        vR1 = vR2 = vPar;
                        iR1 = vPar / p.r1;
                        iR2 = vPar / p.r2;
                        iBulb = iTotal;
                        
                        saveComp('r1', vR1, iR1);
                        saveComp('r2', vR2, iR2);
                        saveComp('bulb', vBulb, iBulb);
                        break;

                    case 'mixed':
                        // Visual: Switch -> R1 -> Split -> (R2 // R3) -> Join -> Bulb -> Return
                        // So: R1 + (R2 // R3) + Bulb
                        
                        const rMix = 1 / (1/p.r2 + 1/p.r3);
                        rTotal = p.r1 + rMix + p.bulbR;
                        iTotal = p.voltage / rTotal;
                        
                        vR1 = iTotal * p.r1;
                        const vMix = iTotal * rMix;
                        vBulb = iTotal * p.bulbR;
                        
                        vR2 = vR3 = vMix;
                        iR2 = vMix / p.r2;
                        iR3 = vMix / p.r3;
                        iR1 = iBulb = iTotal;
                        
                        saveComp('r1', vR1, iR1);
                        saveComp('r2', vR2, iR2);
                        saveComp('r3', vR3, iR3);
                        saveComp('bulb', vBulb, iBulb);
                        break;

                    case 'simple':
                        // R1 + Bulb
                        rTotal = p.r1 + p.bulbR;
                        iTotal = p.voltage / rTotal;
                        
                        iR1 = iBulb = iTotal;
                        vR1 = iTotal * p.r1;
                        vBulb = iTotal * p.bulbR;
                        
                        saveComp('r1', vR1, iR1);
                        saveComp('bulb', vBulb, iBulb);
                        break;
                }
                
                // Update Battery Current
                this.physics.components['bat'].i = iTotal;
                this.physics.components['bat'].p = p.voltage * iTotal;
                
                const power = p.voltage * iTotal;
                
                this.physics = {
                    ...this.physics,
                    current: iTotal,
                    totalR: rTotal,
                    power: power,
                    isLit: iTotal > 0.05
                };
                
                this.updateUI();
            }

            updateUI() {
                // Update stats
                document.getElementById('disp-voltage').textContent = this.params.voltage;
                document.getElementById('disp-current').textContent = this.physics.current.toFixed(2);
                document.getElementById('disp-resistance').textContent = 
                    this.physics.totalR === Infinity ? '∞' : this.physics.totalR.toFixed(1);
                document.getElementById('disp-power').textContent = this.physics.power.toFixed(1);

                // Update Theory Box
                const def = this.definitions[this.type];
                const theoryBox = document.getElementById('theoryBox');
                theoryBox.querySelector('.theory-title').textContent = def.name + '特点';
                const ul = theoryBox.querySelector('ul');
                ul.innerHTML = def.theory.map(t => `<li>${t}</li>`).join('');
            }

            draw() {
                const ctx = this.ctx;
                const def = this.definitions[this.type];
                
                ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                ctx.save();
                ctx.translate(this.offsetX, this.offsetY);
                ctx.scale(this.scale, this.scale);

                const isOn = this.physics.current > 0.01;

                // Draw Wires
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                def.wires.forEach(wire => {
                    // Wire
                    ctx.beginPath();
                    ctx.strokeStyle = isOn ? '#475569' : '#64748b';
                    ctx.lineWidth = 4;
                    ctx.moveTo(wire[0], wire[1]);
                    ctx.lineTo(wire[2], wire[3]);
                    ctx.stroke();

                    // Current Animation
                    if (isOn) {
                        const x1 = wire[0], y1 = wire[1], x2 = wire[2], y2 = wire[3];
                        const dist = Math.sqrt((x2-x1)**2 + (y2-y1)**2);
                        const speed = Math.min(this.physics.current * 20, 100); // Speed proportional to current
                        const offset = (this.time * speed) % dist;
                        
                        // Calculate moving dot position
                        const ratio = offset / dist;
                        const dx = x2 - x1;
                        const dy = y2 - y1;
                        
                        ctx.fillStyle = '#facc15'; // Yellow electrons
                        ctx.beginPath();
                        ctx.arc(x1 + dx*ratio, y1 + dy*ratio, 3, 0, Math.PI*2);
                        ctx.fill();
                    }
                });

                // Draw Components
                def.components.forEach(comp => {
                    ctx.save();
                    // Center component vertically on the wire (y - h/2)
                    ctx.translate(comp.x, comp.y - comp.h/2);

                    switch(comp.type) {
                        case 'battery':
                            this.drawBattery(ctx, comp.w, comp.h);
                            break;
                        case 'resistor':
                            this.drawResistor(ctx, comp.w, comp.h, comp.id);
                            break;
                        case 'bulb':
                            this.drawBulb(ctx, comp.w, comp.h);
                            break;
                        case 'switch':
                            this.drawSwitch(ctx, comp.w, comp.h, comp.id);
                            break;
                    }
                    
                    // Draw Component Readings if enabled
                    if (this.showReadings && comp.id && this.physics.components[comp.id]) {
                        this.drawComponentReadings(ctx, comp.w, comp.h, this.physics.components[comp.id]);
                    }

                    ctx.restore();
                });

                ctx.restore();
            }

            drawComponentReadings(ctx, w, h, data) {
                const text = `U:${data.v.toFixed(1)}V I:${data.i.toFixed(2)}A`;
                
                ctx.save();
                ctx.font = 'bold 12px Arial';
                const metrics = ctx.measureText(text);
                const padding = 4;
                const bgW = metrics.width + padding * 2;
                const bgH = 18;
                
                // Position above component
                const x = (w - bgW) / 2;
                const y = -bgH - 5;
                
                // Background
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.strokeStyle = '#2563eb';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.roundRect(x, y, bgW, bgH, 4);
                ctx.fill();
                ctx.stroke();
                
                // Text
                ctx.fillStyle = '#1e293b';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, x + padding, y + bgH/2);
                
                ctx.restore();
            }

            drawBattery(ctx, w, h) {
                // Main box
                ctx.fillStyle = '#fbbf24';
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.fillRect(0, 0, w, h);
                ctx.strokeRect(0, 0, w, h);
                
                // Labels
                ctx.fillStyle = '#000';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('+', w - 10, h/2);
                ctx.fillText('-', 10, h/2);
            }

            drawResistor(ctx, w, h, id) {
                // Body
                ctx.fillStyle = '#ef4444';
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.fillRect(0, 0, w, h);
                ctx.strokeRect(0, 0, w, h);

                // Bands (decoration)
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(10, 0, 5, h);
                ctx.fillRect(20, 0, 5, h);
                ctx.fillRect(w-15, 0, 5, h);

                // Value Label
                const val = this.params[id];
                ctx.fillStyle = '#fff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(val + 'Ω', w/2, h/2);
            }

            drawBulb(ctx, w, h) {
                const cx = w/2, cy = h/2, r = w/2 - 2;
                
                // Glow effect
                if (this.physics.isLit) {
                    const intensity = Math.min(this.physics.power / 50, 1); // Cap glow
                    ctx.shadowColor = '#facc15';
                    ctx.shadowBlur = 20 + intensity * 40;
                    ctx.fillStyle = '#fef08a';
                } else {
                    ctx.fillStyle = '#cbd5e1';
                }

                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0; // Reset shadow
                
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Filament
                ctx.beginPath();
                ctx.moveTo(cx - 5, cy + 5);
                ctx.lineTo(cx - 2, cy - 5);
                ctx.lineTo(cx + 2, cy + 5);
                ctx.lineTo(cx + 5, cy - 5);
                ctx.stroke();
            }

            drawSwitch(ctx, w, h, id) {
                const closed = this.switches[id];
                
                // Base points
                ctx.fillStyle = '#333';
                ctx.beginPath();
                ctx.arc(0, h/2, 3, 0, Math.PI*2);
                ctx.arc(w, h/2, 3, 0, Math.PI*2);
                ctx.fill();

                // Arm
                ctx.strokeStyle = closed ? '#22c55e' : '#ef4444';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, h/2);
                if (closed) {
                    ctx.lineTo(w, h/2);
                } else {
                    ctx.lineTo(w-5, 0); // Open up
                }
                ctx.stroke();
            }

            animate() {
                this.time = Date.now() / 1000;
                this.draw();
                this.animationId = requestAnimationFrame(() => this.animate());
            }
        }

        // Initialize
        window.onload = () => {
            new CircuitGame();
        };
    </script>
</body>
</html>
