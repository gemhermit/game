    <script>
        class SortingVisualizer {
            constructor() {
                this.array = [];
                this.arraySize = 20;
                this.speed = 5;
                this.currentAlgorithm = 'bubble';
                this.isRunning = false;
                this.isPaused = false;
                this.comparisons = 0;
                this.swaps = 0;
                this.animationId = null;
                this.startTime = 0;
                this.timerInterval = null;

                this.algorithmInfo = {
                    bubble: {
                        name: '冒泡排序',
                        icon: '🌊',
                        desc: '重复遍历数组，比较相邻元素，顺序错误则交换。每轮将最大元素"冒泡"到末尾。',
                        timeComplexity: 'O(n²)',
                        spaceComplexity: 'O(1)',
                        color: 'linear-gradient(135deg, #ff7675, #d63031)'
                    },
                    selection: {
                        name: '选择排序',
                        icon: '🎯',
                        desc: '从未排序区间选出最小元素，放到已排序区间的末尾。重复直到全部有序。',
                        timeComplexity: 'O(n²)',
                        spaceComplexity: 'O(1)',
                        color: 'linear-gradient(135deg, #fd79a8, #e84393)'
                    },
                    insertion: {
                        name: '插入排序',
                        icon: '🃏',
                        desc: '将元素逐个插入已排序序列的正确位置。类似于整理扑克牌的方式。',
                        timeComplexity: 'O(n²)',
                        spaceComplexity: 'O(1)',
                        color: 'linear-gradient(135deg, #ffeaa7, #fdcb6e)'
                    },
                    shell: {
                        name: '希尔排序',
                        icon: '📊',
                        desc: '插入排序的改进版，通过将数组分成多个子序列进行插入排序，逐步缩小间隔直到1。',
                        timeComplexity: 'O(n^{1.5})',
                        spaceComplexity: 'O(1)',
                        color: 'linear-gradient(135deg, #74b9ff, #0984e3)'
                    },
                    heap: {
                        name: '堆排序',
                        icon: '🌳',
                        desc: '利用二叉堆数据结构，先构建最大堆，然后重复取出堆顶元素并调整堆。',
                        timeComplexity: 'O(n log n)',
                        spaceComplexity: 'O(1)',
                        color: 'linear-gradient(135deg, #00b894, #00a085)'
                    },
                    quick: {
                        name: '快速排序',
                        icon: '⚡',
                        desc: '选择一个基准元素，将数组分为小于和大于基准的两部分，递归排序。',
                        timeComplexity: 'O(n log n)',
                        spaceComplexity: 'O(log n)',
                        color: 'linear-gradient(135deg, #a29bfe, #6c5ce7)'
                    },
                    merge: {
                        name: '归并排序',
                        icon: '🔀',
                        desc: '将数组递归分割成单元素，再合并成有序数组。稳定且高效的分治算法。',
                        timeComplexity: 'O(n log n)',
                        spaceComplexity: 'O(n)',
                        color: 'linear-gradient(135deg, #fd79a8, #e84393)'
                    },
                    radix: {
                        name: '计数排序',
                        icon: '🔢',
                        desc: '非比较型排序，统计每个元素出现的次数，然后按计数输出。适合整数排序。',
                        timeComplexity: 'O(n+k)',
                        spaceComplexity: 'O(n+k)',
                        color: 'linear-gradient(135deg, #fdcb6e, #e17055)'
                    }
                };

                this.initializeArray();
                this.bindEvents();
                this.updateAlgorithmInfo();
                this.renderArray();
            }

            initializeArray() {
                this.array = [];
                for (let i = 0; i < this.arraySize; i++) {
                    this.array.push({
                        value: Math.floor(Math.random() * 180) + 20,
                        state: 'normal'
                    });
                }
                this.resetStats();
            }

            resetStats() {
                this.comparisons = 0;
                this.swaps = 0;
                this.updateStats();
                this.stopTimer();
                document.getElementById('timeElapsed').textContent = '0.0s';
            }

            updateStats() {
                document.getElementById('comparisons').textContent = this.comparisons;
                document.getElementById('swaps').textContent = this.swaps;
                document.getElementById('arraySize').textContent = this.array.length;

                const sortedCount = this.array.filter(item => item.state === 'sorted').length;
                const progress = Math.round((sortedCount / this.array.length) * 100);
                document.getElementById('progressFill').style.width = `${progress}%`;
            }

            startTimer() {
                this.startTime = Date.now();
                this.timerInterval = setInterval(() => {
                    const elapsed = ((Date.now() - this.startTime) / 1000).toFixed(1);
                    document.getElementById('timeElapsed').textContent = `${elapsed}s`;
                }, 100);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            renderArray() {
                const container = document.getElementById('visualizationArea');
                const badge = document.getElementById('completionBadge');
                container.innerHTML = '';
                container.appendChild(badge);

                if (this.array.length === 0) return;

                const maxValue = Math.max(...this.array.map(item => item.value));
                const containerWidth = container.clientWidth - 40;
                const containerHeight = container.clientHeight - 40;
                const barWidth = Math.max(8, Math.min(25, (containerWidth - this.array.length * 4) / this.array.length));

                this.array.forEach((item, index) => {
                    const bar = document.createElement('div');
                    bar.className = `bar ${item.state}`;
                    bar.style.width = `${barWidth}px`;
                    bar.style.height = `${Math.max((item.value / maxValue) * containerHeight, 15)}px`;
                    bar.textContent = item.value;
                    bar.id = `bar-${index}`;
                    bar.title = `值: ${item.value}`;
                    container.appendChild(bar);
                });
            }

            updateAlgorithmInfo() {
                const info = this.algorithmInfo[this.currentAlgorithm];
                document.getElementById('algorithmName').textContent = info.name;
                document.getElementById('algorithmDesc').textContent = info.desc;
                document.getElementById('timeComplexity').textContent = info.timeComplexity;
                document.getElementById('spaceComplexity').textContent = info.spaceComplexity;
                document.querySelector('.info-icon').style.background = info.color;
                document.querySelector('.info-icon').textContent = info.icon;
            }

            sleep(ms) {
                return new Promise(resolve => {
                    this.animationId = setTimeout(resolve, ms);
                });
            }

            getDelay() {
                return Math.max(20, 500 - this.speed * 45);
            }

            async highlightComparison(i, j, keepHighlighted = true) {
                this.array[i].state = 'comparing';
                this.array[j].state = 'comparing';
                this.comparisons++;
                this.renderArray();
                this.updateStats();
                await this.sleep(this.getDelay());

                if (keepHighlighted) {
                    this.array[i].state = 'normal';
                    this.array[j].state = 'normal';
                }
            }

            async swap(i, j) {
                this.array[i].state = 'swapping';
                this.array[j].state = 'swapping';
                this.swaps++;
                this.renderArray();
                await this.sleep(this.getDelay());

                [this.array[i].value, this.array[j].value] = [this.array[j].value, this.array[i].value];

                this.array[i].state = 'normal';
                this.array[j].state = 'normal';
                this.renderArray();
                this.updateStats();
            }

            async bubbleSort() {
                const n = this.array.length;

                for (let i = 0; i < n - 1; i++) {
                    for (let j = 0; j < n - i - 1; j++) {
                        if (!this.isRunning) return;

                        await this.highlightComparison(j, j + 1, false);

                        if (this.array[j].value > this.array[j + 1].value) {
                            await this.swap(j, j + 1);
                        } else {
                            this.array[j].state = 'normal';
                            this.array[j + 1].state = 'normal';
                            this.renderArray();
                        }
                    }
                    this.array[n - i - 1].state = 'sorted';
                    this.renderArray();
                    this.updateStats();
                }

                if (this.array.length > 0) {
                    this.array[0].state = 'sorted';
                }
                this.renderArray();
                this.updateStats();
                this.onSortComplete();
            }

            async selectionSort() {
                const n = this.array.length;

                for (let i = 0; i < n - 1; i++) {
                    let minIdx = i;
                    this.array[i].state = 'current';

                    for (let j = i + 1; j < n; j++) {
                        if (!this.isRunning) return;

                        await this.highlightComparison(minIdx, j, false);

                        if (this.array[j].value < this.array[minIdx].value) {
                            if (minIdx !== i) this.array[minIdx].state = 'normal';
                            minIdx = j;
                            this.array[minIdx].state = 'comparing';
                        } else {
                            this.array[j].state = 'normal';
                        }
                        this.renderArray();
                    }

                    if (minIdx !== i) {
                        await this.swap(i, minIdx);
                    }

                    this.array[i].state = 'sorted';
                    this.array[minIdx].state = 'normal';
                    this.renderArray();
                    this.updateStats();
                }

                if (this.array.length > 0) {
                    this.array[n - 1].state = 'sorted';
                }
                this.renderArray();
                this.updateStats();
                this.onSortComplete();
            }

            async insertionSort() {
                const n = this.array.length;

                if (n > 0) {
                    this.array[0].state = 'sorted';
                    this.renderArray();
                }

                for (let i = 1; i < n; i++) {
                    if (!this.isRunning) return;

                    let key = this.array[i].value;
                    let j = i - 1;

                    this.array[i].state = 'comparing';
                    this.renderArray();
                    await this.sleep(this.getDelay());

                    while (j >= 0 && this.array[j].value > key) {
                        if (!this.isRunning) return;

                        await this.highlightComparison(j, j + 1, false);

                        this.array[j + 1].value = this.array[j].value;
                        this.array[j + 1].state = 'swapping';
                        this.swaps++;
                        j--;

                        this.renderArray();
                        this.updateStats();
                        await this.sleep(this.getDelay());
                    }

                    this.array[j + 1].value = key;

                    for (let k = 0; k <= i; k++) {
                        this.array[k].state = 'sorted';
                    }

                    this.renderArray();
                    this.updateStats();
                }

                this.onSortComplete();
            }

            async shellSort() {
                const n = this.array.length;
                let gap = Math.floor(n / 2);

                while (gap > 0 && this.isRunning) {
                    for (let i = gap; i < n; i++) {
                        const temp = this.array[i].value;
                        let j = i;

                        this.array[i].state = 'comparing';
                        this.renderArray();
                        await this.sleep(this.getDelay());

                        while (j >= gap && this.array[j - gap].value > temp) {
                            if (!this.isRunning) return;

                            this.array[j].value = this.array[j - gap].value;
                            this.array[j].state = 'swapping';
                            this.array[j - gap].state = 'comparing';
                            this.swaps++;

                            this.renderArray();
                            this.updateStats();
                            await this.sleep(this.getDelay());

                            this.array[j - gap].state = 'normal';
                            j -= gap;
                        }

                        this.array[j].value = temp;
                        this.array[j].state = 'normal';

                        // Mark sorted portion
                        for (let k = 0; k <= i; k++) {
                            this.array[k].state = 'sorted';
                        }
                        this.renderArray();
                        this.updateStats();
                    }

                    gap = Math.floor(gap / 2);
                }

                // Final pass - mark all as sorted
                this.array.forEach(item => item.state = 'sorted');
                this.renderArray();
                this.updateStats();
                this.onSortComplete();
            }

            async heapSort() {
                const n = this.array.length;

                // Build max heap
                for (let i = Math.floor(n / 2) - 1; i >= 0 && this.isRunning; i--) {
                    await this.heapify(n, i);
                }

                // Extract elements from heap
                for (let i = n - 1; i > 0 && this.isRunning; i--) {
                    // Move current root to end
                    this.array[0].state = 'swapping';
                    this.array[i].state = 'swapping';
                    this.swaps++;
                    this.renderArray();
                    await this.sleep(this.getDelay());

                    [this.array[0].value, this.array[i].value] = [this.array[i].value, this.array[0].value];

                    this.array[i].state = 'sorted';
                    this.array[0].state = 'normal';
                    this.renderArray();
                    this.updateStats();

                    // Call max heapify on the reduced heap
                    await this.heapify(i, 0);
                }

                if (this.array.length > 0) {
                    this.array[0].state = 'sorted';
                }
                this.renderArray();
                this.updateStats();
                this.onSortComplete();
            }

            async heapify(n, i) {
                let largest = i;
                const left = 2 * i + 1;
                const right = 2 * i + 2;

                // Highlight current element being heapified
                this.array[i].state = 'pivot';
                this.renderArray();
                await this.sleep(this.getDelay());

                if (left < n && this.isRunning) {
                    this.array[left].state = 'comparing';
                    this.renderArray();
                    await this.sleep(this.getDelay() / 2);

                    if (this.array[left].value > this.array[largest].value) {
                        this.array[largest].state = 'normal';
                        largest = left;
                    }
                    this.array[left].state = 'normal';
                }

                if (right < n && this.isRunning) {
                    this.array[right].state = 'comparing';
                    this.renderArray();
                    await this.sleep(this.getDelay() / 2);

                    if (this.array[right].value > this.array[largest].value) {
                        this.array[largest].state = 'normal';
                        largest = right;
                    }
                    this.array[right].state = 'normal';
                }

                if (largest !== i && this.isRunning) {
                    this.array[i].state = 'swapping';
                    this.array[largest].state = 'swapping';
                    this.swaps++;
                    this.renderArray();
                    await this.sleep(this.getDelay());

                    [this.array[i].value, this.array[largest].value] = [this.array[largest].value, this.array[i].value];

                    this.array[i].state = 'normal';
                    this.array[largest].state = 'normal';
                    this.renderArray();

                    // Recursively heapify the affected subtree
                    await this.heapify(n, largest);
                } else {
                    this.array[i].state = 'normal';
                }
            }

            async radixSort() {
                const n = this.array.length;
                if (n === 0 || !this.isRunning) {
                    this.onSortComplete();
                    return;
                }

                // Get max value to determine number of digits
                const maxVal = Math.max(...this.array.map(item => item.value));

                // For visualization, we'll use a simpler approach
                // Group by value (bucket sort visualization)
                const maxValue = Math.max(...this.array.map(item => item.value));
                const buckets = [];

                // Create buckets
                for (let i = 0; i <= maxValue && this.isRunning; i++) {
                    buckets.push([]);
                }

                // Distribute elements into buckets
                for (let i = 0; i < n && this.isRunning; i++) {
                    this.array[i].state = 'comparing';
                    this.renderArray();
                    await this.sleep(this.getDelay());

                    buckets[this.array[i].value].push(this.array[i].value);
                    this.array[i].state = 'swapping';
                    this.swaps++;
                    this.renderArray();
                    await this.sleep(this.getDelay());
                }

                // If not running, skip remaining
                if (!this.isRunning) {
                    this.onSortComplete();
                    return;
                }

                // Gather elements from buckets in order
                let idx = 0;
                for (let i = 0; i < buckets.length && this.isRunning; i++) {
                    for (let j = 0; j < buckets[i].length && this.isRunning; j++) {
                        this.array[idx].value = buckets[i][j];
                        this.array[idx].state = 'sorted';
                        this.renderArray();
                        this.updateStats();
                        await this.sleep(this.getDelay() / 2);
                        idx++;
                    }
                }

                this.renderArray();
                this.updateStats();
                this.onSortComplete();
            }

            async quickSort(low = 0, high = this.array.length - 1) {
                if (low >= high || !this.isRunning) {
                    if (low === 0 && high === this.array.length - 1 && this.isRunning) {
                        this.onSortComplete();
                    }
                    return;
                }

                const pi = await this.partition(low, high);

                if (!this.isRunning) {
                    if (low === 0 && high === this.array.length - 1) {
                        this.onSortComplete();
                    }
                    return;
                }

                await this.quickSort(low, pi - 1);
                await this.quickSort(pi + 1, high);

                if (low === 0 && high === this.array.length - 1) {
                    this.onSortComplete();
                }
            }

            async partition(low, high) {
                const pivot = this.array[high].value;
                this.array[high].state = 'pivot';
                this.renderArray();
                await this.sleep(this.getDelay());

                let i = low - 1;

                for (let j = low; j < high; j++) {
                    if (!this.isRunning) return i + 1;

                    await this.highlightComparison(j, high, false);

                    if (this.array[j].value < pivot) {
                        i++;
                        if (i !== j) {
                            await this.swap(i, j);
                        }
                    } else {
                        this.array[j].state = 'normal';
                    }
                    this.array[high].state = 'pivot';
                    this.renderArray();
                }

                if (i + 1 !== high) {
                    await this.swap(i + 1, high);
                }

                this.array[i + 1].state = 'sorted';
                this.array[high].state = 'normal';
                this.renderArray();
                this.updateStats();

                return i + 1;
            }

            async mergeSort(left = 0, right = this.array.length - 1) {
                if (left >= right || !this.isRunning) {
                    if (left === 0 && right === this.array.length - 1 && this.isRunning) {
                        this.onSortComplete();
                    }
                    return;
                }

                const mid = Math.floor((left + right) / 2);

                await this.mergeSort(left, mid);
                await this.mergeSort(mid + 1, right);
                await this.merge(left, mid, right);

                if (left === 0 && right === this.array.length - 1) {
                    this.onSortComplete();
                }
            }

            async merge(left, mid, right) {
                const leftArr = [];
                const rightArr = [];

                for (let i = left; i <= mid; i++) {
                    leftArr.push(this.array[i].value);
                }
                for (let i = mid + 1; i <= right; i++) {
                    rightArr.push(this.array[i].value);
                }

                let i = 0, j = 0, k = left;

                while (i < leftArr.length && j < rightArr.length && this.isRunning) {
                    this.array[k].state = 'comparing';
                    this.renderArray();
                    await this.sleep(this.getDelay());

                    if (leftArr[i] <= rightArr[j]) {
                        this.array[k].value = leftArr[i];
                        i++;
                    } else {
                        this.array[k].value = rightArr[j];
                        j++;
                    }

                    this.array[k].state = 'normal';
                    this.swaps++;
                    k++;
                    this.renderArray();
                    this.updateStats();
                }

                while (i < leftArr.length && this.isRunning) {
                    this.array[k].value = leftArr[i];
                    this.array[k].state = 'comparing';
                    this.renderArray();
                    await this.sleep(this.getDelay());
                    this.array[k].state = 'sorted';
                    i++;
                    k++;
                    this.swaps++;
                    this.renderArray();
                    this.updateStats();
                }

                while (j < rightArr.length && this.isRunning) {
                    this.array[k].value = rightArr[j];
                    this.array[k].state = 'comparing';
                    this.renderArray();
                    await this.sleep(this.getDelay());
                    this.array[k].state = 'sorted';
                    j++;
                    k++;
                    this.swaps++;
                    this.renderArray();
                    this.updateStats();
                }

                for (let m = left; m <= right; m++) {
                    this.array[m].state = 'sorted';
                }
                this.renderArray();
            }

            async startSorting() {
                if (this.isRunning) return;

                this.isRunning = true;
                this.isPaused = false;
                this.resetStats();
                this.startTimer();

                document.getElementById('startBtn').disabled = true;
                document.getElementById('pauseBtn').disabled = false;
                document.getElementById('pauseBtn').textContent = '⏸ 暂停';

                this.array.forEach(item => item.state = 'normal');
                this.renderArray();

                await new Promise(resolve => setTimeout(resolve, 100));

                switch (this.currentAlgorithm) {
                    case 'bubble':
                        await this.bubbleSort();
                        break;
                    case 'selection':
                        await this.selectionSort();
                        break;
                    case 'insertion':
                        await this.insertionSort();
                        break;
                    case 'shell':
                        await this.shellSort();
                        break;
                    case 'heap':
                        await this.heapSort();
                        break;
                    case 'quick':
                        await this.quickSort();
                        break;
                    case 'merge':
                        await this.mergeSort();
                        break;
                    case 'radix':
                        await this.radixSort();
                        break;
                }
            }

            pauseSorting() {
                this.isPaused = !this.isPaused;
                document.getElementById('pauseBtn').textContent = this.isPaused ? '▶ 继续' : '⏸ 暂停';
            }

            stopSorting() {
                this.isRunning = false;
                this.isPaused = false;
                this.stopTimer();

                if (this.animationId) {
                    clearTimeout(this.animationId);
                    this.animationId = null;
                }

                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;
                document.getElementById('pauseBtn').textContent = '⏸ 暂停';
            }

            resetArray() {
                this.stopSorting();
                this.array.forEach(item => item.state = 'normal');
                this.renderArray();
                this.resetStats();
            }

            shuffleArray() {
                this.stopSorting();
                this.initializeArray();
                this.renderArray();
            }

            onSortComplete() {
                this.isRunning = false;
                this.stopTimer();
                document.getElementById('startBtn').disabled = false;
                document.getElementById('pauseBtn').disabled = true;

                this.array.forEach(item => item.state = 'sorted');
                this.renderArray();
                this.updateStats();

                // Show completion badge
                const badge = document.getElementById('completionBadge');
                badge.classList.add('show');
                setTimeout(() => {
                    badge.classList.remove('show');
                }, 2000);
            }

            bindEvents() {
                document.getElementById('arraySizeSlider').addEventListener('input', (e) => {
                    this.arraySize = parseInt(e.target.value);
                    document.getElementById('arraySizeValue').textContent = this.arraySize;
                    this.shuffleArray();
                });

                document.getElementById('speedSlider').addEventListener('input', (e) => {
                    this.speed = parseInt(e.target.value);
                    document.getElementById('speedValue').textContent = this.speed;
                });

                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        if (this.isRunning) return;

                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');

                        this.currentAlgorithm = btn.dataset.algorithm;
                        this.updateAlgorithmInfo();
                        this.resetArray();
                    });
                });

                document.getElementById('startBtn').addEventListener('click', () => {
                    this.startSorting();
                });

                document.getElementById('pauseBtn').addEventListener('click', () => {
                    this.pauseSorting();
                });

                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetArray();
                });

                document.getElementById('shuffleBtn').addEventListener('click', () => {
                    this.shuffleArray();
                });

                // Window resize handler
                window.addEventListener('resize', () => {
                    this.renderArray();
                });
            }
        }

        new SortingVisualizer();
    </script>
</body>
</html>
