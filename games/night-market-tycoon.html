            scoreValue: document.getElementById("scoreValue"),
            productGrid: document.getElementById("productGrid"),
            priceRow: document.getElementById("priceRow"),
            adBtn: document.getElementById("adBtn"),
            clearAdBtn: document.getElementById("clearAdBtn"),
            meters: document.getElementById("meters"),
            upgradeGrid: document.getElementById("upgradeGrid"),
            report: document.getElementById("report"),
            log: document.getElementById("log"),
            eventModal: document.getElementById("eventModal"),
            eventTitle: document.getElementById("eventTitle"),
            eventText: document.getElementById("eventText"),
            eventChoices: document.getElementById("eventChoices")
        };

        let state = createInitialState();

        function createInitialState() {
            return {
                day: 1,
                cash: 900,
                reputation: 46,
                stamina: 94,
                priceMode: "normal",
                marketing: 0,
                ended: false,
                pendingEvent: null,
                seed: Math.floor(Math.random() * 10000),
                stock: { skewer: 16, noodle: 12, tea: 18 },
                upgrades: Object.fromEntries(upgrades.map((item) => [item.id, 0])),
                report: "今晚还没开摊。先看看天气，准备库存。",
                log: ["第 1 天：摊车通电，第一锅汤底已经滚起来。"],
                best: readBestScore()
            };
        }

        function readBestScore() {
            try {
                return Number(localStorage.getItem("night-market-best") || 0);
            } catch (error) {
                return 0;
            }
        }

        function saveBestScore(score) {
            if (score <= state.best) return;
            state.best = score;
            try {
                localStorage.setItem("night-market-best", String(score));
            } catch (error) {
                // localStorage may be blocked by browser settings.
            }
        }

        function rand() {
            const value = Math.sin(state.seed++) * 10000;
            return value - Math.floor(value);
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function format(value) {
            return Math.round(value).toLocaleString("zh-CN");
        }

        function getWeather() {
            const index = (state.day * 7 + state.seed + state.upgrades.sign) % weatherList.length;
            return weatherList[index];
        }

        function upgradeCost(item) {
            return Math.round(item.base * (1 + state.upgrades[item.id] * 0.62));
        }

        function canAfford(cost) {
            return Object.entries(cost).every(([key, value]) => {
                if (key in state.stock) return state.stock[key] >= value;
                return state[key] >= value;
            });
        }

        function applyCost(cost) {
            for (const [key, value] of Object.entries(cost)) {
                if (key in state.stock) {
                    state.stock[key] -= value;
                } else {
                    state[key] -= value;
                }
            }
        }

        function applyEffect(effect) {
            for (const [key, value] of Object.entries(effect)) {
                if (key in state.stock) {
                    state.stock[key] += value;
                } else if (key in state) {
                    state[key] += value;
                }
            }
            normalizeState();
        }

        function normalizeState() {
            state.cash = Math.max(0, state.cash);
            state.reputation = clamp(Math.round(state.reputation), 0, 100);
            state.stamina = clamp(Math.round(state.stamina), 0, 100);
            state.marketing = clamp(Math.round(state.marketing), 0, 3);
            for (const key of Object.keys(state.stock)) {
                state.stock[key] = Math.max(0, Math.round(state.stock[key]));
            }
        }

        function addLog(message) {
            state.log.unshift(message);
            state.log = state.log.slice(0, 18);
        }

        function stockValue() {
            return products.reduce((sum, item) => sum + state.stock[item.id] * item.cost, 0);
        }

        function buyProduct(id) {
            if (state.ended || state.pendingEvent) return;
            const product = products.find((item) => item.id === id);
            const quantity = 10;
            const cost = product.cost * quantity;
            if (state.cash < cost) return;
            state.cash -= cost;
            state.stock[id] += quantity;
            addLog(`第 ${state.day} 天：进货 ${product.name} x${quantity}，花费 ${cost}。`);
            render();
        }

        function buyUpgrade(id) {
            if (state.ended || state.pendingEvent) return;
            const item = upgrades.find((entry) => entry.id === id);
            const owned = state.upgrades[id];
            const cost = upgradeCost(item);
            if (owned >= item.max || state.cash < cost) return;
            state.cash -= cost;
            state.upgrades[id] += 1;
            state.reputation += id === "sign" || id === "recipe" ? 2 : 0;
            addLog(`第 ${state.day} 天：升级「${item.name}」到 ${state.upgrades[id]} 级。`);
            normalizeState();
            render();
        }

        function buyAd() {
            if (state.ended || state.pendingEvent || state.marketing >= 3 || state.cash < 180) return;
            state.cash -= 180;
            state.marketing += 1;
            addLog(`第 ${state.day} 天：投放一条短视频推广，明晚客流会更旺。`);
            render();
        }

        function clearAd() {
            if (state.ended || state.pendingEvent) return;
            state.marketing = 0;
            addLog(`第 ${state.day} 天：取消推广预算，今晚靠自然客流。`);
            render();
        }

        function serviceCapacity() {
            return Math.round(44 + state.upgrades.grill * 15 + state.upgrades.helper * 18 + state.stamina * 0.28);
        }

        function openStall() {
            if (state.ended || state.pendingEvent) return;
            const weather = getWeather();
            const price = priceModes[state.priceMode];
            const seatBonus = weather.focus === "noodle" ? state.upgrades.seat * 5 : state.upgrades.seat * 3;
            const baseDemand = 24 + state.reputation * 0.58 + state.upgrades.sign * 8 + state.upgrades.recipe * 4 + state.marketing * 14 + seatBonus;
            const staminaFactor = state.stamina < 35 ? 0.78 : 1;
            const customers = Math.max(4, Math.round(baseDemand * weather.demand * price.demand * staminaFactor * (0.9 + rand() * 0.22)));
            const capacity = serviceCapacity();
            let served = 0;
            let missed = 0;
            let revenue = 0;
            const sold = { skewer: 0, noodle: 0, tea: 0 };
            const weights = Object.fromEntries(products.map((item) => [item.id, item.demand]));
            weights[weather.focus] += 0.16;
            weights.skewer += state.upgrades.grill * 0.025;
            weights.tea += state.marketing * 0.025;
            weights.noodle += state.upgrades.seat * 0.02;
            const totalWeight = weights.skewer + weights.noodle + weights.tea;

            for (let i = 0; i < customers; i += 1) {
                if (served >= capacity) {
                    missed += 1;
                    continue;
                }
                const roll = rand() * totalWeight;
                let choice = "tea";
                if (roll < weights.skewer) choice = "skewer";
                else if (roll < weights.skewer + weights.noodle) choice = "noodle";
                if (state.stock[choice] <= 0) {
                    const fallback = products.find((item) => state.stock[item.id] > 0);
                    if (!fallback) {
                        missed += 1;
                        continue;
                    }
                    choice = fallback.id;
                }
                const product = products.find((item) => item.id === choice);
                const finalPrice = Math.round((product.price + state.upgrades.recipe * 2) * price.price);
                state.stock[choice] -= 1;
                sold[choice] += 1;
                revenue += finalPrice;
                served += 1;
            }

            const helperWage = state.upgrades.helper * 45;
            state.cash += revenue - helperWage;
            const wasteRate = clamp(0.16 - state.upgrades.fridge * 0.032, 0.035, 0.16);
            const waste = {};
            for (const product of products) {
                waste[product.id] = Math.floor(state.stock[product.id] * wasteRate);
                state.stock[product.id] -= waste[product.id];
            }
            const fatigue = Math.max(8, served * 0.42 - state.upgrades.helper * 5);
            state.stamina -= fatigue;
            state.reputation += price.rep + Math.round((served / Math.max(1, customers)) * 8) - (missed > customers * 0.18 ? 7 : 1) + state.upgrades.sign;
            if (revenue > 900) state.reputation += 2;
            state.marketing = Math.max(0, state.marketing - 1);
            normalizeState();

            const soldText = products.map((item) => `${item.name}${sold[item.id]}`).join("、");
            const wasteCount = Object.values(waste).reduce((sum, value) => sum + value, 0);
            state.report = `${weather.icon} ${weather.name}：到店 ${customers} 人，服务 ${served} 人，收入 ${format(revenue)}，帮工工资 ${format(helperWage)}，损耗 ${wasteCount} 份。售出：${soldText}。`;
            addLog(`第 ${state.day} 天营业：净入账 ${format(revenue - helperWage)}，口碑 ${state.reputation}，体力 ${state.stamina}。`);
            state.day += 1;

            if (!state.ended && state.day <= 30 && state.day % 6 === 0) {
                openEvent();
            }
            checkEnd();
            render();
        }

        function restDay() {
            if (state.ended || state.pendingEvent) return;
            const rent = 80 + state.upgrades.helper * 20;
            state.cash = Math.max(0, state.cash - rent);
            state.stamina += 34;
            state.reputation += state.upgrades.sign > 0 ? 1 : 0;
            state.report = `休整半天：体力恢复，固定成本 ${rent}。`;
            addLog(`第 ${state.day} 天：休整补状态，花费 ${rent}。`);
            state.day += 1;
            normalizeState();
            checkEnd();
            render();
        }

        function openEvent() {
            const index = (state.day + state.reputation + state.upgrades.sign) % events.length;
            state.pendingEvent = events[index];
        }

        function chooseEvent(choice) {
            if (!state.pendingEvent || !canAfford(choice.cost)) return;
            applyCost(choice.cost);
            applyEffect(choice.effect);
            addLog(`第 ${state.day} 天事件：${choice.note}`);
            state.pendingEvent = null;
            render();
        }

        function calculateScore() {
            return Math.max(0, Math.round(
                state.cash +
                stockValue() * 0.65 +
                state.reputation * 78 +
                state.stamina * 12 +
                Object.values(state.upgrades).reduce((sum, value) => sum + value, 0) * 165
            ));
        }

        function checkEnd() {
            if (state.ended) return;
            if (state.cash <= 0 && stockValue() <= 20) {
                state.ended = true;
                state.statusTitle = "现金断档";
                state.statusText = "摊位没有现金也没有库存，只能提前收车。下一局可以少囤高价货，先稳住周转。";
            } else if (state.day > 30) {
                state.ended = true;
                const won = state.cash >= 5200 && state.reputation >= 70;
                state.statusTitle = won ? "夜市招牌诞生" : "摊位还差火候";
                state.statusText = won
                    ? "30 天经营结束，你的小摊已经有稳定客流和响亮口碑。"
                    : "小摊撑过了 30 天，但现金或口碑还没达标。试试更早升级招牌和保鲜。";
            }
            if (state.ended) {
                const score = calculateScore();
                saveBestScore(score);
                addLog(`${state.statusTitle}：最终评分 ${format(score)}。`);
            }
        }

        function costText(cost) {
            const names = { cash: "现金", skewer: "烤串", noodle: "热汤面", tea: "果茶" };
            const entries = Object.entries(cost);
            if (entries.length === 0) return "无需成本";
            return entries.map(([key, value]) => `${names[key]} ${value}`).join("，");
        }

        function renderStats() {
            const items = [
                ["天数", `${state.day}/30`],
                ["现金", format(state.cash)],
                ["口碑", `${state.reputation}%`],
                ["体力", `${state.stamina}%`],
                ["库存价值", format(stockValue())],
                ["最佳", format(state.best)]
            ];
            els.stats.innerHTML = items.map(([label, value]) => `
                <div class="stat">
                    <span>${label}</span>
                    <strong>${value}</strong>
                </div>
            `).join("");
        }

        function renderProducts() {
            els.productGrid.innerHTML = products.map((product) => {
                const cost = product.cost * 10;
                return `
                    <article class="product">
                        <div class="product__head">
                            <div class="name"><span class="icon">${product.icon}</span>${product.name}</div>
                            <span class="chip">库存 ${state.stock[product.id]}</span>
                        </div>
                        <p>${product.desc}</p>
                        <span class="chip">进货 10 份 / ${cost} 现金</span>
                        <button data-buy="${product.id}" ${state.cash < cost || state.ended || state.pendingEvent ? "disabled" : ""}>进货</button>
                    </article>
                `;
            }).join("");
            els.productGrid.querySelectorAll("button[data-buy]").forEach((button) => {
                button.addEventListener("click", () => buyProduct(button.dataset.buy));
            });
        }

        function renderPriceModes() {
            els.priceRow.innerHTML = Object.entries(priceModes).map(([id, mode]) => `
                <button class="price-btn ${state.priceMode === id ? "is-active" : ""}" data-price="${id}" ${state.ended || state.pendingEvent ? "disabled" : ""}>
                    ${mode.name}
                    <span>${mode.desc}</span>
                </button>
            `).join("");
            els.priceRow.querySelectorAll("button").forEach((button) => {
                button.addEventListener("click", () => {
                    state.priceMode = button.dataset.price;
                    addLog(`第 ${state.day} 天：价格策略调整为「${priceModes[state.priceMode].name}」。`);
                    render();
                });
            });
        }

        function renderUpgrades() {
            els.upgradeGrid.innerHTML = upgrades.map((item) => {
                const owned = state.upgrades[item.id];
                const maxed = owned >= item.max;
                const cost = upgradeCost(item);
                return `
                    <article class="upgrade">
                        <div class="upgrade__head">
                            <div class="name"><span class="icon">${item.icon}</span>${item.name}</div>
                            <span class="chip">${owned}/${item.max}</span>
                        </div>
                        <p>${item.desc}</p>
                        <span class="chip">${maxed ? "已满级" : `升级 ${cost} 现金`}</span>
                        <button data-upgrade="${item.id}" ${maxed || state.cash < cost || state.ended || state.pendingEvent ? "disabled" : ""}>升级</button>
                    </article>
                `;
            }).join("");
            els.upgradeGrid.querySelectorAll("button[data-upgrade]").forEach((button) => {
                button.addEventListener("click", () => buyUpgrade(button.dataset.upgrade));
            });
        }

        function renderMeters() {
            const weather = getWeather();
            const items = [
                ["接待上限", `${serviceCapacity()} 人`, clamp(serviceCapacity() / 125 * 100, 0, 100)],
                ["自然客流", `${Math.round(weather.demand * 100)}%`, clamp(weather.demand * 76, 0, 100)],
                ["口碑", `${state.reputation}%`, state.reputation],
                ["体力", `${state.stamina}%`, state.stamina],
                ["推广热度", `${state.marketing}/3`, state.marketing / 3 * 100]
            ];
            els.meters.innerHTML = items.map(([label, value, percent]) => `
                <div class="meter">
                    <div class="meter__label"><span>${label}</span><strong>${value}</strong></div>
                    <div class="meter__track"><div class="meter__fill" style="width:${clamp(percent, 0, 100)}%"></div></div>
                </div>
            `).join("");
        }

        function renderReport() {
            els.report.innerHTML = `<p>${state.report}</p>`;
            els.log.innerHTML = state.log.map((item) => `<p>${item}</p>`).join("");
        }

        function renderEvent() {
            if (!state.pendingEvent) {
                els.eventModal.hidden = true;
                return;
            }
            const event = state.pendingEvent;
            els.eventTitle.textContent = event.title;
            els.eventText.textContent = event.text;
            els.eventChoices.innerHTML = event.choices.map((choice, index) => `
                <button class="choice" data-choice="${index}" ${canAfford(choice.cost) ? "" : "disabled"}>
                    <strong>${choice.label}</strong>
                    <span>${costText(choice.cost)}。${choice.note}</span>
                </button>
            `).join("");
            els.eventChoices.querySelectorAll("button").forEach((button) => {
                button.addEventListener("click", () => chooseEvent(event.choices[Number(button.dataset.choice)]));
            });
            els.eventModal.hidden = false;
        }

        function renderStatus() {
            const weather = getWeather();
            els.weatherPill.textContent = `${weather.icon} ${weather.name}`;
            if (state.ended) {
                els.statusTitle.textContent = state.statusTitle;
                els.statusText.textContent = state.statusText;
            } else {
                els.statusTitle.textContent = weather.name === "节庆夜" ? "今晚客流爆发" : weather.name === "小雨" ? "雨夜考验备货" : "夜市准备营业";
                els.statusText.textContent = `${weather.text} 当前价格是「${priceModes[state.priceMode].name}」，推广热度 ${state.marketing}/3。`;
            }
            els.scoreValue.textContent = format(calculateScore());
            els.openBtn.disabled = state.ended || Boolean(state.pendingEvent);
            els.restBtn.disabled = state.ended || Boolean(state.pendingEvent);
            els.adBtn.disabled = state.ended || Boolean(state.pendingEvent) || state.cash < 180 || state.marketing >= 3;
            els.clearAdBtn.disabled = state.ended || Boolean(state.pendingEvent) || state.marketing <= 0;
        }

        function render() {
            renderStats();
            renderProducts();
            renderPriceModes();
            renderUpgrades();
            renderMeters();
            renderReport();
            renderStatus();
            renderEvent();
        }

        els.openBtn.addEventListener("click", openStall);
        els.restBtn.addEventListener("click", restDay);
        els.restartBtn.addEventListener("click", () => {
            state = createInitialState();
            render();
        });
        els.adBtn.addEventListener("click", buyAd);
        els.clearAdBtn.addEventListener("click", clearAd);

        render();
    </script>
</body>
</html>
