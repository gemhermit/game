<body class="h-screen flex flex-col items-center justify-center p-4">

    <h1 class="text-3xl font-bold mb-2 text-gray-100">西蒙记忆挑战</h1>
    <p class="text-gray-400 mb-8 text-center max-w-md">记住闪烁的颜色顺序，然后按正确的顺序点击重复。</p>

    <div class="simon-board mb-8">
        <div id="green" class="pad pad-green" data-id="0"></div>
        <div id="red" class="pad pad-red" data-id="1"></div>
        <div id="yellow" class="pad pad-yellow" data-id="2"></div>
        <div id="blue" class="pad pad-blue" data-id="3"></div>
        
        <div id="center" class="center-circle">
            <div class="text-gray-400 text-xs font-bold uppercase tracking-widest mb-1">Score</div>
            <div id="score" class="text-3xl font-mono font-bold text-white">0</div>
        </div>
    </div>

    <div class="flex gap-4">
        <button id="startBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition hover:-translate-y-1 active:translate-y-0">
            开始游戏
        </button>
    </div>

    <div id="message" class="mt-8 text-xl font-bold h-8 text-center text-red-400"></div>

<script>
class SimonGame {
    constructor() {
        this.sequence = [];
        this.playerSequence = [];
        this.score = 0;
        this.isPlaying = false;
        this.isComputerTurn = false;
        
        this.pads = [
            document.getElementById('green'),
            document.getElementById('red'),
            document.getElementById('yellow'),
            document.getElementById('blue')
        ];
        
        this.sounds = [
            261.63, // C4
            329.63, // E4
            392.00, // G4
            523.25  // C5
        ];

        this.scoreEl = document.getElementById('score');
        this.centerEl = document.getElementById('center');
        this.startBtn = document.getElementById('startBtn');
        this.messageEl = document.getElementById('message');
        
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        this.initEvents();
    }

    initEvents() {
        this.startBtn.addEventListener('click', () => this.startGame());
        
        this.pads.forEach((pad, index) => {
            pad.addEventListener('mousedown', () => this.handlePadInput(index));
            pad.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent ghost clicks
                this.handlePadInput(index);
            });
        });
    }

    playSound(index) {
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        
        const oscillator = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();
        
        oscillator.type = 'triangle'; // Softer than sine for game feel
        oscillator.frequency.value = this.sounds[index];
        
        // ADSR Envelope
        const now = this.audioCtx.currentTime;
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(0.3, now + 0.05); // Attack
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.5); // Decay
        
        oscillator.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(now + 0.5);
    }

    playErrorSound() {
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        const oscillator = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();
        
        oscillator.type = 'sawtooth';
        oscillator.frequency.setValueAtTime(150, this.audioCtx.currentTime);
        oscillator.frequency.linearRampToValueAtTime(100, this.audioCtx.currentTime + 0.5); // Slide down
        
        gainNode.gain.setValueAtTime(0.3, this.audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0, this.audioCtx.currentTime + 0.5);
        
        oscillator.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);
        
        oscillator.start();
        oscillator.stop(this.audioCtx.currentTime + 0.5);
    }

    flashPad(index) {
        const pad = this.pads[index];
        pad.classList.add('active');
        this.centerEl.classList.add('glow');
        this.playSound(index);
        setTimeout(() => {
            pad.classList.remove('active');
            this.centerEl.classList.remove('glow');
        }, 300);
    }

    startGame() {
        if (this.isPlaying) return;
        this.sequence = [];
        this.score = 0;
        this.scoreEl.textContent = '0';
        this.messageEl.textContent = '';
        this.isPlaying = true;
        this.startBtn.classList.add('opacity-50', 'cursor-not-allowed');
        
        this.nextRound();
    }

    nextRound() {
        this.playerSequence = [];
        this.sequence.push(Math.floor(Math.random() * 4));
        this.score = this.sequence.length - 1;
        this.scoreEl.textContent = this.score;
        
        this.isComputerTurn = true;
        setTimeout(() => this.playSequence(), 1000);
    }

    playSequence() {
        let i = 0;
        const interval = setInterval(() => {
            this.flashPad(this.sequence[i]);
            i++;
            if (i >= this.sequence.length) {
                clearInterval(interval);
                this.isComputerTurn = false;
                this.messageEl.textContent = '轮到你了';
            }
        }, 800); // Speed
    }

    handlePadInput(index) {
        if (!this.isPlaying || this.isComputerTurn) return;

        this.flashPad(index);
        this.playerSequence.push(index);

        // Check correct
        const currentStep = this.playerSequence.length - 1;
        if (this.playerSequence[currentStep] !== this.sequence[currentStep]) {
            this.gameOver();
            return;
        }

        // Check if round complete
        if (this.playerSequence.length === this.sequence.length) {
            this.messageEl.textContent = '正确！下一轮...';
            this.isComputerTurn = true;
            setTimeout(() => this.nextRound(), 1000);
        }
    }

    gameOver() {
        this.isPlaying = false;
        this.messageEl.textContent = `游戏结束！最终得分: ${this.score}`;
        this.messageEl.className = 'mt-8 text-xl font-bold h-8 text-center text-red-500 animate-bounce';
        this.startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        this.startBtn.textContent = '再玩一次';
        
        this.playErrorSound();
        
        // Flash all red
        this.pads.forEach(pad => pad.classList.add('bg-red-500'));
        setTimeout(() => {
            this.pads.forEach(pad => pad.classList.remove('bg-red-500'));
        }, 500);
    }
}

new SimonGame();
</script>
