        /* Main Content */

        }

        .puzzle-piece.correct {
            box-shadow: none;
            cursor: default;

        }

        .puzzle-piece.correct:hover {

        /* Original Image Preview */
        .original-preview {

        /* Overlay Controls */

            position: absolute;

            display: flex;
            gap: 12px;
            background: white;
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: #f1f5f9;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--text-color);
            transition: all 0.2s;

        .icon-btn:hover {
            background: #e2e8f0;
        }

        .icon-btn.active {
            background: var(--primary-color);
            color: white;
        }

        /* Victory Modal */
        .victory-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);

            z-index: 2000;

        .victory-modal.visible {

        .victory-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            text-align: center;
            max-width: 400px;
            animation: popIn 0.3s ease;

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }

        .victory-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .victory-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .victory-stats {

            color: var(--text-secondary);
            margin-bottom: 24px;

        /* Placeholder */

            align-items: center;
            justify-content: center;

            text-align: center;
            padding: 40px;
        }

        .placeholder-icon {
            font-size: 80px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .placeholder-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .placeholder-hint {
            font-size: 14px;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
            .main-content {
                height: 600px;
            }
            .original-preview {
                display: none;
            }
        }
    </style>
</head>
<body>

                        <button class="remove-btn" id="removeBtn">更换图片</button>
                    </div>

        <div class="control-group">

            <div class="difficulty-selector">
                <button class="difficulty-btn" data-difficulty="3">简单</button>
                <button class="difficulty-btn active" data-difficulty="4">中等</button>

            </div>
        </div>

        <div class="stats-card">
            <div class="stat-row">
                <span class="stat-label">已移动步数</span>

                <span class="stat-label">用时</span>
                <span class="stat-value" id="timer">00:00</span>
            </div>
        </div>

        <button class="action-btn primary" id="startBtn" disabled>开始游戏</button>
        <button class="action-btn secondary" id="shuffleBtn" disabled>重新打乱</button>

            <div class="tips-title">💡 游戏提示</div>
            <div class="tips-text" id="tipsText">
                上传图片后选择难度，点击"开始游戏"开始拼图。拖拽拼图块到正确位置完成拼图。
            </div>
        </div>

    <main class="main-content">
        <div class="canvas-container" id="canvasContainer">
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">🧩</div>
                <div class="placeholder-text">等待上传图片</div>
                <div class="placeholder-hint">请上传一张图片开始游戏</div>
            </div>
            <div id="puzzleContainer" style="display: none;">
                <div id="puzzleBoard"></div>
            </div>
            <div class="original-preview" id="originalPreview" style="display: none;">
                <div class="original-preview-title">原图参考</div>
                <img id="originalImage" src="" alt="原图">
            </div>
        </div>

        <div class="overlay-controls" id="overlayControls" style="display: none;">
            <button class="icon-btn" id="hintBtn" title="显示提示">💡</button>

    </main>

    <div class="victory-modal" id="victoryModal">
        <div class="victory-content">
            <div class="victory-icon">🎉</div>
            <div class="victory-title">恭喜完成拼图！</div>
            <div class="victory-stats" id="victoryStats"></div>
            <button class="action-btn primary" id="playAgainBtn">再玩一次</button>
        </div>
    </div>

    <script>
        class PuzzleGame {
            constructor() {
                this.canvas = document.getElementById('puzzleBoard');
                this.container = document.getElementById('canvasContainer');

                this.config = {
                    difficulty: 4,
                    image: null,
                    imageName: ''
                };

                this.gameState = {
                    isPlaying: false,
                    moveCount: 0,
                    startTime: null,
                    timerInterval: null,
                    pieces: [],
                    correctCount: 0
                };

                this.dragState = {
                    isDragging: false,
                    piece: null,
                    pieceData: null,
                    startX: 0,
                    startY: 0,
                    initialX: 0,
                    initialY: 0
                };

                this.ui = {
                    uploadArea: document.getElementById('uploadArea'),
                    fileInput: document.getElementById('fileInput'),
                    previewContainer: document.getElementById('previewContainer'),
                    previewImage: document.getElementById('previewImage'),
                    previewName: document.getElementById('previewName'),
                    removeBtn: document.getElementById('removeBtn'),
                    difficultyBtns: document.querySelectorAll('.difficulty-btn'),
                    difficultyValue: document.getElementById('difficultyValue'),
                    moveCount: document.getElementById('moveCount'),
                    correctCount: document.getElementById('correctCount'),
                    timer: document.getElementById('timer'),
                    startBtn: document.getElementById('startBtn'),
                    shuffleBtn: document.getElementById('shuffleBtn'),
                    tipsText: document.getElementById('tipsText'),
                    placeholder: document.getElementById('placeholder'),
                    puzzleContainer: document.getElementById('puzzleContainer'),
                    originalPreview: document.getElementById('originalPreview'),
                    originalImage: document.getElementById('originalImage'),
                    overlayControls: document.getElementById('overlayControls'),
                    victoryModal: document.getElementById('victoryModal'),
                    victoryStats: document.getElementById('victoryStats'),
                    playAgainBtn: document.getElementById('playAgainBtn'),
                    hintBtn: document.getElementById('hintBtn'),
                    autoSolveBtn: document.getElementById('autoSolveBtn')
                };

                this.init();
            }

            init() {
                this.bindEvents();
                this.resize();
                window.addEventListener('resize', () => this.resize());
                
                // Load default demo image
                const demoImage = new Image();
                demoImage.onload = () => {
                    this.config.image = demoImage;
                    this.config.imageName = '示例图片.jpg';
                    
                    this.ui.previewImage.src = demoImage.src;
                    this.ui.previewName.textContent = '示例图片.jpg';
                    this.ui.previewContainer.classList.add('visible');
                    this.ui.originalImage.src = demoImage.src;
                    this.ui.originalPreview.style.display = 'block';
                    
                    this.ui.startBtn.disabled = false;
                    this.ui.shuffleBtn.disabled = false;
                    
                    this.ui.placeholder.style.display = 'none';
                    this.ui.puzzleContainer.style.display = 'block';
                    this.ui.overlayControls.style.display = 'flex';
                    
                    this.setupBoard();
                };
                // Use a reliable placeholder image service or a base64 string
                demoImage.src = 'https://picsum.photos/800/800'; 
            }

            bindEvents() {
                // File upload
                this.ui.uploadArea.addEventListener('click', () => {
                    this.ui.fileInput.click();
                });

                this.ui.uploadArea.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    this.ui.uploadArea.classList.add('dragover');
                });

                this.ui.uploadArea.addEventListener('dragleave', () => {
                    this.ui.uploadArea.classList.remove('dragover');
                });

                this.ui.uploadArea.addEventListener('drop', (e) => {
                    e.preventDefault();
                    this.ui.uploadArea.classList.remove('dragover');
                    const file = e.dataTransfer.files[0];
                    if (file && file.type.startsWith('image/')) {
                        this.handleImageUpload(file);
                    }
                });

                this.ui.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        this.handleImageUpload(file);
                    }
                });

                this.ui.removeBtn.addEventListener('click', () => {
                    this.removeImage();
                });

                // Difficulty buttons
                this.ui.difficultyBtns.forEach(btn => {
                    btn.addEventListener('click', () => {
                        this.ui.difficultyBtns.forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        this.config.difficulty = parseInt(btn.dataset.difficulty);
                        this.ui.difficultyValue.textContent = `${this.config.difficulty}×${this.config.difficulty}`;
                        
                        if (this.config.image) {
                            this.setupBoard();
                        }

                        if (this.gameState.isPlaying) {
                            this.startGame();
                        }
                    });
                });

                // Action buttons
                this.ui.startBtn.addEventListener('click', () => {
                    if (this.gameState.isPlaying) {
                        this.pauseGame();
                    } else {
                        this.startGame();
                    }
                });

                this.ui.shuffleBtn.addEventListener('click', () => {
                    this.shufflePieces();
                });

                this.ui.playAgainBtn.addEventListener('click', () => {
                    this.ui.victoryModal.classList.remove('visible');
                    this.startGame();
                });

                // Overlay controls
                this.ui.hintBtn.addEventListener('click', () => {
                    this.showHint();
                });

                this.ui.autoSolveBtn.addEventListener('click', () => {
                    this.autoSolve();
                });
            }

            handleImageUpload(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.config.image = img;
                        this.config.imageName = file.name;

                        this.ui.previewImage.src = e.target.result;
                        this.ui.previewName.textContent = file.name;
                        this.ui.previewContainer.classList.add('visible');
                        this.ui.originalImage.src = e.target.result;
                        this.ui.originalPreview.style.display = 'block';

                        this.ui.startBtn.disabled = false;
                        this.ui.shuffleBtn.disabled = false;

                        this.ui.placeholder.style.display = 'none';
                        this.ui.puzzleContainer.style.display = 'block';
                        this.ui.overlayControls.style.display = 'flex';

                        this.setupBoard();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            removeImage() {
                this.config.image = null;
                this.config.imageName = '';
                this.ui.previewContainer.classList.remove('visible');
                this.ui.originalPreview.style.display = 'none';
                this.ui.fileInput.value = '';
                this.ui.startBtn.disabled = true;
                this.ui.shuffleBtn.disabled = true;
                this.ui.placeholder.style.display = 'flex';
                this.ui.puzzleContainer.style.display = 'none';
                this.ui.overlayControls.style.display = 'none';

                if (this.gameState.isPlaying) {
                    this.pauseGame();
                }
            }

            resize() {
                if (this.config.image) {
                    this.setupBoard();
                }
            }

            setupBoard() {
                const container = this.ui.puzzleContainer;
                
                // Force container to have size if hidden
                if (container.style.display === 'none') {
                    container.style.display = 'block';
                }

                const maxSize = Math.min(
                    this.container.clientWidth - 40,
                    this.container.clientHeight - 40,
                    600
                );

                const pieceSize = Math.floor(maxSize / this.config.difficulty);
                const boardSize = pieceSize * this.config.difficulty;

                this.canvas.style.width = boardSize + 'px';
                this.canvas.style.height = boardSize + 'px';
                this.canvas.parentElement.style.width = boardSize + 'px';
                this.canvas.parentElement.style.height = boardSize + 'px';

                this.boardSize = boardSize;
                this.pieceSize = pieceSize;

                this.createPieces();
            }

            createPieces() {
                this.canvas.innerHTML = '';
                this.gameState.pieces = [];

                const { difficulty, image } = this.config;
                const { pieceSize, boardSize } = this;

                for (let row = 0; row < difficulty; row++) {
                    for (let col = 0; col < difficulty; col++) {
                        const piece = document.createElement('div');
                        piece.className = 'puzzle-piece';
                        piece.style.width = pieceSize + 'px';
                        piece.style.height = pieceSize + 'px';
                        piece.dataset.row = row;
                        piece.dataset.col = col;
                        piece.dataset.correctX = col * pieceSize;
                        piece.dataset.correctY = row * pieceSize;

                        // Set initial position
                        const x = col * pieceSize;
                        const y = row * pieceSize;
                        piece.style.left = x + 'px';
                        piece.style.top = y + 'px';
                        piece.style.zIndex = '10';

                        const pieceImage = document.createElement('div');
                        pieceImage.className = 'piece-image';
                        pieceImage.style.width = boardSize + 'px';
                        pieceImage.style.height = boardSize + 'px';
                        pieceImage.style.backgroundImage = `url(${image.src})`;
                        pieceImage.style.backgroundSize = boardSize + 'px ' + boardSize + 'px';
                        pieceImage.style.backgroundPosition = '-' + (col * pieceSize) + 'px -' + (row * pieceSize) + 'px';
                        piece.appendChild(pieceImage);

                        // Create piece data object
                        const pieceData = {
                            element: piece,
                            row,
                            col,
                            x: x,
                            y: y,
                            isCorrect: true
                        };

                        // Add event listener with closure to capture pieceData
                        piece.addEventListener('pointerdown', (e) => {
                            this.onPointerDown(e, pieceData);
                        });

                        this.canvas.appendChild(piece);
                        this.gameState.pieces.push(pieceData);
                    }
                }

                this.updateCorrectCount();
            }

            onPointerDown(e, pieceData) {
                if (!this.gameState.isPlaying || pieceData.isCorrect) return;

                e.preventDefault();
                e.stopPropagation();

                const piece = pieceData.element;

                this.dragState.isDragging = true;
                this.dragState.piece = piece;
                this.dragState.pieceData = pieceData;
                this.dragState.startX = e.clientX;
                this.dragState.startY = e.clientY;
                this.dragState.initialX = pieceData.x;
                this.dragState.initialY = pieceData.y;

                piece.classList.add('dragging');

                // Move piece to end of canvas so it's on top
                this.canvas.appendChild(piece);

                // Set pointer capture
                piece.setPointerCapture(e.pointerId);

                // Add move and up listeners
                piece.addEventListener('pointermove', (e) => this.onPointerMove(e));
                piece.addEventListener('pointerup', (e) => this.onPointerUp(e));
            }

            onPointerMove(e) {
                if (!this.dragState.isDragging) return;

                e.preventDefault();

                const piece = this.dragState.piece;
                const pieceData = this.dragState.pieceData;

                const dx = e.clientX - this.dragState.startX;
                const dy = e.clientY - this.dragState.startY;

                let newX = this.dragState.initialX + dx;
                let newY = this.dragState.initialY + dy;

                // Boundary check
                const maxX = this.boardSize - this.pieceSize;
                const maxY = this.boardSize - this.pieceSize;

                newX = Math.max(0, Math.min(maxX, newX));
                newY = Math.max(0, Math.min(maxY, newY));

                // Update position
                piece.style.left = newX + 'px';
                piece.style.top = newY + 'px';

                // Update piece data
                pieceData.x = newX;
                pieceData.y = newY;
            }

            onPointerUp(e) {
                if (!this.dragState.isDragging) return;

                const piece = this.dragState.piece;
                const pieceData = this.dragState.pieceData;

                piece.classList.remove('dragging');
                piece.releasePointerCapture(e.pointerId);

                // Remove listeners
                piece.removeEventListener('pointermove', (e) => this.onPointerMove(e));
                piece.removeEventListener('pointerup', (e) => this.onPointerUp(e));

                // Snap to grid
                let gridX = Math.round(pieceData.x / this.pieceSize) * this.pieceSize;
                let gridY = Math.round(pieceData.y / this.pieceSize) * this.pieceSize;

                // Boundary check
                const maxX = this.boardSize - this.pieceSize;
                const maxY = this.boardSize - this.pieceSize;
                gridX = Math.max(0, Math.min(maxX, gridX));
                gridY = Math.max(0, Math.min(maxY, gridY));

                // Check for collision/swap
                const targetPiece = this.gameState.pieces.find(p =>
                    p !== pieceData &&
                    Math.abs(p.x - gridX) < 10 &&
                    Math.abs(p.y - gridY) < 10
                );

                if (targetPiece) {
                    if (targetPiece.isCorrect) {
                        // Target is locked, bounce back
                        gridX = this.dragState.initialX;
                        gridY = this.dragState.initialY;
                    } else {
                        // Swap: Move target piece to the dragging piece's old spot
                        const oldX = this.dragState.initialX;
                        const oldY = this.dragState.initialY;

                        // Animate target piece moving
                        targetPiece.element.style.transition = 'all 0.2s ease';
                        targetPiece.element.style.left = oldX + 'px';
                        targetPiece.element.style.top = oldY + 'px';
                        
                        // Update target piece data
                        targetPiece.x = oldX;
                        targetPiece.y = oldY;

                        // Check if target piece accidentally landed in its correct spot
                         const targetCorrectX = parseInt(targetPiece.element.dataset.correctX);
                         const targetCorrectY = parseInt(targetPiece.element.dataset.correctY);
                         if (Math.abs(targetPiece.x - targetCorrectX) < 1 && Math.abs(targetPiece.y - targetCorrectY) < 1) {
                             targetPiece.isCorrect = true;
                             targetPiece.element.classList.add('correct');
                             targetPiece.element.style.zIndex = '1';
                         } else {
                             targetPiece.isCorrect = false;
                             targetPiece.element.classList.remove('correct');
                             targetPiece.element.style.zIndex = '10';
                         }

                        setTimeout(() => {
                             targetPiece.element.style.transition = '';
                        }, 200);
                    }
                }

                pieceData.x = gridX;
                pieceData.y = gridY;

                // Update visual position
                piece.style.left = gridX + 'px';
                piece.style.top = gridY + 'px';

                // Check if correct position
                const correctX = parseInt(piece.dataset.correctX);
                const correctY = parseInt(piece.dataset.correctY);

                const distance = Math.abs(gridX - correctX) + Math.abs(gridY - correctY);

                if (distance < this.pieceSize / 2) {
                    pieceData.isCorrect = true;
                    piece.classList.add('correct');
                    piece.style.zIndex = '1';
                } else {
                    pieceData.isCorrect = false;
                    piece.classList.remove('correct');
                    piece.style.zIndex = '10';
                }

                // Increment move count (only if position changed)
                if (gridX !== this.dragState.initialX || gridY !== this.dragState.initialY) {
                    this.gameState.moveCount++;
                    this.ui.moveCount.textContent = this.gameState.moveCount;
                }

                this.updateCorrectCount();
                this.checkVictory();

                // Reset drag state
                this.dragState.isDragging = false;
                this.dragState.piece = null;
                this.dragState.pieceData = null;
            }

            startGame() {
                this.gameState.isPlaying = true;
                this.gameState.moveCount = 0;
                this.gameState.startTime = Date.now();
                this.gameState.correctCount = 0;

                this.ui.moveCount.textContent = '0';
                this.ui.correctCount.textContent = `0/${this.config.difficulty * this.config.difficulty}`;
                this.ui.startBtn.textContent = '暂停游戏';
                this.ui.startBtn.classList.remove('primary');
                this.ui.startBtn.classList.add('secondary');

                this.gameState.timerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - this.gameState.startTime) / 1000);
                    const min = Math.floor(elapsed / 60).toString().padStart(2, '0');
                    const sec = (elapsed % 60).toString().padStart(2, '0');
                    this.ui.timer.textContent = `${min}:${sec}`;
                }, 1000);

                this.shufflePieces();
                this.updateTips('游戏进行中！拖拽拼图块到正确位置。');
            }

            pauseGame() {
                this.gameState.isPlaying = false;
                clearInterval(this.gameState.timerInterval);
                this.ui.startBtn.textContent = '继续游戏';
                this.ui.startBtn.classList.add('primary');
                this.ui.startBtn.classList.remove('secondary');
            }

            shufflePieces() {
                if (!this.gameState.pieces.length) return;

                const pieces = this.gameState.pieces;

                // Fisher-Yates shuffle
                for (let i = pieces.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));

                    const tempX = pieces[i].x;
                    const tempY = pieces[i].y;
                    pieces[i].x = pieces[j].x;
                    pieces[i].y = pieces[j].y;
                    pieces[j].x = tempX;
                    pieces[j].y = tempY;
                }

                // Update visual positions
                pieces.forEach((piece, index) => {
                    const correctX = parseInt(piece.element.dataset.correctX);
                    const correctY = parseInt(piece.element.dataset.correctY);

                    // Check if piece ended up in correct position
                    if (Math.abs(piece.x - correctX) < 1 && Math.abs(piece.y - correctY) < 1) {
                        piece.isCorrect = true;
                        piece.element.classList.add('correct');
                        piece.element.style.zIndex = '1';
                    } else {
                        piece.isCorrect = false;
                        piece.element.classList.remove('correct');
                        piece.element.style.zIndex = '10';
                    }

                    piece.element.classList.add('shuffling');
                    piece.element.style.left = piece.x + 'px';
                    piece.element.style.top = piece.y + 'px';
                });

                // Remove shuffling class after animation
                setTimeout(() => {
                    pieces.forEach(piece => {
                        piece.element.classList.remove('shuffling');
                    });
                }, 350);

                this.gameState.moveCount = 0;
                this.ui.moveCount.textContent = '0';
                this.updateCorrectCount();
            }

            updateCorrectCount() {
                const correctCount = this.gameState.pieces.filter(p => p.isCorrect).length;
                const totalCount = this.config.difficulty * this.config.difficulty;
                this.gameState.correctCount = correctCount;
                this.ui.correctCount.textContent = `${correctCount}/${totalCount}`;
            }

            checkVictory() {
                const allCorrect = this.gameState.pieces.every(p => p.isCorrect);

                if (allCorrect && this.gameState.isPlaying) {
                    this.pauseGame();

                    const elapsed = Math.floor((Date.now() - this.gameState.startTime) / 1000);
                    const min = Math.floor(elapsed / 60);
                    const sec = elapsed % 60;

                    this.ui.victoryStats.innerHTML = `
                        用时: ${min}分${sec}秒<br>
                        总步数: ${this.gameState.moveCount}步
                    `;

                    setTimeout(() => {
                        this.ui.victoryModal.classList.add('visible');
                    }, 300);
                }
            }

            showHint() {
                this.gameState.pieces.forEach(piece => {
                    if (!piece.isCorrect) {
                        piece.element.style.opacity = '0.5';
                        setTimeout(() => {
                            piece.element.style.opacity = '1';
                        }, 500);
                    }
                });
            }

            autoSolve() {
                this.gameState.pieces.forEach((piece, index) => {
                    piece.x = parseInt(piece.element.dataset.correctX);
                    piece.y = parseInt(piece.element.dataset.correctY);
                    piece.isCorrect = true;
                    piece.element.classList.add('correct');
                    piece.element.style.zIndex = '1';
                    piece.element.style.transition = 'all 0.3s ease';
                    piece.element.style.left = piece.x + 'px';
                    piece.element.style.top = piece.y + 'px';
                });

                setTimeout(() => {
                    this.gameState.pieces.forEach(piece => {
                        piece.element.style.transition = '';
                    });
                }, 350);

                this.updateCorrectCount();
                this.checkVictory();
            }

            updateTips(text) {
                this.ui.tipsText.textContent = text;
            }
        }

        new PuzzleGame();
    </script>
</body>
</html>
