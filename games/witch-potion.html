    <script>
        class WitchPotionGame {
            constructor() {
                this.selectedIngredients = [];
                this.currentRecipeIndex = 0;
                this.successCount = 0;
                this.failCount = 0;
                this.level = 0;
                
                this.recipes = [
                    {
                        name: '治疗药水',
                        ingredients: ['herb', 'water', 'honey'],
                        description: '你成功配制了治疗药水！这种药水可以快速恢复生命值。',
                        color: '#00b894',
                        ingredientDescriptions: {
                            'herb': '🌿 草药 - 基础治疗成分',
                            'water': '💧 纯净水 - 溶解其他成分',
                            'honey': '🍯 蜂蜜 - 增强药效'
                        }
                    },
                    {
                        name: '隐身药水',
                        ingredients: ['mushroom', 'water', 'flower'],
                        description: '你成功配制了隐身药水！喝下后可以短时间内隐身。',
                        color: '#a29bfe',
                        ingredientDescriptions: {
                            'mushroom': '🍄 毒蘑菇 - 产生幻觉效果',
                            'water': '💧 纯净水 - 稀释毒性',
                            'flower': '🌸 月光花 - 隐身魔法源泉'
                        }
                    },
                    {
                        name: '力量药水',
                        ingredients: ['blood', 'bone', 'crystal'],
                        description: '你成功配制了力量药水！可以大幅提升物理攻击力。',
                        color: '#e17055',
                        ingredientDescriptions: {
                            'blood': '🩸 龙血 - 强大的力量源泉',
                            'bone': '🦴 古老骨头 - 增强骨骼强度',
                            'crystal': '💎 魔法水晶 - 放大魔法效果'
                        }
                    },
                    {
                        name: '飞行药水',
                        ingredients: ['feather', 'star', 'water'],
                        description: '你成功配制了飞行药水！可以获得短时间的飞行能力。',
                        color: '#fdcb6e',
                        ingredientDescriptions: {
                            'feather': '🪶 凤凰羽毛 - 飞行的核心',
                            'star': '⭐ 星辰碎片 - 减轻重力',
                            'water': '💧 纯净水 - 平衡药效'
                        }
                    },
                    {
                        name: '毒药',
                        ingredients: ['spider', 'mushroom', 'eye'],
                        description: '你成功配制了致命毒药！极其危险，请小心使用。',
                        color: '#6c5ce7',
                        ingredientDescriptions: {
                            'spider': '🕷️ 毒蜘蛛 - 剧毒来源',
                            'mushroom': '🍄 毒蘑菇 - 增强毒性',
                            'eye': '👁️ 巨龙之眼 - 诅咒效果'
                        }
                    }
                ];
                
                this.levels = [
                    '初级女巫', '中级女巫', '高级女巫', '大师女巫', '传奇女巫'
                ];
                
                this.bindEvents();
                this.updateRecipe();
                this.updateStats();
            }
            
            updateRecipe() {
                const recipe = this.recipes[this.currentRecipeIndex];
                document.getElementById('currentRecipe').textContent = recipe.name;
                
                const ingredientsContainer = document.getElementById('recipeIngredients');
                ingredientsContainer.innerHTML = '';
                
                recipe.ingredients.forEach(ingredient => {
                    const div = document.createElement('div');
                    div.className = 'ingredient';
                    div.textContent = recipe.ingredientDescriptions[ingredient];
                    ingredientsContainer.appendChild(div);
                });
            }
            
            updateSelectedIngredients() {
                const container = document.getElementById('selectedList');
                container.innerHTML = '';
                
                this.selectedIngredients.forEach(ingredient => {
                    const tag = document.createElement('div');
                    tag.className = 'selected-tag';
                    tag.textContent = this.getIngredientName(ingredient);
                    container.appendChild(tag);
                });
            }
            
            getIngredientName(ingredient) {
                const names = {
                    'herb': '🌿 草药',
                    'water': '💧 纯净水',
                    'honey': '🍯 蜂蜜',
                    'mushroom': '🍄 毒蘑菇',
                    'crystal': '💎 魔法水晶',
                    'feather': '🪶 凤凰羽毛',
                    'eye': '👁️ 巨龙之眼',
                    'bone': '🦴 古老骨头',
                    'flower': '🌸 月光花',
                    'spider': '🕷️ 毒蜘蛛',
                    'star': '⭐ 星辰碎片',
                    'blood': '🩸 龙血'
                };
                return names[ingredient] || ingredient;
            }
            
            updateStats() {
                document.getElementById('successCount').textContent = this.successCount;
                document.getElementById('failCount').textContent = this.failCount;
                
                this.level = Math.min(Math.floor(this.successCount / 2), this.levels.length - 1);
                document.getElementById('currentLevel').textContent = this.levels[this.level];
            }
            
            selectIngredient(ingredient) {
                if (this.selectedIngredients.length < 5) {
                    this.selectedIngredients.push(ingredient);
                    this.updateSelectedIngredients();
                    this.updatePotionLevel();
                }
            }
            
            updatePotionLevel() {
                const potion = document.getElementById('potion');
                const level = Math.min((this.selectedIngredients.length / 5) * 100, 100);
                potion.style.height = `${level}%`;
                
                // 根据材料改变颜色
                if (this.selectedIngredients.includes('blood')) {
                    potion.style.background = 'linear-gradient(135deg, #e17055 0%, #d63031 100%)';
                } else if (this.selectedIngredients.includes('mushroom')) {
                    potion.style.background = 'linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%)';
                } else if (this.selectedIngredients.includes('crystal')) {
                    potion.style.background = 'linear-gradient(135deg, #74b9ff 0%, #0984e3 100%)';
                } else if (this.selectedIngredients.includes('herb')) {
                    potion.style.background = 'linear-gradient(135deg, #00b894 0%, #00a085 100%)';
                } else {
                    potion.style.background = 'linear-gradient(135deg, #fdcb6e 0%, #e17055 100%)';
                }
            }
            
            brewPotion() {
                if (this.selectedIngredients.length === 0) {
                    this.showResult('空锅', '你需要先添加一些材料才能开始炼制！', '#e17055', false);
                    return;
                }
                
                const potion = document.getElementById('potion');
                potion.classList.add('bubbling');
                
                setTimeout(() => {
                    potion.classList.remove('bubbling');
                    this.checkRecipe();
                }, 2000);
            }
            
            checkRecipe() {
                const currentRecipe = this.recipes[this.currentRecipeIndex];
                const selectedSet = new Set(this.selectedIngredients.sort());
                const recipeSet = new Set(currentRecipe.ingredients.sort());
                
                // 检查是否完全匹配当前配方
                if (this.arraysEqual(Array.from(selectedSet), Array.from(recipeSet))) {
                    this.successCount++;
                    this.showResult('配制成功!', currentRecipe.description, currentRecipe.color, true);
                    
                    // 切换到下一个配方
                    this.currentRecipeIndex = (this.currentRecipeIndex + 1) % this.recipes.length;
                    this.updateRecipe();
                } else {
                    // 检查是否匹配其他配方
                    let foundMatch = false;
                    for (let i = 0; i < this.recipes.length; i++) {
                        if (i !== this.currentRecipeIndex) {
                            const otherRecipeSet = new Set(this.recipes[i].ingredients.sort());
                            if (this.arraysEqual(Array.from(selectedSet), Array.from(otherRecipeSet))) {
                                this.successCount++;
                                this.showResult('意外发现!', `你意外配制出了${this.recipes[i].name}！${this.recipes[i].description}`, this.recipes[i].color, true);
                                foundMatch = true;
                                break;
                            }
                        }
                    }
                    
                    if (!foundMatch) {
                        this.failCount++;
                        this.showResult('配制失败', '这个配方不正确，大锅里冒出了奇怪的烟雾...请重新尝试！', '#e17055', false);
                    }
                }
                
                this.updateStats();
            }
            
            arraysEqual(a, b) {
                return a.length === b.length && a.every((val, index) => val === b[index]);
            }
            
            showResult(title, description, color, success) {
                const resultPanel = document.getElementById('resultPanel');
                const resultTitle = document.getElementById('resultTitle');
                const resultDescription = document.getElementById('resultDescription');
                
                resultTitle.textContent = title;
                resultTitle.style.color = color;
                resultDescription.textContent = description;
                resultPanel.style.borderColor = color;
                resultPanel.style.display = 'block';
                
                if (success) {
                    // 成功动画
                    resultPanel.style.animation = 'none';
                    setTimeout(() => {
                        resultPanel.style.animation = 'pulse 0.5s ease-in-out';
                    }, 10);
                }
                
                setTimeout(() => {
                    resultPanel.style.display = 'none';
                }, 4000);
            }
            
            clearCauldron() {
                this.selectedIngredients = [];
                this.updateSelectedIngredients();
                
                const potion = document.getElementById('potion');
                potion.style.height = '0%';
                potion.style.background = 'linear-gradient(135deg, #74b9ff 0%, #0984e3 100%)';
                
                // 清除所有选中状态
                document.querySelectorAll('.ingredient-item').forEach(item => {
                    item.classList.remove('selected');
                });
            }
            
            showHint() {
                const currentRecipe = this.recipes[this.currentRecipeIndex];
                const missingIngredients = currentRecipe.ingredients.filter(ingredient => 
                    !this.selectedIngredients.includes(ingredient)
                );
                
                if (missingIngredients.length > 0) {
                    const hint = `提示：你还需要 ${missingIngredients.map(ing => this.getIngredientName(ing)).join(', ')}`;
                    this.showResult('魔法提示', hint, '#a29bfe', false);
                } else if (this.selectedIngredients.length > currentRecipe.ingredients.length) {
                    this.showResult('魔法提示', '你添加了太多材料，试试移除一些不必要的成分。', '#a29bfe', false);
                } else {
                    this.showResult('魔法提示', '配方看起来是正确的，试试炼制吧！', '#a29bfe', false);
                }
            }
            
            bindEvents() {
                // 材料选择
                document.querySelectorAll('.ingredient-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const ingredient = item.dataset.ingredient;
                        this.selectIngredient(ingredient);
                        item.classList.add('selected');
                        
                        // 添加点击动画
                        item.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            item.style.transform = '';
                        }, 150);
                    });
                });
                
                // 控制按钮
                document.getElementById('brewBtn').addEventListener('click', () => {
                    this.brewPotion();
                });
                
                document.getElementById('clearBtn').addEventListener('click', () => {
                    this.clearCauldron();
                });
                
                document.getElementById('hintBtn').addEventListener('click', () => {
                    this.showHint();
                });
            }
        }
        
        // 添加脉冲动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes pulse {
                0% { transform: scale(1); }
                50% { transform: scale(1.05); }
                100% { transform: scale(1); }
            }
        `;
        document.head.appendChild(style);
        
        // 启动游戏
        new WitchPotionGame();
    </script>
</body>
</html>
