    <script>

                    ],
                    medieval: [
                        { title: "西罗马帝国灭亡", description: "日耳曼人攻陷罗马", year: 476 },
                        { title: "伊斯兰教创立", description: "穆罕默德创立伊斯兰教", year: 610 },
                        { title: "查理曼加冕", description: "法兰克王国查理曼称帝", year: 800 },
                        { title: "第一次十字军东征", description: "基督教世界对穆斯林的圣战", year: 1096 },
                        { title: "蒙古帝国建立", description: "成吉思汗统一蒙古各部", year: 1206 },
                        { title: "黑死病大流行", description: "鼠疫席卷欧洲", year: 1347 },
                        { title: "君士坦丁堡陷落", description: "奥斯曼帝国攻陷拜占庭", year: 1453 },
                        { title: "哥伦布发现美洲", description: "开启大航海时代", year: 1492 }
                    ],
                    modern: [
                        { title: "英国工业革命", description: "机器生产取代手工劳动", year: 1760 },
                        { title: "美国独立战争", description: "北美十三殖民地独立", year: 1775 },
                        { title: "法国大革命", description: "推翻君主制，建立共和国", year: 1789 },
                        { title: "拿破仑称帝", description: "法兰西第一帝国建立", year: 1804 },
                        { title: "第一次世界大战", description: "人类历史上第一次世界大战", year: 1914 },
                        { title: "俄国十月革命", description: "布尔什维克夺取政权", year: 1917 },
                        { title: "第二次世界大战", description: "法西斯主义与反法西斯的较量", year: 1939 },
                        { title: "联合国成立", description: "国际组织维护世界和平", year: 1945 }
                    ],
                    china: [
                        { title: "夏朝建立", description: "中国第一个世袭制王朝", year: -2070 },
                        { title: "商朝建立", description: "甲骨文和青铜器文明", year: -1600 },
                        { title: "西周建立", description: "分封制和宗法制", year: -1046 },
                        { title: "春秋时期开始", description: "礼崩乐坏，百家争鸣", year: -770 },
                        { title: "战国时期开始", description: "七雄争霸，变法图强", year: -475 },
                        { title: "秦朝建立", description: "中国第一个统一的封建王朝", year: -221 },
                        { title: "汉朝建立", description: "刘邦建立西汉王朝", year: -206 },
                        { title: "唐朝建立", description: "李渊建立唐朝", year: 618 }
                    ]
                };
                
                this.currentPeriod = 'ancient';
                this.currentRound = 1;
                this.score = 0;
                this.correctCount = 0;
                this.totalRounds = 0;
                this.currentEvents = [];
                this.placedEvents = [];
                this.draggedElement = null;
                
                this.initElements();
                this.bindEvents();
                this.startNewRound();
            }
            
            initElements() {
                this.timeline = document.getElementById('timeline');
                this.eventsGrid = document.getElementById('eventsGrid');
                this.feedback = document.getElementById('feedback');
                this.checkBtn = document.getElementById('checkBtn');
                this.hintBtn = document.getElementById('hintBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.gameComplete = document.getElementById('gameComplete');
                
                this.scoreSpan = document.getElementById('score');
                this.roundSpan = document.getElementById('round');
                this.correctCountSpan = document.getElementById('correctCount');
                this.accuracySpan = document.getElementById('accuracy');
            }
            
            bindEvents() {
                // 时期选择
                document.querySelectorAll('.period-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentPeriod = e.target.dataset.period;
                        this.resetGame();
                    });
                });
                
                this.checkBtn.addEventListener('click', () => this.checkAnswer());
                this.hintBtn.addEventListener('click', () => this.showHint());
                this.resetBtn.addEventListener('click', () => this.resetRound());
                this.nextBtn.addEventListener('click', () => this.nextRound());
            }
            
            resetGame() {
                this.currentRound = 1;
                this.score = 0;
                this.correctCount = 0;
                this.totalRounds = 0;
                this.gameComplete.style.display = 'none';
                this.startNewRound();
            }
            
            startNewRound() {
                // 随机选择4个事件
                const allEvents = this.events[this.currentPeriod];
                this.currentEvents = this.shuffleArray([...allEvents]).slice(0, 4);
                this.currentEvents.sort((a, b) => a.year - b.year); // 按年份排序作为正确答案
                
                this.placedEvents = new Array(4).fill(null);
                this.renderTimeline();
                this.renderEvents();
                this.updateStats();
                
                this.feedback.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.checkBtn.disabled = true;
            }
            
            renderTimeline() {
                this.timeline.innerHTML = '';
                
                for (let i = 0; i < 4; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'timeline-slot';
                    slot.dataset.index = i;
                    
                    const dropZone = document.createElement('div');
                    dropZone.className = `drop-zone ${i % 2 === 0 ? 'left' : 'right'}`;
                    dropZone.textContent = '拖拽事件到这里';
                    dropZone.addEventListener('dragover', this.handleDragOver.bind(this));
                    dropZone.addEventListener('drop', this.handleDrop.bind(this));
                    
                    slot.appendChild(dropZone);
                    this.timeline.appendChild(slot);
                }
            }
            
            renderEvents() {
                this.eventsGrid.innerHTML = '';
                
                // 打乱事件顺序
                const shuffledEvents = this.shuffleArray([...this.currentEvents]);
                
                shuffledEvents.forEach((event, index) => {
                    const card = document.createElement('div');
                    card.className = 'event-card';
                    card.draggable = true;
                    card.dataset.eventId = this.currentEvents.indexOf(event);
                    
                    card.innerHTML = `
                        <div class="event-title">${event.title}</div>
                        <div class="event-description">${event.description}</div>
                        <div class="event-year">${this.formatYear(event.year)}</div>
                    `;
                    
                    card.addEventListener('dragstart', this.handleDragStart.bind(this));
                    card.addEventListener('dragend', this.handleDragEnd.bind(this));
                    
                    this.eventsGrid.appendChild(card);
                });
            }
            
            formatYear(year) {
                return year < 0 ? `公元前${Math.abs(year)}年` : `公元${year}年`;
            }
            
            handleDragStart(e) {
                this.draggedElement = e.target;
                e.target.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            }
            
            handleDragEnd(e) {
                e.target.classList.remove('dragging');
                this.draggedElement = null;
            }
            
            handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                e.target.classList.add('drag-over');
            }
            
            handleDrop(e) {
                e.preventDefault();
                e.target.classList.remove('drag-over');
                
                if (!this.draggedElement) return;
                
                const slotIndex = parseInt(e.target.closest('.timeline-slot').dataset.index);
                const eventId = parseInt(this.draggedElement.dataset.eventId);
                
                // 检查该位置是否已有事件
                if (this.placedEvents[slotIndex] !== null) {
                    // 将原事件放回事件池
                    const originalEventCard = document.querySelector(`[data-event-id="${this.placedEvents[slotIndex]}"]`);
                    if (originalEventCard) {
                        originalEventCard.classList.remove('used');
                        originalEventCard.draggable = true;
                    }
                }
                
                // 放置新事件
                this.placedEvents[slotIndex] = eventId;
                const event = this.currentEvents[eventId];
                
                // 更新时间线显示
                const dropZone = e.target;
                dropZone.innerHTML = `
                    <div class="timeline-item ${slotIndex % 2 === 0 ? 'left' : 'right'}">
                        <div class="event-title">${event.title}</div>
                        <div class="event-description">${event.description}</div>
                        <div class="event-year">${this.formatYear(event.year)}</div>
                    </div>
                `;
                
                // 标记事件卡片为已使用
                this.draggedElement.classList.add('used');
                this.draggedElement.draggable = false;
                
                // 检查是否可以提交答案
                this.checkBtn.disabled = this.placedEvents.includes(null);
            }
            
            checkAnswer() {
                // 检查答案：比较每个位置放置的事件是否是按时间顺序正确的
                const isCorrect = this.placedEvents.every((eventId, index) => {
                    return eventId === index; // placedEvents[i] 表示第i个位置的事件id，index是位置
                    // currentEvents已经按年份排序，所以 currentEvents[i] 是第i早的事件
                });

                this.totalRounds++;

                // 显示结果
                document.querySelectorAll('.timeline-slot').forEach((slot, index) => {
                    const timelineItem = slot.querySelector('.timeline-item');
                    if (timelineItem) {
                        if (this.placedEvents[index] === index) {
                            timelineItem.classList.add('correct');
                            slot.classList.add('filled');
                        } else {
                            timelineItem.classList.add('wrong');
                        }
                    }
                });
                
                if (isCorrect) {
                    this.score += 20;
                    this.correctCount++;
                    this.feedback.className = 'feedback correct';
                    this.feedback.textContent = '恭喜！时间线排序完全正确！';
                } else {
                    this.feedback.className = 'feedback wrong';
                    this.feedback.innerHTML = `
                        <strong>排序有误！</strong><br>
                        正确的时间顺序是：<br>
                        ${this.currentEvents.map((event, index) => 
                            `${index + 1}. ${event.title} (${this.formatYear(event.year)})`
                        ).join('<br>')}
                    `;
                }
                
                this.feedback.style.display = 'block';
                this.checkBtn.disabled = true;
                
                if (this.currentRound >= 5) {
                    this.nextBtn.textContent = '查看结果';
                } else {
                    this.nextBtn.textContent = '下一轮';
                }
                this.nextBtn.style.display = 'inline-block';
                
                this.updateStats();
            }
            
            showHint() {
                // 显示最早的事件提示
                const earliestEvent = this.currentEvents[0];
                const hintCard = document.querySelector(`[data-event-id="0"]`);
                
                if (hintCard && !hintCard.classList.contains('used')) {
                    hintCard.style.background = '#fff3cd';
                    hintCard.style.borderColor = '#ffeaa7';
                    
                    setTimeout(() => {
                        hintCard.style.background = '';
                        hintCard.style.borderColor = '';
                    }, 3000);
                }
                
                this.feedback.className = 'feedback';
                this.feedback.innerHTML = `提示：最早的事件是 "${earliestEvent.title}" (${this.formatYear(earliestEvent.year)})`;
                this.feedback.style.display = 'block';
            }
            
            resetRound() {
                this.placedEvents = new Array(4).fill(null);
                this.renderTimeline();
                
                // 重置事件卡片
                document.querySelectorAll('.event-card').forEach(card => {
                    card.classList.remove('used');
                    card.draggable = true;
                });
                
                this.feedback.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.checkBtn.disabled = true;
            }
            
            nextRound() {
                this.currentRound++;
                
                if (this.currentRound > 5) {
                    this.showGameComplete();
                } else {
                    this.startNewRound();
                }
            }
            
            showGameComplete() {
                const accuracy = Math.round((this.correctCount / this.totalRounds) * 100);
                
                document.getElementById('finalRounds').textContent = this.totalRounds;
                document.getElementById('finalCorrect').textContent = this.correctCount;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('finalAccuracy').textContent = accuracy + '%';
                
                this.gameComplete.style.display = 'block';
                this.nextBtn.style.display = 'none';
                this.checkBtn.style.display = 'none';
                this.hintBtn.style.display = 'none';
                this.resetBtn.textContent = '重新开始';
                this.resetBtn.onclick = () => this.resetGame();
            }
            
            updateStats() {
                this.scoreSpan.textContent = this.score;
                this.roundSpan.textContent = this.currentRound;
                this.correctCountSpan.textContent = this.correctCount;
                
                const accuracy = this.totalRounds > 0 ? 
                    Math.round((this.correctCount / this.totalRounds) * 100) : 0;
                this.accuracySpan.textContent = accuracy + '%';
            }
            
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }
        
        // 启动游戏
        new HistoryTimelineGame();
    </script>
</body>
</html>
