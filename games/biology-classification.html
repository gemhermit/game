            initElements() {
                this.classificationTree = document.getElementById('classificationTree');
                this.organismsGrid = document.getElementById('organismsGrid');
                this.instruction = document.getElementById('instruction');
                this.feedback = document.getElementById('feedback');
                this.progressFill = document.getElementById('progressFill');
                
                this.checkBtn = document.getElementById('checkBtn');
                this.hintBtn = document.getElementById('hintBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.nextBtn = document.getElementById('nextBtn');
                this.gameComplete = document.getElementById('gameComplete');
                
                this.scoreSpan = document.getElementById('score');
                this.classifiedCountSpan = document.getElementById('classifiedCount');
                this.accuracySpan = document.getElementById('accuracy');
                this.roundSpan = document.getElementById('round');
            }
            
            bindEvents() {
                // 分类选择
                document.querySelectorAll('.classification-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.classification-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentClassification = e.target.dataset.classification;
                        this.resetGame();
                    });
                });
                
                this.checkBtn.addEventListener('click', () => this.checkAnswer());
                this.hintBtn.addEventListener('click', () => this.showHint());
                this.resetBtn.addEventListener('click', () => this.resetRound());
                this.nextBtn.addEventListener('click', () => this.nextRound());
            }
            
            resetGame() {
                this.currentRound = 1;
                this.score = 0;
                this.classifiedCount = 0;
                this.totalRounds = 0;
                this.gameComplete.style.display = 'none';
                this.startNewRound();
            }
            
            startNewRound() {
                const classification = this.classifications[this.currentClassification];
                
                // 随机选择4个生物
                this.currentOrganisms = this.shuffleArray([...classification.organisms]).slice(0, 4);
                this.placedOrganisms = {};
                
                this.renderClassificationTree();
                this.renderOrganisms();
                this.updateStats();
                this.updateProgress();
                
                this.instruction.textContent = `将下方的生物拖拽到正确的${classification.title}位置上`;
                this.feedback.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.checkBtn.disabled = true;
            }
            
            renderClassificationTree() {
                this.classificationTree.innerHTML = '';
                const classification = this.classifications[this.currentClassification];
                
                classification.tree.forEach((level, levelIndex) => {
                    const levelDiv = document.createElement('div');
                    levelDiv.className = 'tree-level';
                    
                    const levelTitle = document.createElement('div');
                    levelTitle.className = 'level-title';
                    levelTitle.textContent = level.level;
                    levelDiv.appendChild(levelTitle);
                    
                    const nodesContainer = document.createElement('div');
                    nodesContainer.style.display = 'flex';
                    nodesContainer.style.justifyContent = 'center';
                    nodesContainer.style.flexWrap = 'wrap';
                    nodesContainer.style.gap = '20px';
                    nodesContainer.style.width = '100%';
                    
                    level.nodes.forEach(node => {
                        const nodeDiv = document.createElement('div');
                        nodeDiv.className = 'tree-node drop-zone';
                        nodeDiv.dataset.category = node;
                        nodeDiv.textContent = node;
                        
                        nodeDiv.addEventListener('dragover', this.handleDragOver.bind(this));
                        nodeDiv.addEventListener('drop', this.handleDrop.bind(this));
                        
                        nodesContainer.appendChild(nodeDiv);
                    });
                    
                    levelDiv.appendChild(nodesContainer);
                    this.classificationTree.appendChild(levelDiv);
                });
            }

                this.organismsGrid.innerHTML = '';
                
                // 打乱生物顺序
                const shuffledOrganisms = this.shuffleArray([...this.currentOrganisms]);
                
                shuffledOrganisms.forEach((organism, index) => {
                    const card = document.createElement('div');
                    card.className = 'organism-card';
                    card.draggable = true;
                    card.dataset.organismId = this.currentOrganisms.indexOf(organism);
                    
                    card.innerHTML = `
                        <div class="organism-image">${organism.emoji}</div>
                        <div class="organism-name">${organism.name}</div>
                        <div class="organism-description">${organism.description}</div>
                    `;
                    
                    card.addEventListener('dragstart', this.handleDragStart.bind(this));
                    card.addEventListener('dragend', this.handleDragEnd.bind(this));
                    
                    this.organismsGrid.appendChild(card);
                });
            }
            
            handleDragStart(e) {
                this.draggedElement = e.target;
                e.target.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
            }
            
            handleDragEnd(e) {
                e.target.classList.remove('dragging');
                this.draggedElement = null;
            }
            
            handleDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                e.target.classList.add('drag-over');
            }
            
            handleDrop(e) {
                e.preventDefault();
                e.target.classList.remove('drag-over');
                
                if (!this.draggedElement) return;
                
                const category = e.target.dataset.category;
                const organismId = parseInt(this.draggedElement.dataset.organismId);
                const organism = this.currentOrganisms[organismId];
                
                // 检查该位置是否已有生物
                if (this.placedOrganisms[category]) {
                    // 将原生物放回生物池
                    const originalCard = document.querySelector(`[data-organism-id="${this.placedOrganisms[category]}"]`);
                    if (originalCard) {
                        originalCard.classList.remove('used');
                        originalCard.draggable = true;
                    }
                }
                
                // 放置新生物
                this.placedOrganisms[category] = organismId;
                
                // 更新分类树显示
                const dropZone = e.target;
                dropZone.innerHTML = `
                    <div class="organism-image">${organism.emoji}</div>
                    <div class="organism-name">${organism.name}</div>
                `;
                dropZone.classList.add('filled');
                
                // 标记生物卡片为已使用
                this.draggedElement.classList.add('used');
                this.draggedElement.draggable = false;
                
                // 检查是否可以提交答案
                this.checkBtn.disabled = Object.keys(this.placedOrganisms).length === 0;
            }
            
            checkAnswer() {
                let correctCount = 0;
                const totalPlaced = Object.keys(this.placedOrganisms).length;
                
                // 检查每个放置的生物
                Object.entries(this.placedOrganisms).forEach(([category, organismId]) => {
                    const organism = this.currentOrganisms[organismId];
                    const dropZone = document.querySelector(`[data-category="${category}"]`);
                    
                    if (organism.category === category) {
                        dropZone.classList.add('correct');
                        correctCount++;
                    } else {
                        dropZone.classList.add('wrong');
                    }
                });
                
                this.totalRounds++;
                this.classifiedCount += correctCount;
                
                if (correctCount === totalPlaced && totalPlaced === this.currentOrganisms.length) {
                    this.score += 25;
                    this.feedback.className = 'feedback correct';
                    this.feedback.textContent = '恭喜！所有生物分类完全正确！';
                } else if (correctCount > 0) {
                    this.score += correctCount * 5;
                    this.feedback.className = 'feedback';
                    this.feedback.textContent = `部分正确！${correctCount}/${totalPlaced} 个生物分类正确。`;
                } else {
                    this.feedback.className = 'feedback wrong';
                    this.feedback.innerHTML = `
                        <strong>分类有误！</strong><br>
                        正确的分类是：<br>
                        ${this.currentOrganisms.map(organism => 
                            `${organism.name} → ${organism.category}`
                        ).join('<br>')}
                    `;
                }
                
                this.feedback.style.display = 'block';
                this.checkBtn.disabled = true;
                
                if (this.currentRound >= 5) {
                    this.nextBtn.textContent = '查看结果';
                } else {
                    this.nextBtn.textContent = '下一轮';
                }
                this.nextBtn.style.display = 'inline-block';
                
                this.updateStats();
            }
            
            showHint() {
                // 显示第一个未分类生物的提示
                const unplacedOrganism = this.currentOrganisms.find((organism, index) => {
                    return !Object.values(this.placedOrganisms).includes(index);
                });
                
                if (unplacedOrganism) {
                    const correctCategory = unplacedOrganism.category;
                    const targetNode = document.querySelector(`[data-category="${correctCategory}"]`);
                    
                    if (targetNode) {
                        targetNode.style.background = '#fff3cd';
                        targetNode.style.borderColor = '#ffeaa7';
                        
                        setTimeout(() => {
                            targetNode.style.background = '';
                            targetNode.style.borderColor = '';
                        }, 3000);
                    }
                    
                    this.feedback.className = 'feedback';
                    this.feedback.innerHTML = `提示：${unplacedOrganism.name} 应该分类到 "${correctCategory}"`;
                    this.feedback.style.display = 'block';
                }
            }
            
            resetRound() {
                this.placedOrganisms = {};
                
                // 重置分类树
                document.querySelectorAll('.tree-node').forEach(node => {
                    if (node.dataset.category) {
                        node.textContent = node.dataset.category;
                        node.className = 'tree-node drop-zone';
                    }
                });
                
                // 重置生物卡片
                document.querySelectorAll('.organism-card').forEach(card => {
                    card.classList.remove('used');
                    card.draggable = true;
                });
                
                this.feedback.style.display = 'none';
                this.nextBtn.style.display = 'none';
                this.checkBtn.disabled = true;
            }
            
            nextRound() {
                this.currentRound++;
                
                if (this.currentRound > 5) {
                    this.showGameComplete();
                } else {
                    this.startNewRound();
                }
            }
            
            showGameComplete() {
                const accuracy = this.totalRounds > 0 ? 
                    Math.round((this.classifiedCount / (this.totalRounds * this.currentOrganisms.length)) * 100) : 0;
                
                document.getElementById('finalRounds').textContent = this.totalRounds;
                document.getElementById('finalCorrect').textContent = this.classifiedCount;
                document.getElementById('finalScore').textContent = this.score;
                document.getElementById('finalAccuracy').textContent = accuracy + '%';
                
                this.gameComplete.style.display = 'block';
                this.nextBtn.style.display = 'none';
                this.checkBtn.style.display = 'none';
                this.hintBtn.style.display = 'none';
                this.resetBtn.textContent = '重新开始';
                this.resetBtn.onclick = () => this.resetGame();
            }
            
            updateStats() {
                this.scoreSpan.textContent = this.score;
                this.roundSpan.textContent = this.currentRound;
                this.classifiedCountSpan.textContent = this.classifiedCount;
                
                const accuracy = this.totalRounds > 0 ? 
                    Math.round((this.classifiedCount / (this.totalRounds * this.currentOrganisms.length)) * 100) : 0;
                this.accuracySpan.textContent = accuracy + '%';
            }
            
            updateProgress() {
                const progress = Object.keys(this.placedOrganisms).length / this.currentOrganisms.length * 100;
                this.progressFill.style.width = progress + '%';
            }
            
            shuffleArray(array) {
                const shuffled = [...array];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }
        }
        
        // 启动游戏
        new BiologyClassificationGame();
    </script>
</body>
</html>
