                </div>
                <div class="progress-bar">
                    <div class="fill" id="progressFill" style="width: 0%"></div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">
                    <span class="icon">👥</span> 姓名列表
                </div>
                <div class="name-list-container" id="nameList">
                    <div class="empty-state">暂无姓名，请先添加</div>
                </div>
            </div>

            <div class="btn-row">
                <button class="btn btn-warning" id="resetBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                    重置点名
                </button>
                <button class="btn btn-danger" id="clearBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    清空名单
                </button>
            </div>
        </div>

        <div class="right-panel">
            <div class="mode-select">
                <button class="mode-btn active" data-mode="random">🎲 随机模式</button>
                <button class="mode-btn" data-mode="sequence">📋 顺序模式</button>
                <button class="mode-btn" data-mode="group">👥 分组模式</button>
            </div>

            <div class="display-area" id="displayArea">
                <div class="selected-name" id="selectedName">点击开始点名</div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startBtn" style="min-width: 160px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    开始点名
                </button>
                <button class="btn btn-danger" id="stopBtn" disabled style="min-width: 160px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="6" y="4" width="4" height="16"></rect>
                        <rect x="14" y="4" width="4" height="16"></rect>
                    </svg>
                    停止
                </button>
            </div>

            <div class="options-row">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="allowRepeat">
                    <span>允许重复点名</span>
                </label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="showAnimation" checked>
                    <span>显示动画效果</span>
                </label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="soundEffect">
                    <span>启用音效</span>
                </label>
            </div>

            <div class="history-section">
                <div class="history-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    点名历史（最近10条）
                </div>
                <div class="history-list" id="historyList">
                    <div class="empty-state">暂无点名记录</div>
                </div>
            </div>

            <div class="shortcut-hints">
                <div class="shortcut-hint"><kbd>空格</kbd> 开始/停止</div>
                <div class="shortcut-hint"><kbd>H</kbd> 隐藏面板</div>
                <div class="shortcut-hint"><kbd>R</kbd> 重置点名</div>
            </div>
        </div>
    </div>

    <script>
        // 状态管理
        let names = [];
        let calledNames = [];
        let isRolling = false;
        let rollingInterval = null;
        let isLeftPanelHidden = false;
        let currentMode = 'random';
        let sequenceIndex = -1;
        let groupSize = 2;

        // DOM元素
        const elements = {
            singleName: document.getElementById('singleName'),
            batchNames: document.getElementById('batchNames'),
            addSingleBtn: document.getElementById('addSingleBtn'),
            addBatchBtn: document.getElementById('addBatchBtn'),
            nameList: document.getElementById('nameList'),
            selectedName: document.getElementById('selectedName'),
            displayArea: document.getElementById('displayArea'),
            startBtn: document.getElementById('startBtn'),
            stopBtn: document.getElementById('stopBtn'),
            resetBtn: document.getElementById('resetBtn'),
            clearBtn: document.getElementById('clearBtn'),
            allowRepeat: document.getElementById('allowRepeat'),
            showAnimation: document.getElementById('showAnimation'),
            soundEffect: document.getElementById('soundEffect'),
            totalCount: document.getElementById('totalCount'),
            calledCount: document.getElementById('calledCount'),
            remainingCount: document.getElementById('remainingCount'),
            progressFill: document.getElementById('progressFill'),
            historyList: document.getElementById('historyList'),
            excelFile: document.getElementById('excelFile'),
            container: document.getElementById('container'),
            leftPanel: document.getElementById('leftPanel'),
            togglePanelBtn: document.getElementById('togglePanelBtn')
        };

        // 更新统计
        function updateStats() {
            elements.totalCount.textContent = names.length;
            elements.calledCount.textContent = calledNames.length;
            elements.remainingCount.textContent = names.length - calledNames.length;

            // 更新进度条
            const progress = names.length > 0 ? (calledNames.length / names.length) * 100 : 0;
            elements.progressFill.style.width = `${progress}%`;
        }

        // 更新姓名列表
        function updateNameList() {
            if (names.length === 0) {
                elements.nameList.innerHTML = '<div class="empty-state">暂无姓名，请先添加</div>';
                return;
            }

            elements.nameList.innerHTML = names.map((name, index) => {
                const isSelected = calledNames.includes(name);
                const displayName = isSelected ? `${name} ✓` : name;
                return `
                    <div class="name-item ${isSelected ? 'selected' : ''}">
                        <span class="name-text">${displayName}</span>
                        <button class="remove-btn" onclick="removeName(${index})" title="删除">✕</button>
                    </div>
                `;
            }).join('');
        }

        // 添加单个姓名
        function addSingleName() {
            const name = elements.singleName.value.trim();
            if (name && !names.includes(name)) {
                names.push(name);
                elements.singleName.value = '';
                updateNameList();
                updateStats();
            } else if (names.includes(name)) {
                showToast('该姓名已存在！');
            }
        }

        // 批量添加姓名
        function addBatchNames() {
            const batchText = elements.batchNames.value.trim();
            if (batchText) {
                const newNames = batchText.split(/[\n,，]/)
                    .map(name => name.trim())
                    .filter(name => name && !names.includes(name));

                if (newNames.length > 0) {
                    names.push(...newNames);
                    elements.batchNames.value = '';
                    updateNameList();
                    updateStats();
                    showToast(`成功添加 ${newNames.length} 个姓名！`);
                }
            }
        }

        // 删除姓名
        function removeName(index) {
            const removedName = names[index];
            names.splice(index, 1);
            calledNames = calledNames.filter(name => name !== removedName);
            updateNameList();
            updateStats();
        }

        // 获取可用姓名
        function getAvailableNames() {
            if (elements.allowRepeat.checked) {
                return names;
            }
            return names.filter(name => !calledNames.includes(name));
        }

        // 开始滚动
        function startRolling() {
            if (names.length === 0) {
                showToast('请先添加姓名！');
                return;
            }

            const availableNames = getAvailableNames();
            if (availableNames.length === 0 && !elements.allowRepeat.checked) {
                showToast('所有人都已被点名！请重置或允许重复点名。');
                return;
            }

            isRolling = true;
            elements.startBtn.disabled = true;
            elements.stopBtn.disabled = false;
            elements.startBtn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="6" y="4" width="4" height="16"></rect>
                    <rect x="14" y="4" width="4" height="16"></rect>
                </svg>
                点名中...
            `;

            // 显示滚动效果
            if (elements.showAnimation.checked) {
                elements.selectedName.className = 'rolling-names';
                rollingInterval = setInterval(() => {
                    const randomName = names[Math.floor(Math.random() * names.length)];
                    elements.selectedName.textContent = randomName;
                }, 80);
            }

            // 自动停止（3秒后）
            setTimeout(() => {
                if (isRolling) {
                    stopRolling();
                }
            }, 3000);
        }

        // 停止滚动
        function stopRolling() {
            if (!isRolling) return;

            isRolling = false;
            elements.startBtn.disabled = false;
            elements.stopBtn.disabled = true;
            elements.startBtn.innerHTML = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                开始点名
            `;

            if (rollingInterval) {
                clearInterval(rollingInterval);
                rollingInterval = null;
            }

            // 选择最终结果
            const availableNames = getAvailableNames();
            if (availableNames.length === 0) {
                showToast('所有人都已被点名！');
                return;
            }

            let selectedName;
            if (currentMode === 'sequence') {
                sequenceIndex = (sequenceIndex + 1) % availableNames.length;
                selectedName = availableNames[sequenceIndex];
            } else {
                selectedName = availableNames[Math.floor(Math.random() * availableNames.length)];
            }

            // 显示结果
            elements.selectedName.className = 'selected-name';
            elements.selectedName.textContent = selectedName;

            if (elements.showAnimation.checked) {
                elements.selectedName.classList.add('animate');
                setTimeout(() => {
                    elements.selectedName.classList.remove('animate');
                }, 600);

                // 播放音效
                if (elements.soundEffect.checked) {
                    playSuccessSound();
                }

                // 添加彩带效果
                createConfetti();
            }

            // 记录到历史
            if (!elements.allowRepeat.checked) {
                calledNames.push(selectedName);
            }

            addToHistory(selectedName);
            updateNameList();
            updateStats();
        }

        // 创建彩带效果
        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#96ceb4', '#feca57', '#ff9ff3', '#a29bfe', '#fd79a8'];

            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = `${Math.random() * 100}%`;
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = `${Math.random() * 0.5}s`;
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

                    elements.displayArea.appendChild(confetti);

                    setTimeout(() => {
                        if (confetti.parentNode) {
                            confetti.parentNode.removeChild(confetti);
                        }
                    }, 2500);
                }, i * 50);
            }
        }

        // 播放成功音效
        function playSuccessSound() {
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // E5
                oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // G5

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.4);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.4);
            } catch (e) {
                console.log('音频播放失败');
            }
        }

        // 添加到历史
        function addToHistory(name) {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            if (elements.historyList.querySelector('.empty-state')) {
                elements.historyList.innerHTML = '';
            }

            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.innerHTML = `${timeStr} · ${name}`;

            elements.historyList.insertBefore(historyItem, elements.historyList.firstChild);

            // 限制历史记录数量
            while (elements.historyList.children.length > 10) {
                elements.historyList.removeChild(elements.historyList.lastChild);
            }
        }

        // 重置点名
        function resetCalling() {
            calledNames = [];
            sequenceIndex = -1;
            elements.selectedName.textContent = '点击开始点名';
            updateNameList();
            updateStats();
        }

        // 清空所有
        function clearAllNames() {
            if (confirm('确定要清空所有姓名吗？')) {
                names = [];
                calledNames = [];
                sequenceIndex = -1;
                elements.selectedName.textContent = '点击开始点名';
                elements.historyList.innerHTML = '<div class="empty-state">暂无点名记录</div>';
                updateNameList();
                updateStats();
            }
        }

        // 切换面板
        function toggleLeftPanel() {
            isLeftPanelHidden = !isLeftPanelHidden;
            if (isLeftPanelHidden) {
                elements.container.classList.add('hide-left');
                elements.togglePanelBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 18l6-6-6-6"/>
                    </svg>
                `;
            } else {
                elements.container.classList.remove('hide-left');
                elements.togglePanelBtn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 18l-6-6 6-6"/>
                    </svg>
                `;
            }
        }

        // 处理文件导入
        function handleExcelFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const content = e.target.result;
                    let namesFromFile = [];

                    if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
                        // 处理CSV/TXT文件
                        const lines = content.split('\n');
                        namesFromFile = lines
                            .map(line => line.split(/[,\t]/)[0].trim())
                            .filter(name => name && name !== '姓名' && name !== 'Name' && name.length < 20);
                    } else {
                        // Excel文件需要额外库支持，这里给出提示
                        showToast('建议将Excel另存为CSV格式后导入');
                        event.target.value = '';
                        return;
                    }

                    const newNames = namesFromFile.filter(name => !names.includes(name));

                    if (newNames.length > 0) {
                        names.push(...newNames);
                        updateNameList();
                        updateStats();
                        showToast(`成功导入 ${newNames.length} 个姓名！`);
                    } else {
                        showToast('文件中没有找到新的姓名');
                    }
                } catch (error) {
                    showToast('文件读取失败，请检查格式');
                }

                event.target.value = '';
            };

            if (file.name.endsWith('.csv') || file.name.endsWith('.txt')) {
                reader.readAsText(file, 'UTF-8');
            } else {
                reader.readAsArrayBuffer(file);
            }
        }

        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 30px;
                left: 50%;
                transform: translateX(-50%);
                background: linear-gradient(135deg, #667eea, #764ba2);
                color: white;
                padding: 12px 24px;
                border-radius: 30px;
                font-size: 14px;
                font-weight: 500;
                box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
                z-index: 10000;
                animation: fadeInUp 0.3s ease;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'fadeOut 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        // 添加动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from { opacity: 0; transform: translateX(-50%) translateY(20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
            @keyframes fadeOut {
                from { opacity: 1; }
                to { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            }
        `;
        document.head.appendChild(style);

        // 事件绑定
        elements.addSingleBtn.addEventListener('click', addSingleName);
        elements.addBatchBtn.addEventListener('click', addBatchNames);
        elements.startBtn.addEventListener('click', () => isRolling ? stopRolling() : startRolling());
        elements.stopBtn.addEventListener('click', stopRolling);
        elements.resetBtn.addEventListener('click', resetCalling);
        elements.clearBtn.addEventListener('click', clearAllNames);
        elements.togglePanelBtn.addEventListener('click', toggleLeftPanel);
        elements.excelFile.addEventListener('change', handleExcelFile);

        // 模式切换
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                showToast(`已切换到${btn.textContent}`);
            });
        });

        // 回车键添加
        elements.singleName.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addSingleName();
        });

        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            // 防止空格滚动页面
            if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                e.preventDefault();
                if (isRolling) {
                    stopRolling();
                } else {
                    startRolling();
                }
            } else if (e.code === 'KeyH') {
                toggleLeftPanel();
            } else if (e.code === 'KeyR') {
                resetCalling();
            }
        });

        // 初始化默认姓名
        const defaultNames = [
            '张三', '李四', '王五', '赵六', '钱七', '孙八', '周九', '吴十',
            '郑十一', '王十二', '冯十三', '陈十四', '褚十五', '卫十六'
        ];

        names = [...defaultNames];
        updateNameList();
        updateStats();
    </script>
</body>
</html>
