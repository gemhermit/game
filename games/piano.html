                name: '卡农',
                notes: [
                    ['D4',1],['B3',1],['C4',1],['A3',1],
                    ['D4',1],['B3',1],['C4',1],['A3',1],
                    ['D4',1],['B3',1],['C4',1],['A3',1],

    init() {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.createPiano();
        this.setupVolumeControl();
        this.setupKeyboard();
        this.setupAutoPlay();
    }

    // 设置自动演奏
    setupAutoPlay() {
        const songSelect = document.getElementById('songSelect');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const tempoSlider = document.getElementById('tempo');
        const tempoValue = document.getElementById('tempoValue');
        const playingStatus = document.getElementById('playingStatus');

        // 乐曲选择
        songSelect.addEventListener('change', (e) => {
            playBtn.disabled = !e.target.value;
        });

        // 速度控制
        tempoSlider.addEventListener('input', (e) => {
            this.tempo = parseInt(e.target.value);
            tempoValue.textContent = `${this.tempo} BPM`;
        });

        // 播放按钮
        playBtn.addEventListener('click', () => {
            const songKey = songSelect.value;
            if (songKey && this.songs[songKey]) {
                this.playSong(this.songs[songKey]);
            }
        });

        // 停止按钮
        stopBtn.addEventListener('click', () => {
            this.stopSong();
        });
    }

    // 播放乐曲
    playSong(song) {
        if (this.isPlaying) {
            this.stopSong();
        }

        this.isPlaying = true;
        this.currentSong = song;

        // 更新UI状态
        document.getElementById('playBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('songSelect').disabled = true;
        document.getElementById('playingStatus').textContent = `正在播放: ${song.name}`;

        // 切换到全键位模式以确保所有音符都能演奏
        this.setMode('full');

        let currentIndex = 0;
        const beatDuration = 60000 / this.tempo; // 每拍的毫秒数

        const playNextNote = () => {
            if (!this.isPlaying || currentIndex >= song.notes.length) {
                this.stopSong();
                return;
            }

            const [note, duration] = song.notes[currentIndex];
            this.playNoteByName(note);

            // 安排下一个音符
            currentIndex++;
            const noteDuration = beatDuration * duration;
            this.playTimeout = setTimeout(playNextNote, noteDuration);
        };

        playNextNote();
    }

    // 停止播放
    stopSong() {
        this.isPlaying = false;
        this.currentSong = null;

        if (this.playTimeout) {
            clearTimeout(this.playTimeout);
            this.playTimeout = null;
        }

        // 更新UI状态
        document.getElementById('playBtn').disabled = !document.getElementById('songSelect').value;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('songSelect').disabled = false;
        document.getElementById('playingStatus').textContent = '';
    }

    // 通过音符名播放
    playNoteByName(noteName) {
        const keyElement = document.querySelector(`.key[data-note="${noteName}"]`);
        if (keyElement) {
            this.playNote(keyElement);

            // 短暂延迟后释放
            setTimeout(() => {
                this.releaseNote(keyElement);
            }, 200);
        }
    }

    createPiano() {
        const piano = document.getElementById('piano');
        piano.innerHTML = '';

        const mode = this.modes[this.currentMode];
        const startOctave = mode.startOctave;
        const octaveCount = mode.octaveCount;

        const whiteKeyWidth = 52; // Width + margin

        for (let oct = 0; oct < octaveCount; oct++) {
            const currentOctave = startOctave + oct;
            const whiteKeys = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const blackKeyNotes = ['C#', 'D#', null, 'F#', 'G#', 'A#'];

            for (let i = 0; i < 7; i++) {
                const note = whiteKeys[i];
                const fullNote = note + currentOctave;
                const whiteKeyIndex = oct * 7 + i;

                // White key
                const whiteKey = this.createKey('white', fullNote, whiteKeyIndex, currentOctave);
                piano.appendChild(whiteKey);

                // Black key (if exists)
                if (blackKeyNotes[i]) {
                    const blackNote = blackKeyNotes[i] + currentOctave;
                    const blackKey = this.createKey('black', blackNote, whiteKeyIndex, currentOctave);
                    const offset = (whiteKeyIndex + 1) * whiteKeyWidth - 20;
                    blackKey.style.left = `${offset}px`;
                    piano.appendChild(blackKey);
                }
            }
        }
    }

    createKey(type, note, index, octave) {
        const key = document.createElement('div');
        key.className = `key ${type}-key`;
        key.dataset.note = note;
        key.dataset.type = type;
        key.dataset.frequency = this.noteFrequencies[note] || 440;

        // Add label for white keys
        if (type === 'white') {
            const label = document.createElement('span');
            label.className = 'key-label';
            // Only show C notes and the note name
            const noteName = note.replace(/\d+/, '');
            label.textContent = note;
            key.appendChild(label);
        }

        // Add event listeners
        key.addEventListener('mousedown', () => this.playNote(key));
        key.addEventListener('mouseup', () => this.releaseNote(key));
        key.addEventListener('mouseleave', () => this.releaseNote(key));

        // Touch events
        key.addEventListener('touchstart', (e) => {
            e.preventDefault();
            this.playNote(key);
        });
        key.addEventListener('touchend', (e) => {
            e.preventDefault();
            this.releaseNote(key);
        });

        return key;
    }

    setupVolumeControl() {
        const volumeSlider = document.getElementById('volume');
        const volumeValue = document.getElementById('volumeValue');

        volumeSlider.addEventListener('input', (e) => {
            this.volume = e.target.value / 100;
            volumeValue.textContent = `${e.target.value}%`;
        });
    }

    setupKeyboard() {
        document.addEventListener('keydown', (e) => {
            if (e.repeat) return;

            const key = e.key.toLowerCase();
            const note = this.keyboardMap[key];

            if (note) {
                const keyElement = document.querySelector(`.key[data-note="${note}"]`);
                if (keyElement) {
                    this.playNote(keyElement);
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            const note = this.keyboardMap[key];

            if (note) {
                const keyElement = document.querySelector(`.key[data-note="${note}"]`);
                if (keyElement) {
                    this.releaseNote(keyElement);
                }
            }
        });
    }

    playNote(keyElement) {
        if (!this.audioCtx) return;

        // Resume audio context if suspended (required by browsers)
        if (this.audioCtx.state === 'suspended') {
            this.audioCtx.resume();
        }

        const frequency = parseFloat(keyElement.dataset.frequency);
        const note = keyElement.dataset.note;

        // Visual feedback
        keyElement.classList.add('pressed');

        // Show note indicator
        this.showNoteIndicator(note, keyElement);

        // Create oscillator
        const oscillator = this.audioCtx.createOscillator();
        const gainNode = this.audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(this.audioCtx.destination);

        // Use a more piano-like sound with multiple oscillators
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(frequency, this.audioCtx.currentTime);

        // Add harmonics for richer sound
        const oscillator2 = this.audioCtx.createOscillator();
        const gainNode2 = this.audioCtx.createGain();

        oscillator2.type = 'triangle';
        oscillator2.frequency.setValueAtTime(frequency * 2, this.audioCtx.currentTime);

        oscillator2.connect(gainNode2);
        gainNode2.connect(this.audioCtx.destination);

        // Set volume with envelope
        const now = this.audioCtx.currentTime;
        gainNode.gain.setValueAtTime(0, now);
        gainNode.gain.linearRampToValueAtTime(this.volume * 0.6, now + 0.01);
        gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5);

        gainNode2.gain.setValueAtTime(0, now);
        gainNode2.gain.linearRampToValueAtTime(this.volume * 0.2, now + 0.01);
        gainNode2.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

        oscillator.start(now);
        oscillator.stop(now + 1.5);

        oscillator2.start(now);
        oscillator2.stop(now + 0.75);

        // Store oscillator for release
        keyElement.dataset.oscillator = oscillator;
        keyElement.dataset.gainNode = gainNode;
    }

    releaseNote(keyElement) {
        keyElement.classList.remove('pressed');
    }

    showNoteIndicator(note, keyElement) {
        const rect = keyElement.getBoundingClientRect();
        const indicator = document.createElement('div');
        indicator.className = 'note-indicator';
        indicator.textContent = note;
        indicator.style.left = `${rect.left + rect.width / 2}px`;
        indicator.style.top = `${rect.top - 20}px`;
        document.body.appendChild(indicator);

        setTimeout(() => {
            indicator.remove();
        }, 800);
    }

    setOctave(octave) {
        this.currentOctave = octave;
        this.createPiano();
    }

    setMode(mode, btn) {
        this.currentMode = mode;
        this.createPiano();
        // Update active button
        document.querySelectorAll('.preset-btn').forEach(b => {
            b.classList.remove('ring-2', 'ring-purple-400');
        });
        if (btn) btn.classList.add('ring-2', 'ring-purple-400');
    }
}

// Initialize game
const game = new PianoGame();
