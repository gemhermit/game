    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let GRID_SIZE = 20;
        let GRID_COUNT = 30;
        const BASE_CANVAS_SIZE = 600;
        let zoomLevel = 1;
        const MIN_ZOOM = 0.5;
        const MAX_ZOOM = 2.0;

        let snake = [];
        let food = { x: 0, y: 0 };
        let powerups = [];
        let direction = { x: 1, y: 0 };
        let nextDirection = { x: 1, y: 0 };
        let score = 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameLoop = null;
        let baseSpeed = 150;
        let currentSpeed = 150;
        let activeEffects = { speed: 0, slow: 0, wallPass: 0 };
        let highScores = JSON.parse(localStorage.getItem('snakeHighScores')) || [];

        const speedBtns = document.querySelectorAll('.speed-btn');
        const sizeBtns = document.querySelectorAll('.size-btn');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const modalStartBtn = document.getElementById('modalStartBtn');
        const restartBtn = document.getElementById('restartBtn');
        const menuBtn = document.getElementById('menuBtn');
        const startOverlay = document.getElementById('startOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const zoomInBtn = document.getElementById('zoomIn');
        const zoomOutBtn = document.getElementById('zoomOut');
        const zoomLevelDisplay = document.getElementById('zoomLevel');
        const zoomSlider = document.getElementById('zoomSlider');

        speedBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                speedBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                baseSpeed = parseInt(btn.dataset.speed);
            });
        });

        sizeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sizeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                GRID_COUNT = parseInt(btn.dataset.size);
                GRID_SIZE = (BASE_CANVAS_SIZE * zoomLevel) / GRID_COUNT;
                if (!gameRunning) {
                    initGame();
                    draw();
                }
            });
        });

        zoomInBtn.addEventListener('click', () => {
            if (zoomLevel < MAX_ZOOM) {
                zoomLevel = Math.min(zoomLevel + 0.1, MAX_ZOOM);
                resizeCanvas();
                if (!gameRunning) draw();
                updateZoomUI();
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (zoomLevel > MIN_ZOOM) {
                zoomLevel = Math.max(zoomLevel - 0.1, MIN_ZOOM);
                resizeCanvas();
                if (!gameRunning) draw();
                updateZoomUI();
            }
        });

        zoomSlider.addEventListener('input', (e) => {
            const newZoom = parseInt(e.target.value) / 100;
            if (newZoom !== zoomLevel) {
                zoomLevel = newZoom;
                resizeCanvas();
                if (!gameRunning) draw();
                updateZoomUI();
            }
        });

        function updateZoomUI() {
            const percent = Math.round(zoomLevel * 100);
            zoomLevelDisplay.textContent = percent + '%';
            zoomSlider.value = percent;
            zoomInBtn.disabled = zoomLevel >= MAX_ZOOM;
            zoomOutBtn.disabled = zoomLevel <= MIN_ZOOM;
        }

        function resizeCanvas() {
            const canvasSize = BASE_CANVAS_SIZE * zoomLevel;
            canvas.width = canvasSize;
            canvas.height = canvasSize;
            GRID_SIZE = canvasSize / GRID_COUNT;
        }

        function initGame() {
            resizeCanvas();
            const startX = Math.floor(GRID_COUNT / 2);
            const startY = Math.floor(GRID_COUNT / 2);
            snake = [
                { x: startX, y: startY },
                { x: startX - 1, y: startY },
                { x: startX - 2, y: startY }
            ];
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            score = 0;
            currentSpeed = baseSpeed;
            powerups = [];
            activeEffects = { speed: 0, slow: 0, wallPass: 0 };
            spawnFood();
            updateUI();
        }

        function spawnFood() {
            let valid = false;
            while (!valid) {
                food = {
                    x: Math.floor(Math.random() * GRID_COUNT),
                    y: Math.floor(Math.random() * GRID_COUNT)
                };
                valid = !snake.some(seg => seg.x === food.x && seg.y === food.y) &&
                        !powerups.some(p => p.x === food.x && p.y === food.y);
            }

            if (Math.random() < 0.15) {
                spawnPowerup();
            }
        }

        function spawnPowerup() {
            if (powerups.length >= 2) return;

            const types = ['speed', 'slow', 'wallPass'];
            const type = types[Math.floor(Math.random() * types.length)];

            let valid = false;
            let pos;
            let attempts = 0;
            while (!valid && attempts < 50) {
                pos = {
                    x: Math.floor(Math.random() * GRID_COUNT),
                    y: Math.floor(Math.random() * GRID_COUNT)
                };
                valid = !snake.some(seg => seg.x === pos.x && seg.y === pos.y) &&
                        !(pos.x === food.x && pos.y === food.y) &&
                        !powerups.some(p => p.x === pos.x && p.y === pos.y);
                attempts++;
            }

            if (valid) {
                powerups.push({ x: pos.x, y: pos.y, type, expires: Date.now() + 10000 });
            }
        }

        function update() {
            direction = { ...nextDirection };

            const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

            if (activeEffects.wallPass > 0) {
                if (head.x < 0) head.x = GRID_COUNT - 1;
                if (head.x >= GRID_COUNT) head.x = 0;
                if (head.y < 0) head.y = GRID_COUNT - 1;
                if (head.y >= GRID_COUNT) head.y = 0;
            } else {
                if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
                    gameOver();
                    return;
                }
            }

            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                spawnFood();
            } else {
                snake.pop();
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                if (Date.now() > p.expires) {
                    powerups.splice(i, 1);
                } else if (head.x === p.x && head.y === p.y) {
                    activatePowerup(p.type);
                    powerups.splice(i, 1);
                    score += 5;
                }
            }

            if (activeEffects.speed > 0) activeEffects.speed--;
            if (activeEffects.slow > 0) activeEffects.slow--;
            if (activeEffects.wallPass > 0) activeEffects.wallPass--;

            updateUI();
            draw();
        }

        function activatePowerup(type) {
            switch (type) {
                case 'speed':
                    activeEffects.speed = 50;
                    currentSpeed = baseSpeed * 0.5;
                    break;
                case 'slow':
                    activeEffects.slow = 50;
                    currentSpeed = baseSpeed * 1.5;
                    break;
                case 'wallPass':
                    activeEffects.wallPass = 30;
                    break;
            }
        }

        function draw() {
            ctx.fillStyle = '#0c1222';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= GRID_COUNT; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(canvas.width, i * GRID_SIZE);
                ctx.stroke();
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const p = powerups[i];
                const x = p.x * GRID_SIZE;
                const y = p.y * GRID_SIZE;

                let color;
                switch (p.type) {
                    case 'speed': color = '#fbbf24'; break;
                    case 'slow': color = '#38bdf8'; break;
                    case 'wallPass': color = '#a855f7'; break;
                }

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x + GRID_SIZE/2, y + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 2;
                ctx.stroke();

                const remaining = p.expires - Date.now();
                if (remaining < 3000) {
                    ctx.globalAlpha = 0.5 + Math.sin(Date.now() / 100) * 0.5;
                    ctx.fill();
                    ctx.globalAlpha = 1;
                }
            }

            const fx = food.x * GRID_SIZE;
            const fy = food.y * GRID_SIZE;
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.arc(fx + GRID_SIZE/2, fy + GRID_SIZE/2, GRID_SIZE/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            ctx.shadowColor = '#f43f5e';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;

            snake.forEach((seg, i) => {
                const x = seg.x * GRID_SIZE;
                const y = seg.y * GRID_SIZE;

                if (i === 0) {
                    // 蛇头 - 使用渐变
                    const gradient = ctx.createLinearGradient(x, y, x + GRID_SIZE, y + GRID_SIZE);
                    gradient.addColorStop(0, activeEffects.wallPass > 0 ? '#a855f7' : '#22c55e');
                    gradient.addColorStop(1, activeEffects.wallPass > 0 ? '#7c3aed' : '#16a34a');
                    ctx.fillStyle = gradient;
                } else {
                    // 蛇身 - 根据位置计算渐变色，从头到尾颜色逐渐变淡
                    const alpha = 1 - (i / snake.length) * 0.5;
                    const gradient = ctx.createLinearGradient(x, y, x + GRID_SIZE, y + GRID_SIZE);
                    const baseColor = activeEffects.wallPass > 0 ? '#c084fc' : '#4ade80';
                    const endColor = activeEffects.wallPass > 0 ? '#a855f7' : '#22c55e';
                    gradient.addColorStop(0, baseColor);
                    gradient.addColorStop(1, endColor);
                    ctx.fillStyle = gradient;
                    ctx.globalAlpha = alpha;
                }

                const radius = i === 0 ? 6 : 4;
                ctx.beginPath();
                ctx.roundRect(x + 1, y + 1, GRID_SIZE - 2, GRID_SIZE - 2, radius);
                ctx.fill();
                ctx.globalAlpha = 1;

                if (i === 0) {
                    ctx.fillStyle = '#0c1222';
                    const eyeOffset = direction.x !== 0 ? (direction.x > 0 ? 3 : -3) : 0;
                    const eyeY = direction.y !== 0 ? (direction.y > 0 ? 3 : -3) : 0;
                    ctx.beginPath();
                    ctx.arc(x + GRID_SIZE/2 - 3 + eyeOffset, y + GRID_SIZE/2 - 2 + eyeY, 2, 0, Math.PI * 2);
                    ctx.arc(x + GRID_SIZE/2 + 3 + eyeOffset, y + GRID_SIZE/2 - 2 + eyeY, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            if (activeEffects.speed > 0) {
                ctx.fillStyle = 'rgba(251, 191, 36, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#fbbf24';
                ctx.font = '12px sans-serif';
                ctx.fillText('⚡ 加速', 10, 20);
            }
            if (activeEffects.slow > 0) {
                ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = '12px sans-serif';
                ctx.fillText('❄️ 减速', 60, 20);
            }
            if (activeEffects.wallPass > 0) {
                ctx.fillStyle = 'rgba(168, 85, 247, 0.15)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#a855f7';
                ctx.font = '12px sans-serif';
                ctx.fillText('🔮 穿墙', 120, 20);
            }
        }

        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('length').textContent = snake.length;

            let speedText = '1x';
            if (activeEffects.speed > 0) speedText = '2x ⚡';
            else if (activeEffects.slow > 0) speedText = '0.5x ❄️';
            document.getElementById('speed').textContent = speedText;
        }

        function startGame() {
            initGame();
            gameRunning = true;
            gamePaused = false;
            startOverlay.classList.add('hidden');
            gameOverOverlay.classList.add('hidden');
            startBtn.textContent = '重新开始';
            pauseBtn.disabled = false;
            pauseBtn.textContent = '暂停';
            runGameLoop();
        }

        function runGameLoop() {
            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                if (!gamePaused && gameRunning) {
                    update();
                }
            }, currentSpeed);
        }

        function togglePause() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            pauseBtn.textContent = gamePaused ? '继续' : '暂停';
        }

        function gameOver() {
            gameRunning = false;
            if (gameLoop) clearInterval(gameLoop);

            if (score > 0) {
                highScores.push({ score, length: snake.length, date: new Date().toLocaleDateString() });
                highScores.sort((a, b) => b.score - a.score);
                highScores = highScores.slice(0, 5);
                localStorage.setItem('snakeHighScores', JSON.stringify(highScores));
            }

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLength').textContent = snake.length;
            gameOverOverlay.classList.remove('hidden');

            startBtn.textContent = '开始游戏';
            pauseBtn.disabled = true;
            pauseBtn.textContent = '暂停';
        }

        function showHighScores() {
            const container = document.getElementById('highScores');
            if (highScores.length === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = `
                <h4>最高分记录</h4>
                <div class="score-list">
                    ${highScores.map((s, i) => `<div><span>#${i+1}</span><span>${s.score}分</span></div>`).join('')}
                </div>
            `;
        }

        document.addEventListener('keydown', (e) => {
            // Handle zoom with Ctrl/Cmd + plus/minus
            if ((e.ctrlKey || e.metaKey) && (e.code === 'Equal' || e.code === 'Minus' || e.code === 'NumpadAdd' || e.code === 'NumpadSubtract')) {
                e.preventDefault();
                if (e.code === 'Equal' || e.code === 'NumpadAdd') {
                    if (zoomLevel < MAX_ZOOM) {
                        zoomLevel = Math.min(zoomLevel + 0.1, MAX_ZOOM);
                        resizeCanvas();
                        if (!gameRunning) draw();
                        updateZoomUI();
                    }
                } else {
                    if (zoomLevel > MIN_ZOOM) {
                        zoomLevel = Math.max(zoomLevel - 0.1, MIN_ZOOM);
                        resizeCanvas();
                        if (!gameRunning) draw();
                        updateZoomUI();
                    }
                }
                return;
            }

            if (!gameRunning || gamePaused) {
                if (e.code === 'Space' && !gameRunning) {
                    startGame();
                }
                return;
            }

            const keyMap = {
                'ArrowUp': { x: 0, y: -1 },
                'ArrowDown': { x: 0, y: 1 },
                'ArrowLeft': { x: -1, y: 0 },
                'ArrowRight': { x: 1, y: 0 },
                'KeyW': { x: 0, y: -1 },
                'KeyS': { x: 0, y: 1 },
                'KeyA': { x: -1, y: 0 },
                'KeyD': { x: 1, y: 0 }
            };

            const newDir = keyMap[e.code];
            if (newDir) {
                e.preventDefault();
                if (newDir.x !== -direction.x || newDir.y !== -direction.y) {
                    nextDirection = newDir;
                }
            }

            if (e.code === 'Space') {
                e.preventDefault();
                togglePause();
            }
        });

        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        modalStartBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', startGame);
        menuBtn.addEventListener('click', () => {
            gameOverOverlay.classList.add('hidden');
            startOverlay.classList.remove('hidden');
            showHighScores();
            resizeCanvas();
            draw();
        });

        function detectOptimalZoom() {
            const gameArea = document.querySelector('.game-area');
            const availableWidth = gameArea.clientWidth - 60; // padding
            const availableHeight = gameArea.clientHeight - 60;

            const maxZoomByWidth = availableWidth / BASE_CANVAS_SIZE;
            const maxZoomByHeight = availableHeight / BASE_CANVAS_SIZE;
            const maxZoom = Math.min(maxZoomByWidth, maxZoomByHeight);

            if (maxZoom < 0.7) {
                zoomLevel = 0.5;
            } else if (maxZoom > 1.8) {
                zoomLevel = 2.0;
            } else if (maxZoom > 1.2) {
                zoomLevel = 1.2;
            } else {
                zoomLevel = 1;
            }

            zoomLevel = Math.max(MIN_ZOOM, Math.min(zoomLevel, MAX_ZOOM));
        }

        // Auto-detect optimal zoom on load
        detectOptimalZoom();

        showHighScores();
        resizeCanvas();
        updateZoomUI();
        draw();
    </script>
</body>
</html>
