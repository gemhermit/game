    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');
        
        body {
            font-family: 'Fredoka One', cursive;
            background-color: #84cc16; /* Lime-500 */
            text-align: center;
            overflow: hidden;
            touch-action: manipulation;

        .game-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 90%;
            max-width: 600px;
            margin: 20px auto;
            cursor: url('data:image/svg+xml;utf8,<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><text y="28" font-size="28">🔨</text></svg>') 16 16, pointer;
        }

        .hole {
            background-color: #78350f; /* Amber-900 (Dirt) */
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            aspect-ratio: 1;
            box-shadow: inset 0 10px 0 0 rgba(0,0,0,0.3), 0 5px 10px rgba(0,0,0,0.2);
        }
        
        .game-board:active {
            cursor: url('data:image/svg+xml;utf8,<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" style="transform: rotate(-45deg)"><text y="28" font-size="28">🔨</text></svg>') 16 16, pointer;
        }

        /* Dirt pile effect */
        .hole::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 0;
            width: 100%;
            height: 30px;
            background: url('data:image/svg+xml;utf8,<svg width="100" height="30" viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg"><path d="M0 30 Q50 0 100 30" fill="%235D4037"/></svg>');
            background-size: cover;
            z-index: 2;
        }

        .mole {
            width: 70%;
            height: 80%;
            background-color: #a16207; /* Yellow-700 */
            position: absolute;
            bottom: 0;
            left: 15%;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            transition: transform 0.4s;
            transform: translateY(100%); /* Hidden */
            cursor: url('data:image/svg+xml;utf8,<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><text y="28" font-size="28">🔨</text></svg>') 16 16, pointer;
            z-index: 1;
            
            /* Face */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .hit-text {
            position: absolute;
            color: #fbbf24;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 0.5s ease-out forwards;
            z-index: 10;
            text-shadow: 2px 2px 0 #000;
        }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-50px) scale(1.5); opacity: 0; }
        }
        
        .mole::before { /* Eyes */
            content: '••';
            color: black;
            font-size: 40px;
            margin-bottom: 20px;
        }
        
        .mole::after { /* Nose */
            content: '';
            position: absolute;
            top: 50%;
            width: 20px;
            height: 15px;
            background: pink;
            border-radius: 50%;
        }

        .mole.up {
            transform: translateY(10%); /* Visible */
        }
        
        .mole.bonked {
            background-color: #ef4444; /* Red */
            transform: translateY(10%) scale(0.9);
        }

        .mole.bomb {
            background-color: #1f2937; /* Black */
        }
        
        .mole.bomb::before {
            content: '💣';
            font-size: 40px;
            color: white;
        }
        
        .mole.bomb::after {
            display: none;
        }

<body class="h-screen flex flex-col items-center">

        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>

    <button id="startBtn" class="mt-8 bg-white text-green-600 text-2xl px-12 py-4 rounded-full font-bold shadow-lg hover:scale-105 transition active:scale-95">开始游戏</button>

<div id="game-over-modal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full text-center shadow-2xl transform scale-100 transition-transform border-4 border-indigo-500">

                    关闭
                </button>

    <script>
class WhackAMole {
    constructor() {
        this.holes = document.querySelectorAll('.hole');
        this.scoreBoard = document.getElementById('score');
        this.timerBoard = document.getElementById('timer');
        this.timerLabel = document.getElementById('timerLabel');
        this.moles = document.querySelectorAll('.mole');
        this.startBtn = document.getElementById('startBtn');
        
        // Modal elements
        this.modal = document.getElementById('game-over-modal');
        this.modalTitle = document.getElementById('modal-title');
        this.modalMessage = document.getElementById('modal-message');
        this.modalRestartBtn = document.getElementById('modal-restart-btn');
        this.modalCloseBtn = document.getElementById('modal-close-btn');

        // Mode Buttons
        this.modeBtns = {
            classic: document.getElementById('modeClassic'),
            survival: document.getElementById('modeSurvival'),
            bomb: document.getElementById('modeBomb')
        };
        
        this.mode = 'classic'; // classic, survival, bomb
        this.lastHole = null;
        this.timeUp = false;
        this.score = 0;
        this.lives = 3;
        this.timeLeft = 30;
        this.gameTimer = null;
        this.peepTimer = null;
        this.isPlaying = false;
        
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        this.initEvents();
    }
    
    playSound(type) {
        if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        
        if (type === 'hit') {
            osc.frequency.setValueAtTime(600, this.audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, this.audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, this.audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.1);
            osc.type = 'square';
            osc.start();
            osc.stop(this.audioCtx.currentTime + 0.1);
        } else if (type === 'pop') {
            osc.frequency.setValueAtTime(300, this.audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(500, this.audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, this.audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, this.audioCtx.currentTime + 0.1);
            osc.type = 'sine';
            osc.start();
            osc.stop(this.audioCtx.currentTime + 0.1);
        }
    }

    initEvents() {
        this.startBtn.addEventListener('click', () => this.startGame());
        this.moles.forEach(mole => mole.addEventListener('mousedown', (e) => this.bonk(e))); // Mouse
        this.moles.forEach(mole => mole.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            this.bonk(e);
        }));
        
        // Modal Events
        this.modalRestartBtn.addEventListener('click', () => {
            this.modal.classList.add('hidden');
            this.startGame();
        });
        this.modalCloseBtn.addEventListener('click', () => {
            this.modal.classList.add('hidden');
        });

        // Mode Selection
        Object.keys(this.modeBtns).forEach(key => {
            this.modeBtns[key].addEventListener('click', () => this.setMode(key));
        });
    }
    
    setMode(mode) {
        if (this.isPlaying) return; // Can't change while playing
        this.mode = mode;
        
        // Reset styles
        Object.values(this.modeBtns).forEach(btn => {
            btn.className = 'bg-gray-600 text-white px-4 py-2 rounded-full text-sm font-bold shadow hover:bg-opacity-80 transition';
        });
        
        // Active style
        const activeBtn = this.modeBtns[mode];
        let color = 'indigo';
        if (mode === 'survival') color = 'yellow';
        if (mode === 'bomb') color = 'red';
        
        activeBtn.className = `bg-${color}-600 text-white px-4 py-2 rounded-full text-sm font-bold shadow hover:bg-${color}-700 transition ring-2 ring-white`;
        
        // Update UI Label
        if (mode === 'survival') {
            this.timerLabel.textContent = '生命';
            this.timerBoard.textContent = '3';
        } else {
            this.timerLabel.textContent = '时间';
            this.timerBoard.textContent = '30';
        }
    }

    randomTime(min, max) {
        return Math.round(Math.random() * (max - min) + min);
    }

    randomHole(holes) {
        // Filter holes that are not currently up (active or bonked)
        const available = Array.from(holes).filter(h => {
            const m = h.querySelector('.mole');
            return !m.classList.contains('up');
        });

        if (available.length === 0) return null; // Should ideally not happen if pace is balanced

        const idx = Math.floor(Math.random() * available.length);
        const hole = available[idx];
        
        if (hole === this.lastHole && available.length > 1) {
            return this.randomHole(holes); // Retry from full list (recursion might be inefficient but safe here)
        }
        this.lastHole = hole;
        return hole;
    }

    peep() {
        const minTime = this.mode === 'survival' ? 500 : 300;
        const maxTime = this.mode === 'survival' ? 1000 : 800;
        const time = this.randomTime(minTime, maxTime); 
        
        const hole = this.randomHole(this.holes);
        
        // If no hole available, retry shortly
        if (!hole) {
             this.peepTimer = setTimeout(() => this.peep(), 100);
             return;
        }

        const mole = hole.querySelector('.mole');
        
        // Bomb Logic
        let isBomb = false;
        if (this.mode === 'bomb' && Math.random() > 0.7) {
            isBomb = true;
            mole.classList.add('bomb');
        } else {
            mole.classList.remove('bomb');
        }
        
        mole.classList.add('up');
        mole.classList.remove('bonked');
        this.playSound('pop');
        
        this.peepTimer = setTimeout(() => {
            if (!this.timeUp && mole.classList.contains('up') && !mole.classList.contains('bonked')) {
                // Survival Mode: Missed a mole
                if (this.mode === 'survival' && !isBomb) {
                    this.lives--;
                    this.timerBoard.textContent = this.lives;
                    this.playSound('hit'); // reused fail sound? or need new one
                    if (this.lives <= 0) {
                        this.endGame();
                        mole.classList.remove('up');
                        return;
                    }
                }
            }
            
            mole.classList.remove('up');
            if (!this.timeUp) this.peep();
        }, time);
    }

    startGame() {
        if (this.gameTimer) clearInterval(this.gameTimer);
        if (this.peepTimer) clearTimeout(this.peepTimer);
        
        this.isPlaying = true;
        this.scoreBoard.textContent = 0;
        this.timeUp = false;
        this.score = 0;
        
        if (this.mode === 'survival') {
            this.lives = 3;
            this.timerBoard.textContent = this.lives;
        } else {
            this.timeLeft = 30;
            this.timerBoard.textContent = this.timeLeft;
        }
        
        this.startBtn.disabled = true;
        this.startBtn.classList.add('opacity-50', 'cursor-not-allowed');
        
        this.peep();
        
        if (this.mode !== 'survival') {
            this.gameTimer = setInterval(() => {
                this.timeLeft--;
                this.timerBoard.textContent = this.timeLeft;
                if (this.timeLeft <= 0) {
                    this.endGame();
                }
            }, 1000);
        }
    }

    bonk(e) {
        if(!e.isTrusted) return; // Cheater!
        const mole = e.target;
        if (!mole.classList.contains('up') || mole.classList.contains('bonked')) return;
        
        // Bomb Check
        if (mole.classList.contains('bomb')) {
            this.playSound('hit'); // Boom sound ideally
            mole.classList.remove('up');
            this.endGame(true); // Bomb Game Over
            return;
        }
        
        this.score++;
        
        // Stop the natural hiding timer since we hit it
        clearTimeout(this.peepTimer);
        
        mole.classList.add('bonked'); // Visual feedback
        this.scoreBoard.textContent = this.score;
        this.playSound('hit');
        
        // Visual +1
        const rect = mole.getBoundingClientRect();
        const floatText = document.createElement('div');
        floatText.className = 'hit-text';
        floatText.textContent = '+1';
        floatText.style.left = (e.clientX || rect.left) + 'px';
        floatText.style.top = (e.clientY || rect.top) + 'px';
        document.body.appendChild(floatText);
        setTimeout(() => floatText.remove(), 500);

        // Random retraction delay (hit moles retract randomly too)
        const delay = Math.random() * 4500 + 500; // 0.5s - 5.0s delay
        
        // Store timeout ID on the mole element itself to handle potential cleanup if game ends
        mole.dataset.timeoutId = setTimeout(() => {
            mole.classList.remove('up');
            mole.classList.remove('bonked');
            // Removed recursive peep call here to decouple
        }, delay);
        
        // Immediately trigger next mole elsewhere to keep pace fast
        if (!this.timeUp) {
            setTimeout(() => this.peep(), 100); 
        }
    }
    
    endGame(isBomb = false) {
        this.timeUp = true;
        this.isPlaying = false;
        clearInterval(this.gameTimer);
        clearTimeout(this.peepTimer);
        this.gameTimer = null;
        this.peepTimer = null;
        
        // Clear board
        this.moles.forEach(mole => {
            mole.classList.remove('up', 'bonked');
            if (mole.dataset.timeoutId) {
                clearTimeout(parseInt(mole.dataset.timeoutId));
                delete mole.dataset.timeoutId;
            }
        });

        this.startBtn.disabled = false;
        this.startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        this.startBtn.textContent = '再玩一次';
        
        let title = '时间到！';
        if (this.mode === 'survival') title = '生命耗尽！';
        if (isBomb) title = 'BOOM! 炸弹！';
        
        this.modalTitle.textContent = title;
        this.modalMessage.textContent = '你的得分是: ' + this.score;
        this.modal.classList.remove('hidden');
    }
}

new WhackAMole();
</script>
