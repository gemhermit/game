            {

            {
                id: 21, character: "🤴", name: "贵族",
                text: "这些贱民居然敢要求减少赋税？请允许我用皮鞭教训他们！",
                left: { text: "不可暴力", effects: { people: +20, wealth: -10 } },
                right: { text: "随便你", effects: { people: -30, wealth: +20 } }
            },
            {
                id: 22, character: "👸", name: "王后",
                text: "我怀孕了！是个男孩！我们应该大赦天下庆祝！",
                left: { text: "低调处理", effects: { wealth: +5, people: -5 } },

            },
            {
                id: 23, character: "🕵️", name: "密探",
                text: "我们在下水道发现了一个邪教窝点，里面藏着大量的黄金。",
                left: { text: "炸毁那里", effects: { religion: +15, people: +5 } },
                right: { text: "没收黄金", effects: { wealth: +30, religion: -15 } }
            },
            {
                id: 24, character: "👨‍⚕️", name: "医生",
                text: "我需要解剖尸体来研究人体构造，但这违反了教规。",
                left: { text: "遵守教规", effects: { religion: +15, people: -5 } },
                right: { text: "秘密批准", effects: { religion: -20, people: +15 } }
            },
            {
                id: 25, character: "🃏", name: "弄臣",
                text: "陛下，不如我们宣布今天为‘全国倒立日’，让大家都倒着走路！",
                left: { text: "你疯了吗", effects: { religion: +5, people: -5 } },
                right: { text: "好主意！", effects: { people: +15, military: -10, wealth: -5 } }
            }
        ];

        let state = {
            religion: 50,
            people: 50,
            military: 50,
            wealth: 50,
            year: 1,
            isDead: false
        };

        const deckEl = document.getElementById('card-deck');
        let currentCardEl = null;
        let currentCardData = null;

        function updateStatsUI() {
            document.getElementById('bar-religion').style.width = `${Math.max(0, Math.min(100, state.religion))}%`;
            document.getElementById('bar-people').style.width = `${Math.max(0, Math.min(100, state.people))}%`;
            document.getElementById('bar-military').style.width = `${Math.max(0, Math.min(100, state.military))}%`;
            document.getElementById('bar-wealth').style.width = `${Math.max(0, Math.min(100, state.wealth))}%`;
            document.getElementById('year-display').innerText = state.year;
        }

        function checkDeath() {
            const reasons = [];
            if (state.religion <= 0) reasons.push("教会宣布你为异端，暴徒冲入王宫将你烧死。");
            if (state.religion >= 100) reasons.push("教皇的权力凌驾于王权之上，你被废黜成为傀儡。");
            if (state.people <= 0) reasons.push("愤怒的民众发动起义，你被送上了断头台。");
            if (state.people >= 100) reasons.push("刁民们得寸进尺，冲入王宫瓜分了你的财产。");
            if (state.military <= 0) reasons.push("邻国军队轻而易举地攻破了城门，你沦为阶下囚。");
            if (state.military >= 100) reasons.push("将军们发动军事政变，将你赶下了王座。");
            if (state.wealth <= 0) reasons.push("国库空虚，连卫兵的工资都发不出，你被刺客暗杀。");
            if (state.wealth >= 100) reasons.push("你在金币堆中醉生梦死，最终死于纵欲过度。");

            if (reasons.length > 0) {
                state.isDead = true;
                document.getElementById('death-reason').innerText = reasons[0];
                document.getElementById('death-years').innerText = state.year;
                
                setTimeout(() => {
                    document.getElementById('game-screen').classList.add('hidden');
                    document.getElementById('death-screen').classList.remove('hidden');
                    
                    gsap.fromTo("#death-screen > *", 
                        { opacity: 0, y: 20 }, 
                        { opacity: 1, y: 0, duration: 0.6, stagger: 0.1, ease: "power2.out" }
                    );
                }, 500);
                return true;
            }
            return false;
        }

        function showDots(effects) {
            ['religion', 'people', 'military', 'wealth'].forEach(key => {
                const dot = document.querySelector(`#stat-container-${key} .stat-dot`);
                if (effects && effects[key] !== undefined) {
                    dot.style.opacity = 1;
                    dot.style.transform = effects[key] > 0 ? 'translateX(-50%) translateY(-5px) scale(1.2)' : 'translateX(-50%) translateY(5px) scale(0.8)';
                } else {
                    dot.style.opacity = 0;
                    dot.style.transform = 'translateX(-50%)';
                }
            });
        }

        function spawnCard() {
            if (state.isDead) return;

            // Pick random card
            currentCardData = CARDS[Math.floor(Math.random() * CARDS.length)];
            
            const card = document.createElement('div');
            card.className = 'card flex flex-col';
            card.innerHTML = `
                <div class="choice-hint left">${currentCardData.left.text}</div>
                <div class="choice-hint right">${currentCardData.right.text}</div>
                <div class="card-character">${currentCardData.character}</div>
                <div class="card-name">${currentCardData.name}</div>
                <div class="card-text">${currentCardData.text}</div>
            `;
            
            deckEl.appendChild(card);
            currentCardEl = card;

            gsap.fromTo(card, 
                { scale: 0.8, opacity: 0, y: 50 }, 
                { scale: 1, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.5)" }
            );

            initDrag(card);
        }

        function makeChoice(direction) {
            const effects = direction === -1 ? currentCardData.left.effects : currentCardData.right.effects;
            
            for (let key in effects) {
                state[key] += effects[key];
            }
            state.year++;
            updateStatsUI();
            showDots(null); // hide dots

            const outX = direction === -1 ? -window.innerWidth : window.innerWidth;
            const rot = direction === -1 ? -30 : 30;

            gsap.to(currentCardEl, {
                x: outX,
                y: 100,
                rotation: rot,
                opacity: 0,
                duration: 0.4,
                ease: "power2.in",
                onComplete: () => {
                    currentCardEl.remove();
                    if (!checkDeath()) {
                        setTimeout(spawnCard, 200);
                    }
                }
            });
        }

        function initDrag(card) {
            let startX = 0, startY = 0;
            let currentX = 0, currentY = 0;
            let isDragging = false;
            
            const threshold = 100;
            const hintLeft = card.querySelector('.choice-hint.left');
            const hintRight = card.querySelector('.choice-hint.right');

            function onStart(e) {
                isDragging = true;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                startX = clientX - currentX;
                startY = clientY - currentY;
                
                card.style.transition = 'none';
            }

            function onMove(e) {
                if (!isDragging) return;
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                
                currentX = clientX - startX;
                currentY = clientY - startY;

                const rotate = currentX * 0.1;
                card.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px)) rotate(${rotate}deg)`;

                // Hints opacity
                if (currentX < -20) {
                    hintLeft.style.opacity = Math.min(1, Math.abs(currentX) / threshold);
                    hintRight.style.opacity = 0;
                    showDots(currentCardData.left.effects);
                } else if (currentX > 20) {
                    hintRight.style.opacity = Math.min(1, currentX / threshold);
                    hintLeft.style.opacity = 0;
                    showDots(currentCardData.right.effects);
                } else {
                    hintLeft.style.opacity = 0;
                    hintRight.style.opacity = 0;
                    showDots(null);
                }
            }

            function onEnd() {
                if (!isDragging) return;
                isDragging = false;
                
                card.style.transition = 'transform 0.3s ease-out';

                if (currentX < -threshold) {
                    makeChoice(-1);
                } else if (currentX > threshold) {
                    makeChoice(1);
                } else {
                    currentX = 0;
                    currentY = 0;
                    card.style.transform = `translate(-50%, -50%) rotate(0deg)`;
                    hintLeft.style.opacity = 0;
                    hintRight.style.opacity = 0;
                    showDots(null);
                }
            }

            card.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);

            card.addEventListener('touchstart', onStart, {passive: true});
            window.addEventListener('touchmove', onMove, {passive: true});
            window.addEventListener('touchend', onEnd);
        }

        function startGame() {
            state = {
                religion: 50,
                people: 50,
                military: 50,
                wealth: 50,
                year: 1,
                isDead: false
            };
            
            document.getElementById('death-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            deckEl.innerHTML = '';
            
            updateStatsUI();
            setTimeout(spawnCard, 300);
        }

        // Init
        document.addEventListener('DOMContentLoaded', startGame);

    </script>
</body>
