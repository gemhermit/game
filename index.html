    <!-- Material 3 (BeerCSS) -->
    <link href="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.css" rel="stylesheet">
    <script type="module" src="https://cdn.jsdelivr.net/npm/beercss@3.5.1/dist/cdn/beer.min.js"></script>
    <script type="module" src="https://cdn.jsdelivr.net/npm/material-dynamic-colors@1.1.0/dist/cdn/material-dynamic-colors.min.js"></script>

    <style>
        :root {
            --primary: #005cbb;
            --on-primary: #ffffff;
            --primary-container: #d7e3ff;
            --on-primary-container: #001b3f;
            --radius: 28px; /* Material 3 Extra Large Radius */
        }
        body {
            background-color: var(--background);
        }
        .logo-container {
            text-align: center;
            padding: 4rem 0 3rem;
            display: flex;
            justify-content: center;
        }
        .game-card {
            cursor: pointer;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            border-radius: var(--radius);
            background-color: var(--surface-container); /* Material 3 flat background */
            transition: background-color 0.2s ease;
            border: none;
            box-shadow: none; /* Flattened */
        }
        .game-card:hover {
            background-color: var(--surface-container-high);
            box-shadow: none;
            transform: none; /* Flattened */
        }
        .game-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px; /* Squircle */
            margin-bottom: 1rem;
            object-fit: cover;
            background-color: var(--surface-variant);
        }
        .game-title {
            font-size: 1rem;
            font-weight: 500;
            color: var(--on-surface);
            letter-spacing: 0.1px;
        }
        .no-decoration {
            text-decoration: none;
            color: inherit;
        }
        footer {
            margin-top: auto;
            padding: 4rem 1rem;
            text-align: center;
            color: var(--on-surface-variant);
            font-size: 0.875rem;
        }
        footer a {
            color: var(--on-surface-variant);
            text-decoration: none;
            margin: 0 0.75rem;
            opacity: 0.8;
        }
        footer a:hover {
            opacity: 1;
            text-decoration: underline;
        }
        
        /* SVG Styles */
        .st0{fill:#FFFFFF;stroke:#2196F3;stroke-width:22;stroke-miterlimit:10;}
        .st1{fill:none;stroke:#0AA858;stroke-width:22;stroke-linecap:round;stroke-miterlimit:10;}
        .st2{fill:none;stroke:#2196F3;stroke-width:22;stroke-linecap:round;stroke-miterlimit:10;}
        .st3{fill:none;stroke:#F44336;stroke-width:22;stroke-linecap:round;stroke-miterlimit:10;}
        .st4{fill:none;stroke:#FFBC32;stroke-width:22;stroke-linecap:round;stroke-miterlimit:10;}
        .st5{fill:none;stroke:#FFBC32;stroke-width:22;stroke-miterlimit:10;}
    </style>
</head>

                <path class="st0" d="M35.6,39.5"/>
                <circle class="st1" cx="489" cy="108" r="50"/>

        <!-- Game 5: Cloud Game -->

        <!-- Game 6: Animal Gun -->

            </a>
        </div>
    </div>

    <!-- Back to top FAB -->
